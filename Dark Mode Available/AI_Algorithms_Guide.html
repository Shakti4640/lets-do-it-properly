<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>30 AI Algorithms — Cheatsheet, Intuition & Python Snippets</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<style>
  :root {
    --bg: #f6f7fb;
    --fg: #1f2330;
    --muted: #6b7280;
    --accent: #7c3aed;
    --border: #e3e6ee;
    --card: #ffffff;
    --code-bg: #f8fafc;
    --code-fg: #24292f;
    --kw: #cf222e;
    --typ: #6f42c1;
    --str: #0a7d4d;
    --cmt: #6a737d;
    --num: #0550ae;
    --bi:  #b91c1c;
    --veasy: #0891b2;
    --easy: #16a34a;
    --med: #d97706;
    --hard: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
  }

  /* HAMBURGER + TOC SIDEBAR */
  .hamburger {
    position: fixed; top: 14px; left: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 5px; cursor: pointer; z-index: 1001;
  }
  .hamburger span {
    display: block; width: 22px; height: 2.5px;
    background: #1e1e25; border-radius: 2px;
    transition: transform .25s, opacity .2s;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

  .sidebar {
    position: fixed; top: 0; left: 0;
    height: 100vh; width: 360px; max-width: 90vw;
    background: #ffffff;
    border-right: 1px solid var(--border);
    box-shadow: 2px 0 14px rgba(0,0,0,.06);
    transform: translateX(-100%);
    transition: transform .28s ease;
    overflow-y: auto;
    z-index: 1000;
    padding: 70px 18px 32px;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2 {
    margin: 0 0 12px;
    font-size: 13px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .sidebar .group-title {
    margin-top: 18px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .sidebar a {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px;
    margin: 2px 0;
    text-decoration: none;
    color: #1f2330;
    border-radius: 6px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .sidebar a:hover { background: #f3e8ff; color: var(--accent); }
  .sidebar a.active { background: #f3e8ff; color: var(--accent); font-weight: 600; }
  .sidebar a .num {
    display: inline-block;
    min-width: 28px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.25);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 999;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  /* HERO + TABS */
  .topbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 18px 24px 0;
    padding-left: 76px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 { margin: 0 0 6px; font-size: 20px; }
  .topbar p  { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: #f1f3f9;
    color: var(--muted);
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    transition: background .15s;
  }
  .tab:hover { background: #e7eaf3; color: var(--fg); }
  .tab.active {
    background: #ffffff;
    color: var(--fg);
    border-bottom: 2px solid #ffffff;
    margin-bottom: -1px;
    box-shadow: 0 -2px 0 var(--accent) inset;
  }
  .tab .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: 1px;
  }
  .tab.veasy .dot { background: var(--veasy); }
  .tab.easy  .dot { background: var(--easy); }
  .tab.med   .dot { background: var(--med); }
  .tab.hard  .dot { background: var(--hard); }
  .tab.brief .dot { background: #8b5cf6; }
  .tab .count { color: var(--muted); margin-left: 6px; font-weight: 500; }

  /* MAIN */
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 24px 120px;
  }
  .problem-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .problem-card h2 {
    margin: 0 0 6px;
    font-size: 24px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .num-tag {
    background: #f3e8ff; color: var(--accent);
    padding: 3px 10px; border-radius: 6px;
    font-size: 13px; font-weight: 700;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff; font-weight: 700; letter-spacing: .05em;
  }
  .badge.veasy { background: var(--veasy); }
  .badge.easy  { background: var(--easy); }
  .badge.med   { background: var(--med); }
  .badge.hard  { background: var(--hard); }
  .pill {
    display: inline-block;
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 999px;
    background: #eef2ff;
    color: #4338ca;
    font-weight: 600;
    letter-spacing: .03em;
  }
  .pill.unsup { background:#ecfdf5; color:#047857; }
  .pill.rl    { background:#fef3c7; color:#92400e; }
  .pill.dl    { background:#fce7f3; color:#9d174d; }
  .pill.dim   { background:#e0e7ff; color:#3730a3; }
  .pill.ens   { background:#fef2f2; color:#991b1b; }

  .section-title {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 8px;
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }
  .problem-card p { margin: 8px 0; font-size: 15px; }
  .intuition {
    background: #f5f3ff;
    border-left: 4px solid #8b5cf6;
    border-radius: 6px;
    padding: 12px 16px;
    margin: 8px 0;
  }
  .formula {
    background: #ecfeff;
    border-left: 4px solid #06b6d4;
    border-radius: 6px;
    padding: 10px 16px;
    margin: 8px 0;
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    font-size: 13.5px;
    overflow-x: auto;
  }
  .hints, .tips { margin: 6px 0 6px 4px; padding: 0 0 0 22px; }
  .hints li, .tips li { margin: 6px 0; font-size: 14.5px; }
  .tips-block {
    background: #fff7ed;
    border-left: 4px solid #f59e0b;
    border-radius: 6px;
    padding: 10px 16px;
    margin: 8px 0;
  }
  .complexity { margin-top: 12px; color: var(--muted); font-size: 13.5px; }

  /* CHEATSHEET TABLE */
  .cheat-table {
    border-collapse: collapse;
    width: 100%;
    margin: 8px 0 16px;
    font-size: 14px;
  }
  .cheat-table th, .cheat-table td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  .cheat-table th {
    background: #f3e8ff;
    color: var(--accent);
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .cheat-table td:first-child {
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    background: var(--code-bg);
    white-space: nowrap;
    color: var(--num);
  }
  .cheat-table tr:nth-child(even) td:not(:first-child) { background: #fafbff; }

  /* CODE */
  pre.code {
    background: var(--code-bg);
    color: var(--code-fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 13.5px;
    line-height: 1.55;
    margin: 6px 0;
  }
  pre.code code {
    font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
  }
  .kw  { color: var(--kw);  font-weight: 600; }
  .typ { color: var(--typ); font-weight: 500; }
  .bi  { color: var(--bi);  font-weight: 500; }
  .str { color: var(--str); }
  .cmt { color: var(--cmt); font-style: italic; }
  .num { color: var(--num); }

  /* PREV/NEXT BAR */
  .nav-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #ffffff;
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    z-index: 60;
    box-shadow: 0 -2px 8px rgba(0,0,0,.04);
  }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--fg);
    font-weight: 500;
  }
  .nav-btn:hover:not(:disabled) { background: #f3e8ff; color: var(--accent); border-color: #d8b4fe; }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .nav-info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kbd {
    display: inline-block;
    border: 1px solid #d0d7de;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    background: #f6f8fa;
    font-family: monospace;
    font-size: 11px;
    color: #444;
  }

  /* BRIEF TAB */
  body.brief-mode .nav-bar { display: none; }
  .brief-root { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
  .brief-root .brief-header { text-align: center; margin-bottom: 24px; }
  .brief-root .brief-subtitle {
    font-size: 11px; letter-spacing: 8px; color: var(--muted); margin-bottom: 8px;
  }
  .brief-root .brief-title {
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 900; margin: 0;
    background: linear-gradient(90deg, #7c3aed, #db2777, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
  }
  .brief-root .brief-tagline { color: var(--muted); margin-top: 8px; font-size: 13px; }
  .brief-root .panel {
    background: var(--card); border-radius: 16px;
    border: 1px solid var(--border); padding: 24px; margin-bottom: 20px;
  }
  .brief-root .panel h3 {
    margin: 0 0 12px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent);
  }
  .brief-root .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
  .brief-root .card-mini {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; background: var(--code-bg);
  }
  .brief-root .card-mini b { color: var(--accent); display:block; margin-bottom:4px; font-size:13.5px; }
  .brief-root .card-mini span { color: var(--muted); font-size: 13px; }
  .brief-root .flow {
    border: 1px dashed var(--border); border-radius: 12px;
    padding: 16px; background: var(--code-bg);
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 13px; line-height: 1.9;
    overflow-x: auto;
    white-space: pre;          /* preserve newlines + spacing in the tree */
    margin: 0;
    color: var(--fg);
  }
  .brief-root .flow .q { color: var(--accent); font-weight:700; }
  .brief-root .flow .a { color: var(--str); }
  .brief-root .flow .alg { color: var(--bi); font-weight:700; }

  @media (max-width: 600px) {
    .topbar { padding-left: 70px; padding-right: 70px; }
    main { padding: 20px 14px 130px; }
    .problem-card { padding: 18px 18px; }
    .problem-card h2 { font-size: 19px; }
  }

  /* THEME TOGGLE */
  .theme-toggle {
    position: fixed; top: 14px; right: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 1001;
    font-size: 20px;
    line-height: 1;
    color: var(--fg);
    transition: background .15s, color .15s, border-color .15s, transform .15s;
  }
  .theme-toggle:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }
  .theme-toggle:active { transform: scale(0.95); }

  /* DARK MODE */
  [data-theme="dark"] {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #c084fc;
    --border: #30363d;
    --card: #161b22;
    --code-bg: #0b0f15;
    --code-fg: #e6edf3;
    --kw:  #ff7b72;
    --typ: #d2a8ff;
    --bi:  #ffa657;
    --str: #a5d6ff;
    --cmt: #8b949e;
    --num: #79c0ff;
  }
  [data-theme="dark"] .hamburger { background: var(--card); }
  [data-theme="dark"] .hamburger span { background: var(--fg); }
  [data-theme="dark"] .sidebar { background: var(--card); box-shadow: 2px 0 14px rgba(0,0,0,.4); }
  [data-theme="dark"] .sidebar a { color: var(--fg); }
  [data-theme="dark"] .sidebar a:hover,
  [data-theme="dark"] .sidebar a.active { background: rgba(192,132,252,.15); color: var(--accent); }
  [data-theme="dark"] .topbar { background: var(--card); }
  [data-theme="dark"] .tab { background: #0d1117; border-color: var(--border); }
  [data-theme="dark"] .tab:hover { background: #1c2128; color: var(--fg); }
  [data-theme="dark"] .tab.active { background: var(--card); border-bottom-color: var(--card); color: var(--fg); }
  [data-theme="dark"] .num-tag { background: rgba(192,132,252,.15); color: var(--accent); }
  [data-theme="dark"] .intuition { background: rgba(139,92,246,.10); }
  [data-theme="dark"] .formula { background: rgba(6,182,212,.10); }
  [data-theme="dark"] .tips-block { background: rgba(245,158,11,.10); }
  [data-theme="dark"] .pill { background: rgba(67,56,202,.18); color: #c7d2fe; }
  [data-theme="dark"] .pill.unsup { background: rgba(4,120,87,.18); color: #a7f3d0; }
  [data-theme="dark"] .pill.rl    { background: rgba(146,64,14,.18); color: #fde68a; }
  [data-theme="dark"] .pill.dl    { background: rgba(157,23,77,.18); color: #fbcfe8; }
  [data-theme="dark"] .pill.dim   { background: rgba(55,48,163,.18); color: #c7d2fe; }
  [data-theme="dark"] .pill.ens   { background: rgba(153,27,27,.18); color: #fecaca; }
  [data-theme="dark"] .nav-bar { background: var(--card); box-shadow: 0 -2px 8px rgba(0,0,0,.3); }
  [data-theme="dark"] .nav-btn { background: var(--card); color: var(--fg); }
  [data-theme="dark"] .nav-btn:hover:not(:disabled) { background: rgba(192,132,252,.15); color: var(--accent); border-color: var(--accent); }
  [data-theme="dark"] .kbd { background: #1c2128; border-color: var(--border); color: var(--muted); }
  [data-theme="dark"] pre.code { background: var(--code-bg); }
  [data-theme="dark"] .overlay { background: rgba(0,0,0,.55); }
  [data-theme="dark"] .cheat-table th { background: rgba(192,132,252,.15); color: var(--accent); }
  [data-theme="dark"] .cheat-table td:first-child { background: var(--code-bg); color: var(--num); }
  [data-theme="dark"] .cheat-table tr:nth-child(even) td:not(:first-child) { background: rgba(255,255,255,.02); }
</style>
</head>
<body>

<button class="hamburger" id="hamburger" aria-label="Open menu">
  <span></span><span></span><span></span>
</button>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <h2>Table of Contents</h2>
  <div id="toc"></div>
</aside>

<header class="topbar">
  <h1>30 AI Algorithms — Cheatsheet, Intuition &amp; Python Snippets</h1>
  <p>Click a difficulty tab. Use <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> arrow keys to navigate within the tab.</p>
  <div class="tabs" id="tabs">
    <div class="tab veasy" data-diff="veasy"><span class="dot"></span>Foundations<span class="count" id="cnt-veasy"></span></div>
    <div class="tab easy"  data-diff="easy"><span class="dot"></span>Easy<span class="count" id="cnt-easy"></span></div>
    <div class="tab med"   data-diff="med"><span class="dot"></span>Medium<span class="count" id="cnt-med"></span></div>
    <div class="tab hard"  data-diff="hard"><span class="dot"></span>Hard<span class="count" id="cnt-hard"></span></div>
    <div class="tab brief" data-diff="brief"><span class="dot"></span>Brief</div>
  </div>
</header>

<main id="main"></main>

<div class="nav-bar">
  <button class="nav-btn" id="prev">&larr; Previous</button>
  <div class="nav-info" id="nav-info"></div>
  <button class="nav-btn" id="next">Next &rarr;</button>
</div>

<script>
/* ----------------------- DATA: ALL ALGORITHMS ----------------------- */
const PROBLEMS = [];

/* ===================== FOUNDATION ===================== */
PROBLEMS.push({
  num: 0, title: "The AI Algorithms Cheatsheet (read this first)", diff: "veasy",
  family: "Foundations",
  problem: "ML algorithms split into three big families: SUPERVISED (you have labeled (X, y) pairs and learn a function), UNSUPERVISED (no labels, find structure), and REINFORCEMENT (an agent acts in an environment and learns from rewards). Knowing which family a problem lives in narrows the algorithm choice from 30 to about 5.",
  intuition: "Pick the family from the data shape, then pick the algorithm from the bias–variance trade-off and the data scale. Linear models are high-bias / low-variance and need lots of data to be wrong; tree ensembles are low-bias and dominate tabular data; deep nets dominate when raw signals (pixels, audio, text, sequences) are involved; reinforcement learning is for sequential decision making where you optimize a long-run reward, not a single label.",
  hints: [
    "Labels y available? → Supervised. y is continuous → Regression. y is categorical → Classification.",
    "No labels? → Unsupervised. Group rows → Clustering. Compress columns → Dimensionality reduction. Score how weird → Anomaly detection.",
    "Sequential decisions with feedback? → Reinforcement Learning (MDP, Q-learning, policy gradient, actor-critic).",
    "Tabular and small? → Start with a linear/logistic baseline, then a tree ensemble (Random Forest / XGBoost).",
    "Images, audio, text, time series? → Deep learning (CNN / RNN / LSTM / Transformer)."
  ],
  tips: [
    "Always train a dumb baseline first (mean predictor, logistic regression, k-NN). If your fancy model can't beat it, the data — not the model — is the bug.",
    "Bias–variance: high training error = bias (underfitting), big train↔val gap = variance (overfitting).",
    "Standardize features for any distance- or gradient-based model (k-NN, k-Means, SVM, PCA, NN). Trees don't care.",
    "Validate with train / val / test or k-fold CV. Never tune hyperparameters on the test set.",
    "More data > more model. Doubling clean data usually beats doubling depth."
  ],
  cheatsheetHtml: `
    <table class="cheat-table">
      <thead><tr><th>Family</th><th>Algorithms in this guide</th></tr></thead>
      <tbody>
        <tr><td>Supervised — Regression</td><td>Linear Regression</td></tr>
        <tr><td>Supervised — Classification</td><td>Logistic Reg, k-NN, Naive Bayes, Decision Tree, SVM</td></tr>
        <tr><td>Ensembles (sup.)</td><td>Random Forest, AdaBoost, Gradient Boosting, XGBoost</td></tr>
        <tr><td>Clustering (unsup.)</td><td>k-Means, k-Means++, Hierarchical, DBSCAN</td></tr>
        <tr><td>Dim. Reduction (unsup.)</td><td>PCA, t-SNE, Autoencoders</td></tr>
        <tr><td>Anomaly Detection</td><td>Isolation Forest</td></tr>
        <tr><td>Deep Learning</td><td>ANN, CNN, RNN, LSTM, Transformer</td></tr>
        <tr><td>Reinforcement Learning</td><td>MDP, Q-Learning, SARSA, DQN, Policy Gradient, Actor-Critic</td></tr>
        <tr><td>Search / Optimization</td><td>Genetic Algorithms</td></tr>
      </tbody>
    </table>
    <p><b>Bias–variance one-liners:</b></p>
    <ul class="hints">
      <li><b>Linear / Logistic / Naive Bayes</b> — high bias, low variance, fast, interpretable. Great baselines.</li>
      <li><b>k-NN / Decision Tree</b> — low bias, high variance. Easy to overfit on small data.</li>
      <li><b>Random Forest / Gradient Boosting</b> — bagging averages variance away; boosting cuts bias. Workhorses on tabular data.</li>
      <li><b>SVM with RBF</b> — flexible decision boundaries, but tuning C and γ matters and it scales as O(n²) – O(n³).</li>
      <li><b>Deep nets</b> — universal approximators, dominant on raw perceptual data, hungry for data and compute.</li>
    </ul>
  `,
  code: `# ----------------------------------------------------------------------
# The five lines you'll write at the start of nearly every ML script.
# Memorise this skeleton; every algorithm in this guide drops into it.

import numpy as np

  intuition: "Pick the first centroid uniformly at random. For every next centroid, sample a point with probability proportional to its squared distance to the nearest already-chosen centroid. The further a point is from the existing centroids, the more likely it gets picked — so seeds spread out instead of clumping. Then run normal k-Means.",
  formula: "P(x is next centroid) = D(x)² / Σⱼ D(xⱼ)²   where D(x) = min‖x − μ‖",

    "If features have different scales, k-Means++ won't save you — still standardize.",
    "On streaming data, look at scalable k-Means++ (k-Means|| / Spark MLlib's variant).",
    "If you only ever start k-Means once, k-Means++ is the cheapest accuracy upgrade you can make."

  code: `import numpy as np

def kmeanspp_init(X, k, rng=np.random.default_rng(0)):
    n = len(X)
    idx = [rng.integers(n)]                       # first centroid uniform
    for _ in range(1, k):
        d2 = np.min(((X[:, None] - X[idx][None]) ** 2).sum(-1), axis=1)
        probs = d2 / d2.sum()
        idx.append(rng.choice(n, p=probs))        # ∝ D(x)²
    return X[idx]

# Then run normal k-Means starting from these centroids.

km = KMeans(n_clusters=4, init='k-means++', n_init=1, random_state=42).fit(X)`,

PROBLEMS.push({
  num: 29, title: "Markov Decision Process (MDP)", diff: "med",
  family: "Reinforcement Learning — Foundations",
  problem: "Formalise sequential decision-making as a tuple (S, A, P, R, γ): states, actions, transition probabilities P(s'|s,a), rewards R(s,a), and a discount factor γ ∈ [0,1). Find a policy π(a|s) that maximises the expected discounted return.",
  intuition: "MDP = Markov assumption (the future depends only on the current state) + a clear notion of value. The Bellman equation V*(s) = maxₐ [R(s,a) + γ Σ P(s'|s,a) V*(s')] is recursive — solve it once and you have the optimal policy. When P and R are known, value iteration / policy iteration solve it exactly. When they aren't, you need RL (cards 16, 17, 18, 19, 20).",
  formula: "V*(s) = maxₐ [R(s,a) + γ Σ_s' P(s'|s,a) V*(s')]      Q*(s,a) = R(s,a) + γ Σ_s' P(s'|s,a) maxₐ' Q*(s',a')",
  hints: [
    "Discount factor γ trades off immediate vs long-term reward (typical 0.9 – 0.99).",
    "Value iteration: repeatedly apply the Bellman update until V converges. Convergence rate ∝ γ.",
    "Policy iteration: alternate (1) evaluate the current policy by solving its linear system, (2) make π greedy w.r.t. V.",
    "MDPs assume the state captures EVERYTHING — if it doesn't, you have a POMDP and life gets harder."
  ],
  tips: [
    "Value iteration converges in roughly log(1/(1-γ)) iterations for ε-accuracy.",
    "If |S| is huge, you tabulate-then-die. Use function approximation (DQN — card 18) instead.",
    "Reward shaping changes the speed of learning, never the optimal policy (provided you stay potential-based).",
    "MDP is the language; Q-learning, SARSA, DQN, policy gradient, actor-critic are the algorithms that solve it."
  ],
  code: `import numpy as np

def value_iteration(P, R, gamma=0.99, theta=1e-6):
    """
    P : array of shape (S, A, S) — transition probabilities
    R : array of shape (S, A)   — expected immediate reward
    """
    S, A = R.shape
    V = np.zeros(S)
    while True:
        Q = R + gamma * np.einsum('sap,p->sa', P, V)   # Bellman backup
        V_new = Q.max(axis=1)
        if np.abs(V_new - V).max() < theta: break
        V = V_new
    pi = Q.argmax(axis=1)        # greedy policy
    return V, pi`,
  complexity: "Value iteration O(|S|² · |A| · iters). Memory O(|S|² · |A|) for P. Tabular ≤ ~10⁶ states."
});

  family: "Search / Optimization — Evolutionary",
  problem: "Optimise a black-box fitness function by evolving a POPULATION of candidate solutions. Each generation: SELECT parents weighted by fitness, CROSS OVER pairs to produce offspring, randomly MUTATE bits, replace the population.",
  intuition: "Borrowed from biology. You don't need gradients, the function doesn't have to be smooth, and the search escapes local optima because mutation + crossover keep the population diverse. Trade-off: slow per-evaluation (you call the fitness function many times), embarrassingly parallel.",
  formula: "P(parent = i) ∝ fitness(i)    child = crossover(p₁, p₂)    child′ = mutate(child)    population ← top-N(parents ∪ children)",
  hints: [
    "Pick selection: roulette / tournament / rank. Tournament is robust and easy.",
    "Encode the candidate as a fixed-length vector (binary, real-valued, or permutation).",
    "Mutation rate ~1/L, where L is the chromosome length.",
    "Elitism: always carry the top-k unchanged into the next generation, otherwise you can lose the current best."
  ],
  tips: [
    "Great when the fitness landscape is non-differentiable, noisy, or has many local optima (NAS, hyperparameter tuning, scheduling).",
    "If you have gradients, use them. GAs are inefficient compared to gradient methods on smooth problems.",
    "CMA-ES, NEAT, and differential evolution are stronger evolutionary cousins worth knowing.",
    "Always cache fitness evaluations — they're usually the bottleneck."
  ],
  code: `import numpy as np

def genetic_algorithm(fitness, n_genes, pop=50, generations=100,
                      mut_rate=0.05, elite=2, rng=np.random.default_rng(0)):
    population = rng.integers(0, 2, (pop, n_genes))    # binary encoding
    for _ in range(generations):
        scores = np.array([fitness(ind) for ind in population])
        order  = scores.argsort()[::-1]
        keep   = population[order[:elite]]             # elitism
        # tournament selection (size 3)
        def pick():
            idx = rng.integers(0, pop, 3); return population[idx[scores[idx].argmax()]]
        children = []
        while len(children) < pop - elite:
            p1, p2 = pick(), pick()
            c = rng.integers(1, n_genes)
            child = np.r_[p1[:c], p2[c:]]              # one-point crossover
            mask  = rng.random(n_genes) < mut_rate
            child = np.where(mask, 1 - child, child)   # bit-flip mutation
            children.append(child)
        population = np.vstack([keep, children])
    scores = np.array([fitness(ind) for ind in population])
    return population[scores.argmax()], scores.max()`,
  complexity: "O(generations · pop · cost-of-fitness). Memory O(pop · n_genes)."
});

  intuition: "OFF-POLICY temporal difference learning: act using whatever exploration policy you like (typically ε-greedy), but always update toward the GREEDY future value. The max in the target is what makes Q-learning learn the optimal policy regardless of the data-collection policy. Tabular Q-learning is provably correct for small discrete state/action spaces.",

  hints: [
    "Initialize Q to zeros (or optimistic values to encourage exploration).",
    "Use ε-greedy: with probability ε pick a random action, otherwise pick argmax Q. Decay ε over time.",
    "Learning rate α typically 0.1; discount γ typically 0.9 – 0.99.",
    "Q-learning maximises over actions in the target — this introduces 'maximisation bias'. Double Q-learning fixes it."
  ],
  tips: [
    "Tabular Q-learning works only for tiny discrete worlds. Beyond that, use DQN (card 18).",
    "OFF-policy means you can replay old (s,a,r,s') transitions — replay buffers are critical for stability.",
    "Reward shaping speeds learning but never changes the optimal policy if you stick to potential-based shaping.",
    "Watch for non-stationary returns when γ ≈ 1 — bootstrapped values can blow up."

  code: `import numpy as np

def q_learning(env, episodes=2000, alpha=0.1, gamma=0.99, eps=1.0, eps_min=0.05, eps_decay=0.995):
    Q = np.zeros((env.n_states, env.n_actions))
    for ep in range(episodes):
        s = env.reset()
        done = False
        while not done:
            # ε-greedy action selection
            a = np.random.randint(env.n_actions) if np.random.rand() < eps else int(np.argmax(Q[s]))
            s2, r, done = env.step(a)
            # Bellman update — note the max over a' (off-policy)
            target = r + gamma * (0 if done else Q[s2].max())
            Q[s, a] += alpha * (target - Q[s, a])
            s = s2
        eps = max(eps_min, eps * eps_decay)

def sarsa(env, episodes=2000, alpha=0.1, gamma=0.99, eps=0.1):

        return np.random.randint(env.n_actions) if np.random.rand() < eps else int(np.argmax(Q[s]))

class PolicyNet(nn.Module):
    def __init__(self, n_in, n_act):

        self.f = nn.Sequential(nn.Linear(n_in, 128), nn.Tanh(),
                               nn.Linear(128, n_act))

def reinforce_episode(policy, opt, traj, gamma=0.99):
    """ traj = list of (state, action, reward) for one rollout. """
    states  = torch.stack([t[0] for t in traj])
    actions = torch.tensor([t[1] for t in traj])
    rewards = [t[2] for t in traj]

    # discounted return-to-go
    G, returns = 0.0, []
    for r in reversed(rewards):
        G = r + gamma * G
        returns.insert(0, G)
    returns = torch.tensor(returns, dtype=torch.float32)

    loss   = -(logp * returns).mean()

/* ----------------------- RENDERING ENGINE ----------------------- */

const DIFF_LABEL = { veasy: 'Foundations', easy: 'Easy', med: 'Medium', hard: 'Hard', brief: 'Brief' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Lightweight Python syntax highlighter — same scheme as the Bit-Manipulation guide. */
function highlightPython(src) {
  let s = escapeHtml(src);
  const stash = [];
  const stashIt = (html) => {
    stash.push(html);
    return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001';
  };

  // line comments (#)
  s = s.replace(/#[^\n]*/g, m => stashIt('<span class="cmt">' + m + '</span>'));
  // triple-quoted strings (kept simple)
  s = s.replace(/&quot;&quot;&quot;[\s\S]*?&quot;&quot;&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  s = s.replace(/&#39;&#39;&#39;[\s\S]*?&#39;&#39;&#39;/g, m => stashIt('<span class="str">' + m + '</span>'));
  // double-quoted / single-quoted strings
  s = s.replace(/&quot;([^&\n]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  s = s.replace(/&#39;([^&\n]|&(?!#39;))*?&#39;/g,    m => stashIt('<span class="str">' + m + '</span>'));

  const builtins = ['print','len','range','enumerate','zip','map','filter','sum','min','max',
    'abs','round','sorted','reversed','list','dict','set','tuple','int','float','str','bool',
    'isinstance','any','all','next','iter','open','type','super','hasattr','getattr','setattr'];
  const biRe = new RegExp('\\b(' + builtins.join('|') + ')\\b', 'g');
  s = s.replace(biRe, (_, name) => stashIt('<span class="bi">' + name + '</span>'));

  const types = ['np','torch','nn','F','pd','plt','sklearn','sk','tf','keras','xgb','lgb',
    'StandardScaler','LinearRegression','LogisticRegression','Ridge','Lasso','KNeighborsClassifier',
    'DecisionTreeClassifier','RandomForestClassifier','GradientBoostingClassifier','XGBClassifier',
    'SVC','SVR','KMeans','DBSCAN','PCA','TSNE','IsolationForest','Pipeline','Tensor','DataLoader',
    'Module','Sequential','Linear','Conv2d','BatchNorm2d','LSTM','GRU','MultiheadAttention',
    'LayerNorm','ReLU','GELU','Tanh','Embedding','MaxPool2d','AdaptiveAvgPool2d','Flatten',
    'Categorical','Optimizer','Adam','SGD','True','False','None','self'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  const kws = ['def','class','return','if','elif','else','for','while','in','not','and','or',
    'is','import','from','as','with','try','except','finally','raise','pass','break','continue',
    'lambda','yield','global','nonlocal','async','await'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  // numbers
  s = s.replace(/\b(\d+(?:\.\d+)?(?:e[+-]?\d+)?)\b/g, '<span class="num">$1</span>');

  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

function getProblems(diff) {
  return PROBLEMS
    .filter(p => p.diff === diff)
    .sort((a, b) => a.num - b.num);
}

const state = { diff: 'veasy', idx: 0 };

function renderTOC() {
  const toc = document.getElementById('toc');
  const groups = [
    { diff: 'veasy', label: 'Foundations' },
    { diff: 'easy',  label: 'Easy' },
    { diff: 'med',   label: 'Medium' },
    { diff: 'hard',  label: 'Hard' },
  ];
  const html = groups.map(g => {
    const items = getProblems(g.diff)
      .map((p, i) => `<a data-diff="${g.diff}" data-idx="${i}"><span class="num">${p.num === 0 ? '★' : '#' + p.num}</span>${escapeHtml(p.title)}</a>`)
      .join('');
    return `<div class="group-title">${g.label}</div>${items}`;
  }).join('');
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      state.diff = a.dataset.diff;
      state.idx = +a.dataset.idx;
      render();
      toggleSidebar(false);
    });
  });
}

function renderTabs() {
  document.getElementById('cnt-veasy').textContent = '(' + getProblems('veasy').length + ')';
  document.getElementById('cnt-easy').textContent  = '(' + getProblems('easy').length + ')';
  document.getElementById('cnt-med').textContent   = '(' + getProblems('med').length + ')';
  document.getElementById('cnt-hard').textContent  = '(' + getProblems('hard').length + ')';
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      if (state.diff !== t.dataset.diff) {
        state.diff = t.dataset.diff;
        state.idx = 0;
        render();
      }
    };
  });
}

function render() {
  const main = document.getElementById('main');

  if (state.diff === 'brief') {
    document.body.classList.add('brief-mode');
    main.innerHTML = renderBriefView();
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.diff === state.diff);
    });
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  document.body.classList.remove('brief-mode');

  const problems = getProblems(state.diff);
  if (state.idx >= problems.length) state.idx = problems.length - 1;
  if (state.idx < 0) state.idx = 0;
  const p = problems[state.idx];
  const numTag = p.num === 0 ? '★ Foundation' : '#' + p.num;

  const cheatBlock = p.cheatsheetHtml
    ? `<div class="section-title">Cheatsheet</div>${p.cheatsheetHtml}`
    : '';

  const formulaBlock = p.formula
    ? `<div class="section-title">Key Formula</div><div class="formula">${escapeHtml(p.formula)}</div>`
    : '';

  const familyPill = p.family
    ? `<span class="pill">${escapeHtml(p.family)}</span>`
    : '';

  main.innerHTML = `
    <div class="problem-card">
      <h2>
        <span class="num-tag">${numTag}</span>
        ${escapeHtml(p.title)}
        <span class="badge ${p.diff}">${DIFF_LABEL[p.diff]}</span>
        ${familyPill}
      </h2>

      <div class="section-title">Problem</div>
      <p>${escapeHtml(p.problem)}</p>

      <div class="section-title">Intuition</div>
      <div class="intuition">${escapeHtml(p.intuition)}</div>

      ${formulaBlock}
      ${cheatBlock}

      <div class="section-title">Step-by-step Hints</div>
      <ol class="hints">${p.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ol>

      <div class="section-title">Tips & Tricks</div>
      <div class="tips-block"><ul class="tips">${p.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>

      <div class="section-title">Python Code</div>
      <pre class="code"><code>${highlightPython(p.code)}</code></pre>

      ${p.complexity ? `<div class="complexity"><b>Complexity:</b> ${escapeHtml(p.complexity)}</div>` : ''}
    </div>
  `;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.diff === state.diff);
  });

  document.getElementById('prev').disabled = state.idx === 0;
  document.getElementById('next').disabled = state.idx === problems.length - 1;
  document.getElementById('nav-info').textContent =
    `${DIFF_LABEL[state.diff]} · ${state.idx + 1} / ${problems.length}`;

  document.querySelectorAll('.sidebar a').forEach(a => {
    a.classList.toggle('active', a.dataset.diff === state.diff && +a.dataset.idx === state.idx);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextProblem() {
  const arr = getProblems(state.diff);
  if (state.idx < arr.length - 1) { state.idx++; render(); }
}
function prevProblem() {
  if (state.idx > 0) { state.idx--; render(); }
}
document.getElementById('prev').addEventListener('click', prevProblem);
document.getElementById('next').addEventListener('click', nextProblem);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') prevProblem();
  else if (e.key === 'ArrowRight') nextProblem();
  else if (e.key === 'Escape') toggleSidebar(false);
});

const hb = document.getElementById('hamburger');
const sb = document.getElementById('sidebar');
const ov = document.getElementById('overlay');
function toggleSidebar(open) {
  const isOpen = (typeof open === 'boolean') ? open : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  hb.classList.toggle('open', isOpen);
  ov.classList.toggle('show', isOpen);
}
hb.addEventListener('click', () => toggleSidebar());
ov.addEventListener('click', () => toggleSidebar(false));

/* theme toggle */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️';
    themeBtn.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙';
    themeBtn.title = 'Switch to dark mode';
  }
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('theme', next);
});



/* ===== BRIEF MODE: at-a-glance map of the 30 algorithms ===== */
function renderBriefView() {
  const families = [
    { title: 'Supervised — Regression',          algos: ['Linear Regression'] },
    { title: 'Supervised — Classification',      algos: ['Logistic Regression', 'k-NN', 'Naive Bayes', 'Decision Tree', 'SVM'] },
    { title: 'Ensembles',                        algos: ['Random Forest', 'AdaBoost', 'Gradient Boosting', 'XGBoost'] },
    { title: 'Clustering',                       algos: ['k-Means', 'k-Means++', 'Hierarchical', 'DBSCAN'] },
    { title: 'Dimensionality Reduction',         algos: ['PCA', 't-SNE', 'Autoencoders'] },
    { title: 'Anomaly Detection',                algos: ['Isolation Forest'] },
    { title: 'Deep Learning',                    algos: ['ANN', 'CNN', 'RNN', 'LSTM', 'Transformer'] },
    { title: 'Reinforcement Learning',           algos: ['MDP', 'Q-Learning', 'SARSA', 'DQN', 'Policy Gradient', 'Actor-Critic'] },
    { title: 'Search / Optimization',            algos: ['Genetic Algorithms'] },
  ];

  const decisionFlow = `
<span class="q">Q1.</span> Do you have labeled (X, y) pairs?
   ├── <span class="a">YES</span> → <span class="q">Q2.</span> Is y continuous or categorical?
   │       ├── continuous   → <span class="alg">Linear Regression / Gradient Boosting / Neural Net</span>
   │       └── categorical  → <span class="alg">Logistic Reg / Decision Tree / Random Forest / XGBoost / SVM</span>
   └── <span class="a">NO</span>  → <span class="q">Q3.</span> Are you grouping rows, compressing columns, or scoring weirdness?
           ├── group rows         → <span class="alg">k-Means / k-Means++ / DBSCAN / Hierarchical</span>
           ├── compress columns   → <span class="alg">PCA / t-SNE / Autoencoders</span>
           └── score weirdness    → <span class="alg">Isolation Forest</span>

<span class="q">Q4.</span> Are you making sequential decisions with reward feedback?
   └── <span class="a">YES</span> → <span class="alg">MDP → Q-Learning / SARSA → DQN → Policy Gradient → Actor-Critic</span>

<span class="q">Q5.</span> Is your input raw pixels, audio, text, or a long sequence?
   ├── images / video        → <span class="alg">CNN (or Vision Transformer)</span>
   ├── short sequences       → <span class="alg">RNN / LSTM</span>
   └── long sequences / text → <span class="alg">Transformer</span>
`;

  const bvCards = [
    { b: 'Linear / Logistic / Naive Bayes', s: 'High bias, low variance. Fast, interpretable, great baselines.' },
    { b: 'k-NN / Decision Tree',            s: 'Low bias, high variance. Easy to overfit on small data.' },
    { b: 'Random Forest / Boosting',        s: 'Bagging averages variance away; boosting cuts bias. Tabular workhorses.' },
    { b: 'SVM (RBF)',                       s: 'Flexible but tuning C, γ matters. Scales as O(n²)–O(n³).' },
    { b: 'Deep Nets',                       s: 'Universal approximators. Dominate raw perceptual data. Hungry for data + compute.' },
  ];

  const families_html = families.map(f => `
    <div class="panel">
      <h3>${escapeHtml(f.title)}</h3>
      <div class="grid">
        ${f.algos.map(a => `<div class="card-mini"><b>${escapeHtml(a)}</b><span>see card in Foundations / Easy / Medium / Hard tabs</span></div>`).join('')}
      </div>
    </div>`).join('');

  const bv_html = `
    <div class="panel">
      <h3>Bias–Variance Cheatsheet</h3>
      <div class="grid">
        ${bvCards.map(c => `<div class="card-mini"><b>${escapeHtml(c.b)}</b><span>${escapeHtml(c.s)}</span></div>`).join('')}
      </div>
    </div>`;

  return `
    <div class="brief-root">
      <header class="brief-header">
        <div class="brief-subtitle">A I &nbsp; A L G O R I T H M S</div>
        <h1 class="brief-title">30 Algorithms · One Decision</h1>
        <p class="brief-tagline">Pick the family from your data. Pick the algorithm from bias–variance and scale.</p>
      </header>

      <div class="panel">
        <h3>The 5-Question Decision Flow</h3>
        <div class="flow">${decisionFlow}</div>
      </div>

      ${bv_html}
      ${families_html}
    </div>
  `;
}

renderTabs();
bindTabs();
renderTOC();
render();
</script>

<!-- KIRO_CROSS_TAB_NAV_START -->
<script id="kiro-cross-tab-nav">
(function(){
  if(window.__kiroCrossTabNav) return;
  window.__kiroCrossTabNav = true;
  function init(){
    if(typeof getProblems !== 'function' || typeof window.render !== 'function' || typeof state === 'undefined') return;
    var ORDER = ['veasy','easy','med','hard'];
    function diffs(){ return ORDER.filter(function(d){ try { return getProblems(d).length > 0; } catch(e){ return false; } }); }

    function updateNavButtons(){
      var prevB = document.getElementById('prev');
      var nextB = document.getElementById('next');
      if(!prevB || !nextB) return;
      if(state.diff === 'brief'){ return; }
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      prevB.disabled = (di <= 0 && state.idx <= 0);
      nextB.disabled = (di === list.length - 1 && state.idx >= arr.length - 1);
    }

    var origRender = window.render;
    window.render = function(){
      var r = origRender.apply(this, arguments);
      try { updateNavButtons(); } catch(e){}
      return r;
    };

    function goNext(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      if(state.idx < arr.length - 1){ state.idx++; window.render(); return; }
      if(di < list.length - 1){ state.diff = list[di + 1]; state.idx = 0; window.render(); }
    }
    function goPrev(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      if(state.idx > 0){ state.idx--; window.render(); return; }
      if(di > 0){
        var pd = list[di - 1];
        state.diff = pd;
        var parr = getProblems(pd);
        state.idx = Math.max(0, parr.length - 1);
        window.render();
      }
    }

    window.nextProblem = goNext;
    window.prevProblem = goPrev;

    ['prev','next'].forEach(function(id){
      var b = document.getElementById(id);
      if(!b) return;
      var clone = b.cloneNode(true);
      b.parentNode.replaceChild(clone, b);
      clone.addEventListener('click', id === 'next' ? goNext : goPrev);
    });

    updateNavButtons();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<!-- KIRO_CROSS_TAB_NAV_END -->
