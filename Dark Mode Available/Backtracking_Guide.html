<!DOCTYPE html>
<html lang="en">
<head>

<title>Backtracking — Hints, Tricks & Java Snippets</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<style>
  :root {
    --bg: #f6f7fb;
    --fg: #1f2330;
    --muted: #6b7280;
    --accent: #2563eb;
    --border: #e3e6ee;
    --card: #ffffff;
    --code-bg: #f8fafc;        /* LIGHT code background */
    --code-fg: #24292f;
    --kw: #cf222e;             /* keywords - red */
    --typ: #6f42c1;            /* types - purple */
    --str: #0a7d4d;            /* strings - green */
    --cmt: #6a737d;            /* comments - gray italic */
    --num: #0550ae;            /* numbers - blue */
    --veasy: #0891b2;
    --easy: #16a34a;
    --med: #d97706;
    --hard: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
  }

  /* HAMBURGER + TOC SIDEBAR */
  .hamburger {
    position: fixed; top: 14px; left: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 5px; cursor: pointer; z-index: 1001;
  }
  .hamburger span {
    display: block; width: 22px; height: 2.5px;
    background: #1e1e25; border-radius: 2px;
    transition: transform .25s, opacity .2s;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

  .sidebar {
    position: fixed; top: 0; left: 0;
    height: 100vh; width: 360px; max-width: 90vw;
    background: #ffffff;
    border-right: 1px solid var(--border);
    box-shadow: 2px 0 14px rgba(0,0,0,.06);
    transform: translateX(-100%);
    transition: transform .28s ease;
    overflow-y: auto;
    z-index: 1000;
    padding: 70px 18px 32px;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2 {
    margin: 0 0 12px;
    font-size: 13px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .sidebar .group-title {
    margin-top: 18px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .sidebar a {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px;
    margin: 2px 0;
    text-decoration: none;
    color: #1f2330;
    border-radius: 6px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .sidebar a:hover { background: #eef2ff; color: var(--accent); }
  .sidebar a.active { background: #eef2ff; color: var(--accent); font-weight: 600; }
  .sidebar a .num {
    display: inline-block;
    min-width: 28px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.25);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 999;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  /* HERO + TABS */
  .topbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 18px 24px 0;
    padding-left: 76px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 {
    margin: 0 0 6px; font-size: 20px;
  }
  .topbar p {
    margin: 0 0 10px; color: var(--muted); font-size: 13.5px;
  }
  .tabs {
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .tab {
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: #f1f3f9;
    color: var(--muted);
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    transition: background .15s;
  }
  .tab:hover { background: #e7eaf3; color: var(--fg); }
  .tab.active {
    background: #ffffff;
    color: var(--fg);
    border-bottom: 2px solid #ffffff;
    margin-bottom: -1px;
    box-shadow: 0 -2px 0 var(--accent) inset;
  }
  .tab .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: 1px;
  }
  .tab.veasy .dot { background: var(--veasy); }
  .tab.easy .dot { background: var(--easy); }
  .tab.med .dot { background: var(--med); }
  .tab.hard .dot { background: var(--hard); }
  .tab .count { color: var(--muted); margin-left: 6px; font-weight: 500; }

  /* MAIN */
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 24px 120px;

  .problem-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .problem-card h2 {
    margin: 0 0 6px;
    font-size: 24px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .num-tag {
    background: #eef2ff; color: var(--accent);
    padding: 3px 10px; border-radius: 6px;
    font-size: 13px; font-weight: 700;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff; font-weight: 700; letter-spacing: .05em;
  }
  .badge.veasy { background: var(--veasy); }
  .badge.easy { background: var(--easy); }
  .badge.med { background: var(--med); }
  .badge.hard { background: var(--hard); }

  .section-title {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 8px;
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }
  .problem-card p {
    margin: 8px 0;
    font-size: 15px;
  }
  .intuition {
    background: #ecfeff;
    border-left: 4px solid #06b6d4;
    border-radius: 6px;
    padding: 12px 16px;
    margin: 8px 0;
  }
  .hints, .tips {
    margin: 6px 0 6px 4px;
    padding: 0 0 0 22px;
  }
  .hints li, .tips li { margin: 6px 0; font-size: 14.5px; }
  .tips-block {
    background: #fff7ed;
    border-left: 4px solid #f59e0b;
    border-radius: 6px;
    padding: 10px 16px;
    margin: 8px 0;
  }
  .complexity {
    margin-top: 12px;
    color: var(--muted);
    font-size: 13.5px;
  }

  /* CODE */
  pre.code {
    background: var(--code-bg);
    color: var(--code-fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 13.5px;
    line-height: 1.55;
    margin: 6px 0;
  }
  pre.code code {
    font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
  }
  .kw  { color: var(--kw);  font-weight: 600; }
  .typ { color: var(--typ); font-weight: 500; }
  .str { color: var(--str); }
  .cmt { color: var(--cmt); font-style: italic; }
  .num { color: var(--num); }

  /* PREV/NEXT BAR */
  .nav-bar {
    position: fixed; left: 0; right: 0; bottom: 0;

    background: #ffffff;
    border: 1px solid var(--border);

  .nav-info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kbd {
    display: inline-block;
    border: 1px solid #d0d7de;

    border-radius: 4px;
    padding: 1px 6px;
    background: #f6f8fa;
    font-family: monospace;
    font-size: 11px;
    color: #444;
  }

  /* INTRO CARD */
  .intro {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 26px;
    margin-bottom: 24px;
  }
  .intro h2 { margin-top: 0; }

  @media (max-width: 600px) {
    .topbar { padding-left: 70px; padding-right: 70px; }
    main { padding: 20px 14px 130px; }
    .problem-card { padding: 18px 18px; }
    .problem-card h2 { font-size: 19px; }
  }

  /* THEME TOGGLE BUTTON (top-right) */
  .theme-toggle {
    position: fixed; top: 14px; right: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 1001;
    font-size: 20px;
    line-height: 1;
    color: var(--fg);

  }
  .theme-toggle:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }
  .theme-toggle:active { transform: scale(0.95); }

  /* ===================== DARK MODE ===================== */
  [data-theme="dark"] {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --border: #30363d;
    --card: #161b22;
    --code-bg: #0b0f15;
    --code-fg: #e6edf3;
    --kw:  #ff7b72;
    --typ: #d2a8ff;
    --str: #a5d6ff;
    --cmt: #8b949e;
    --num: #79c0ff;
  }
  [data-theme="dark"] .hamburger { background: var(--card); }
  [data-theme="dark"] .hamburger span { background: var(--fg); }
  [data-theme="dark"] .sidebar { background: var(--card); box-shadow: 2px 0 14px rgba(0,0,0,.4); }
  [data-theme="dark"] .sidebar a { color: var(--fg); }
  [data-theme="dark"] .sidebar a:hover,
  [data-theme="dark"] .sidebar a.active { background: rgba(88,166,255,.15); color: var(--accent); }
  [data-theme="dark"] .topbar { background: var(--card); }
  [data-theme="dark"] .tab { background: #0d1117; border-color: var(--border); }
  [data-theme="dark"] .tab:hover { background: #1c2128; color: var(--fg); }
  [data-theme="dark"] .tab.active { background: var(--card); border-bottom-color: var(--card); color: var(--fg); }
  [data-theme="dark"] .num-tag { background: rgba(88,166,255,.15); color: var(--accent); }
  [data-theme="dark"] .intuition { background: rgba(6,182,212,.10); }
  [data-theme="dark"] .tips-block { background: rgba(245,158,11,.10); }
  [data-theme="dark"] .nav-bar { background: var(--card); box-shadow: 0 -2px 8px rgba(0,0,0,.3); }
  [data-theme="dark"] .nav-btn { background: var(--card); color: var(--fg); }
  [data-theme="dark"] .nav-btn:hover:not(:disabled) { background: rgba(88,166,255,.15); color: var(--accent); border-color: var(--accent); }
  [data-theme="dark"] .kbd { background: #1c2128; border-color: var(--border); color: var(--muted); }
  [data-theme="dark"] pre.code { background: var(--code-bg); }
  [data-theme="dark"] .overlay { background: rgba(0,0,0,.55); }

<script>
/* ----------------------- DATA: ALL PROBLEMS ----------------------- */
const PROBLEMS = [];


/* ===================== TEMPLATE / FOUNDATION ===================== */
PROBLEMS.push({
  num: 0, title: "The Backtracking Template (read this first)", diff: "veasy",
  problem: "Backtracking is a systematic, controlled brute-force technique. You build a candidate solution one decision at a time, and the moment a partial candidate is shown to be hopeless, you abandon it (\"backtrack\") and try a different decision. It powers permutations, combinations, subsets, sudoku, n-queens, maze paths, expression building — virtually every \"explore all valid configurations\" problem.",
  intuition: "Picture every possible solution as a node in a giant decision tree. The root is the empty solution; each edge represents one decision; each leaf is a complete candidate. Backtracking is just Depth-First Search on this tree, with two superpowers: (1) you PRUNE entire subtrees the instant you can prove they can't lead to a valid answer, and (2) on the way back up, you UNDO whatever you changed, so the next branch starts from a clean slate. The 'back' in backtracking is literally that undo step.",
  hints: [
    "STATE = what changes during recursion (current path, current index, running sum, visited mask…). CHOICES = what you branch on at each node (which number to add, which color to use, which cell to step into).",
    "BASE CASE: when is the partial solution complete? That's where you record an answer and return. Without a clear base case, recursion never ends.",
    "RECURSIVE STEP: loop over the available choices. For each one, validate → apply → recurse → undo. The four words choose, explore, un-choose are the heartbeat of the pattern.",
    "PRUNE BEFORE you recurse, never after. A check that comes after the recursive call has already paid the exponential cost.",
    "If you reach the same state through many different paths AND the answer from that state doesn't depend on how you got there → MEMOIZE the state. Backtracking + memo = top-down DP."
  ],
  tips: [
    "Combinations vs Permutations: combinations don't care about order, so pass a `start` index and never look backward. Permutations do care about order, so use a `boolean[] used` array and loop from 0 each time.",
    "Duplicate inputs: SORT the array first, then at every recursion depth, skip a value if it's equal to its left neighbor and that neighbor is unused (or, equivalently, `i > start && nums[i] == nums[i-1]`).",
    "If you mutate a shared object (an array, a grid cell, a map), you MUST restore it on the way back. The single most common backtracking bug is forgetting the undo.",
    "Use StringBuilder.setLength() to undo string appends in O(1). Avoid passing a fresh String down each recursion — that's O(n) garbage per call.",
    "When the answer is a count and not a list of solutions, ask yourself if DP or bitmask DP would be faster. For order-matters counting problems, DP usually wins."
  ],
  code: `/*
 * The five anatomical pieces every backtracking function has.
 * Read it once, then map every problem you meet onto these slots.
 */
void backtrack(State state, Choices remaining) {

    // ---- 1. BASE CASE -----------------------------------------------------
    // Stop recursing when the partial solution is complete (or invalid).
    // Record the answer here, then return. No base case = infinite recursion.
    if (isGoal(state)) {
        record(state);                     // save a COPY of the current state
        return;
    }

    // ---- 2. ENUMERATE CHOICES --------------------------------------------
    // Loop over every decision available from the current state.
    // For combinations: usually a 'start' index. For permutations: every unused element.
    for (Choice c : choicesFrom(state, remaining)) {

        // ---- 3. PRUNE ---------------------------------------------------
        // Cheap, local check that throws out any choice that cannot possibly
        // lead to a valid solution. Doing this BEFORE the recursive call is
        // what turns a 2^n search into something tractable.
        if (!isValid(state, c)) continue;

        // ---- 4. CHOOSE -> EXPLORE -> UN-CHOOSE --------------------------
        apply(state, c);                   // 4a. choose: mutate the state
        backtrack(state, remaining);       // 4b. explore: recurse deeper
        undo(state, c);                    // 4c. un-choose: restore the state

        // After undo() the state is exactly what it was before apply(),
        // so the next iteration of the loop starts from a clean slate.
    }
}

/*
 * Tiny worked example — generating all subsets of {1,2,3}.
 * Maps directly onto the template:
 *   STATE      = (start index, current path)
 *   CHOICES    = pick nums[i] for i in [start..n)
 *   BASE CASE  = none extra; we record the path at every node
 *   PRUNE      = none for plain subsets
 *   CHOOSE     = path.add(nums[i])
 *   UN-CHOOSE  = path.remove(last)
 */
void subsets(int[] nums, int start, List<Integer> path, List<List<Integer>> res) {
    res.add(new ArrayList<>(path));        // every node in the tree is a subset
    for (int i = start; i < nums.length; i++) {
        path.add(nums[i]);                 // choose
        subsets(nums, i + 1, path, res);   // explore (i+1 keeps it a combination)
        path.remove(path.size() - 1);      // un-choose
    }
}`,
  complexity: "Worst-case time is the size of the decision tree (often 2^n, n!, or k^n). Pruning is what brings it down to something usable. If recursive states overlap and the answer from a state is path-independent, memoize it and you've turned the algorithm into top-down dynamic programming."
});

/* ===================== VERY EASY (PATTERN BUILDING) ===================== */

PROBLEMS.push({
  num: 71, title: "Generate Subsets", diff: "veasy",
  problem: "Given an array of distinct integers, return all 2^n possible subsets (the power set).",
  intuition: "Every element has two fates: in the subset, or not. That's a binary tree of height n with 2^n leaves. But subsets are not just leaves — every NODE is a valid subset on its own.",
  hints: [
    "Recursive function takes a `start` index and the current `path`.",
    "Add `path` to the answer at the START of the function (every visit = one subset).",
    "Loop `i` from `start` to `n-1`: pick nums[i], recurse with `i+1`, un-pick.",
    "Using `start` (and not `0`) is what prevents duplicates like {1,2} and {2,1}."
  ],
  tips: [
    "Want it iterative? Each subset corresponds to a bitmask 0..2^n-1. The recursion is just a DFS traversal of those masks.",
    "Cloning the path is necessary when adding to the result list — otherwise all entries point to the same mutable list."
  ],
  code: `/*
 * Generate all 2^n subsets via DFS.
 * STATE      = (start index, current path)
 * CHOICES    = pick any element with index >= start
 * BASE CASE  = none extra; every node visited IS a subset
 */
void dfs(int[] nums, int start, List<Integer> path, List<List<Integer>> res) {

    // ---- 1. RECORD CURRENT NODE -----------------------------------------
    // Add a COPY of path. Without copying, all entries point to the same
    // mutable list and you'd see the final list repeated everywhere.
    res.add(new ArrayList<>(path));

    // ---- 2. ENUMERATE CHOICES -------------------------------------------
    // Loop from 'start', not 0, so we never look back. This is what
    // prevents duplicate subsets like {1,2} and {2,1}.
    for (int i = start; i < nums.length; i++) {

        // ---- 3. CHOOSE -> EXPLORE -> UN-CHOOSE --------------------------
        path.add(nums[i]);                        // 3a. choose nums[i]
        dfs(nums, i + 1, path, res);              // 3b. explore deeper (i+1)
        path.remove(path.size() - 1);             // 3c. un-choose (backtrack)
    }
}`,
  complexity: "Time O(n · 2^n) — 2^n subsets, each up to length n to copy. Space O(n) recursion."
});

PROBLEMS.push({
  num: 72, title: "Generate Permutations", diff: "veasy",
  problem: "Given an array of distinct integers, return all n! orderings of its elements.",
  intuition: "Order matters here, so you cannot use a `start` index — you must be allowed to revisit positions. Instead, mark each element as 'used' so you don't pick it twice within one permutation.",
  hints: [
    "Maintain a boolean `used[i]` parallel to `nums`.",
    "Base case: `path.size() == nums.length` → add a copy to result.",
    "At every level, try EVERY unused element (not just those after some index).",
    "Set `used[i]=true` before recursing, then `used[i]=false` after."
  ],
  tips: [
    "Don't use `path.contains(...)` to test usage — it's O(n) per check. Use the boolean array.",
    "If you only need ONE permutation (e.g., next permutation), this is overkill — there's a O(n) algorithm."
  ],
  code: `/*
 * Generate all n! permutations via DFS.
 * STATE      = (path so far, used[] array)
 * CHOICES    = every UNUSED element (order matters → no 'start' index)
 * BASE CASE  = path length equals input length
 */
void dfs(int[] nums, boolean[] used, List<Integer> path, List<List<Integer>> res) {

    // ---- 1. BASE CASE ---------------------------------------------------
    // We've placed every element → record a snapshot of the permutation.
    if (path.size() == nums.length) {
        res.add(new ArrayList<>(path));
        return;
    }

    // ---- 2. ENUMERATE CHOICES -------------------------------------------
    // Try EVERY index — order matters, so we revisit positions we've passed.
    for (int i = 0; i < nums.length; i++) {

        if (used[i]) continue;                    // skip already-placed elements

        // ---- 3. CHOOSE -> EXPLORE -> UN-CHOOSE --------------------------
        used[i] = true;                           // 3a. mark used
        path.add(nums[i]);                        //     append to path
        dfs(nums, used, path, res);               // 3b. explore
        used[i] = false;                          // 3c. un-mark
        path.remove(path.size() - 1);             //     pop from path
    }
}`,
  complexity: "Time O(n · n!). Space O(n) recursion + O(n) used array."
});

PROBLEMS.push({
  num: 73, title: "Subsets with Duplicates", diff: "veasy",
  problem: "Same as Generate Subsets, but the input may contain duplicates. Return only unique subsets.",

void dfs(int[] nums, int start, List<Integer> path, List<List<Integer>> res) {

  hints: [

  ],
  code: `/*
 * Kth Symbol in Grammar — recurse on the parent's HALF, never build the row.
 * Row n has 2^(n-1) symbols. First half == row n-1. Second half == flipped row n-1.
 */
int kthGrammar(int n, int k) {

    // ---- 1. BASE CASE ---------------------------------------------------
    if (n == 1) return 0;                         // row 1 is just "0"

    // ---- 2. WHICH HALF DOES k FALL INTO? --------------------------------
    int half = 1 << (n - 2);                      // 2^(n-2) = size of each half

    if (k <= half) {
        // First half is identical to row n-1.
        return kthGrammar(n - 1, k);
    } else {
        // Second half is row n-1 with every bit flipped.
        return 1 - kthGrammar(n - 1, k - half);
    }
}`,

});

  tips: [

  ],
  code: `/*
 * Sudoku Solver. Three int[9] bitmasks track digit usage in each row,
 * column, and 3x3 box. A cell's box index is (r/3)*3 + c/3.
 * Returning false from the loop triggers backtracking up the call stack.
 */
boolean solve(char[][] b, int[] rows, int[] cols, int[] boxes) {

    for (int r = 0; r < 9; r++) for (int c = 0; c < 9; c++) {

        if (b[r][c] != '.') continue;             // skip filled cells

        int k = (r / 3) * 3 + c / 3;              // box index for (r, c)

        // ---- 1. TRY DIGITS 1..9 ----------------------------------------
        for (int d = 1; d <= 9; d++) {
            int bit = 1 << d;

            // ---- 2. PRUNE: digit already used in this row/col/box ------
            if (((rows[r] | cols[c] | boxes[k]) & bit) != 0) continue;

            // ---- 3. CHOOSE -------------------------------------------
            b[r][c] = (char) ('0' + d);
            rows[r] |= bit;  cols[c] |= bit;  boxes[k] |= bit;

            // ---- 4. EXPLORE -----------------------------------------
            if (solve(b, rows, cols, boxes)) return true;   // done!

            // ---- 5. UN-CHOOSE ---------------------------------------
            b[r][c] = '.';
            rows[r] ^= bit;  cols[c] ^= bit;  boxes[k] ^= bit;

        return false;

    // Every cell filled → board solved.
    return true;

        for (int c = 0; c < g[0].length; c++)

  ],
  code: `/*
 * Additive Number. Pick lengths for the first two numbers; everything else
 * is determined as their running sum. Match the next sum's digits exactly
 * against the remaining string.
 */
boolean isAdditiveNumber(String s) {

    int n = s.length();

    // ---- 1. CHOOSE LENGTH OF FIRST NUMBER ------------------------------
    for (int i = 1; i <= n / 2; i++) {

        // No leading zero (unless first number is "0" alone).
        if (s.charAt(0) == '0' && i > 1) break;

        long a = Long.parseLong(s.substring(0, i));

        // ---- 2. CHOOSE LENGTH OF SECOND NUMBER -------------------------
        // Need at least max(i, j-i) chars left for the running sum to fit.
        for (int j = i + 1; n - j >= Math.max(i, j - i); j++) {

            if (s.charAt(i) == '0' && j - i > 1) break;

            long b = Long.parseLong(s.substring(i, j));

            // ---- 3. EXTEND BY FORCED a+b VALUES ------------------------
            if (check(s, j, a, b)) return true;
        }

    long c = a + b;
    String cs = String.valueOf(c);
    if (!s.startsWith(cs, i)) return false;       // forced match failed
    return check(s, i + cs.length(), b, c);       // slide the window

  code: `/*
 * All Possible Full Binary Trees. A full binary tree of n nodes splits as
 * 1 (root) + l (left subtree) + r (right subtree), with l and r both odd.
 * Memoize the list per n.
 */
Map<Integer, List<TreeNode>> memo = new HashMap<>();

List<TreeNode> allPossibleFBT(int n) {

    // ---- 1. MEMO HIT ----------------------------------------------------
    if (memo.containsKey(n)) return memo.get(n);

    List<TreeNode> out = new ArrayList<>();

    // ---- 2. BASE CASE: single leaf -------------------------------------
    if (n == 1) {
        out.add(new TreeNode(0));
        memo.put(n, out);
        return out;
    }

    // ---- 3. SPLIT n-1 INTO ODD (l, r) AND COMBINE ALL TREES -----------
    for (int l = 1; l < n; l += 2) {
        int r = n - 1 - l;

        for (TreeNode L : allPossibleFBT(l)) {
            for (TreeNode R : allPossibleFBT(r)) {

                // Build a NEW root each time (don't share roots between trees).
                TreeNode root = new TreeNode(0);
                root.left = L;
                root.right = R;
                out.add(root);

        }
    }

    memo.put(n, out);

}`,

 * Reconstruct Itinerary — Hierholzer's algorithm for an Eulerian path.
 * Use a min-heap per node to always explore lexicographically smallest edge first.
 * Append the node to the route AFTER its recursion returns (post-order),
 * then reverse at the end. Dead ends naturally land at the END.
 */
Map<String, PriorityQueue<String>> g = new HashMap<>();
LinkedList<String> route = new LinkedList<>();

List<String> findItinerary(List<List<String>> tickets) {

    // ---- 1. BUILD ADJACENCY: each destination list is a min-heap -------
    for (List<String> t : tickets) {
        g.computeIfAbsent(t.get(0), k -> new PriorityQueue<>()).offer(t.get(1));

 * dp[a] = fewest coins making amount a (using sentinel amount+1 for "impossible").

    // ---- 1. INITIALIZE dp WITH AN "IMPOSSIBLE" SENTINEL ---------------
    int[] dp = new int[amount + 1];

  num: 70, title: "Solve the Equation", diff: "med",
  problem: "Given a linear equation in x like \"2x+3=4x-7\", return its solution as \"x=N\", or report \"No solution\" / \"Infinite solutions\".",
  intuition: "Parsing problem, not really backtracking. Walk both sides collecting x-coefficient and constant. After computing (xL - xR) and (cR - cL), solve x = constSum / xCoef, with edge cases for zero coefficient.",
  hints: [
    "Helper that parses a side: walks chars, tracks sign and number, distinguishes x-terms (number followed by 'x') from constants.",
    "Final: A = xL - xR, B = cR - cL. If A == 0: B == 0 → infinite, else no solution. Else x = B / A."
  ],
  tips: [
    "Edge cases: \"x=x\" (infinite), \"2x=3x\" (zero), no implicit '+' for the leading term."
  ],
  code: `/*
 * Solve the Equation. Pure parse: collect coefficient of x and the constant
 * from each side, then solve A*x = B.
 */
String solveEquation(String eq) {

    String[] sides = eq.split("=");
    int[] L = parse(sides[0]);                    // {xCoef, const} on LHS
    int[] R = parse(sides[1]);                    // {xCoef, const} on RHS

    // Move x to LHS, constants to RHS:  (L.x - R.x) * x = R.const - L.const
    int A = L[0] - R[0];
    int B = R[1] - L[1];

    // ---- SPECIAL CASES --------------------------------------------------
    if (A == 0) return B == 0 ? "Infinite solutions" : "No solution";

    return "x=" + (B / A);
}

// Returns {x-coefficient, constant} for one side of the equation.
int[] parse(String s) {

    int x = 0, c = 0;                             // running totals
    int sign = 1;                                 // current term's sign
    int i = 0, n = s.length();

    while (i < n) {

        // ---- 1. SIGN TOKENS ---------------------------------------------
        if (s.charAt(i) == '+') { sign =  1; i++; }
        else if (s.charAt(i) == '-') { sign = -1; i++; }
        else {
            // ---- 2. READ A NUMBER (may be empty before 'x') -----------
            int num = 0;
            boolean hasDigit = false;
            while (i < n && Character.isDigit(s.charAt(i))) {
                num = num * 10 + s.charAt(i) - '0';
                i++;
                hasDigit = true;
            }

            // ---- 3. IS IT AN x-TERM OR A CONSTANT? --------------------
            if (i < n && s.charAt(i) == 'x') {
                x += sign * (hasDigit ? num : 1); // "x" alone = 1*x
                i++;
            } else {
                c += sign * num;
            }
        }
    }
    return new int[]{x, c};
}`,
  complexity: "Time O(n). Space O(1)."
});

int dfs(int m, int n, int r, int c, int k, Integer[][][] memo) {

  problem: "In a binary tree, return all nodes that are exactly K edges away from a given target node.",
  intuition: "A binary tree's parent links aren't given, so first DFS to build parent pointers. Then BFS from the target — at each step you can go to left, right, or parent. Stop when distance == K.",
  hints: [
    "DFS to fill Map<TreeNode, TreeNode> parent.",
    "BFS from target; track Set<TreeNode> visited so you don't bounce back to where you came from.",
    "When BFS depth equals K, the current layer's contents are the answer."

  tips: [
    "Alternative: a single DFS that returns the depth at which `target` is found, then reuse the recursion to fan out distance K from each ancestor — clever but tricky."
  ],
  code: `/*
 * All Nodes Distance K. Build parent pointers via DFS, then BFS from target
 * outward. From any node you can go to left, right, OR parent.
 */
Map<TreeNode, TreeNode> par = new HashMap<>();

List<Integer> distanceK(TreeNode root, TreeNode target, int K) {

    // ---- 1. BUILD PARENT POINTERS --------------------------------------
    buildParents(root, null);

    // ---- 2. BFS FROM TARGET --------------------------------------------
    Set<TreeNode> seen = new HashSet<>();
    seen.add(target);
    Queue<TreeNode> q = new ArrayDeque<>();
    q.offer(target);

    int dist = 0;

    while (!q.isEmpty()) {

        // ---- 3. AT DEPTH K → CURRENT QUEUE IS THE ANSWER ---------------
        if (dist == K) {
            List<Integer> out = new ArrayList<>();
            for (TreeNode n : q) out.add(n.val);
            return out;
        }

        // ---- 4. EXPAND ONE LAYER ---------------------------------------
        int sz = q.size();
        for (int i = 0; i < sz; i++) {
            TreeNode n = q.poll();
            for (TreeNode nb : new TreeNode[]{n.left, n.right, par.get(n)}) {
                if (nb != null && seen.add(nb)) q.offer(nb);
            }
        }
        dist++;
    }
    return new ArrayList<>();
}

void buildParents(TreeNode n, TreeNode p) {
    if (n == null) return;
    par.put(n, p);
    buildParents(n.left, n);
    buildParents(n.right, n);
}`,

});

 * substring to avoid recomputing the same chunk.
 */
Map<String, List<Integer>> memo = new HashMap<>();

List<Integer> diffWaysToCompute(String s) {

    // ---- 1. MEMO HIT ----------------------------------------------------
    if (memo.containsKey(s)) return memo.get(s);

    List<Integer> res = new ArrayList<>();

    // ---- 2. SPLIT AT EVERY OPERATOR ------------------------------------
    for (int i = 0; i < s.length(); i++) {

        char op = s.charAt(i);

void carve(int[][] g, int r, int c, Random rng) {

    // ---- 1. MARK CURRENT CELL AS A PATH (room) -------------------------
    g[r][c] = 0;

  code: `/*
 * Knight's Tour with WARNSDORFF'S HEURISTIC.
 * At every step move to the square with the FEWEST onward legal moves.
 * This rarely backtracks on standard boards; without it, brute backtracking
 * is hopeless even for 8x8.
 */
int[][] M = { {2, 1}, {1, 2}, {-1, 2}, {-2, 1},
              {-2,-1}, {-1,-2},{1,-2}, {2,-1} };

boolean tour(int[][] b, int r, int c, int step) {

    // ---- 1. PLACE THE KNIGHT --------------------------------------------
    b[r][c] = step;

    // ---- 2. BASE CASE: every cell visited -------------------------------
    if (step == b.length * b[0].length) return true;

    // ---- 3. SORT 8 MOVES BY ONWARD-DEGREE (Warnsdorff) ------------------
    Integer[] order = {0, 1, 2, 3, 4, 5, 6, 7};
    Arrays.sort(order, (a, x) ->
        degree(b, r + M[a][0], c + M[a][1]) - degree(b, r + M[x][0], c + M[x][1]));

    // ---- 4. TRY EACH MOVE IN ORDER --------------------------------------
    for (int k : order) {
        int nr = r + M[k][0], nc = c + M[k][1];
        if (valid(b, nr, nc) && tour(b, nr, nc, step + 1)) return true;
    }

    // ---- 5. UN-CHOOSE: clear and propagate failure ----------------------
    b[r][c] = 0;
    return false;
}

// Onward-move count from (r, c). Out-of-board returns 9 to push it last.
int degree(int[][] b, int r, int c) {
    if (!valid(b, r, c)) return 9;
    int d = 0;
    for (int[] m : M) if (valid(b, r + m[0], c + m[1])) d++;
    return d;
}

boolean valid(int[][] b, int r, int c) {
    return r >= 0 && c >= 0 && r < b.length && c < b[0].length && b[r][c] == 0;
}`,

    "'*': cur = cur - prev + prev*num, prev = prev*num.",

  code: `/*
 * Expression Add Operators. The trick for '*' precedence: track 'prev' =
 * contribution of the LAST additive term. To insert '*N', undo prev from
 * cur, then add prev*N as the new term: cur = cur - prev + prev*N.
 */
void dfs(String num, int i, long target, long cur, long prev,
         StringBuilder sb, List<String> res) {

    // ---- 1. BASE CASE: consumed the digit string -----------------------
    if (i == num.length()) {
        if (cur == target) res.add(sb.toString());
        return;
    }

    int len = sb.length();

    // ---- 2. TRY EVERY OPERAND ENDING AT j ------------------------------

        // No leading-zero operand (unless it's exactly "0").
        if (j > i && num.charAt(i) == '0') break;

        long n = Long.parseLong(num.substring(i, j + 1));

        if (i == 0) {

            sb.append(n);
            dfs(num, j + 1, target, n, n, sb, res);
            sb.setLength(len);

            // ---- 3b. '+' branch ---------------------------------------
            sb.append('+').append(n);
            dfs(num, j + 1, target, cur + n, n, sb, res);
            sb.setLength(len);

  problem: "Given a string with letters and parentheses, remove the MINIMUM number of parentheses to make it valid. Return all distinct results.",

  hints: [
    "Pass 1: walk s; track unmatched ')' (rightRem) and after the pass also unmatched '(' (leftRem).",
    "Pass 2 (DFS): at each char, two options — remove it (if it's the right type AND removal counter > 0) or keep it.",
    "Track current open count; never let it go below 0.",
    "End condition: index at end, leftRem == rightRem == 0, open == 0 → valid."
  ],
  tips: [
    "Dedup trick: when REMOVING, skip identical consecutive characters — only the first occurrence in a run matters.",
    "Use a HashSet<String> for results to defensively dedupe."
  ],
  code: `/*
 * Remove Invalid Parentheses.
 * Pre-pass computes EXACTLY how many '(' (lRem) and ')' (rRem) must be removed.
 * Then DFS removes only that many. Every char has 2 options (remove or keep);
 * track 'open' to never let ')' outpace '('. Use a Set to dedupe.
 */
List<String> removeInvalidParentheses(String s) {

    // ---- 1. PRE-PASS: minimum removals on each side --------------------
    int leftRem = 0, rightRem = 0;
    for (char c : s.toCharArray()) {
        if (c == '(') leftRem++;
        else if (c == ')') {
            if (leftRem > 0) leftRem--;           // matches a previous '('
            else rightRem++;                      // unmatched ')' must be removed
        }
    }

    // leftRem now also counts unmatched '(' that need removal at end.
    Set<String> res = new HashSet<>();
    dfs(s, 0, leftRem, rightRem, 0, new StringBuilder(), res);
    return new ArrayList<>(res);
}

void dfs(String s, int i, int lRem, int rRem, int open,
         StringBuilder sb, Set<String> res) {

    // ---- 2. BASE CASE --------------------------------------------------
    if (i == s.length()) {
        if (lRem == 0 && rRem == 0 && open == 0) res.add(sb.toString());
        return;
    }

    char c = s.charAt(i);
    int len = sb.length();

    // ---- 3. OPTION A: REMOVE THIS CHAR ---------------------------------
    if (c == '(' && lRem > 0) dfs(s, i + 1, lRem - 1, rRem, open, sb, res);
    if (c == ')' && rRem > 0) dfs(s, i + 1, lRem, rRem - 1, open, sb, res);

    // ---- 4. OPTION B: KEEP THIS CHAR -----------------------------------
    sb.append(c);
    if (c != '(' && c != ')')      dfs(s, i + 1, lRem, rRem, open, sb, res);
    else if (c == '(')             dfs(s, i + 1, lRem, rRem, open + 1, sb, res);
    else if (open > 0)             dfs(s, i + 1, lRem, rRem, open - 1, sb, res);
    sb.setLength(len);                            // restore
}`,

});

PROBLEMS.push({

  problem: "Given an n×m rectangle, find the minimum number of integer-sided squares that tile it exactly.",
  intuition: "Maintain a height profile — for each column, how high it's been filled so far. At every step, find the lowest column (leftmost on ties); place a square there, of any side length that fits without exceeding column heights or rectangle bounds. Recurse with updated heights and a count, pruning by the global best.",
  hints: [
    "h[0..n-1] = current fill height per column.",
    "Find min height m and leftmost index idx of m.",
    "Determine the maximum square side that fits at idx (limited by horizontal run of equal height and remaining vertical room).",
    "Try sizes from large to small (better prune); update h, recurse, undo."
  ],
  tips: [
    "Initialize best = n*m (worst-case using 1×1 squares).",
    "This is one of the rare problems where there's no nice polynomial algorithm — heuristics + branch-and-bound dominate."
  ],
  code: `/*
 * Tile a Rectangle with Fewest Squares — branch and bound on a height profile.
 * h[i] = current fill height of column i. Always tile at the lowest column
 * (leftmost on ties) to reduce symmetric branches.
 */
int best;

int tilingRectangle(int n, int m) {
    best = n * m;                                 // worst-case: all 1x1 squares
    dfs(n, m, new int[n], 0);
    return best;
}

void dfs(int n, int m, int[] h, int count) {

    // ---- 1. PRUNE: already worse than best ------------------------------
    if (count >= best) return;

    // ---- 2. FIND LOWEST COLUMN (leftmost on tie) ------------------------
    int min = Integer.MAX_VALUE, idx = -1;
    for (int i = 0; i < n; i++) {
        if (h[i] < min) { min = h[i]; idx = i; }
    }

    // ---- 3. ALL COLUMNS REACHED CEILING m → done ------------------------
    if (min == m) {
        best = Math.min(best, count);
        return;
    }

    // ---- 4. FIND THE WIDEST FLAT RUN STARTING AT idx --------------------
    int end = idx;
    while (end + 1 < n && h[end + 1] == h[idx] && (end + 1 - idx + 1) + min <= m) {
        end++;
    }

    // ---- 5. TRY EVERY SQUARE SIZE FROM LARGEST TO 1 ---------------------
    for (int sz = end - idx + 1; sz >= 1; sz--) {

        // CHOOSE: lift those columns by sz
        for (int i = idx; i < idx + sz; i++) h[i] += sz;
        dfs(n, m, h, count + 1);
        // UN-CHOOSE: drop them back
        for (int i = idx; i < idx + sz; i++) h[i] -= sz;
    }
}`,

});

PROBLEMS.push({

  problem: "Given a string s and an integer k, return the minimum length of the run-length encoded version of s after deleting at most k characters.",
  intuition: "DP / memoized backtracking on (i, k, prevChar, prevCount). At every position we either DELETE the current char (k--) or KEEP it (extending the current run, possibly increasing the encoding length).",
  hints: [
    "Encoding-length cost rule: when extending a run, the count adds 1 char only when the run reaches 1, 10, or 100 (digit-boundaries).",
    "State (i, k, prev, run): length of remaining encoding minimal cost.",
    "Two options at each step: skip (k-1) or keep (extend run if same char else start new run length 1)."
  ],
  tips: [
    "Cap run by 100 — the encoding cost stops changing past 100.",
    "Memoize aggressively; without it, this is exponential."
  ],
  code: `/*
 * String Compression II. Memoized DFS on (i, k, prevChar, prevRun).
 * RLE cost rule: extending a run only adds an output char when crossing
 * a run-length boundary (1 → 2 digit, 9 → 10, 99 → 100).
 */
Integer[][][][] memo;

int getLengthOfOptimalCompression(String s, int k) {
    // states: i ∈ [0..n], k ∈ [0..k], prev ∈ {none + 26 letters}, run ∈ [0..100]
    memo = new Integer[s.length()][k + 1][27][101];
    return dfs(s, 0, k, '#', 0);
}

int dfs(String s, int i, int k, char prev, int run) {

    // ---- 1. INVALID STATE: out of deletions ----------------------------
    if (k < 0) return 1_000_000;                  // sentinel infinity

    // ---- 2. BASE CASE: end of string -----------------------------------
    if (i == s.length()) return 0;

    int p = prev == '#' ? 0 : prev - 'a' + 1;     // index for prev char
    if (memo[i][k][p][run] != null) return memo[i][k][p][run];

    // ---- 3. OPTION A: DELETE THIS CHAR (k--) ---------------------------
    int del = dfs(s, i + 1, k - 1, prev, run);

    // ---- 4. OPTION B: KEEP THIS CHAR -----------------------------------
    int keep;
    if (s.charAt(i) == prev) {
        // Extend the existing run; pay 1 if run length crosses 1, 9, or 99.
        int extra = (run == 1 || run == 9 || run == 99) ? 1 : 0;
        keep = extra + dfs(s, i + 1, k, prev, Math.min(run + 1, 100));
    } else {
        // Start a new run: 1 char of output (the letter itself).
        keep = 1 + dfs(s, i + 1, k, s.charAt(i), 1);
    }

    return memo[i][k][p][run] = Math.min(del, keep);
}`,

});

PROBLEMS.push({
  num: 49, title: "Crack the Safe (de Bruijn sequence)", diff: "hard",
  problem: "Build the shortest string over a k-symbol alphabet such that every n-length sequence of symbols appears in it (as a contiguous substring). Total length is k^n + n - 1.",
  intuition: "This is a de Bruijn sequence. Construct via greedy DFS: start with n-1 zeros; at each step, try appending the largest unseen symbol that creates a new n-length substring. Continue until all k^n substrings have appeared.",
  hints: [
    "Track seen substrings in a HashSet.",
    "From the current end, take the last n-1 chars as prefix; for each digit d in 0..k-1, candidate = prefix + d.",
    "If candidate not in set, add it, append d, recurse.",
    "Stop when set size reaches k^n."
  ],
  tips: [
    "Iterating digits in DESC order tends to find a valid suffix quicker (greedy DFS).",
    "Hierholzer's algorithm on the de Bruijn graph is the classical formulation."
  ],
  code: `/*
 * Crack the Safe — greedy DFS construction of a de Bruijn sequence.
 * Length is k^n + n - 1: covers every length-n string over alphabet of size k.
 * Start with n-1 zeros; at each step append the largest unseen extension.
 */
StringBuilder sb;
Set<String> seen;
int N, K;

String crackSafe(int n, int k) {
    N = n; K = k;

    // ---- 1. SEED with n-1 leading zeros --------------------------------
    sb = new StringBuilder("0".repeat(n - 1));
    seen = new HashSet<>();

    // ---- 2. DFS until every length-n substring has appeared ------------
    dfs((int) Math.pow(k, n));
    return sb.toString();
}

boolean dfs(int total) {

    // ---- 3. BASE CASE: every n-tuple covered ---------------------------
    if (seen.size() == total) return true;

    // Last n-1 chars form the prefix of any new substring.
    String pre = sb.substring(sb.length() - N + 1);

    // ---- 4. TRY EACH DIGIT 0..k-1 --------------------------------------
    for (int d = 0; d < K; d++) {

        String node = pre + d;                    // candidate n-tuple
        if (seen.contains(node)) continue;        // already covered

        // ---- 5. CHOOSE -> EXPLORE -> UN-CHOOSE -------------------------
        seen.add(node);
        sb.append(d);
        if (dfs(total)) return true;
        seen.remove(node);
        sb.deleteCharAt(sb.length() - 1);
    }
    return false;
}`,
  complexity: "Time O(k · k^n)."
});

PROBLEMS.push({
  num: 52, title: "Smallest Sufficient Team", diff: "hard",
  problem: "Given a list of required skills and a list of people each with their skills, return the smallest team that covers every required skill.",
  intuition: "Skills become a bitmask over up to 16 bits. dp[mask] = bitmask of the smallest team covering the skill set `mask`. For each person, OR their skills into existing dp entries to update larger masks.",
  hints: [
    "Map skill string → index; build personMask[p].",
    "dp[0] = 0 (empty team). All others initialized as ‘unknown'.",
    "For each person p, for each mask covered: newMask = mask | personMask[p]; candidate = dp[mask] | (1L<<p). Keep if it has fewer bits than the current dp[newMask].",
    "Convert dp[full] back into a list of indices."
  ],
  tips: [
    "Skills count ≤ 16 → mask fits in int. People ≤ 60 → team mask must use long.",
    "Skip people with mask 0 (no useful skills) — they can never improve the team."
  ],
  code: `/*
 * Smallest Sufficient Team. Skills bitmask DP.
 *   dp[mask] = bitmask of the smallest team that COVERS the skill set 'mask'
 * (-1 means "not yet reachable"). For each person p, OR their skills into
 * every previously-known mask, and keep the team with the fewest people.
 */
int[] smallestSufficientTeam(String[] req, List<List<String>> people) {

    int n = req.length, full = (1 << n) - 1;

    // ---- 1. INDEX SKILLS INTO BIT POSITIONS ----------------------------
    Map<String, Integer> idx = new HashMap<>();
    for (int i = 0; i < n; i++) idx.put(req[i], i);

    // dp[mask] is a TEAM bitmask (over people, up to ~60 → use long).
    long[] dp = new long[full + 1];
    Arrays.fill(dp, -1L);
    dp[0] = 0L;                                   // empty mask: empty team

    // ---- 2. RELAX OVER EACH PERSON -------------------------------------
    for (int p = 0; p < people.size(); p++) {

        // Build this person's skill mask.
        int sk = 0;
        for (String s : people.get(p)) {
            if (idx.containsKey(s)) sk |= 1 << idx.get(s);
        }
        if (sk == 0) continue;                    // useless person

        for (int m = 0; m <= full; m++) {

            if (dp[m] == -1) continue;            // unreachable mask

            int nm = m | sk;                      // mask after hiring p
            long cand = dp[m] | (1L << p);        // candidate team

            if (dp[nm] == -1 || Long.bitCount(cand) < Long.bitCount(dp[nm])) {
                dp[nm] = cand;
            }
        }
    }

    // ---- 3. UNPACK TEAM BITMASK INTO INDEX LIST -----------------------
    long mask = dp[full];
    List<Integer> out = new ArrayList<>();
    for (int i = 0; i < people.size(); i++) {
        if ((mask & (1L << i)) != 0) out.add(i);
    }
    return out.stream().mapToInt(Integer::intValue).toArray();
}`,
  complexity: "Time O(P · 2^N) where N = required skills count."
});

PROBLEMS.push({
  num: 53, title: "Shortest Path in Grid with Obstacles Elimination", diff: "hard",
  problem: "On an m×n grid (0 = empty, 1 = obstacle), find the shortest path from (0,0) to (m-1,n-1) given you can eliminate up to k obstacles.",
  intuition: "Plain BFS doesn't work — the cost on a cell depends on remaining eliminations. State must include (r, c, k_left). BFS over this 3D state finds the shortest path in steps.",
  hints: [
    "If k ≥ m+n-2, no obstacle blocks you → return m+n-2.",
    "Visited array of dimensions [m][n][k+1].",
    "BFS queue stores (r, c, eliminationsLeft, steps).",
    "Decrement eliminations when crossing an obstacle; reject if it goes negative."
  ],
  tips: [
    "Could also be done as A* with heuristic = Manhattan distance for further speedup."
  ],
  code: `/*
 * Shortest Path with K Eliminations. State must include eliminations left
 * because the same cell with more eliminations available is a stronger state.
 * BFS finds shortest path in steps; visited keyed on (r, c, k_left).
 */
int shortestPath(int[][] g, int K) {

    int m = g.length, n = g[0].length;

    // ---- 1. SHORT-CIRCUIT: enough eliminations to break any path -------
    if (K >= m + n - 2) return m + n - 2;

    // ---- 2. 3-D VISITED, BFS QUEUE -------------------------------------
    boolean[][][] vis = new boolean[m][n][K + 1];
    Deque<int[]> q = new ArrayDeque<>();
    q.offer(new int[]{0, 0, K, 0});               // (r, c, kLeft, steps)
    vis[0][0][K] = true;

    int[][] D = {{1,0},{-1,0},{0,1},{0,-1}};

    while (!q.isEmpty()) {

        int[] s = q.poll();

        // ---- 3. REACHED THE TARGET → answer is steps ------------------
        if (s[0] == m - 1 && s[1] == n - 1) return s[3];

        // ---- 4. EXPAND 4 NEIGHBORS ------------------------------------
        for (int[] d : D) {
            int nr = s[0] + d[0], nc = s[1] + d[1];
            if (nr < 0 || nc < 0 || nr >= m || nc >= n) continue;

            int nk = s[2] - g[nr][nc];            // crossing obstacle costs 1
            if (nk < 0 || vis[nr][nc][nk]) continue;

            vis[nr][nc][nk] = true;
            q.offer(new int[]{nr, nc, nk, s[3] + 1});
        }
    }
    return -1;
}`,
  complexity: "Time O(m·n·k)."
});

PROBLEMS.push({

  problem: "Given a string, return its longest non-empty prefix that is also a suffix (excluding the string itself).",
  intuition: "Compute the KMP failure function. f[n-1] gives the length of the longest proper prefix-suffix; the answer is s.substring(0, f[n-1]).",
  hints: [
    "Standard KMP failure-function build.",
    "Two pointers i (scanning) and k (length of current match).",
    "When mismatch, k = f[k-1]; when match, k++.",
    "Answer = s.substring(0, f[n-1])."
  ],
  tips: [
    "Polynomial hashing also works (rolling hash + verification) but KMP is canonical.",
    "Not really backtracking — listed for completeness."
  ],
  code: `/*
 * Longest Happy Prefix — KMP failure function.
 * f[i] = length of the longest proper prefix of s[0..i] that is also a suffix.
 * Answer = s.substring(0, f[n-1]).
 */
String longestPrefix(String s) {

    int n = s.length();
    int[] f = new int[n];

    // ---- BUILD THE FAILURE FUNCTION ------------------------------------
    for (int i = 1, k = 0; i < n; i++) {

        // Roll back k while there's a mismatch.
        while (k > 0 && s.charAt(i) != s.charAt(k)) k = f[k - 1];

        // Extend match length on character match.
        if (s.charAt(i) == s.charAt(k)) k++;

        f[i] = k;
    }

    // f[n-1] is the longest proper prefix that is also a suffix.
    return s.substring(0, f[n - 1]);
}`,
  complexity: "Time O(n). Space O(n)."
});

boolean isMatch(String s, String p) {
    memo = new Boolean[s.length() + 1][p.length() + 1];

boolean dfs(String s, String p, int i, int j) {

    if (memo[i][j] != null) return memo[i][j];

    // ---- 2. PATTERN EXHAUSTED → string must be exhausted too -----------
    if (j == p.length()) {

        boolean firstMatch = i < s.length() &&
            (s.charAt(i) == p.charAt(j) || p.charAt(j) == '.');

        // ---- 3. NEXT CHAR IS '*' → ZERO or ONE+ branches ---------------
        if (j + 1 < p.length() && p.charAt(j + 1) == '*') {

  hints: [
    "Initialize dp[0][0] = true.",
    "Initialize dp[0][j] = true while p[j-1] == '*' (a leading '*' can match the empty string).",
    "Two-pointer greedy version exists in O(m+n) but DP is the cleaner first version."
  ],
  tips: [
    "Greedy: scan with two pointers; on '*' record positions to fall back to. Worst-case O(m+n) and constant memory but trickier to get right.",
    "This is also a classic place where memoized recursion = bottom-up DP."
  ],
  code: `/*
 * Wildcard Matching. Bottom-up 2-D DP.
 *   dp[i][j] = true iff s[0..i-1] matches p[0..j-1]
 *
 * Transitions:
 *   '*' → dp[i][j] = dp[i][j-1]     (match empty sequence)
 *                  | dp[i-1][j]     (extend an existing match)
 *   '?' or literal → dp[i-1][j-1] when characters agree
 */
boolean isMatch(String s, String p) {

    int m = s.length(), n = p.length();
    boolean[][] dp = new boolean[m + 1][n + 1];

    // ---- 1. INITIAL STATE ----------------------------------------------
    dp[0][0] = true;                              // empty matches empty

    // Leading '*'s in p can match the empty string.
    for (int j = 1; j <= n && p.charAt(j - 1) == '*'; j++) dp[0][j] = true;

    // ---- 2. FILL TABLE -------------------------------------------------
    for (int i = 1; i <= m; i++) {
        for (int j = 1; j <= n; j++) {

            char c = p.charAt(j - 1);

            if (c == '*') {
                dp[i][j] = dp[i][j - 1]           // '*' = empty
                        || dp[i - 1][j];          // '*' = extend
            } else {
                dp[i][j] = (c == '?' || c == s.charAt(i - 1))
                        && dp[i - 1][j - 1];
            }
        }
    }

    return dp[m][n];
}`,
  complexity: "Time O(m·n). Space O(m·n)."
});


/* ----------------------- RENDERING ENGINE ----------------------- */

const DIFF_LABEL = { veasy: 'Very Easy', easy: 'Easy', med: 'Medium', hard: 'Hard' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Lightweight Java syntax highlighter. Order matters:
   1) escape HTML
   2) protect comments and strings (replace with placeholders)
   3) highlight types and keywords
   4) restore comments and strings */
function highlightJava(src) {
  let s = escapeHtml(src);
  const stash = [];
  // Placeholder uses letter-padded form so the number regex (which requires \b
  // word boundaries) cannot match the embedded index. e.g. \x01zZ12Zz\x01
  const stashIt = (html) => {
    stash.push(html);
    return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001';
  };
  // line comments
  s = s.replace(/\/\/[^\n]*/g, m => stashIt('<span class="cmt">' + m + '</span>'));
  // block comments
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => stashIt('<span class="cmt">' + m + '</span>'));
  // double-quoted strings
  s = s.replace(/&quot;([^&]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  // char literals
  s = s.replace(/&#39;.&#39;|&#39;\\.&#39;/g, m => stashIt('<span class="str">' + m + '</span>'));

  // types (capitalized identifiers + common ones).
  // We stash the resulting span so subsequent passes (keywords, numbers)
  // cannot accidentally re-match text INSIDE a span attribute, e.g. matching
  // the word "class" inside class="typ".
  const types = ['String','Integer','Long','Boolean','Character','Double','Float',
    'List','Map','Set','HashMap','HashSet','TreeMap','TreeSet','ArrayList','LinkedList',
    'ArrayDeque','Queue','Deque','PriorityQueue','StringBuilder','BitSet','Stack',
    'TreeNode','Robot','Random','Collections','Arrays','Math','Comparator','Objects',
    'State','Choice','Choices'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  // keywords — also stash so the number pass can't touch tagged content.
  const kws = ['void','int','long','boolean','char','double','float','byte','short',
    'public','private','protected','static','final','abstract','class','interface','enum',
    'return','if','else','for','while','do','break','continue','switch','case','default',
    'new','null','true','false','this','super','try','catch','finally','throw','throws',
    'import','package','extends','implements','instanceof'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  // numbers (placeholders are letter-padded so \b can't match digits inside)
  s = s.replace(/\b(\d+(?:_\d+)*L?)\b/g, '<span class="num">$1</span>');

  // restore stashed (loop until no more placeholders, since stashed spans
  // may themselves contain placeholder text — defensive)
  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

function getProblems(diff) {
  return PROBLEMS.filter(p => p.diff === diff);
}

/* state: current diff tab + index inside that tab */
const state = { diff: 'veasy', idx: 0 };

function renderTOC() {
  const toc = document.getElementById('toc');
  const groups = [
    { diff: 'veasy', label: 'Very Easy' },
    { diff: 'easy',  label: 'Easy' },
    { diff: 'med',   label: 'Medium' },
    { diff: 'hard',  label: 'Hard' },
  ];
  const html = groups.map(g => {
    const items = getProblems(g.diff)
      .map((p, i) => `<a data-diff="${g.diff}" data-idx="${i}"><span class="num">${p.num === 0 ? '★' : '#' + p.num}</span>${escapeHtml(p.title)}</a>`)
      .join('');
    return `<div class="group-title">${g.label}</div>${items}`;
  }).join('');
  toc.innerHTML = html;
  // wire clicks
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      state.diff = a.dataset.diff;
      state.idx = +a.dataset.idx;
      render();
      toggleSidebar(false);
    });
  });
}

function renderTabs() {
  document.getElementById('cnt-veasy').textContent = '(' + getProblems('veasy').length + ')';
  document.getElementById('cnt-easy').textContent  = '(' + getProblems('easy').length + ')';
  document.getElementById('cnt-med').textContent   = '(' + getProblems('med').length + ')';
  document.getElementById('cnt-hard').textContent  = '(' + getProblems('hard').length + ')';
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.diff === state.diff);
    t.addEventListener('click', () => {
      if (state.diff !== t.dataset.diff) {
        state.diff = t.dataset.diff;
        state.idx = 0;
        render();
      }
    }, { once: true });   // re-attach on each render below to keep handler simple
  });
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      if (state.diff !== t.dataset.diff) {
        state.diff = t.dataset.diff;
        state.idx = 0;
        render();
      }
    };
  });
}

function render() {
  const problems = getProblems(state.diff);
  if (state.idx >= problems.length) state.idx = problems.length - 1;
  if (state.idx < 0) state.idx = 0;
  const p = problems[state.idx];
  const main = document.getElementById('main');
  const numTag = p.num === 0 ? '★ Foundation' : '#' + p.num;
  main.innerHTML = `
    <div class="problem-card">
      <h2>
        <span class="num-tag">${numTag}</span>
        ${escapeHtml(p.title)}
        <span class="badge ${p.diff}">${DIFF_LABEL[p.diff]}</span>
      </h2>

      <div class="section-title">Problem</div>
      <p>${escapeHtml(p.problem)}</p>

      <div class="section-title">Intuition</div>
      <div class="intuition">${escapeHtml(p.intuition)}</div>

      <div class="section-title">Step-by-step Hints</div>
      <ol class="hints">${p.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ol>

      <div class="section-title">Tips & Tricks</div>
      <div class="tips-block"><ul class="tips">${p.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>

      <div class="section-title">Java Code</div>
      <pre class="code"><code>${highlightJava(p.code)}</code></pre>

      ${p.complexity ? `<div class="complexity"><b>Complexity:</b> ${escapeHtml(p.complexity)}</div>` : ''}
    </div>
  `;

  // update tabs active class
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.diff === state.diff);
  });

  // update prev/next
  document.getElementById('prev').disabled = state.idx === 0;
  document.getElementById('next').disabled = state.idx === problems.length - 1;
  document.getElementById('nav-info').textContent =
    `${DIFF_LABEL[state.diff]} · ${state.idx + 1} / ${problems.length}`;

  // update active TOC link
  document.querySelectorAll('.sidebar a').forEach(a => {
    a.classList.toggle('active', a.dataset.diff === state.diff && +a.dataset.idx === state.idx);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* navigation */
function nextProblem() {
  const arr = getProblems(state.diff);
  if (state.idx < arr.length - 1) { state.idx++; render(); }
}
function prevProblem() {
  if (state.idx > 0) { state.idx--; render(); }
}
document.getElementById('prev').addEventListener('click', prevProblem);
document.getElementById('next').addEventListener('click', nextProblem);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') prevProblem();
  else if (e.key === 'ArrowRight') nextProblem();
  else if (e.key === 'Escape') toggleSidebar(false);
});

/* sidebar */
const hb = document.getElementById('hamburger');
const sb = document.getElementById('sidebar');
const ov = document.getElementById('overlay');
function toggleSidebar(open) {
  const isOpen = (typeof open === 'boolean') ? open : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  hb.classList.toggle('open', isOpen);
  ov.classList.toggle('show', isOpen);
}
hb.addEventListener('click', () => toggleSidebar());
ov.addEventListener('click', () => toggleSidebar(false));

/* theme toggle */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️';
    themeBtn.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙';
    themeBtn.title = 'Switch to dark mode';
  }
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('theme', next);
});

/* boot */
renderTabs();
bindTabs();
renderTOC();
render();

</script>

<!-- KIRO_CROSS_TAB_NAV_START -->
<script id="kiro-cross-tab-nav">
(function(){
  if(window.__kiroCrossTabNav) return;
  window.__kiroCrossTabNav = true;
  function init(){
    if(typeof getProblems !== 'function' || typeof window.render !== 'function' || typeof state === 'undefined') return;
    var ORDER = ['veasy','easy','med','hard'];
    function diffs(){ return ORDER.filter(function(d){ try { return getProblems(d).length > 0; } catch(e){ return false; } }); }

    function updateNavButtons(){
      var prevB = document.getElementById('prev');
      var nextB = document.getElementById('next');
      if(!prevB || !nextB) return;
      if(state.diff === 'brief'){ return; }
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      prevB.disabled = (di <= 0 && state.idx <= 0);
      nextB.disabled = (di === list.length - 1 && state.idx >= arr.length - 1);
    }

    var origRender = window.render;
    window.render = function(){
      var r = origRender.apply(this, arguments);
      try { updateNavButtons(); } catch(e){}
      return r;
    };

    function goNext(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      if(state.idx < arr.length - 1){ state.idx++; window.render(); return; }
      if(di < list.length - 1){ state.diff = list[di + 1]; state.idx = 0; window.render(); }
    }
    function goPrev(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      if(state.idx > 0){ state.idx--; window.render(); return; }
      if(di > 0){
        var pd = list[di - 1];
        state.diff = pd;
        var parr = getProblems(pd);
        state.idx = Math.max(0, parr.length - 1);
        window.render();
      }
    }

    window.nextProblem = goNext;
    window.prevProblem = goPrev;

    ['prev','next'].forEach(function(id){
      var b = document.getElementById(id);
      if(!b) return;
      var clone = b.cloneNode(true);
      b.parentNode.replaceChild(clone, b);
      clone.addEventListener('click', id === 'next' ? goNext : goPrev);
    });

    updateNavButtons();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<!-- KIRO_CROSS_TAB_NAV_END -->
