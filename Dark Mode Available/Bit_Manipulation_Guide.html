<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bit Manipulation — Cheatsheet, Tricks & Java Snippets</title>
<style>
  :root {
    --bg: #f6f7fb;
    --fg: #1f2330;
    --muted: #6b7280;
    --accent: #2563eb;
    --border: #e3e6ee;
    --card: #ffffff;
    --code-bg: #f8fafc;
    --code-fg: #24292f;
    --kw: #cf222e;
    --typ: #6f42c1;
    --str: #0a7d4d;
    --cmt: #6a737d;
    --num: #0550ae;
    --veasy: #0891b2;
    --easy: #16a34a;
    --med: #d97706;
    --hard: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
  }

  /* HAMBURGER + TOC SIDEBAR */
  .hamburger {
    position: fixed; top: 14px; left: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 5px; cursor: pointer; z-index: 1001;
  }
  .hamburger span {
    display: block; width: 22px; height: 2.5px;
    background: #1e1e25; border-radius: 2px;
    transition: transform .25s, opacity .2s;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

  .sidebar {
    position: fixed; top: 0; left: 0;
    height: 100vh; width: 360px; max-width: 90vw;
    background: #ffffff;
    border-right: 1px solid var(--border);
    box-shadow: 2px 0 14px rgba(0,0,0,.06);
    transform: translateX(-100%);
    transition: transform .28s ease;
    overflow-y: auto;
    z-index: 1000;
    padding: 70px 18px 32px;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2 {
    margin: 0 0 12px;
    font-size: 13px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .sidebar .group-title {
    margin-top: 18px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .sidebar a {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px;
    margin: 2px 0;
    text-decoration: none;
    color: #1f2330;
    border-radius: 6px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .sidebar a:hover { background: #eef2ff; color: var(--accent); }
  .sidebar a.active { background: #eef2ff; color: var(--accent); font-weight: 600; }
  .sidebar a .num {
    display: inline-block;
    min-width: 28px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.25);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 999;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  /* HERO + TABS */
  .topbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 18px 24px 0;
    padding-left: 76px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 {
    margin: 0 0 6px; font-size: 20px;
  }
  .topbar p {
    margin: 0 0 10px; color: var(--muted); font-size: 13.5px;
  }
  .tabs {
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .tab {
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: #f1f3f9;
    color: var(--muted);
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    transition: background .15s;
  }
  .tab:hover { background: #e7eaf3; color: var(--fg); }
  .tab.active {
    background: #ffffff;
    color: var(--fg);
    border-bottom: 2px solid #ffffff;
    margin-bottom: -1px;
    box-shadow: 0 -2px 0 var(--accent) inset;
  }
  .tab .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: 1px;
  }
  .tab.veasy .dot { background: var(--veasy); }
  .tab.easy .dot { background: var(--easy); }
  .tab.med .dot { background: var(--med); }
  .tab.hard .dot { background: var(--hard); }
  .tab .count { color: var(--muted); margin-left: 6px; font-weight: 500; }

  /* MAIN */
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 24px 120px;
  }
  .problem-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .problem-card h2 {
    margin: 0 0 6px;
    font-size: 24px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .num-tag {
    background: #eef2ff; color: var(--accent);
    padding: 3px 10px; border-radius: 6px;
    font-size: 13px; font-weight: 700;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff; font-weight: 700; letter-spacing: .05em;
  }
  .badge.veasy { background: var(--veasy); }
  .badge.easy { background: var(--easy); }
  .badge.med { background: var(--med); }
  .badge.hard { background: var(--hard); }

  .section-title {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 8px;
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }
  .problem-card p {
    margin: 8px 0;
    font-size: 15px;
  }
  .intuition {
    background: #ecfeff;
    border-left: 4px solid #06b6d4;
    border-radius: 6px;
    padding: 12px 16px;
    margin: 8px 0;
  }
  .hints, .tips {
    margin: 6px 0 6px 4px;
    padding: 0 0 0 22px;
  }
  .hints li, .tips li { margin: 6px 0; font-size: 14.5px; }
  .tips-block {
    background: #fff7ed;
    border-left: 4px solid #f59e0b;
    border-radius: 6px;
    padding: 10px 16px;
    margin: 8px 0;
  }
  .complexity {
    margin-top: 12px;
    color: var(--muted);
    font-size: 13.5px;
  }

  /* CHEATSHEET TABLE */
  .cheat-table {
    border-collapse: collapse;
    width: 100%;
    margin: 8px 0 16px;
    font-size: 14px;
  }
  .cheat-table th, .cheat-table td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  .cheat-table th {
    background: #eef2ff;
    color: var(--accent);
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .cheat-table td:first-child {
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    background: var(--code-bg);
    white-space: nowrap;
    color: var(--num);
  }
  .cheat-table tr:nth-child(even) td:not(:first-child) { background: #fafbff; }

  /* CODE */
  pre.code {
    background: var(--code-bg);
    color: var(--code-fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 13.5px;
    line-height: 1.55;
    margin: 6px 0;
  }
  pre.code code {
    font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
  }
  .kw  { color: var(--kw);  font-weight: 600; }
  .typ { color: var(--typ); font-weight: 500; }
  .str { color: var(--str); }
  .cmt { color: var(--cmt); font-style: italic; }
  .num { color: var(--num); }

  /* PREV/NEXT BAR */
  .nav-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #ffffff;
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    z-index: 60;
    box-shadow: 0 -2px 8px rgba(0,0,0,.04);
  }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--fg);
    font-weight: 500;
  }
  .nav-btn:hover:not(:disabled) { background: #eef2ff; color: var(--accent); border-color: #c7d2fe; }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .nav-info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kbd {
    display: inline-block;
    border: 1px solid #d0d7de;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    background: #f6f8fa;
    font-family: monospace;
    font-size: 11px;
    color: #444;
  }

  @media (max-width: 600px) {
    .topbar { padding-left: 70px; padding-right: 70px; }
    main { padding: 20px 14px 130px; }
    .problem-card { padding: 18px 18px; }
    .problem-card h2 { font-size: 19px; }
  }

  /* THEME TOGGLE BUTTON (top-right) */
  .theme-toggle {
    position: fixed; top: 14px; right: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 1001;
    font-size: 20px;
    line-height: 1;
    color: var(--fg);
    transition: background .15s, color .15s, border-color .15s, transform .15s;
  }
  .theme-toggle:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }
  .theme-toggle:active { transform: scale(0.95); }

  /* ===================== DARK MODE ===================== */
  [data-theme="dark"] {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --border: #30363d;
    --card: #161b22;
    --code-bg: #0b0f15;
    --code-fg: #e6edf3;
    --kw:  #ff7b72;
    --typ: #d2a8ff;
    --str: #a5d6ff;
    --cmt: #8b949e;
    --num: #79c0ff;
  }
  [data-theme="dark"] .hamburger { background: var(--card); }
  [data-theme="dark"] .hamburger span { background: var(--fg); }
  [data-theme="dark"] .sidebar { background: var(--card); box-shadow: 2px 0 14px rgba(0,0,0,.4); }
  [data-theme="dark"] .sidebar a { color: var(--fg); }
  [data-theme="dark"] .sidebar a:hover,
  [data-theme="dark"] .sidebar a.active { background: rgba(88,166,255,.15); color: var(--accent); }
  [data-theme="dark"] .topbar { background: var(--card); }
  [data-theme="dark"] .tab { background: #0d1117; border-color: var(--border); }
  [data-theme="dark"] .tab:hover { background: #1c2128; color: var(--fg); }
  [data-theme="dark"] .tab.active { background: var(--card); border-bottom-color: var(--card); color: var(--fg); }
  [data-theme="dark"] .num-tag { background: rgba(88,166,255,.15); color: var(--accent); }
  [data-theme="dark"] .intuition { background: rgba(6,182,212,.10); }
  [data-theme="dark"] .tips-block { background: rgba(245,158,11,.10); }
  [data-theme="dark"] .nav-bar { background: var(--card); box-shadow: 0 -2px 8px rgba(0,0,0,.3); }
  [data-theme="dark"] .nav-btn { background: var(--card); color: var(--fg); }
  [data-theme="dark"] .nav-btn:hover:not(:disabled) { background: rgba(88,166,255,.15); color: var(--accent); border-color: var(--accent); }
  [data-theme="dark"] .kbd { background: #1c2128; border-color: var(--border); color: var(--muted); }
  [data-theme="dark"] pre.code { background: var(--code-bg); }
  [data-theme="dark"] .overlay { background: rgba(0,0,0,.55); }
  [data-theme="dark"] .cheat-table th { background: rgba(88,166,255,.15); color: var(--accent); }
  [data-theme="dark"] .cheat-table td:first-child { background: var(--code-bg); color: var(--num); }
  [data-theme="dark"] .cheat-table tr:nth-child(even) td:not(:first-child) { background: rgba(255,255,255,.02); }
</style>
</head>

</button>

<script>
/* ----------------------- DATA: ALL PROBLEMS ----------------------- */
const PROBLEMS = [];


/* ===================== TEMPLATE / FOUNDATION ===================== */
PROBLEMS.push({
  num: 0, title: "The Bit Manipulation Cheatsheet (read this first)", diff: "veasy",
  problem: "Bit manipulation problems treat an integer not as a number but as a bag of 32 (or 64) flags. The basic operators run in O(1) and unlock huge gains in speed and memory: subset enumeration, deduplication via XOR, set membership via bitmasks, fast division by powers of two, and dozens of LeetCode classics that look hard until you see the bit picture.",
  intuition: "Every int in Java is a fixed-width 32-bit two's-complement integer. Read it from right (bit 0) to left (bit 31). The four operators that matter are AND (intersect bits), OR (union bits), XOR (symmetric difference / parity), and NOT (flip all bits). Combine those with the shifts << and >> (and >>>), throw in the two magical idioms `n & (n-1)` and `n & -n`, and you can solve almost any bit problem mechanically. Memorize the table below — every other recipe in this guide is built from it.",
  hints: [
    "All listed operations are O(1). Java int = 32 bits, long = 64 bits.",
    "Translate the problem into 'which bits matter?' first, THEN pick operators.",
    "Sign matters: prefer `>>>` (logical) over `>>` (arithmetic) when treating an int as raw bits.",
    "When you need bit 31 as a 1 without the sign trap, write `1L << 31` or work in long.",
    "Two's complement gives you `-n == (~n) + 1`, which is why `n & -n` isolates the lowest set bit."
  ],
  tips: [
    "`n & (n-1)`: drops the lowest set bit. Loop while n != 0 to count set bits in O(popcount).",
    "`n & -n`: isolates the lowest set bit (a power of two value).",
    "Subset enumeration of mask m: `for (int s = m; s > 0; s = (s - 1) & m)` walks every non-empty submask. Add `s == 0` once to include the empty submask.",
    "XOR is its own inverse and is commutative & associative — that's why XOR-ing a list cancels duplicates.",
    "Avoid `Math.pow` for powers of 2. Use `1 << k` (or `1L << k`) — exact and fast."
  ],
  cheatsheetHtml: `
    <table class="cheat-table">
      <thead><tr><th>Operation</th><th>What it does</th></tr></thead>
      <tbody>
        <tr><td>n &amp; 1</td><td>Check if n is odd (last bit)</td></tr>
        <tr><td>n &gt;&gt; 1</td><td>Divide by 2 (arithmetic right shift, sign-preserving)</td></tr>
        <tr><td>n &lt;&lt; 1</td><td>Multiply by 2 (left shift)</td></tr>
        <tr><td>n &amp; (n - 1)</td><td>Clear the lowest set bit</td></tr>
        <tr><td>n &amp; (-n)</td><td>Isolate the lowest set bit</td></tr>
        <tr><td>n ^ n</td><td>Always 0 — XOR cancels duplicates</td></tr>
        <tr><td>n ^ 0</td><td>Always n — XOR with 0 is identity</td></tr>
        <tr><td>~n</td><td>Bitwise NOT (flip every bit). Equals -(n+1) in two's complement.</td></tr>
        <tr><td>n | (1 &lt;&lt; i)</td><td>Set bit i</td></tr>
        <tr><td>n &amp; ~(1 &lt;&lt; i)</td><td>Clear bit i</td></tr>
        <tr><td>n ^ (1 &lt;&lt; i)</td><td>Toggle bit i</td></tr>
        <tr><td>(n &gt;&gt; i) &amp; 1</td><td>Read bit i (returns 0 or 1)</td></tr>
        <tr><td>(n &amp; (n - 1)) == 0</td><td>n is a power of 2 (and n &gt; 0)</td></tr>
        <tr><td>Integer.bitCount(n)</td><td>Count set bits (popcount)</td></tr>
        <tr><td>Integer.highestOneBit(n)</td><td>Highest set bit value (a power of 2)</td></tr>
        <tr><td>Integer.numberOfTrailingZeros(n)</td><td>Index of the lowest set bit</td></tr>
        <tr><td>Integer.reverse(n)</td><td>Reverse all 32 bits</td></tr>
      </tbody>
    </table>
    <p><b>Java gotchas to internalize:</b></p>
    <ul class="hints">
      <li><b>&gt;&gt; vs &gt;&gt;&gt;</b> &mdash; <code>&gt;&gt;</code> is arithmetic and preserves the sign bit (fills with 1 for negatives). <code>&gt;&gt;&gt;</code> is logical and always fills with 0. Use <code>&gt;&gt;&gt;</code> when treating an int as unsigned bits (e.g. LC 190 Reverse Bits).</li>
      <li><b>1 &lt;&lt; 31 overflows</b> &mdash; that expression is <code>Integer.MIN_VALUE</code> (negative). Use <code>1L &lt;&lt; 31</code> or work in long when you need bit 31 as a flag.</li>
      <li><b>Negative numbers</b> &mdash; Java uses two's complement. <code>-1</code> is all 1s in 32 bits, <code>Integer.MIN_VALUE</code> is <code>10000...0</code>, and <code>~n == -(n+1)</code> always.</li>
      <li><b>int vs long</b> &mdash; if a problem says "treat as unsigned 32-bit", convert via <code>n &amp; 0xFFFFFFFFL</code> first to avoid sign extension.</li>
    </ul>
  `,
  code: `/*
 * The seven idioms you'll reach for in 90% of bit problems.
 * Memorize each line — every other technique is just a combination of these.
 */

// ---- 1. SET / CLEAR / TOGGLE / READ a single bit ---------------------
int set    (int n, int i) { return n |  (1 << i); }
int clear  (int n, int i) { return n & ~(1 << i); }
int toggle (int n, int i) { return n ^  (1 << i); }
int read   (int n, int i) { return (n >> i) & 1; }     // returns 0 or 1

// ---- 2. POPCOUNT (count set bits) — Brian Kernighan's trick ---------
int popcount(int n) {
    int count = 0;
    while (n != 0) {
        n &= (n - 1);                  // drops the lowest set bit
        count++;
    }
    return count;
    // (Or just call Integer.bitCount(n).)
}

// ---- 3. ISOLATE LOWEST / DROP LOWEST set bit -------------------------
int lowestBit  (int n) { return n & -n;        }   // value of lowest set bit
int dropLowest (int n) { return n & (n - 1);   }   // n with lowest set bit cleared

// ---- 4. POWER-OF-TWO check -------------------------------------------
boolean isPowerOfTwo(int n) {
    return n > 0 && (n & (n - 1)) == 0;
}

// ---- 5. ENUMERATE EVERY SUBMASK of mask m ----------------------------
void forEachSubmask(int m) {
    // Walks all non-empty submasks of m in decreasing order.
    // Total iterations across all m is O(3^n) — Sum of Subsets Theorem.
    for (int s = m; s > 0; s = (s - 1) & m) {
        // ... use submask 's' ...
    }
    // The empty submask 0 is excluded by s > 0; handle it separately if needed.
}

// ---- 6. XOR — two LeetCode-favorite identities -----------------------
//   a ^ a == 0   (XOR cancels duplicates)
//   a ^ 0 == a   (XOR with 0 is identity)
// Therefore, XOR-ing every value in [a, a, b, b, c] returns c.

// ---- 7. SAFE 32-BIT BUILDS — avoid the 1<<31 trap --------------------
long bit31Flag = 1L << 31;             // 2147483648, NOT Integer.MIN_VALUE
long unsignedView(int n) {
    return n & 0xFFFFFFFFL;            // promote to non-negative long
}`,
  complexity: "Every operation above is O(1). Submask enumeration over all masks costs O(3^n). The whole guide is built from these primitives — when you see a new bit problem, ask which of these idioms can be glued together to solve it."
});


/* ===================== VERY EASY (DRILLS) ===================== */

PROBLEMS.push({
  num: 191, title: "Number of 1 Bits (Hamming Weight)", diff: "veasy",
  problem: "Given an unsigned 32-bit integer n, return how many bits are set to 1.",
  intuition: "Two equally good answers. The naive way is to walk all 32 bits with `(n >> i) & 1`. The cute way is Brian Kernighan's trick: `n &= (n - 1)` drops the lowest set bit, so the loop runs exactly popcount times instead of 32.",
  hints: [
    "Iterate while n != 0 to use Kernighan; iterate i from 0..31 for the bit-by-bit version.",
    "Use `>>>` (logical shift), not `>>`, since the input is conceptually unsigned.",
    "Java's built-in `Integer.bitCount(n)` does this for you in O(1) intrinsic-friendly code."
  ],
  tips: [
    "Kernighan is faster on sparse inputs. For dense inputs both are essentially identical.",
    "If you need popcount on a `long`, use `Long.bitCount(n)`.",
    "Beware: a plain `n >> 1` will sign-extend for negative inputs and you'll loop forever."

 * Max Students Taking Exam. Row-by-row bitmask DP.
 * Valid row masks: no two adjacent students AND no student on a broken seat.
 * Cross-row constraint: no diagonal cheating.

int maxStudents(char[][] seats) {

    int m = seats.length, n = seats[0].length, FULL = 1 << n;

            if (seats[i][j] == '#') broken[i] |= (1 << j);
        }

    int[][] dp = new int[m][FULL];
    for (int[] row : dp) Arrays.fill(row, -1);

    for (int mask = 0; mask < FULL; mask++) {
        if ((mask & broken[0]) != 0) continue;
        if ((mask & (mask << 1)) != 0) continue;
        dp[0][mask] = Integer.bitCount(mask);

  code: `/*

 *   Each puzzle has exactly 7 distinct letters → at most 2^7 = 128 submasks,
 *   half of which include the first letter. Group words by their mask
 *   and, for each puzzle, sum counts over the 64 forced submasks.
 */
List<Integer> findNumOfValidWords(String[] words, String[] puzzles) {

    Map<Integer, Integer> wordCount = new HashMap<>();
    for (String w : words) {
        int mask = 0;
        for (char c : w.toCharArray()) mask |= 1 << (c - 'a');
        wordCount.merge(mask, 1, Integer::sum);

    List<Integer> result = new ArrayList<>();
    for (String p : puzzles) {

  problem: "Given a 2n-element array, on the i-th operation pick any two remaining numbers x, y, gain `i * gcd(x, y)`, and remove them. Maximize the total score.",
  intuition: "State = bitmask of which numbers are still available; dp[mask] = best score achievable from that mask. The number of removed elements is `2n - popcount(mask)`, which tells you the operation index. For each pair of set bits, recurse with both bits cleared.",

    "dp[(1<<2n) - 1] = 0 (base: nothing removed yet — but we measure 'used').",
    "Bottom-up by mask popcount, or top-down memoized DFS.",
    "Operation index = popcount(removedMask) / 2 + 1."
  ],
  tips: [
    "Precompute pair gcds once: `gcd[i][j] = Math.gcd(nums[i], nums[j])`.",
    "n ≤ 7 → 2n ≤ 14 → 2^14 = 16384 states. Transitions O(n^2) per state."
  ],
  code: `/*
 * Maximize Score After N Operations. Bitmask DP.
 *   mask = set of elements ALREADY USED
 *   op   = popcount(mask) / 2 + 1  → which operation we're filling
 *   dp[mask] = max total score reachable from this mask onward
 *
 * Top-down memoization is cleanest.
 */
int[] memo;
int[][] gcd;
int N;

int maxScore(int[] nums) {
    N = nums.length;
    memo = new int[1 << N];
    Arrays.fill(memo, -1);
    gcd = new int[N][N];
    for (int i = 0; i < N; i++)
        for (int j = i + 1; j < N; j++)
            gcd[i][j] = bigGcd(nums[i], nums[j]);
    return dfs(0);
}

int dfs(int used) {
    if (memo[used] != -1) return memo[used];
    int op = Integer.bitCount(used) / 2 + 1;
    if (op > N / 2) return 0;

    int best = 0;
    for (int i = 0; i < N; i++) {
        if (((used >> i) & 1) == 1) continue;
        for (int j = i + 1; j < N; j++) {
            if (((used >> j) & 1) == 1) continue;
            int score = op * gcd[i][j] + dfs(used | (1 << i) | (1 << j));
            best = Math.max(best, score);
        }
    }
    return memo[used] = best;
}

int bigGcd(int a, int b) { return b == 0 ? a : bigGcd(b, a % b); }`,

});

  problem: "Given an array of stickers (each a string) and a target string, return the minimum number of stickers needed to compose target. Each sticker can be used unlimited times. Return -1 if impossible.",
  intuition: "State = bitmask over which characters of `target` are still uncovered. From a state, try each sticker; for each sticker, fill as many target letters as possible greedily by checking sticker character counts; the new mask has those bits cleared. Memoize on the mask.",
  hints: [
    "Encode target characters as 0..target.length-1 → bitmask of length up to 15.",
    "Precompute each sticker's character count.",
    "DFS(mask): if mask == 0 return 0; for each sticker, simulate covering target letters and recurse."
  ],
  tips: [
    "Skip stickers that don't contain `target.charAt(lowestUncoveredIndex)` — heuristic that prunes the tree dramatically.",
    "target.length ≤ 15 ⇒ 2^15 = 32768 states, very tractable."
  ],
  code: `/*
 * Stickers to Spell Word. Memoized bitmask DFS over 'which target chars
 * are still needed'.
 */
Map<Integer, Integer> memo;
int[][] stickCnt;
String target;

int minStickers(String[] stickers, String target) {

    this.target = target;
    int n = stickers.length;
    stickCnt = new int[n][26];
    for (int i = 0; i < n; i++)
        for (char c : stickers[i].toCharArray())
            stickCnt[i][c - 'a']++;

    memo = new HashMap<>();
    int ans = dfs((1 << target.length()) - 1);
    return ans == Integer.MAX_VALUE / 2 ? -1 : ans;
}

int dfs(int mask) {

    if (mask == 0) return 0;
    if (memo.containsKey(mask)) return memo.get(mask);

    int best = Integer.MAX_VALUE / 2;

    // PRUNE: pick the LOWEST uncovered char and only consider stickers
    // that contain it — this avoids permutation-style duplicate work.
    int firstNeeded = Integer.numberOfTrailingZeros(mask);
    char firstChar = target.charAt(firstNeeded);

    for (int s = 0; s < stickCnt.length; s++) {
        if (stickCnt[s][firstChar - 'a'] == 0) continue;

        int[] remaining = stickCnt[s].clone();
        int newMask = mask;
        for (int i = 0; i < target.length(); i++) {
            if (((newMask >> i) & 1) == 0) continue;
            int idx = target.charAt(i) - 'a';
            if (remaining[idx] > 0) {
                remaining[idx]--;
                newMask &= ~(1 << i);
            }
        }
        best = Math.min(best, 1 + dfs(newMask));
    }

    memo.put(mask, best);
    return best;
}`,
  complexity: "Time O(2^L · S · L) where L = target length and S = sticker count. Space O(2^L)."
});


/* ----------------------- RENDERING ENGINE ----------------------- */

const DIFF_LABEL = { veasy: 'Very Easy', easy: 'Easy', med: 'Medium', hard: 'Hard' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Lightweight Java syntax highlighter — same scheme as the Backtracking guide. */
function highlightJava(src) {
  let s = escapeHtml(src);
  const stash = [];
  const stashIt = (html) => {
    stash.push(html);
    return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001';
  };
  // line comments
  s = s.replace(/\/\/[^\n]*/g, m => stashIt('<span class="cmt">' + m + '</span>'));
  // block comments
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => stashIt('<span class="cmt">' + m + '</span>'));
  // double-quoted strings
  s = s.replace(/&quot;([^&]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  // char literals
  s = s.replace(/&#39;.&#39;|&#39;\\.&#39;/g, m => stashIt('<span class="str">' + m + '</span>'));

  const types = ['String','Integer','Long','Boolean','Character','Double','Float',
    'List','Map','Set','HashMap','HashSet','TreeMap','TreeSet','ArrayList','LinkedList',
    'ArrayDeque','Queue','Deque','PriorityQueue','StringBuilder','BitSet','Stack',
    'TreeNode','Random','Collections','Arrays','Math','Comparator','Objects'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  const kws = ['void','int','long','boolean','char','double','float','byte','short',
    'public','private','protected','static','final','abstract','class','interface','enum',
    'return','if','else','for','while','do','break','continue','switch','case','default',
    'new','null','true','false','this','super','try','catch','finally','throw','throws',
    'import','package','extends','implements','instanceof'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  // numbers (with optional L suffix; 0x hex literals included)
  s = s.replace(/\b(0x[0-9A-Fa-f_]+L?|\d+(?:_\d+)*L?)\b/g, '<span class="num">$1</span>');

  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

function getProblems(diff) {
  return PROBLEMS.filter(p => p.diff === diff);
}

const state = { diff: 'veasy', idx: 0 };

function renderTOC() {
  const toc = document.getElementById('toc');
  const groups = [
    { diff: 'veasy', label: 'Very Easy' },
    { diff: 'easy',  label: 'Easy' },
    { diff: 'med',   label: 'Medium' },
    { diff: 'hard',  label: 'Hard' },
  ];
  const html = groups.map(g => {
    const items = getProblems(g.diff)
      .map((p, i) => `<a data-diff="${g.diff}" data-idx="${i}"><span class="num">${p.num === 0 ? '★' : '#' + p.num}</span>${escapeHtml(p.title)}</a>`)
      .join('');
    return `<div class="group-title">${g.label}</div>${items}`;
  }).join('');
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      state.diff = a.dataset.diff;
      state.idx = +a.dataset.idx;
      render();
      toggleSidebar(false);
    });
  });
}

function renderTabs() {
  document.getElementById('cnt-veasy').textContent = '(' + getProblems('veasy').length + ')';
  document.getElementById('cnt-easy').textContent  = '(' + getProblems('easy').length + ')';
  document.getElementById('cnt-med').textContent   = '(' + getProblems('med').length + ')';
  document.getElementById('cnt-hard').textContent  = '(' + getProblems('hard').length + ')';
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      if (state.diff !== t.dataset.diff) {
        state.diff = t.dataset.diff;
        state.idx = 0;
        render();
      }
    };
  });
}

function render() {
  const problems = getProblems(state.diff);
  if (state.idx >= problems.length) state.idx = problems.length - 1;
  if (state.idx < 0) state.idx = 0;
  const p = problems[state.idx];
  const main = document.getElementById('main');
  const numTag = p.num === 0 ? '★ Foundation' : '#' + p.num;

  const cheatBlock = p.cheatsheetHtml
    ? `<div class="section-title">Cheatsheet</div>${p.cheatsheetHtml}`
    : '';

  main.innerHTML = `
    <div class="problem-card">
      <h2>
        <span class="num-tag">${numTag}</span>
        ${escapeHtml(p.title)}
        <span class="badge ${p.diff}">${DIFF_LABEL[p.diff]}</span>
      </h2>

      <div class="section-title">Problem</div>
      <p>${escapeHtml(p.problem)}</p>

      <div class="section-title">Intuition</div>
      <div class="intuition">${escapeHtml(p.intuition)}</div>

      ${cheatBlock}

      <div class="section-title">Step-by-step Hints</div>
      <ol class="hints">${p.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ol>

      <div class="section-title">Tips & Tricks</div>
      <div class="tips-block"><ul class="tips">${p.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>

      <div class="section-title">Java Code</div>
      <pre class="code"><code>${highlightJava(p.code)}</code></pre>

      ${p.complexity ? `<div class="complexity"><b>Complexity:</b> ${escapeHtml(p.complexity)}</div>` : ''}
    </div>
  `;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.diff === state.diff);
  });

  document.getElementById('prev').disabled = state.idx === 0;
  document.getElementById('next').disabled = state.idx === problems.length - 1;
  document.getElementById('nav-info').textContent =
    `${DIFF_LABEL[state.diff]} · ${state.idx + 1} / ${problems.length}`;

  document.querySelectorAll('.sidebar a').forEach(a => {
    a.classList.toggle('active', a.dataset.diff === state.diff && +a.dataset.idx === state.idx);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextProblem() {
  const arr = getProblems(state.diff);
  if (state.idx < arr.length - 1) { state.idx++; render(); }
}
function prevProblem() {
  if (state.idx > 0) { state.idx--; render(); }
}
document.getElementById('prev').addEventListener('click', prevProblem);
document.getElementById('next').addEventListener('click', nextProblem);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') prevProblem();
  else if (e.key === 'ArrowRight') nextProblem();
  else if (e.key === 'Escape') toggleSidebar(false);
});

const hb = document.getElementById('hamburger');
const sb = document.getElementById('sidebar');
const ov = document.getElementById('overlay');
function toggleSidebar(open) {
  const isOpen = (typeof open === 'boolean') ? open : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  hb.classList.toggle('open', isOpen);
  ov.classList.toggle('show', isOpen);
}
hb.addEventListener('click', () => toggleSidebar());
ov.addEventListener('click', () => toggleSidebar(false));

/* theme toggle */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️';
    themeBtn.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙';
    themeBtn.title = 'Switch to dark mode';
  }
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('theme', next);
});

renderTabs();
bindTabs();
renderTOC();
render();

</script>
