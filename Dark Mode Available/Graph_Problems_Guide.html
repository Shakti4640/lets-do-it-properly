<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Graph Problems in SDE Interviews — A Classification with Templates</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<style>
  :root {
    --bg: #f6f7fb;
    --fg: #1f2330;
    --muted: #6b7280;
    --accent: #059669;          /* graph green */
    --accent2: #2563eb;
    --border: #e3e6ee;
    --card: #ffffff;
    --code-bg: #f8fafc;
    --code-fg: #24292f;
    --kw:  #cf222e;
    --typ: #6f42c1;
    --bi:  #b91c1c;
    --str: #0a7d4d;
    --cmt: #6a737d;
    --num: #0550ae;
    --veasy: #0891b2;
    --easy:  #16a34a;
    --med:   #d97706;
    --hard:  #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; }
  .hamburger { position: fixed; top: 14px; left: 14px; width: 44px; height: 44px; border-radius: 10px; background: #ffffff; border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,.08); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; cursor: pointer; z-index: 1001; }
  .hamburger span { display: block; width: 22px; height: 2.5px; background: #1e1e25; border-radius: 2px; transition: transform .25s, opacity .2s; }
  .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
  .sidebar { position: fixed; top: 0; left: 0; height: 100vh; width: 360px; max-width: 90vw; background: #ffffff; border-right: 1px solid var(--border); box-shadow: 2px 0 14px rgba(0,0,0,.06); transform: translateX(-100%); transition: transform .28s ease; overflow-y: auto; z-index: 1000; padding: 70px 18px 32px; }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2 { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sidebar .group-title { margin-top: 18px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; border-bottom: 1px dashed var(--border); }
  .sidebar a { display: flex; align-items: center; gap: 8px; padding: 7px 8px; margin: 2px 0; text-decoration: none; color: #1f2330; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
  .sidebar a:hover { background: #d1fae5; color: var(--accent); }
  .sidebar a.active { background: #d1fae5; color: var(--accent); font-weight: 600; }
  .sidebar a .num { display: inline-block; min-width: 32px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; font-family: "JetBrains Mono", Consolas, monospace; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 999; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .topbar { background: #ffffff; border-bottom: 1px solid var(--border); padding: 18px 24px 0; padding-left: 76px; position: sticky; top: 0; z-index: 50; }
  .topbar h1 { margin: 0 0 6px; font-size: 20px; }
  .topbar p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { padding: 9px 16px; border: 1px solid var(--border); border-bottom: none; background: #f1f3f9; color: var(--muted); border-top-left-radius: 8px; border-top-right-radius: 8px; cursor: pointer; font-size: 13.5px; font-weight: 600; transition: background .15s; }
  .tab:hover { background: #e7eaf3; color: var(--fg); }
  .tab.active { background: #ffffff; color: var(--fg); border-bottom: 2px solid #ffffff; margin-bottom: -1px; box-shadow: 0 -2px 0 var(--accent) inset; }
  .tab .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  .tab.veasy .dot { background: var(--veasy); }
  .tab.easy .dot { background: var(--easy); }
  .tab.med .dot { background: var(--med); }
  .tab.hard .dot { background: var(--hard); }
  .tab.brief .dot { background: #8b5cf6; }
  .tab .count { color: var(--muted); margin-left: 6px; font-weight: 500; }

  main { max-width: 980px; margin: 0 auto; padding: 28px 24px 120px; }
  .problem-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 26px 28px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .problem-card h2 { margin: 0 0 6px; font-size: 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .num-tag { background: #d1fae5; color: var(--accent); padding: 3px 10px; border-radius: 6px; font-size: 13px; font-weight: 700; font-family: "JetBrains Mono", Consolas, monospace; }
  .badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 999px; color: #fff; font-weight: 700; letter-spacing: .05em; }
  .badge.veasy { background: var(--veasy); }
  .badge.easy { background: var(--easy); }
  .badge.med { background: var(--med); }
  .badge.hard { background: var(--hard); }
  .pill { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; background: #ecfdf5; color: #065f46; font-weight: 600; letter-spacing: .03em; }
  .pill.trav { background:#dbeafe; color:#1e40af; }
  .pill.sp   { background:#fef3c7; color:#92400e; }
  .pill.topo { background:#ede9fe; color:#5b21b6; }
  .pill.mst  { background:#fce7f3; color:#9d174d; }
  .pill.uf   { background:#fee2e2; color:#991b1b; }
  .pill.cycle{ background:#fff7ed; color:#c2410c; }
  .pill.bip  { background:#e0f2fe; color:#075985; }
  .pill.grid { background:#f0fdf4; color:#166534; }
  .pill.impl { background:#fef9c3; color:#854d0e; }
  .pill.adv  { background:#f3f4f6; color:#374151; }

  .section-title { font-size: 13.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; border-left: 3px solid var(--accent); padding-left: 10px; }
  .problem-card p { margin: 8px 0; font-size: 15px; }
  .intuition { background: #ecfdf5; border-left: 4px solid #10b981; border-radius: 6px; padding: 12px 16px; margin: 8px 0; }
  .formula { background: #ecfeff; border-left: 4px solid #06b6d4; border-radius: 6px; padding: 10px 16px; margin: 8px 0; font-family: "JetBrains Mono", Consolas, monospace; font-size: 13.5px; overflow-x: auto; white-space: pre; }
  .hints, .tips { margin: 6px 0 6px 4px; padding: 0 0 0 22px; }
  .hints li, .tips li { margin: 6px 0; font-size: 14.5px; }
  .tips-block { background: #fef9c3; border-left: 4px solid #ca8a04; border-radius: 6px; padding: 10px 16px; margin: 8px 0; }
  .complexity { margin-top: 12px; color: var(--muted); font-size: 13.5px; }
  .cheat-table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; font-size: 14px; }
  .cheat-table th, .cheat-table td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
  .cheat-table th { background: #d1fae5; color: var(--accent); font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; }
  .cheat-table td:first-child { font-family: "JetBrains Mono", Consolas, monospace; background: #ecfdf5; white-space: nowrap; color: #065f46; }
  .cheat-table tr:nth-child(even) td:not(:first-child) { background: #fafbff; }

  pre.code { background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.55; margin: 6px 0; }
  pre.code code { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; }
  .kw { color: var(--kw); font-weight: 600; }
  .typ { color: var(--typ); font-weight: 500; }
  .bi { color: var(--bi); font-weight: 500; }
  .str { color: var(--str); }
  .cmt { color: var(--cmt); font-style: italic; }
  .num { color: var(--num); }

  .nav-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 60; box-shadow: 0 -2px 8px rgba(0,0,0,.04); }
  .nav-btn { display: inline-flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--fg); font-weight: 500; }
  .nav-btn:hover:not(:disabled) { background: #d1fae5; color: var(--accent); border-color: #6ee7b7; }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .nav-info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kbd { display: inline-block; border: 1px solid #d0d7de; border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; background: #f6f8fa; font-family: monospace; font-size: 11px; color: #444; }

  body.brief-mode .nav-bar { display: none; }
  .brief-root { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
  .brief-root .brief-header { text-align: center; margin-bottom: 24px; }
  .brief-root .brief-subtitle { font-size: 11px; letter-spacing: 8px; color: var(--muted); margin-bottom: 8px; }
  .brief-root .brief-title { font-size: clamp(28px, 6vw, 48px); font-weight: 900; margin: 0; background: linear-gradient(90deg, #059669, #2563eb, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -1px; }
  .brief-root .brief-tagline { color: var(--muted); margin-top: 8px; font-size: 13px; }
  .brief-root .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 24px; margin-bottom: 20px; }
  .brief-root .panel h3 { margin: 0 0 12px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .brief-root .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .brief-root .card-mini { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: #ecfdf5; }
  .brief-root .card-mini b { color: var(--accent); display: block; margin-bottom: 4px; font-size: 13.5px; font-family: "JetBrains Mono", Consolas, monospace; }
  .brief-root .card-mini span { color: var(--muted); font-size: 13px; }
  .brief-root .flow { border: 1px dashed var(--border); border-radius: 12px; padding: 16px; background: var(--code-bg); font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; line-height: 1.9; overflow-x: auto; white-space: pre; margin: 0; color: var(--fg); }
  .brief-root .flow .q { color: var(--accent); font-weight: 700; }
  .brief-root .flow .a { color: var(--str); }
  .brief-root .flow .alg { color: var(--bi); font-weight: 700; }

  @media (max-width: 600px) {
    .topbar { padding-left: 70px; padding-right: 70px; }
    main { padding: 20px 14px 130px; }
    .problem-card { padding: 18px 18px; }
    .problem-card h2 { font-size: 19px; }
  }
  .theme-toggle { position: fixed; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,.08); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1001; font-size: 20px; line-height: 1; color: var(--fg); transition: background .15s, color .15s, border-color .15s, transform .15s; }
  .theme-toggle:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }

  [data-theme="dark"] {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --accent: #34d399;
    --border: #30363d; --card: #161b22; --code-bg: #0b0f15; --code-fg: #e6edf3;
    --kw: #ff7b72; --typ: #d2a8ff; --bi: #ffa657; --str: #a5d6ff; --cmt: #8b949e; --num: #79c0ff;
  }
  [data-theme="dark"] .hamburger { background: var(--card); }
  [data-theme="dark"] .hamburger span { background: var(--fg); }
  [data-theme="dark"] .sidebar { background: var(--card); }
  [data-theme="dark"] .sidebar a { color: var(--fg); }
  [data-theme="dark"] .sidebar a:hover, [data-theme="dark"] .sidebar a.active { background: rgba(52,211,153,.15); color: var(--accent); }
  [data-theme="dark"] .topbar { background: var(--card); }
  [data-theme="dark"] .tab { background: #0d1117; border-color: var(--border); }
  [data-theme="dark"] .tab:hover { background: #1c2128; color: var(--fg); }
  [data-theme="dark"] .tab.active { background: var(--card); border-bottom-color: var(--card); color: var(--fg); }
  [data-theme="dark"] .num-tag { background: rgba(52,211,153,.15); color: var(--accent); }
  [data-theme="dark"] .intuition { background: rgba(16,185,129,.10); }
  [data-theme="dark"] .formula { background: rgba(6,182,212,.10); }
  [data-theme="dark"] .tips-block { background: rgba(202,138,4,.10); }
  [data-theme="dark"] .pill       { background: rgba(6,95,70,.18);  color: #6ee7b7; }
  [data-theme="dark"] .pill.trav  { background: rgba(30,64,175,.18); color: #bfdbfe; }
  [data-theme="dark"] .pill.sp    { background: rgba(146,64,14,.18); color: #fde68a; }
  [data-theme="dark"] .pill.topo  { background: rgba(91,33,182,.18); color: #ddd6fe; }
  [data-theme="dark"] .pill.mst   { background: rgba(157,23,77,.18); color: #fbcfe8; }
  [data-theme="dark"] .pill.uf    { background: rgba(153,27,27,.18); color: #fecaca; }
  [data-theme="dark"] .pill.cycle { background: rgba(194,65,12,.18); color: #fed7aa; }
  [data-theme="dark"] .pill.bip   { background: rgba(7,89,133,.18); color: #bae6fd; }
  [data-theme="dark"] .pill.grid  { background: rgba(22,101,52,.18); color: #bbf7d0; }
  [data-theme="dark"] .pill.impl  { background: rgba(133,77,14,.18); color: #fef08a; }
  [data-theme="dark"] .pill.adv   { background: rgba(55,65,81,.30); color: #d1d5db; }
  [data-theme="dark"] .nav-bar { background: var(--card); }
  [data-theme="dark"] .nav-btn { background: var(--card); color: var(--fg); }
  [data-theme="dark"] .nav-btn:hover:not(:disabled) { background: rgba(52,211,153,.15); color: var(--accent); border-color: var(--accent); }
  [data-theme="dark"] .kbd { background: #1c2128; border-color: var(--border); color: var(--muted); }
  [data-theme="dark"] pre.code { background: var(--code-bg); }

  [data-theme="dark"] .cheat-table th { background: rgba(52,211,153,.15); color: var(--accent); }
  [data-theme="dark"] .cheat-table td:first-child { background: var(--code-bg); color: #6ee7b7; }
  [data-theme="dark"] .cheat-table tr:nth-child(even) td:not(:first-child) { background: rgba(255,255,255,.02); }
  [data-theme="dark"] .brief-root .card-mini { background: rgba(52,211,153,.07); }
</style>

<button class="hamburger" id="hamburger" aria-label="Open menu"><span></span><span></span><span></span></button>

<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar"><h2>Table of Contents</h2><div id="toc"></div></aside>
<header class="topbar">
  <h1>Graph Problems in SDE Interviews — A Classification with Templates</h1>
  <p>Click a difficulty tab. Use <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> arrow keys to navigate within the tab.</p>
  <div class="tabs" id="tabs">
    <div class="tab brief" data-diff="brief"><span class="dot"></span>Brief</div>
    <div class="tab veasy" data-diff="veasy"><span class="dot"></span>Foundations<span class="count" id="cnt-veasy"></span></div>

  </div>

<script>
const PROBLEMS = [];


PROBLEMS.push({
  num: 0, title: "The Graph Problem Mental Model (read this first)", diff: "veasy",
  family: "Foundations",
  problem: "Most graph problems in SDE interviews fall into 12 archetypes. Once you recognise the archetype from the problem statement, the algorithm is almost forced. The skill being tested is rarely 'do you know Dijkstra?' — it's 'can you SEE that this is a Dijkstra problem?'.",
  intuition: "The 12 archetypes: (1) traversal & connectivity, (2) shortest path, (3) topological / DAG, (4) MST, (5) Union-Find, (6) cycle-related, (7) bipartite / coloring, (8) grid-as-graph, (9) implicit / state-space search, (10) advanced (flow, bridges, 2-SAT, LCA), (11) tree-specific, (12) hard / niche (TSP, coloring). Pattern-matching from the prompt to the archetype is the entire game.",
  hints: [
    "Signal: 'shortest' + unweighted     → BFS",
    "Signal: 'shortest' + non-negative   → Dijkstra",
    "Signal: 'prerequisites / order'     → Topological sort",
    "Signal: 'groups / merge / connected'→ Union-Find",
    "Signal: 'min cost to connect all'   → MST (Kruskal / Prim)",
    "Signal: 'two groups / colour'       → Bipartite check",
    "Signal: 'states / configurations'   → BFS on implicit graph",
    "Signal: 'critical / cannot remove'  → Bridges / articulation",
    "Signal: 'every pair' with small n   → Floyd-Warshall",
    "Signal: 'negative weights'          → Bellman-Ford",
    "Signal: grid + obstacles + shortest → BFS (or Dijkstra if weighted)"
  ],
  tips: [
    "First questions to ask: directed or undirected? weighted? cycles allowed? size of V and E? source(s) and target(s)?",
    "Build the adjacency list once, reuse across the whole solution. Re-creating it inside a loop is the rookie cost-blower.",
    "Default representations: adjacency list (List<List<Integer>> or Map<K, List<K>>) for sparse graphs; matrix only for dense or all-pairs.",
    "Almost every graph algorithm is BFS/DFS plus state. Master those two and most problems collapse.",
    "When in doubt, start sketching by hand on a 5-node example. Pattern usually clicks within 90 seconds."
  ],
  cheatsheetHtml: `
    <table class="cheat-table">
      <thead><tr><th>Archetype</th><th>Algorithm(s)</th><th>Typical signal</th></tr></thead>
      <tbody>
        <tr><td>Traversal / Components</td><td>BFS / DFS / Union-Find</td><td>"reachable", "components", "islands"</td></tr>
        <tr><td>Shortest Path (unweighted)</td><td>BFS</td><td>"min steps", uniform edges</td></tr>
        <tr><td>Shortest Path (non-neg)</td><td>Dijkstra</td><td>"min cost", weighted edges</td></tr>
        <tr><td>Shortest Path (any weights)</td><td>Bellman-Ford</td><td>"negative weights", "arbitrage"</td></tr>
        <tr><td>All-pairs shortest path</td><td>Floyd-Warshall (V&le;400)</td><td>"every pair", small graph</td></tr>
        <tr><td>DAG / ordering</td><td>Topological sort</td><td>"prerequisites", "build order"</td></tr>
        <tr><td>MST</td><td>Kruskal / Prim</td><td>"min cost to connect all"</td></tr>
        <tr><td>Disjoint set</td><td>Union-Find</td><td>"merge", "are X and Y in same group"</td></tr>
        <tr><td>Cycle detection (dir)</td><td>3-color DFS / Kahn's</td><td>"is there a cycle", "schedulable"</td></tr>
        <tr><td>Cycle detection (undir)</td><td>DFS w/ parent / Union-Find</td><td>"redundant edge", "extra connection"</td></tr>
        <tr><td>Bipartite</td><td>2-color BFS/DFS</td><td>"split into two groups", "possible bipartition"</td></tr>
        <tr><td>Grid problems</td><td>BFS/DFS w/ 4-dir / 8-dir</td><td>"matrix", "neighbours", "islands"</td></tr>
        <tr><td>Implicit graph</td><td>BFS over states</td><td>"transformations", "configurations", "moves"</td></tr>
        <tr><td>Bridges / articulation</td><td>Tarjan's</td><td>"critical connection", "cannot remove"</td></tr>
        <tr><td>Bipartite matching</td><td>Hungarian / Flow</td><td>"assign", "pair up"</td></tr>
        <tr><td>Eulerian path</td><td>Hierholzer's</td><td>"use every edge once"</td></tr>
        <tr><td>Hamiltonian / TSP</td><td>Bitmask DP</td><td>"visit every node once", "min tour"</td></tr>
      </tbody>
    </table>
  `,
  code: `// The two templates that solve 60% of graph interviews
import java.util.*;

// 1) BFS — shortest path / level-by-level on unweighted graphs
int bfs(List<List<Integer>> g, int src, int dst) {
    int n = g.size();
    int[] dist = new int[n];
    Arrays.fill(dist, -1);
    Deque<Integer> q = new ArrayDeque<>();
    q.offer(src);
    dist[src] = 0;
    while (!q.isEmpty()) {
        int u = q.poll();
        if (u == dst) return dist[u];
        for (int v : g.get(u)) {
            if (dist[v] == -1) {
                dist[v] = dist[u] + 1;
                q.offer(v);
            }
        }
    }
    return -1;
}

// 2) DFS — connectivity / cycles / topological / SCC building block
boolean[] visited;
void dfs(List<List<Integer>> g, int u) {
    visited[u] = true;
    for (int v : g.get(u))
        if (!visited[v]) dfs(g, v);
}`,
  complexity: "Most graph algorithms run in O(V + E). Dijkstra adds a log factor. Floyd-Warshall is O(V^3)."
});


PROBLEMS.push({

    <table class="cheat-table">
      <thead><tr><th>Representation</th><th>Java type</th><th>Best for</th><th>Memory</th></tr></thead>

    </ul>
    <p><b>Conversion table (input shape → target shape):</b></p>
    <table class="cheat-table">
      <thead><tr><th>From</th><th>To</th><th>How (5-line idea)</th></tr></thead>
      <tbody>
        <tr><td>edge list</td><td>adj list (unweighted, undirected)</td><td>for each {u,v}: g[u].add(v); g[v].add(u);</td></tr>
        <tr><td>edge list</td><td>adj list (unweighted, directed)</td><td>for each {u,v}: g[u].add(v);</td></tr>
        <tr><td>edge list</td><td>adj list (weighted, undirected)</td><td>for each {u,v,w}: g[u].add({v,w}); g[v].add({u,w});</td></tr>

  code: `import java.util.*;

// =========================================================
// 1) edge list  →  adjacency list
// =========================================================
List<List<Integer>> buildAdjUnweighted(int n, int[][] edges, boolean undirected) {
    List<List<Integer>> g = new ArrayList<>();
    for (int i = 0; i < n; i++) g.add(new ArrayList<>());
    for (int[] e : edges) {
        g.get(e[0]).add(e[1]);
        if (undirected) g.get(e[1]).add(e[0]);
    }
    return g;
}

List<List<int[]>> buildAdjWeighted(int n, int[][] edges, boolean undirected) {
    List<List<int[]>> g = new ArrayList<>();
    for (int i = 0; i < n; i++) g.add(new ArrayList<>());
    for (int[] e : edges) {
        g.get(e[0]).add(new int[]{e[1], e[2]});
        if (undirected) g.get(e[1]).add(new int[]{e[0], e[2]});
    }
    return g;
}

// =========================================================
// 2) edge list  →  adjacency matrix
// =========================================================
int[][] buildMatrix(int n, int[][] edges, boolean undirected) {
    int[][] m = new int[n][n];
    for (int[] e : edges) {
        m[e[0]][e[1]] = e.length >= 3 ? e[2] : 1;
        if (undirected) m[e[1]][e[0]] = e.length >= 3 ? e[2] : 1;
    }
    return m;
}

// =========================================================
// 3) adj list  →  edge list (undirected: deduped by u < v)
// =========================================================
List<int[]> adjToEdgeListUndirected(List<List<Integer>> g) {
    List<int[]> out = new ArrayList<>();
    for (int u = 0; u < g.size(); u++)
        for (int v : g.get(u))
            if (u < v) out.add(new int[]{u, v});
    return out;
}

// =========================================================
// 4) Node-class graph  →  int adjacency list
// =========================================================
class Node { int val; List<Node> neighbors = new ArrayList<>(); Node(int v){val=v;} }

List<List<Integer>> nodeGraphToAdj(Node start) {
    Map<Node, Integer> id = new HashMap<>();
    List<Node> all = new ArrayList<>();
    Deque<Node> q = new ArrayDeque<>();
    q.offer(start); id.put(start, 0); all.add(start);
    while (!q.isEmpty()) {
        Node cur = q.poll();
        for (Node nb : cur.neighbors)
            if (!id.containsKey(nb)) {
                id.put(nb, id.size());
                all.add(nb);
                q.offer(nb);
            }
    }
    List<List<Integer>> g = new ArrayList<>();
    for (int i = 0; i < all.size(); i++) g.add(new ArrayList<>());
    for (Node u : all)
        for (Node v : u.neighbors)
            g.get(id.get(u)).add(id.get(v));
    return g;
}

// =========================================================
// 5) Grid  →  implicit adjacency (no list built; just iterate)
// =========================================================
int[] dr = {-1, 1, 0, 0}, dc = {0, 0, -1, 1};
void visitNeighbours(int r, int c, int R, int C, int[][] grid) {
    for (int d = 0; d < 4; d++) {
        int nr = r + dr[d], nc = c + dc[d];
        if (nr < 0 || nr >= R || nc < 0 || nc >= C) continue;
        // ... your per-neighbour work here ...
    }
}

// =========================================================
// 6) ITERATING (accessing neighbours) by representation
// =========================================================
void demo(int u,
          int[][] edges,                       // edge list
          List<List<Integer>> adjU,            // adj list, unweighted
          List<List<int[]>>  adjW,             // adj list, weighted
          int[][] m,                           // adjacency matrix
          Node nodeU) {                        // Node-class

    // edge list — full scan; rarely how you query a single u
    for (int[] e : edges) if (e[0] == u) { int v = e[1]; /* ... */ }

    // adj list, unweighted
    for (int v : adjU.get(u)) { /* ... */ }

    // adj list, weighted
    for (int[] e : adjW.get(u)) { int v = e[0], w = e[1]; /* ... */ }

    // matrix — iterate the row
    for (int v = 0; v < m.length; v++) if (m[u][v] != 0) { /* edge u->v with weight m[u][v] */ }

    // Node class — iterate .neighbors
    for (Node nb : nodeU.neighbors) { /* ... */ }
}`,
  complexity: "Build cost: O(V + E) for lists, O(V²) for matrix. Iterating a single node's neighbours: O(deg(u)) for adj list / Node, O(V) for matrix, O(E) for edge list."
});

    "BFS naturally yields shortest distance / fewest steps.",
    "DFS naturally yields a discovery / finish-time ordering — basis for topological sort and SCC."
  ],
  tips: [
    "Mark on push, not on pop — otherwise BFS can enqueue the same node multiple times before visiting it.",
    "For very deep graphs, recursive DFS overflows the stack. Use the iterative form or bump the thread stack.",
    "BFS/DFS scaffolding is identical across problems — what changes is the per-node state and what you record.",

  code: `import java.util.*;

// BFS — shortest path on unweighted graph
int bfs(List<List<Integer>> g, int src, int dst) {
    int n = g.size();
    int[] dist = new int[n];
    Arrays.fill(dist, -1);
    Deque<Integer> q = new ArrayDeque<>();
    q.offer(src);
    dist[src] = 0;
    while (!q.isEmpty()) {
        int u = q.poll();
        for (int v : g.get(u))
            if (dist[v] == -1) {
                dist[v] = dist[u] + 1;
                if (v == dst) return dist[v];
                q.offer(v);
            }
    }
    return -1;
}

// DFS recursive — generic visit
boolean[] visited;
void dfs(List<List<Integer>> g, int u) {
    visited[u] = true;
    for (int v : g.get(u))
        if (!visited[v]) dfs(g, v);
}

// DFS iterative
void dfsIter(List<List<Integer>> g, int src) {
    boolean[] seen = new boolean[g.size()];
    Deque<Integer> st = new ArrayDeque<>();
    st.push(src);
    while (!st.isEmpty()) {
        int u = st.pop();
        if (seen[u]) continue;
        seen[u] = true;
        for (int v : g.get(u)) if (!seen[v]) st.push(v);
    }
}`,
  complexity: "Both: O(V + E) time, O(V) space."
});

  code: `import java.util.*;

// Kosaraju — returns list of SCCs (each as a list of node IDs)
List<List<Integer>> kosaraju(List<List<Integer>> g) {
    int n = g.size();
    boolean[] vis = new boolean[n];
    Deque<Integer> order = new ArrayDeque<>();
    // pass 1
    for (int i = 0; i < n; i++) if (!vis[i]) fill(g, i, vis, order);
    // build reverse graph
    List<List<Integer>> r = new ArrayList<>();
    for (int i = 0; i < n; i++) r.add(new ArrayList<>());
    for (int u = 0; u < n; u++)
        for (int v : g.get(u)) r.get(v).add(u);
    // pass 2
    Arrays.fill(vis, false);
    List<List<Integer>> sccs = new ArrayList<>();
    while (!order.isEmpty()) {
        int u = order.pop();
        if (vis[u]) continue;
        List<Integer> comp = new ArrayList<>();
        collect(r, u, vis, comp);
        sccs.add(comp);
    }
    return sccs;
}
void fill(List<List<Integer>> g, int u, boolean[] vis, Deque<Integer> order) {
    vis[u] = true;
    for (int v : g.get(u)) if (!vis[v]) fill(g, v, vis, order);
    order.push(u);
}
void collect(List<List<Integer>> r, int u, boolean[] vis, List<Integer> out) {
    vis[u] = true; out.add(u);
    for (int v : r.get(u)) if (!vis[v]) collect(r, v, vis, out);
}`,
  complexity: "O(V + E)."
});

  code: `import java.util.*;

int[] topoKahn(int n, List<List<Integer>> g) {
    int[] indeg = new int[n];
    for (int u = 0; u < n; u++) for (int v : g.get(u)) indeg[v]++;
    Deque<Integer> q = new ArrayDeque<>();
    for (int i = 0; i < n; i++) if (indeg[i] == 0) q.offer(i);
    int[] order = new int[n];
    int k = 0;
    while (!q.isEmpty()) {
        int u = q.poll();
        order[k++] = u;
        for (int v : g.get(u))
            if (--indeg[v] == 0) q.offer(v);
    }
    if (k != n) return new int[0];   // cycle
    return order;
}

// DFS post-order variant
List<Integer> topoDFS(int n, List<List<Integer>> g) {
    int[] state = new int[n];        // 0 unseen, 1 in-stack, 2 done
    Deque<Integer> stack = new ArrayDeque<>();
    for (int i = 0; i < n; i++) if (state[i] == 0)
        if (!dfs(i, g, state, stack)) return List.of();    // cycle
    List<Integer> order = new ArrayList<>(stack);
    Collections.reverse(order);
    return order;
}
boolean dfs(int u, List<List<Integer>> g, int[] s, Deque<Integer> st) {
    if (s[u] == 1) return false;     // back edge → cycle
    if (s[u] == 2) return true;
    s[u] = 1;
    for (int v : g.get(u)) if (!dfs(v, g, s, st)) return false;
    s[u] = 2; st.push(u);
    return true;
}`,

  family: "Union-Find",
  problem: "Disjoint-set data structure with two operations: find(x) returns the representative of x's set; union(a, b) merges the two sets. With path compression + union by rank, both operations are nearly O(1) amortised — α(N), the inverse Ackermann.",
  intuition: "Each node points to a parent; the root represents the set. find walks up to the root and (with path compression) flattens the chain. union picks one root and points the other under it (with rank/size to keep trees shallow).",
  hints: [
    "parent[i] = i initially.",
    "find: if parent[x] != x → parent[x] = find(parent[x]); return parent[x].",
    "union by rank: rank[ru] vs rank[rv] → smaller hangs under larger; equal → tie-break + rank++.",
    "Track set count: start at n, decrement on every successful union.",
    "Track set size when problems ask about component size."
  ],
  tips: [
    "Default to it for: dynamic connectivity, cycle detection in undirected, Kruskal's MST, equation problems.",
    "α(n) ≤ 4 for any practically large n — treat as O(1).",
    "Rank vs size: rank tracks tree depth; size tracks element count. Either gives near-O(1); pick based on what the problem asks about.",
    "Implementation: int[] parent + int[] rank/size + int count. ~30 lines, learn it cold."
  ],
  code: `class UnionFind {
    int[] parent, rank;
    int count;     // number of disjoint sets

    UnionFind(int n) {
        parent = new int[n]; rank = new int[n]; count = n;
        for (int i = 0; i < n; i++) parent[i] = i;
    }

    int find(int x) {
        while (parent[x] != x) { parent[x] = parent[parent[x]]; x = parent[x]; }
        return x;
    }

    boolean union(int a, int b) {
        int ra = find(a), rb = find(b);
        if (ra == rb) return false;
        if (rank[ra] < rank[rb]) { parent[ra] = rb; }
        else if (rank[ra] > rank[rb]) { parent[rb] = ra; }
        else { parent[rb] = ra; rank[ra]++; }
        count--;
        return true;
    }
}`,
  complexity: "Both ops near O(1) amortised: O(α(N)) ≤ 4."
});

// Edmonds-Karp — BFS-based max flow
class MaxFlow {
    int n;
    int[][] cap;
    MaxFlow(int n) { this.n = n; cap = new int[n][n]; }
    void addEdge(int u, int v, int c) { cap[u][v] += c; }   // += handles parallel

    int maxflow(int s, int t) {
        int flow = 0;
        while (true) {
            int[] parent = new int[n];
            Arrays.fill(parent, -1);
            parent[s] = s;
            Deque<Integer> q = new ArrayDeque<>();
            q.offer(s);
            while (!q.isEmpty() && parent[t] == -1) {
                int u = q.poll();
                for (int v = 0; v < n; v++)
                    if (parent[v] == -1 && cap[u][v] > 0) {
                        parent[v] = u;
                        q.offer(v);
                    }

            int push = Integer.MAX_VALUE;
            for (int v = t; v != s; v = parent[v]) push = Math.min(push, cap[parent[v]][v]);
            for (int v = t; v != s; v = parent[v]) {
                cap[parent[v]][v] -= push;
                cap[v][parent[v]] += push;
            }
            flow += push;
        }

// TSP — minimum-cost Hamiltonian circuit, complete graph with cost matrix
int tsp(int[][] cost) {
    int n = cost.length;
    int INF = Integer.MAX_VALUE / 2;
    int[][] dp = new int[1 << n][n];
    for (int[] r : dp) Arrays.fill(r, INF);
    dp[1][0] = 0;     // start at node 0, only node 0 visited
    for (int mask = 1; mask < (1 << n); mask++) {
        for (int u = 0; u < n; u++) {
            if ((mask & (1 << u)) == 0 || dp[mask][u] == INF) continue;
            for (int v = 0; v < n; v++) {
                if ((mask & (1 << v)) != 0) continue;
                int nmask = mask | (1 << v);
                dp[nmask][v] = Math.min(dp[nmask][v], dp[mask][u] + cost[u][v]);
            }
        }
    }
    int ans = INF, full = (1 << n) - 1;
    for (int u = 1; u < n; u++) ans = Math.min(ans, dp[full][u] + cost[u][0]);
    return ans;
}`,

    for (int c = 0; c < k; c++) {
        boolean ok = true;
        for (int v = 0; v < n; v++) if (g[u][v] == 1 && color[v] == c) { ok = false; break; }

/* ----------------------- RENDERING ENGINE ----------------------- */
const DIFF_LABEL = { veasy: 'Foundations', easy: 'Easy', med: 'Medium', hard: 'Hard', brief: 'Brief' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightJava(src) {
  let s = escapeHtml(src);
  const stash = [];
  const stashIt = (html) => { stash.push(html); return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001'; };
  s = s.replace(/\/\/[^\n]*/g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/&quot;([^&\n]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  s = s.replace(/&#39;.&#39;|&#39;\\.&#39;/g, m => stashIt('<span class="str">' + m + '</span>'));

  const types = ['String','Integer','Long','Boolean','Character','Double','Float','Object',
    'List','Map','Set','HashMap','HashSet','TreeMap','TreeSet','LinkedHashMap','LinkedHashSet',
    'ArrayList','LinkedList','ArrayDeque','Queue','Deque','PriorityQueue','BlockingQueue',
    'StringBuilder','Optional','Comparator','Comparable','Objects','Arrays','Collections','Iterator','Iterable',
    'Math','Random','TreeNode','Node','Edge','UnionFind','Codec','LCA','MaxFlow','BridgeFinder','BipartiteMatching',
    'RuntimeException','NoSuchElementException'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  const kws = ['void','int','long','boolean','char','double','float','byte','short',
    'public','private','protected','static','final','abstract','class','interface','enum','record',
    'return','if','else','for','while','do','break','continue','switch','case','default','yield',
    'new','null','true','false','this','super','try','catch','finally','throw','throws',
    'import','package','extends','implements','instanceof','var'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  s = s.replace(/\b(0x[0-9A-Fa-f_]+L?|\d+(?:_\d+)*L?)\b/g, '<span class="num">$1</span>');
  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

function getProblems(diff) {
  return PROBLEMS.filter(p => p.diff === diff).sort((a, b) => a.num - b.num);
}

const state = { diff: 'brief', idx: 0 };

function renderTOC() {
  const toc = document.getElementById('toc');
  const groups = [
    { diff: 'veasy', label: 'Foundations' },
    { diff: 'easy',  label: 'Easy' },
    { diff: 'med',   label: 'Medium' },
    { diff: 'hard',  label: 'Hard' },
  ];
  const html = groups.map(g => {
    const items = getProblems(g.diff)
      .map((p, i) => `<a data-diff="${g.diff}" data-idx="${i}"><span class="num">${p.num === 0 ? '★' : '#' + p.num}</span>${escapeHtml(p.title)}</a>`)
      .join('');
    return `<div class="group-title">${g.label}</div>${items}`;
  }).join('');
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      state.diff = a.dataset.diff;
      state.idx = +a.dataset.idx;
      render();
      toggleSidebar(false);
    });
  });
}

function renderTabs() {
  document.getElementById('cnt-veasy').textContent = '(' + getProblems('veasy').length + ')';
  document.getElementById('cnt-easy').textContent  = '(' + getProblems('easy').length + ')';
  document.getElementById('cnt-med').textContent   = '(' + getProblems('med').length + ')';
  document.getElementById('cnt-hard').textContent  = '(' + getProblems('hard').length + ')';
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => { if (state.diff !== t.dataset.diff) { state.diff = t.dataset.diff; state.idx = 0; render(); } };
  });
}

function familyPillClass(family) {
  if (!family) return '';
  const f = family.toLowerCase();
  if (f.includes('traversal'))           return 'trav';
  if (f.includes('shortest'))            return 'sp';
  if (f.includes('topological'))         return 'topo';
  if (f.includes('minimum spanning'))    return 'mst';
  if (f.includes('union-find'))          return 'uf';
  if (f.includes('cycle'))               return 'cycle';
  if (f.includes('bipartite'))           return 'bip';
  if (f.includes('grid'))                return 'grid';
  if (f.includes('implicit'))            return 'impl';
  if (f.includes('advanced'))            return 'adv';
  if (f.includes('tree'))                return 'topo';
  if (f.includes('hard / niche'))        return 'adv';
  if (f.includes('pattern'))             return 'impl';
  return '';
}


function render() {
  const main = document.getElementById('main');
  if (state.diff === 'brief') {
    document.body.classList.add('brief-mode');
    main.innerHTML = renderBriefView();
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.diff === state.diff));
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  document.body.classList.remove('brief-mode');

  const problems = getProblems(state.diff);
  if (state.idx >= problems.length) state.idx = problems.length - 1;
  if (state.idx < 0) state.idx = 0;
  const p = problems[state.idx];
  const numTag = p.num === 0 ? '★ Foundation' : '#' + p.num;

  const cheatBlock = p.cheatsheetHtml ? `<div class="section-title">Cheatsheet</div>${p.cheatsheetHtml}` : '';
  const formulaBlock = p.formula ? `<div class="section-title">Format / Syntax</div><div class="formula">${escapeHtml(p.formula)}</div>` : '';
  const familyPill = p.family ? `<span class="pill ${familyPillClass(p.family)}">${escapeHtml(p.family)}</span>` : '';

  main.innerHTML = `
    <div class="problem-card">
      <h2>
        <span class="num-tag">${numTag}</span>
        ${escapeHtml(p.title)}
        <span class="badge ${p.diff}">${DIFF_LABEL[p.diff]}</span>
        ${familyPill}
      </h2>
      <div class="section-title">What &amp; Why</div>
      <p>${escapeHtml(p.problem)}</p>
      <div class="section-title">Intuition</div>
      <div class="intuition">${escapeHtml(p.intuition)}</div>
      ${formulaBlock}
      ${cheatBlock}
      <div class="section-title">Patterns &amp; Hints</div>
      <ol class="hints">${p.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ol>
      <div class="section-title">Tips &amp; Tricks</div>
      <div class="tips-block"><ul class="tips">${p.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>
      <div class="section-title">Java Template</div>
      <pre class="code"><code>${highlightJava(p.code)}</code></pre>
      ${p.complexity ? `<div class="complexity"><b>Complexity:</b> ${escapeHtml(p.complexity)}</div>` : ''}
    </div>`;

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.diff === state.diff));
  document.getElementById('prev').disabled = state.idx === 0;
  document.getElementById('next').disabled = state.idx === problems.length - 1;
  document.getElementById('nav-info').textContent = `${DIFF_LABEL[state.diff]} · ${state.idx + 1} / ${problems.length}`;
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.toggle('active', a.dataset.diff === state.diff && +a.dataset.idx === state.idx));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextProblem() { const arr = getProblems(state.diff); if (state.idx < arr.length - 1) { state.idx++; render(); } }
function prevProblem() { if (state.idx > 0) { state.idx--; render(); } }
document.getElementById('prev').addEventListener('click', prevProblem);
document.getElementById('next').addEventListener('click', nextProblem);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') prevProblem();
  else if (e.key === 'ArrowRight') nextProblem();
  else if (e.key === 'Escape') toggleSidebar(false);
});

const hb = document.getElementById('hamburger');
const sb = document.getElementById('sidebar');
const ov = document.getElementById('overlay');
function toggleSidebar(open) {
  const isOpen = (typeof open === 'boolean') ? open : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  hb.classList.toggle('open', isOpen);
  ov.classList.toggle('show', isOpen);
}
hb.addEventListener('click', () => toggleSidebar());
ov.addEventListener('click', () => toggleSidebar(false));

const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️'; themeBtn.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙'; themeBtn.title = 'Switch to dark mode';
  }
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next); localStorage.setItem('theme', next);
});


function renderBriefView() {
  const families = [
    { title: '1. Traversal & Connectivity', cmds: [['BFS / DFS','core templates'],['Connected components','outer + inner traversal'],['SCC (directed)','Tarjan / Kosaraju'],['Flood fill / islands','grid as graph']] },
    { title: '2. Shortest Path',            cmds: [['BFS','unweighted'],['Dijkstra','non-negative weights'],['Bellman-Ford','negative / detects cycle'],['Floyd-Warshall','all pairs, V ≤ 400'],['0-1 BFS','weights ∈ {0,1}'],['Multi-source BFS','many starts at d=0']] },
    { title: '3. Topological / DAG',        cmds: [['Topo sort','Kahn / DFS post-order'],['Cycle detection (dir)','3-color DFS'],['DP on DAG','longest / count / cost']] },
    { title: '4. MST',                      cmds: [['Kruskal','sort + Union-Find'],['Prim','heap from a node']] },
    { title: '5. Union-Find',               cmds: [['Path compression + rank','near O(1)'],['Equation problems','Accounts Merge etc'],['Cycle detection (undir)','same-root check']] },
    { title: '6. Cycle-related',            cmds: [['Eulerian path','Hierholzer'],['Find / shortest cycle','BFS variants']] },
    { title: '7. Bipartite / Coloring',     cmds: [['2-coloring BFS / DFS','no odd cycle']] },
    { title: '8. Grid as Graph',            cmds: [['4 / 8-dir BFS / DFS','islands / regions / paths'],['Multi-state BFS','keys, eliminations, time']] },
    { title: '9. Implicit Graph',           cmds: [['Word Ladder','letter swaps as edges'],['Open the Lock','board as state'],['Bidirectional BFS','meet in the middle'],['A*','informed search']] },
    { title: '10. Advanced',                cmds: [['Bridges / articulation','Tarjan'],['Max flow / min cut','Dinic / Edmonds-Karp'],['Bipartite matching','augmenting / Hopcroft-Karp'],['2-SAT','impl graph + SCC']] },
    { title: '11. Trees',                   cmds: [['Tree DFS / BFS','traversal'],['Tree DP','diameter / max path / robber'],['LCA','binary lifting'],['Re-rooting','answer for every node']] },
    { title: '12. Hard / Niche',            cmds: [['TSP / Hamiltonian','bitmask DP n ≤ 20'],['Graph coloring','backtracking'],['Steiner tree','DP over subsets'],['k-shortest paths','Yen']] },
  ];

  const decisionFlow = `
<span class="q">Q1.</span> What KIND of question is this?
   ├── <span class="a">"reachable / connected / components"</span>     → <span class="alg">BFS · DFS · Union-Find</span>
   ├── <span class="a">"shortest"</span>                              → <span class="alg">BFS / Dijkstra / Bellman-Ford / Floyd-Warshall</span>
   ├── <span class="a">"prerequisites / order / dependencies"</span>   → <span class="alg">Topological sort</span>
   ├── <span class="a">"min cost to connect all"</span>               → <span class="alg">MST (Kruskal / Prim)</span>
   ├── <span class="a">"merge / group / equivalence"</span>           → <span class="alg">Union-Find</span>
   ├── <span class="a">"two groups / colour / bipartition"</span>     → <span class="alg">Bipartite check</span>
   ├── <span class="a">"states / configurations / transformations"</span> → <span class="alg">BFS on implicit graph</span>
   ├── <span class="a">"critical edge / cannot remove"</span>         → <span class="alg">Bridges (Tarjan)</span>
   ├── <span class="a">"every pair, V ≤ 400"</span>                   → <span class="alg">Floyd-Warshall</span>
   ├── <span class="a">"negative weights / arbitrage"</span>          → <span class="alg">Bellman-Ford</span>
   ├── <span class="a">"visit every node once"</span>                 → <span class="alg">Bitmask DP / TSP (n ≤ 20)</span>
   └── <span class="a">"use every edge once"</span>                   → <span class="alg">Hierholzer's</span>

<span class="q">Q2.</span> What about the GRAPH itself?
   ├── directed or undirected?
   ├── weighted / non-neg / can-be-negative?
   ├── connected guaranteed?
   ├── cycles allowed?
   └── size of V, E, query count?

<span class="q">Q3.</span> What does the CONSTRAINT say?
   ├── n ≤ 20             → <span class="alg">bitmask DP feasible</span>
   ├── n ≤ 400            → <span class="alg">Floyd-Warshall</span>
   ├── n ≤ 10^4           → <span class="alg">Bellman-Ford</span>
   ├── n ≤ 10^5, sparse   → <span class="alg">Dijkstra / BFS / Union-Find</span>
   └── n ≤ 10^6           → <span class="alg">linear: BFS / DFS / topo</span>

<span class="q">Q4.</span> Are queries online or offline?
   ├── one-shot              → run the algorithm
   ├── many on same graph    → preprocess (LCA, distances, components)
   └── streaming edges       → Union-Find / dynamic connectivity

<span class="q">Q5.</span> If no algorithm fits cleanly, look for an IMPLICIT graph
   └── nodes = states, edges = legal transitions → BFS / Dijkstra / A*
`;

  const recipeCards = [
    { b: 'BFS shortest path',         s: "Deque + dist[] = -1 + mark on push" },
    { b: 'DFS connected components',  s: "outer loop + inner BFS/DFS + counter" },
    { b: 'Topological order',         s: "Kahn: in-degree + queue, emit zeros" },
    { b: 'Cycle in directed graph',   s: "3-color DFS — back edge = cycle" },
    { b: 'Cycle in undirected',       s: "DFS w/ parent OR Union-Find same-root" },
    { b: 'Dijkstra',                  s: "PQ keyed on dist + relax neighbours" },
    { b: 'Bellman-Ford',              s: "V-1 relax-all + V-th detects neg cycle" },
    { b: 'Floyd-Warshall',            s: "k outer; d[i][j] = min(d[i][j], d[i][k]+d[k][j])" },
    { b: 'MST Kruskal',               s: "sort edges + Union-Find skip cycles" },
    { b: 'Union-Find',                s: "path compression + union by rank" },
    { b: 'Bipartite check',           s: "BFS 2-coloring; conflict ⇒ false" },
    { b: 'Multi-source BFS',          s: "enqueue ALL sources at distance 0" },
    { b: 'Bridges (Tarjan)',          s: "DFS + disc/low; low[v] > disc[u]" },
    { b: 'Tree DP diameter',          s: "post-order: max chain + global update" },
    { b: 'LCA binary lifting',        s: "up[k][u] = 2^k-th ancestor" },
    { b: 'TSP bitmask',               s: "dp[mask][end] = min cost; final OR back to start" },
  ];

  const families_html = families.map(f => `
    <div class="panel">
      <h3>${escapeHtml(f.title)}</h3>
      <div class="grid">
        ${f.cmds.map(c => `<div class="card-mini"><b>${escapeHtml(c[0])}</b><span>${escapeHtml(c[1])}</span></div>`).join('')}
      </div>
    </div>`).join('');

  const recipes_html = `
    <div class="panel">
      <h3>One-Liner Recipes</h3>
      <div class="grid">
        ${recipeCards.map(c => `<div class="card-mini"><b>${escapeHtml(c.b)}</b><span>${escapeHtml(c.s)}</span></div>`).join('')}
      </div>
    </div>`;

  return `
    <div class="brief-root">
      <header class="brief-header">
        <div class="brief-subtitle">G R A P H &nbsp; P R O B L E M S</div>
        <h1 class="brief-title">12 Archetypes · One Decision Tree</h1>
        <p class="brief-tagline">Read the prompt. Match the archetype. Apply the template. Win the interview.</p>
      </header>
      <div class="panel">
        <h3>The 5-Question Decision Flow</h3>
        <div class="flow">${decisionFlow}</div>
      </div>
      ${recipes_html}
      ${families_html}
    </div>`;
}

renderTabs();
bindTabs();
renderTOC();
render();
</script>

<!-- KIRO_CROSS_TAB_NAV_START -->
<script id="kiro-cross-tab-nav">
(function(){
  if(window.__kiroCrossTabNav) return;
  window.__kiroCrossTabNav = true;
  function init(){
    if(typeof getProblems !== 'function' || typeof window.render !== 'function' || typeof state === 'undefined') return;
    var ORDER = ['veasy','easy','med','hard'];
    function diffs(){ return ORDER.filter(function(d){ try { return getProblems(d).length > 0; } catch(e){ return false; } }); }

    function updateNavButtons(){
      var prevB = document.getElementById('prev');
      var nextB = document.getElementById('next');
      if(!prevB || !nextB) return;
      if(state.diff === 'brief'){ return; }
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      prevB.disabled = (di <= 0 && state.idx <= 0);
      nextB.disabled = (di === list.length - 1 && state.idx >= arr.length - 1);
    }

    var origRender = window.render;
    window.render = function(){
      var r = origRender.apply(this, arguments);
      try { updateNavButtons(); } catch(e){}
      return r;
    };

    function goNext(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      if(state.idx < arr.length - 1){ state.idx++; window.render(); return; }
      if(di < list.length - 1){ state.diff = list[di + 1]; state.idx = 0; window.render(); }
    }
    function goPrev(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      if(state.idx > 0){ state.idx--; window.render(); return; }
      if(di > 0){
        var pd = list[di - 1];
        state.diff = pd;
        var parr = getProblems(pd);
        state.idx = Math.max(0, parr.length - 1);
        window.render();
      }
    }

    window.nextProblem = goNext;
    window.prevProblem = goPrev;

    ['prev','next'].forEach(function(id){
      var b = document.getElementById(id);
      if(!b) return;
      var clone = b.cloneNode(true);
      b.parentNode.replaceChild(clone, b);
      clone.addEventListener('click', id === 'next' ? goNext : goPrev);
    });

    updateNavButtons();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<!-- KIRO_CROSS_TAB_NAV_END -->
