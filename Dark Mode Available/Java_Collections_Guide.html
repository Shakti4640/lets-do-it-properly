<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Java Collections — Cheatsheet, Methods, Use Cases &amp; Problem Patterns</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<style>
  :root {
    --bg: #f6f7fb;
    --fg: #1f2330;
    --muted: #6b7280;
    --accent: #ea580c;          /* Java orange */
    --accent2: #b91c1c;
    --border: #e3e6ee;
    --card: #ffffff;
    --code-bg: #f8fafc;
    --code-fg: #24292f;
    --kw:  #cf222e;
    --typ: #6f42c1;
    --bi:  #b91c1c;
    --str: #0a7d4d;
    --cmt: #6a737d;
    --num: #0550ae;
    --veasy: #0891b2;
    --easy:  #16a34a;
    --med:   #d97706;
    --hard:  #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
  }

  .hamburger {
    position: fixed; top: 14px; left: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 5px; cursor: pointer; z-index: 1001;
  }
  .hamburger span {
    display: block; width: 22px; height: 2.5px;
    background: #1e1e25; border-radius: 2px;
    transition: transform .25s, opacity .2s;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

  .sidebar {
    position: fixed; top: 0; left: 0;
    height: 100vh; width: 360px; max-width: 90vw;
    background: #ffffff;
    border-right: 1px solid var(--border);
    box-shadow: 2px 0 14px rgba(0,0,0,.06);
    transform: translateX(-100%);
    transition: transform .28s ease;
    overflow-y: auto;
    z-index: 1000;
    padding: 70px 18px 32px;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2 {
    margin: 0 0 12px;
    font-size: 13px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .sidebar .group-title {
    margin-top: 18px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .sidebar a {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px;
    margin: 2px 0;
    text-decoration: none;
    color: #1f2330;
    border-radius: 6px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .sidebar a:hover { background: #ffedd5; color: var(--accent); }
  .sidebar a.active { background: #ffedd5; color: var(--accent); font-weight: 600; }
  .sidebar a .num {
    display: inline-block;
    min-width: 32px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    font-family: "JetBrains Mono", Consolas, monospace;
  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.25);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 999;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .topbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 18px 24px 0;
    padding-left: 76px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 { margin: 0 0 6px; font-size: 20px; }
  .topbar p  { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: #f1f3f9;
    color: var(--muted);
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    transition: background .15s;
  }
  .tab:hover { background: #e7eaf3; color: var(--fg); }
  .tab.active {
    background: #ffffff;
    color: var(--fg);
    border-bottom: 2px solid #ffffff;
    margin-bottom: -1px;
    box-shadow: 0 -2px 0 var(--accent) inset;
  }
  .tab .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: 1px;
  }
  .tab.veasy .dot { background: var(--veasy); }
  .tab.easy  .dot { background: var(--easy); }
  .tab.med   .dot { background: var(--med); }
  .tab.hard  .dot { background: var(--hard); }
  .tab.brief .dot { background: #8b5cf6; }
  .tab .count { color: var(--muted); margin-left: 6px; font-weight: 500; }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 24px 120px;
  }
  .problem-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .problem-card h2 {
    margin: 0 0 6px;
    font-size: 24px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .num-tag {
    background: #ffedd5; color: var(--accent);
    padding: 3px 10px; border-radius: 6px;
    font-size: 13px; font-weight: 700;
    font-family: "JetBrains Mono", Consolas, monospace;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff; font-weight: 700; letter-spacing: .05em;
  }
  .badge.veasy { background: var(--veasy); }
  .badge.easy  { background: var(--easy); }
  .badge.med   { background: var(--med); }
  .badge.hard  { background: var(--hard); }
  .pill {
    display: inline-block;

  .pill.set  { background:#dcfce7; color:#166534; }
  .pill.map  { background:#fce7f3; color:#9d174d; }
  .pill.q    { background:#ede9fe; color:#5b21b6; }
  .pill.conc { background:#fee2e2; color:#991b1b; }
  .pill.itf  { background:#e0e7ff; color:#3730a3; }
  .pill.util { background:#f1f5f9; color:#334155; }

  .section-title {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 8px;
    border-left: 3px solid var(--accent);
    padding-left: 10px;

  .problem-card p { margin: 8px 0; font-size: 15px; }
  .intuition {
    background: #fff7ed;
    border-left: 4px solid #fb923c;
    border-radius: 6px;
    padding: 12px 16px;
    margin: 8px 0;
  }
  .formula {
    background: #ecfeff;
    border-left: 4px solid #06b6d4;
    border-radius: 6px;
    padding: 10px 16px;
    margin: 8px 0;
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    font-size: 13.5px;
    overflow-x: auto;
    white-space: pre;
  }
  .hints, .tips { margin: 6px 0 6px 4px; padding: 0 0 0 22px; }
  .hints li, .tips li { margin: 6px 0; font-size: 14.5px; }
  .tips-block {
    background: #fef9c3;
    border-left: 4px solid #ca8a04;
    border-radius: 6px;

    margin: 8px 0;

  .complexity { margin-top: 12px; color: var(--muted); font-size: 13.5px; }

    border-collapse: collapse;

    margin: 8px 0 16px;

    padding: 8px 12px;

  }

    background: #ffedd5;

    color: var(--code-fg);

  .bi  { color: var(--bi);  font-weight: 500; }
  .str { color: var(--str); }
  .cmt { color: var(--cmt); font-style: italic; }
  .num { color: var(--num); }

    position: fixed; left: 0; right: 0; bottom: 0;
    background: #ffffff;
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    z-index: 60;
    box-shadow: 0 -2px 8px rgba(0,0,0,.04);
  }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--fg);
    font-weight: 500;
  }
  .nav-btn:hover:not(:disabled) { background: #ffedd5; color: var(--accent); border-color: #fdba74; }

  .nav-info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kbd {
    display: inline-block;
    border: 1px solid #d0d7de;
    border-bottom-width: 2px;

    font-size: 11px;
    color: #444;

  .brief-root .brief-header { text-align: center; margin-bottom: 24px; }
  .brief-root .brief-subtitle {
    font-size: 11px; letter-spacing: 8px; color: var(--muted); margin-bottom: 8px;
  }
  .brief-root .brief-title {
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 900; margin: 0;

    -webkit-background-clip: text;

    background-clip: text;
    letter-spacing: -1px;

  .brief-root .brief-tagline { color: var(--muted); margin-top: 8px; font-size: 13px; }

    margin: 0 0 12px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase;

  .brief-root .grid {

    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; background: #fffaf0;

  .brief-root .card-mini span { color: var(--muted); font-size: 13px; }
  .brief-root .flow {
    border: 1px dashed var(--border); border-radius: 12px;
    padding: 16px; background: var(--code-bg);
    font-family: "JetBrains Mono", Consolas, monospace;

    --card: #161b22;
    --code-bg: #0b0f15;
    --code-fg: #e6edf3;
    --kw:  #ff7b72;
    --typ: #d2a8ff;
    --bi:  #ffa657;

  [data-theme="dark"] .pill      { background: rgba(146,64,14,.18);  color: #fde68a; }

  [data-theme="dark"] .pill.q    { background: rgba(91,33,182,.18);  color: #ddd6fe; }
  [data-theme="dark"] .pill.conc { background: rgba(153,27,27,.18);  color: #fecaca; }
  [data-theme="dark"] .pill.itf  { background: rgba(55,48,163,.18);  color: #c7d2fe; }
  [data-theme="dark"] .pill.util { background: rgba(51,65,85,.18);   color: #cbd5e1; }
  [data-theme="dark"] .nav-bar { background: var(--card); box-shadow: 0 -2px 8px rgba(0,0,0,.3); }

<script>
const PROBLEMS = [];


/* ===================== FOUNDATION ===================== */
PROBLEMS.push({
  num: 0, title: "The Java Collections Mental Model (read this first)", diff: "veasy",
  family: "Foundations",
  problem: "Every Java collection lives under one of four root interfaces: List (ordered, indexed, duplicates allowed), Set (no duplicates), Queue/Deque (front-and-back insertion order), and Map (key→value). The Collections Framework is just a small forest of interfaces, a couple of dozen implementations, and one utility class (java.util.Collections) that operates on them generically.",
  intuition: "Pick the interface from your access pattern, then pick the implementation from your performance profile. 'I need a list and I'll fetch by index a lot' → ArrayList. 'I need a set and I want it sorted' → TreeSet. 'I need a map and threads will hammer it concurrently' → ConcurrentHashMap. The interface is what your method signatures should accept; the implementation is an implementation detail of the variable that holds it.",
  hints: [
    "Program to interfaces: List<String> xs = new ArrayList<>(); — your callers don't need to know it's an ArrayList.",
    "Generics are erased at runtime. Be careful with arrays of generic types and unchecked casts.",
    "null handling is uneven across implementations — HashMap allows one null key; TreeMap/ConcurrentHashMap do not.",
    "equals() + hashCode() contract — all hash-based collections rely on it. Break the contract, lose your data.",
    "Comparable (natural order) vs Comparator (external) — sorted collections need one or the other.",
    "Iteration: enhanced for-loop is fine, but use Iterator.remove() (or removeIf) to delete during iteration without ConcurrentModificationException."
  ],
  tips: [
    "Default to ArrayList, HashMap, HashSet — they're the right answer ~80% of the time on tabular work.",
    "Default to ArrayDeque (not Stack, not LinkedList) for stacks AND queues.",
    "For thread-safety, prefer ConcurrentHashMap over Collections.synchronizedMap() — far more scalable.",
    "Java 9+ List.of / Set.of / Map.of give you immutable, compact, fast literal collections — use them aggressively.",
    "Streams (java.util.stream) compose nicely with collections via Collection.stream() and Collectors.toXxx()."
  ],
  cheatsheetHtml: `
    <table class="cheat-table">
      <thead><tr><th>Interface</th><th>Implementations</th><th>Pick when…</th></tr></thead>
      <tbody>
        <tr><td>List</td><td>ArrayList, LinkedList, CopyOnWriteArrayList, Vector*</td><td>order matters, indexed access, duplicates ok</td></tr>
        <tr><td>Set</td><td>HashSet, LinkedHashSet, TreeSet, EnumSet, CopyOnWriteArraySet</td><td>uniqueness matters; do you also need order?</td></tr>
        <tr><td>Queue / Deque</td><td>ArrayDeque, LinkedList, PriorityQueue, ArrayBlockingQueue, LinkedBlockingQueue, ConcurrentLinkedDeque</td><td>FIFO / LIFO / priority / producer-consumer</td></tr>
        <tr><td>Map</td><td>HashMap, LinkedHashMap, TreeMap, EnumMap, IdentityHashMap, WeakHashMap, ConcurrentHashMap, ConcurrentSkipListMap</td><td>key→value lookup; ordered, sorted, or concurrent variants</td></tr>
      </tbody>
    </table>
    <p><b>Big-O reflexes (average case):</b></p>
    <ul class="hints">
      <li><b>ArrayList</b>: get O(1), add-at-end O(1) amortised, add-at-middle O(n).</li>
      <li><b>LinkedList</b>: head/tail ops O(1), get(i) O(n). Almost always slower than ArrayList in practice.</li>
      <li><b>HashMap / HashSet</b>: O(1) avg, O(log n) worst since Java 8 (treeified buckets).</li>
      <li><b>TreeMap / TreeSet</b>: all ops O(log n). Sorted iteration in O(n).</li>
      <li><b>ArrayDeque</b>: O(1) for both ends. Beats Stack and LinkedList.</li>

  intuition: "For sliding-window MAX, keep a deque of indices whose values are STRICTLY DECREASING from front to back. The front is always the current window's max. When you slide: pop from the back any indices with smaller values (they're shadowed forever), push the new index, then drop the front if it's outside the window.",
  hints: [

    "Front = current answer. Tail = newest candidates.",

  code: `import java.util.*;

int[] slidingWindowMax(int[] a, int k) {
    Deque<Integer> dq = new ArrayDeque<>();    // holds indices
    int[] out = new int[a.length - k + 1];
    for (int i = 0; i < a.length; i++) {
        while (!dq.isEmpty() && dq.peekFirst() <= i - k) dq.pollFirst();    // off-window
        while (!dq.isEmpty() && a[dq.peekLast()] < a[i]) dq.pollLast();     // dominated

    "For grid problems, encode (row,col) as `row * cols + col` to use int[] / boolean[] visited."

  code: `import java.util.*;

List<Node> bfsShortestPath(Node start, Node target) {
    Deque<Node> q = new ArrayDeque<>();
    Map<Node, Node> parent = new HashMap<>();
    q.offer(start);
    parent.put(start, null);

    while (!q.isEmpty()) {
        Node n = q.poll();
        if (n.equals(target)) break;
        for (Node nb : n.neighbors())
            if (!parent.containsKey(nb)) {
                parent.put(nb, n);
                q.offer(nb);
            }
    }
    // reconstruct
    List<Node> path = new ArrayList<>();
    for (Node n = target; n != null; n = parent.get(n)) path.add(n);
    Collections.reverse(path);
    return path;
}`,

int[] twoSum(int[] nums, int target) {
    Map<Integer, Integer> idx = new HashMap<>();
    for (int i = 0; i < nums.length; i++) {
        int need = target - nums[i];
        Integer j = idx.get(need);
        if (j != null) return new int[] { j, i };
        idx.put(nums[i], i);
    }
    return new int[0];

    Map<Integer,Integer> seen = new HashMap<>();
    seen.put(0, 1);
    int sum = 0, ans = 0;

        ans += seen.getOrDefault(sum - k, 0);
        seen.merge(sum, 1, Integer::sum);

    return ans;

/* ----------------------- RENDERING ENGINE ----------------------- */

const DIFF_LABEL = { veasy: 'Foundations', easy: 'Easy', med: 'Medium', hard: 'Hard', brief: 'Brief' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Lightweight Java syntax highlighter */
function highlightJava(src) {
  let s = escapeHtml(src);
  const stash = [];
  const stashIt = (html) => {
    stash.push(html);
    return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001';
  };
  // line comments
  s = s.replace(/\/\/[^\n]*/g, m => stashIt('<span class="cmt">' + m + '</span>'));
  // block comments
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => stashIt('<span class="cmt">' + m + '</span>'));
  // double-quoted strings
  s = s.replace(/&quot;([^&\n]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  // char literals
  s = s.replace(/&#39;.&#39;|&#39;\\.&#39;/g, m => stashIt('<span class="str">' + m + '</span>'));

  const types = ['String','Integer','Long','Boolean','Character','Double','Float','Object','Number','Byte','Short',
    'List','Map','Set','HashMap','HashSet','TreeMap','TreeSet','LinkedHashMap','LinkedHashSet','EnumMap','EnumSet',
    'IdentityHashMap','WeakHashMap','Hashtable','Properties','ArrayList','LinkedList','CopyOnWriteArrayList','Vector','Stack',
    'ArrayDeque','Queue','Deque','PriorityQueue','BlockingQueue','ArrayBlockingQueue','LinkedBlockingQueue',
    'PriorityBlockingQueue','DelayQueue','SynchronousQueue','ConcurrentLinkedQueue','ConcurrentLinkedDeque',
    'ConcurrentHashMap','ConcurrentSkipListMap','ConcurrentSkipListSet','ConcurrentMap','CopyOnWriteArraySet',
    'StringBuilder','StringBuffer','BitSet','Optional','Stream','IntStream','LongStream','DoubleStream',
    'Collectors','Collections','Arrays','Math','Comparator','Comparable','Objects','Iterator','ListIterator',
    'Iterable','Spliterator','Random','ThreadLocalRandom','Function','BiFunction','Predicate','Consumer','Supplier',
    'TreeNode','Node','Edge','Person','Order','Document','Listener','LogListener','MetricsListener','ParsedAst',
    'Status','Day','Ticket','Event','Task','LRU'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  const kws = ['void','int','long','boolean','char','double','float','byte','short',
    'public','private','protected','static','final','abstract','class','interface','enum','record','sealed','permits',
    'return','if','else','for','while','do','break','continue','switch','case','default','yield',
    'new','null','true','false','this','super','try','catch','finally','throw','throws',
    'import','package','extends','implements','instanceof','var'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  // numbers
  s = s.replace(/\b(0x[0-9A-Fa-f_]+L?|\d+(?:_\d+)*L?)\b/g, '<span class="num">$1</span>');

  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

function getProblems(diff) {
  return PROBLEMS
    .filter(p => p.diff === diff)
    .sort((a, b) => a.num - b.num);
}

const state = { diff: 'veasy', idx: 0 };

function renderTOC() {
  const toc = document.getElementById('toc');
  const groups = [
    { diff: 'veasy', label: 'Foundations' },
    { diff: 'easy',  label: 'Easy' },
    { diff: 'med',   label: 'Medium' },
    { diff: 'hard',  label: 'Hard' },
  ];
  const html = groups.map(g => {
    const items = getProblems(g.diff)
      .map((p, i) => `<a data-diff="${g.diff}" data-idx="${i}"><span class="num">${p.num === 0 ? '★' : '#' + p.num}</span>${escapeHtml(p.title)}</a>`)
      .join('');
    return `<div class="group-title">${g.label}</div>${items}`;
  }).join('');
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      state.diff = a.dataset.diff;
      state.idx = +a.dataset.idx;
      render();
      toggleSidebar(false);
    });
  });
}

function renderTabs() {
  document.getElementById('cnt-veasy').textContent = '(' + getProblems('veasy').length + ')';
  document.getElementById('cnt-easy').textContent  = '(' + getProblems('easy').length + ')';
  document.getElementById('cnt-med').textContent   = '(' + getProblems('med').length + ')';
  document.getElementById('cnt-hard').textContent  = '(' + getProblems('hard').length + ')';
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      if (state.diff !== t.dataset.diff) {
        state.diff = t.dataset.diff;
        state.idx = 0;
        render();
      }
    };
  });
}

function familyPillClass(family) {
  if (!family) return '';
  const f = family.toLowerCase();
  if (f.includes('list'))   return 'list';
  if (f.includes('set'))    return 'set';
  if (f.includes('queue'))  return 'q';
  if (f.includes('map'))    return 'map';
  if (f.includes('concurrent')) return 'conc';
  if (f.includes('interface'))  return 'itf';
  if (f.includes('utilities'))  return 'util';
  return '';
}


function render() {
  const main = document.getElementById('main');

  if (state.diff === 'brief') {
    document.body.classList.add('brief-mode');
    main.innerHTML = renderBriefView();
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.diff === state.diff);
    });
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  document.body.classList.remove('brief-mode');

  const problems = getProblems(state.diff);
  if (state.idx >= problems.length) state.idx = problems.length - 1;
  if (state.idx < 0) state.idx = 0;
  const p = problems[state.idx];
  const numTag = p.num === 0 ? '★ Foundation' : '#' + p.num;

  const cheatBlock = p.cheatsheetHtml
    ? `<div class="section-title">Cheatsheet</div>${p.cheatsheetHtml}`
    : '';

  const formulaBlock = p.formula
    ? `<div class="section-title">Format / Syntax</div><div class="formula">${escapeHtml(p.formula)}</div>`
    : '';

  const familyPill = p.family
    ? `<span class="pill ${familyPillClass(p.family)}">${escapeHtml(p.family)}</span>`
    : '';

  main.innerHTML = `
    <div class="problem-card">
      <h2>
        <span class="num-tag">${numTag}</span>
        ${escapeHtml(p.title)}
        <span class="badge ${p.diff}">${DIFF_LABEL[p.diff]}</span>
        ${familyPill}
      </h2>

      <div class="section-title">Why You Use It</div>
      <p>${escapeHtml(p.problem)}</p>

      <div class="section-title">Intuition</div>
      <div class="intuition">${escapeHtml(p.intuition)}</div>

      ${formulaBlock}
      ${cheatBlock}

      <div class="section-title">Methods &amp; Patterns</div>
      <ol class="hints">${p.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ol>

      <div class="section-title">Tips &amp; Tricks</div>
      <div class="tips-block"><ul class="tips">${p.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>

      <div class="section-title">Java Code</div>
      <pre class="code"><code>${highlightJava(p.code)}</code></pre>

      ${p.complexity ? `<div class="complexity"><b>Complexity:</b> ${escapeHtml(p.complexity)}</div>` : ''}
    </div>
  `;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.diff === state.diff);
  });

  document.getElementById('prev').disabled = state.idx === 0;
  document.getElementById('next').disabled = state.idx === problems.length - 1;
  document.getElementById('nav-info').textContent =
    `${DIFF_LABEL[state.diff]} · ${state.idx + 1} / ${problems.length}`;

  document.querySelectorAll('.sidebar a').forEach(a => {
    a.classList.toggle('active', a.dataset.diff === state.diff && +a.dataset.idx === state.idx);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextProblem() {
  const arr = getProblems(state.diff);
  if (state.idx < arr.length - 1) { state.idx++; render(); }
}
function prevProblem() {
  if (state.idx > 0) { state.idx--; render(); }
}
document.getElementById('prev').addEventListener('click', prevProblem);
document.getElementById('next').addEventListener('click', nextProblem);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') prevProblem();
  else if (e.key === 'ArrowRight') nextProblem();
  else if (e.key === 'Escape') toggleSidebar(false);
});

const hb = document.getElementById('hamburger');
const sb = document.getElementById('sidebar');
const ov = document.getElementById('overlay');
function toggleSidebar(open) {
  const isOpen = (typeof open === 'boolean') ? open : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  hb.classList.toggle('open', isOpen);
  ov.classList.toggle('show', isOpen);
}
hb.addEventListener('click', () => toggleSidebar());
ov.addEventListener('click', () => toggleSidebar(false));

/* theme toggle */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️';
    themeBtn.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙';
    themeBtn.title = 'Switch to dark mode';
  }
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('theme', next);
});


/* ===== BRIEF MODE: decision flow + family map ===== */
function renderBriefView() {
  const families = [
    { title: 'List',         cmds: [['ArrayList','default · indexed · O(1) get'], ['LinkedList','rarely · doubly-linked'], ['CopyOnWriteArrayList','read-mostly concurrent'], ['Vector / Stack','legacy — avoid']] },
    { title: 'Set',          cmds: [['HashSet','default · O(1) avg'], ['LinkedHashSet','+ insertion order'], ['TreeSet','sorted · floor/ceiling'], ['EnumSet','enum keys · bitmap']] },
    { title: 'Map',          cmds: [['HashMap','default · O(1) avg'], ['LinkedHashMap','+ order · LRU mode'], ['TreeMap','sorted · range queries'], ['EnumMap','enum keys · array-backed'], ['WeakHashMap','GC-collectable keys'], ['IdentityHashMap','== equality']] },
    { title: 'Queue / Deque',cmds: [['ArrayDeque','default queue + stack'], ['PriorityQueue','min-heap'], ['BlockingQueue','producer-consumer'], ['ConcurrentLinkedQueue','lock-free']] },
    { title: 'Concurrent',   cmds: [['ConcurrentHashMap','shared map · default'], ['ConcurrentSkipListMap','sorted + concurrent'], ['CopyOnWriteArrayList','read-mostly list'], ['ArrayBlockingQueue','bounded buffer'], ['LinkedBlockingQueue','optionally bounded']] },
    { title: 'Utilities',    cmds: [['Collections','sort/reverse/shuffle/etc'], ['Comparator','comparing · thenComparing'], ['List.of / Set.of / Map.of','immutable literals'], ['Streams + Collectors','functional pipelines']] },
  ];

  const decisionFlow = `
<span class="q">Q1.</span> Order matters and duplicates are ok?
   ├── <span class="a">indexed access</span>      → <span class="alg">ArrayList</span>
   ├── <span class="a">read-mostly + concurrent</span> → <span class="alg">CopyOnWriteArrayList</span>
   └── <span class="a">otherwise</span>             → <span class="alg">ArrayList</span>

<span class="q">Q2.</span> Uniqueness matters?
   ├── no order               → <span class="alg">HashSet</span>
   ├── insertion order        → <span class="alg">LinkedHashSet</span>
   ├── sorted / range queries → <span class="alg">TreeSet</span>
   └── keys are an enum       → <span class="alg">EnumSet</span>

<span class="q">Q3.</span> Key → Value lookup?
   ├── default                → <span class="alg">HashMap</span>
   ├── insertion order        → <span class="alg">LinkedHashMap</span>
   ├── LRU cache              → <span class="alg">LinkedHashMap (accessOrder=true)</span>
   ├── sorted / floor/ceiling → <span class="alg">TreeMap</span>
   ├── enum keys              → <span class="alg">EnumMap</span>
   ├── thread-safe            → <span class="alg">ConcurrentHashMap</span>
   └── thread-safe + sorted   → <span class="alg">ConcurrentSkipListMap</span>

<span class="q">Q4.</span> Front/back access (FIFO / LIFO / priority)?
   ├── FIFO / LIFO            → <span class="alg">ArrayDeque</span>
   ├── priority order         → <span class="alg">PriorityQueue</span>
   ├── producer/consumer      → <span class="alg">ArrayBlockingQueue</span>
   └── lock-free async        → <span class="alg">ConcurrentLinkedQueue</span>

<span class="q">Q5.</span> Common problem?
   ├── count by key           → <span class="alg">HashMap + merge(k,1,Integer::sum)</span>
   ├── group by key           → <span class="alg">computeIfAbsent  /  Collectors.groupingBy</span>
   ├── top-K                  → <span class="alg">PriorityQueue size K (min-heap)</span>
   ├── LRU cache              → <span class="alg">LinkedHashMap subclass</span>
   ├── sliding window max     → <span class="alg">monotonic ArrayDeque of indices</span>
   ├── BFS / DFS              → <span class="alg">ArrayDeque + HashSet visited</span>
   └── two-sum / pair lookup  → <span class="alg">one-pass HashMap</span>
`;

  const recipeCards = [
    { b: 'Count occurrences',     s: "map.merge(k, 1, Integer::sum)" },
    { b: 'Group → list',          s: "map.computeIfAbsent(k, x -> new ArrayList<>()).add(v)" },
    { b: 'Default value',         s: "map.getOrDefault(k, 0)" },
    { b: 'Dedup, keep order',     s: "new ArrayList<>(new LinkedHashSet<>(list))" },
    { b: 'Top K largest',         s: "PriorityQueue size K (min-heap)" },
    { b: 'Sort by field',         s: "list.sort(Comparator.comparing(T::field))" },
    { b: 'Multi-key sort',        s: "Comparator.comparing(a).thenComparing(b)" },
    { b: 'LRU cache',             s: "extends LinkedHashMap with accessOrder=true" },
    { b: 'Concurrent map',        s: "new ConcurrentHashMap<>()" },
    { b: 'Range query (sorted)',  s: "treeMap.subMap(lo, hi)" },
    { b: 'Group by (stream)',     s: "stream().collect(Collectors.groupingBy(...))" },
    { b: 'Immutable literal',     s: "List.of / Set.of / Map.of" },
  ];

  const families_html = families.map(f => `
    <div class="panel">
      <h3>${escapeHtml(f.title)}</h3>
      <div class="grid">
        ${f.cmds.map(c => `<div class="card-mini"><b>${escapeHtml(c[0])}</b><span>${escapeHtml(c[1])}</span></div>`).join('')}
      </div>
    </div>`).join('');

  const recipes_html = `
    <div class="panel">
      <h3>One-Liner Recipes</h3>
      <div class="grid">
        ${recipeCards.map(c => `<div class="card-mini"><b>${escapeHtml(c.b)}</b><span>${escapeHtml(c.s)}</span></div>`).join('')}
      </div>
    </div>`;

  return `
    <div class="brief-root">
      <header class="brief-header">
        <div class="brief-subtitle">J A V A &nbsp; C O L L E C T I O N S</div>
        <h1 class="brief-title">Pick the Interface · Pick the Implementation</h1>
        <p class="brief-tagline">Access pattern decides the interface. Performance profile decides the class.</p>
      </header>

      <div class="panel">
        <h3>The 5-Question Decision Flow</h3>
        <div class="flow">${decisionFlow}</div>
      </div>

      ${recipes_html}
      ${families_html}
    </div>
  `;
}

renderTabs();
bindTabs();
renderTOC();
render();
</script>

<!-- KIRO_CROSS_TAB_NAV_START -->
<script id="kiro-cross-tab-nav">
(function(){
  if(window.__kiroCrossTabNav) return;
  window.__kiroCrossTabNav = true;
  function init(){
    if(typeof getProblems !== 'function' || typeof window.render !== 'function' || typeof state === 'undefined') return;
    var ORDER = ['veasy','easy','med','hard'];
    function diffs(){ return ORDER.filter(function(d){ try { return getProblems(d).length > 0; } catch(e){ return false; } }); }

    function updateNavButtons(){
      var prevB = document.getElementById('prev');
      var nextB = document.getElementById('next');
      if(!prevB || !nextB) return;
      if(state.diff === 'brief'){ return; }
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      prevB.disabled = (di <= 0 && state.idx <= 0);
      nextB.disabled = (di === list.length - 1 && state.idx >= arr.length - 1);
    }

    var origRender = window.render;
    window.render = function(){
      var r = origRender.apply(this, arguments);
      try { updateNavButtons(); } catch(e){}
      return r;
    };

    function goNext(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      if(state.idx < arr.length - 1){ state.idx++; window.render(); return; }
      if(di < list.length - 1){ state.diff = list[di + 1]; state.idx = 0; window.render(); }
    }
    function goPrev(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      if(state.idx > 0){ state.idx--; window.render(); return; }
      if(di > 0){
        var pd = list[di - 1];
        state.diff = pd;
        var parr = getProblems(pd);
        state.idx = Math.max(0, parr.length - 1);
        window.render();
      }
    }

    window.nextProblem = goNext;
    window.prevProblem = goPrev;

    ['prev','next'].forEach(function(id){
      var b = document.getElementById(id);
      if(!b) return;
      var clone = b.cloneNode(true);
      b.parentNode.replaceChild(clone, b);
      clone.addEventListener('click', id === 'next' ? goNext : goPrev);
    });

    updateNavButtons();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<!-- KIRO_CROSS_TAB_NAV_END -->
