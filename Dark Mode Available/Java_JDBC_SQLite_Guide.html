<script>
const PROBLEMS = [];


PROBLEMS.push({
  num: 0, title: "How a Java App Talks to a Database (read this first)", diff: "veasy",
  family: "Foundations",
  problem: "A Java app talks to a database through THREE moving parts: (1) a JDBC DRIVER (a JAR file specific to that database — sqlite-jdbc, postgresql, mysql-connector-j); (2) a CONNECTION URL (jdbc:sqlite:app.db, jdbc:postgresql://host:5432/mydb); (3) the JDBC API (DriverManager / DataSource → Connection → PreparedStatement → ResultSet). SQLite is the easiest target — it's just a single file on disk, no server to install.",
  intuition: "JDBC is a thin, generic abstraction over 'send SQL, receive rows'. SQLite is the simplest backend to learn against because there's no daemon, no auth, no networking — `jdbc:sqlite:app.db` and you're in. Once you understand JDBC against SQLite, switching to Postgres or MySQL is just a different driver + URL + dialect quirks. The code shape is identical.",
  hints: [
    "Add the driver: Maven `org.xerial:sqlite-jdbc:3.46.x` (or your DB's driver). Modern JDBC drivers register themselves automatically; no Class.forName() needed.",
    "URL shape: `jdbc:sqlite:path/to/app.db` (file), `jdbc:sqlite::memory:` (in-RAM), `jdbc:sqlite:file::memory:?cache=shared` (shared in-memory).",
    "Five JDBC types you must know: Connection, Statement, PreparedStatement, ResultSet, SQLException.",
    "Always use try-with-resources — Connection / PreparedStatement / ResultSet all implement AutoCloseable.",
    "Always use PreparedStatement with `?` placeholders — never string-concatenate user input into SQL.",
    "Wrap multi-statement work in a transaction: connection.setAutoCommit(false) → ... → connection.commit() / rollback() in a finally block."
  ],
  tips: [
    "SQLite is ideal for: desktop apps, CLI tools, tests, embedded data, single-process servers, prototypes. NOT ideal for: many-writer concurrent workloads, sharded scale-out, network-shared databases.",
    "Use a connection POOL (HikariCP) even for SQLite — it reuses connections and serialises writes correctly.",
    "For SQLite specifically, enable WAL journal mode in production: `PRAGMA journal_mode=WAL;` — readers don't block the writer.",
    "JDBC types map to Java types via getInt/getString/getTimestamp/etc. Use getObject(col, Type.class) for cleaner code in modern JDBC.",
    "Spring JDBC, JdbcClient (Spring 6.1+), JOOQ, and Hibernate are higher-level options on top of plain JDBC."
  ],
  cheatsheetHtml: `
    <table class="cheat-table">
      <thead><tr><th>Layer</th><th>What it does · examples</th></tr></thead>
      <tbody>
        <tr><td>JDBC Driver</td><td>JAR you add to classpath: sqlite-jdbc, postgresql, mysql-connector-j, ojdbc11.</td></tr>
        <tr><td>JDBC URL</td><td>jdbc:sqlite:app.db · jdbc:sqlite::memory: · jdbc:postgresql://host/db · jdbc:mysql://host:3306/db</td></tr>
        <tr><td>DriverManager</td><td>Quick-and-dirty: <code>DriverManager.getConnection(url)</code>. Fine for scripts and tests.</td></tr>
        <tr><td>DataSource (pooled)</td><td>HikariCP, c3p0, Tomcat JDBC. The right choice for any real app.</td></tr>
        <tr><td>Connection</td><td>One session with the DB. Auto-commit on by default — turn off for transactions.</td></tr>
        <tr><td>Statement</td><td>Plain SQL. Avoid for user input — SQL injection.</td></tr>
        <tr><td>PreparedStatement</td><td>Parameterised SQL with <code>?</code> placeholders. Default for every query that has values.</td></tr>
        <tr><td>ResultSet</td><td>Forward iterator over rows. Always close it.</td></tr>
        <tr><td>SQLException</td><td>Checked exception. Wrap in DataAccessException (Spring) or rethrow as runtime in your own code.</td></tr>
        <tr><td>Higher level</td><td>Spring JdbcTemplate / JdbcClient · JOOQ · Hibernate / JPA · MyBatis</td></tr>
      </tbody>
    </table>
  `,
  code: `// pom.xml — add the SQLite JDBC driver
// <dependency>
//   <groupId>org.xerial</groupId>
//   <artifactId>sqlite-jdbc</artifactId>
//   <version>3.46.1.0</version>
// </dependency>

import java.sql.*;

public class Hello {
    public static void main(String[] args) throws SQLException {
        String url = "jdbc:sqlite:app.db";          // file in CWD; created if missing

        // try-with-resources closes everything for you
        try (Connection c = DriverManager.getConnection(url);
             Statement s = c.createStatement()) {

            s.executeUpdate("CREATE TABLE IF NOT EXISTS users (id INTEGER PRIMARY KEY, name TEXT NOT NULL)");
            s.executeUpdate("INSERT INTO users(name) VALUES('alice')");

            try (ResultSet rs = s.executeQuery("SELECT id, name FROM users")) {
                while (rs.next()) {
                    System.out.println(rs.getInt("id") + " " + rs.getString("name"));
                }
            }
        }
    }
}`,
  complexity: "Single SQLite operation: microseconds. Network DB call: milliseconds + network + driver overhead."
});


/* ===================== SETUP & CONNECT ===================== */

PROBLEMS.push({
  num: 1, title: "Add the JDBC Driver — Maven / Gradle", diff: "easy",
  family: "Setup",
  problem: "JDBC drivers are JAR files. Add the right one for your database to the build. With modern drivers (Java 6+ JDBC 4.0), you DON'T need Class.forName() — they auto-register via the ServiceLoader.",
  intuition: "One coordinate per database: `org.xerial:sqlite-jdbc` for SQLite, `org.postgresql:postgresql` for Postgres, `com.mysql:mysql-connector-j` for MySQL, `com.oracle.database.jdbc:ojdbc11` for Oracle. Switching backends is mostly a coordinate change + a URL change.",
  hints: [
    "Maven: <dependency><groupId>org.xerial</groupId><artifactId>sqlite-jdbc</artifactId><version>3.46.1.0</version></dependency>",
    "Gradle (Kotlin DSL): implementation(\"org.xerial:sqlite-jdbc:3.46.1.0\")",
    "Modern drivers self-register. `Class.forName(\"org.sqlite.JDBC\")` is legacy and unnecessary in Java 6+.",
    "`DriverManager.getDrivers()` lists everything currently registered — useful when debugging 'no suitable driver' errors.",
    "If you bundle a fat JAR, make sure META-INF/services/java.sql.Driver isn't shaded out by mistake."
  ],
  tips: [
    "Pin the version. `LATEST` / version-range coordinates bite you eventually.",
    "Two driver JARs for the same DB on the classpath = fights over the URL prefix. Don't.",
    "If 'No suitable driver found for jdbc:...' shows up, check (a) the JAR is on the classpath, (b) the URL prefix matches.",

public void bulkInsertUsers(Connection c, List<User> users) throws SQLException {

    c.setAutoCommit(false);

public void exportAllUsers(Connection c, java.io.PrintWriter out) throws SQLException {

    "PRAGMA synchronous=NORMAL; — fast, still durable to OS crashes (loses last commit only on power loss).",
    "PRAGMA foreign_keys=ON; — must be set per connection.",
    "PRAGMA busy_timeout=5000; — wait up to 5s for a locked DB before SQLITE_BUSY error.",
    "PRAGMA temp_store=MEMORY; — keep temp tables in RAM.",
    "PRAGMA cache_size=-20000; — 20 MB page cache (negative = KB, positive = pages).",

    "synchronous=NORMAL is the right default. Use FULL only if you must survive a power loss without losing the last commit.",

import java.sql.*;
import java.util.*;

public record User(long id, String email, String name) {}

public class UserRepository {
    private final DataSource ds;

    public Optional<User> findById(long id) {
        String sql = "SELECT id, email, name FROM users WHERE id = ?";
        try (Connection c = ds.getConnection();
             PreparedStatement ps = c.prepareStatement(sql)) {
            ps.setLong(1, id);
            try (ResultSet rs = ps.executeQuery()) {
                return rs.next() ? Optional.of(map(rs)) : Optional.empty();
            }
        } catch (SQLException e) { throw new RuntimeException(e); }

                "INSERT INTO users(email,name) VALUES(?,?)",
                Statement.RETURN_GENERATED_KEYS)) {
            ps.setString(1, email); ps.setString(2, name);
            ps.executeUpdate();
            try (ResultSet keys = ps.getGeneratedKeys()) {
                keys.next();
                return keys.getLong(1);
            }
        }
    }

    Optional<User> findById(long id) throws SQLException {
        try (Connection c = ds.getConnection();
             PreparedStatement ps = c.prepareStatement(
                "SELECT id, email, name FROM users WHERE id = ?")) {
            ps.setLong(1, id);
            try (ResultSet rs = ps.executeQuery()) {
                if (rs.next())
                    return Optional.of(new User(rs.getLong(1), rs.getString(2), rs.getString(3)));
                return Optional.empty();
            }
        }
    }
}`,
  complexity: "End-to-end: a few milliseconds for the first connection, microseconds per query thereafter."
});

PROBLEMS.push({
  num: 23, title: "Common Pitfalls — the 10 mistakes everyone makes", diff: "med",
  family: "Pitfalls",
  problem: "Repeating bugs that show up in nearly every JDBC codebase. Catch them in code review and they never reach production.",
  intuition: "Most JDBC bugs aren't subtle — they're patterns that get copy-pasted. Read this once, recognise them forever.",
  hints: [
    "1. String-concatenating user input into SQL → SQL injection. Use PreparedStatement with `?`.",
    "2. Forgetting to close ResultSet / Statement / Connection → leaks. Use try-with-resources.",
    "3. One Connection field shared across threads → race conditions. Connections are not thread-safe.",
    "4. Auto-commit on, multi-statement business op → partial-updates. Wrap in a transaction.",
    "5. SELECT *, then change the table → silent column-order break. Name your columns.",
    "6. Storing money as double → precision loss. Use BigDecimal.",
    "7. N+1 queries (loop calling SELECT) → death by latency. Use JOIN or IN-list.",
    "8. Missing index on FK / WHERE column → full-table scans. EXPLAIN your queries.",
    "9. Catching SQLException + swallowing → silent data loss. Log + decide retry-or-fail.",
    "10. Holding a transaction open during user think-time → blocked writers. Keep transactions short."
  ],
  tips: [
    "Static analysis (SonarQube / Error Prone) catches several of these.",
    "Run an EXPLAIN on every query you ship — it takes seconds and surfaces missing indexes.",
    "In tests, count queries — a counter wrapper around the Connection / DataSource catches N+1 regressions.",
    "If a connection is held longer than a few hundred milliseconds, something's wrong. Set HikariCP leakDetectionThreshold."
  ],
  code: `// 1. BAD
String sql = "SELECT * FROM users WHERE email = '" + email + "'";

// 2. BAD — leak
ResultSet rs = ps.executeQuery();
return rs.getString(1);                        // never closes

// 3. BAD
class Service {
    private Connection c;                       // shared across threads — racy
}

// 4. BAD
ps.executeUpdate("UPDATE a SET ...");
ps.executeUpdate("UPDATE b SET ...");           // if first commits and second fails: partial state

// 6. BAD
double balance = rs.getDouble("balance");       // floating-point money

// GOOD
BigDecimal balance = rs.getBigDecimal("balance");

// 7. BAD — N+1
for (User u : users) {
    var orders = repo.ordersFor(u.id());        // one SELECT per user
}

// GOOD — one JOIN, group in Java`,
  complexity: "Each pitfall is preventable with one line of vigilance."
});


/* ----------------------- RENDERING ENGINE ----------------------- */
const DIFF_LABEL = { veasy: 'Foundations', easy: 'Easy', med: 'Medium', hard: 'Hard', brief: 'Brief' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightJava(src) {
  let s = escapeHtml(src);
  const stash = [];
  const stashIt = (html) => { stash.push(html); return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001'; };
  s = s.replace(/\/\/[^\n]*/g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => stashIt('<span class="cmt">' + m + '</span>'));
  // SQL-style comments inside HTML/template strings are NOT highlighted as comments here.
  s = s.replace(/&quot;([^&\n]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  s = s.replace(/&#39;.&#39;|&#39;\\.&#39;/g, m => stashIt('<span class="str">' + m + '</span>'));

  const types = ['String','Integer','Long','Boolean','Character','Double','Float','Object','BigDecimal','UUID',
    'List','Map','Set','HashMap','LinkedHashMap','ArrayList','Optional','Properties',
    'Connection','Statement','PreparedStatement','ResultSet','SQLException','SQLWarning','Savepoint','Types',
    'DriverManager','DataSource','HikariConfig','HikariDataSource','SQLiteConfig',
    'JdbcClient','JdbcTemplate','GeneratedKeyHolder','DataAccessException','DuplicateKeyException',
    'JpaRepository','UserEntity','UserRepository','UserRepo','User','Order','App','Schema','Service',
    'Instant','LocalDateTime','LocalDate','LocalTime','Duration','UUID','Throwable','RuntimeException',
    'Flyway','Liquibase','PrintWriter'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  const kws = ['void','int','long','boolean','char','double','float','byte','short',
    'public','private','protected','static','final','abstract','class','interface','enum','record',
    'return','if','else','for','while','do','break','continue','switch','case','default','yield',
    'new','null','true','false','this','super','try','catch','finally','throw','throws',
    'import','package','extends','implements','instanceof','var'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  s = s.replace(/\b(0x[0-9A-Fa-f_]+L?|\d+(?:_\d+)*L?)\b/g, '<span class="num">$1</span>');
  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

function getProblems(diff) {
  return PROBLEMS.filter(p => p.diff === diff).sort((a, b) => a.num - b.num);
}

const state = { diff: 'veasy', idx: 0 };

function renderTOC() {
  const toc = document.getElementById('toc');
  const groups = [
    { diff: 'veasy', label: 'Foundations' },
    { diff: 'easy',  label: 'Easy' },
    { diff: 'med',   label: 'Medium' },
    { diff: 'hard',  label: 'Hard' },
  ];
  const html = groups.map(g => {
    const items = getProblems(g.diff)
      .map((p, i) => `<a data-diff="${g.diff}" data-idx="${i}"><span class="num">${p.num === 0 ? '★' : '#' + p.num}</span>${escapeHtml(p.title)}</a>`)
      .join('');
    return `<div class="group-title">${g.label}</div>${items}`;
  }).join('');
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      state.diff = a.dataset.diff;
      state.idx = +a.dataset.idx;
      render();
      toggleSidebar(false);
    });
  });
}

function renderTabs() {
  document.getElementById('cnt-veasy').textContent = '(' + getProblems('veasy').length + ')';
  document.getElementById('cnt-easy').textContent  = '(' + getProblems('easy').length + ')';
  document.getElementById('cnt-med').textContent   = '(' + getProblems('med').length + ')';
  document.getElementById('cnt-hard').textContent  = '(' + getProblems('hard').length + ')';
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => { if (state.diff !== t.dataset.diff) { state.diff = t.dataset.diff; state.idx = 0; render(); } };
  });
}

function familyPillClass(family) {
  if (!family) return '';
  const f = family.toLowerCase();
  if (f.includes('setup'))        return 'conn';
  if (f.includes('schema'))       return 'crud';
  if (f.includes('crud'))         return 'crud';
  if (f.includes('query'))        return 'crud';
  if (f.includes('transaction')) return 'tx';
  if (f.includes('production'))   return 'prod';
  if (f.includes('error'))        return 'spr';
  if (f.includes('type'))         return 'crud';
  if (f.includes('architecture')) return 'pool';
  if (f.includes('spring'))       return 'spr';
  if (f.includes('orm'))          return 'orm';
  if (f.includes('recipe'))       return 'prod';
  if (f.includes('pitfall'))      return 'spr';
  return '';
}


function render() {
  const main = document.getElementById('main');
  if (state.diff === 'brief') {
    document.body.classList.add('brief-mode');
    main.innerHTML = renderBriefView();
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.diff === state.diff));
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  document.body.classList.remove('brief-mode');

  const problems = getProblems(state.diff);
  if (state.idx >= problems.length) state.idx = problems.length - 1;
  if (state.idx < 0) state.idx = 0;
  const p = problems[state.idx];
  const numTag = p.num === 0 ? '★ Foundation' : '#' + p.num;

  const cheatBlock = p.cheatsheetHtml ? `<div class="section-title">Cheatsheet</div>${p.cheatsheetHtml}` : '';
  const formulaBlock = p.formula ? `<div class="section-title">Format / Syntax</div><div class="formula">${escapeHtml(p.formula)}</div>` : '';
  const familyPill = p.family ? `<span class="pill ${familyPillClass(p.family)}">${escapeHtml(p.family)}</span>` : '';

  main.innerHTML = `
    <div class="problem-card">
      <h2>
        <span class="num-tag">${numTag}</span>
        ${escapeHtml(p.title)}
        <span class="badge ${p.diff}">${DIFF_LABEL[p.diff]}</span>
        ${familyPill}
      </h2>
      <div class="section-title">Why You Use It</div>
      <p>${escapeHtml(p.problem)}</p>
      <div class="section-title">Intuition</div>
      <div class="intuition">${escapeHtml(p.intuition)}</div>
      ${formulaBlock}
      ${cheatBlock}
      <div class="section-title">Methods &amp; Patterns</div>
      <ol class="hints">${p.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ol>
      <div class="section-title">Tips &amp; Tricks</div>
      <div class="tips-block"><ul class="tips">${p.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>
      <div class="section-title">Java / SQL Code</div>
      <pre class="code"><code>${highlightJava(p.code)}</code></pre>
      ${p.complexity ? `<div class="complexity"><b>Complexity / Cost:</b> ${escapeHtml(p.complexity)}</div>` : ''}
    </div>`;

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.diff === state.diff));
  document.getElementById('prev').disabled = state.idx === 0;
  document.getElementById('next').disabled = state.idx === problems.length - 1;
  document.getElementById('nav-info').textContent = `${DIFF_LABEL[state.diff]} · ${state.idx + 1} / ${problems.length}`;
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.toggle('active', a.dataset.diff === state.diff && +a.dataset.idx === state.idx));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextProblem() { const arr = getProblems(state.diff); if (state.idx < arr.length - 1) { state.idx++; render(); } }
function prevProblem() { if (state.idx > 0) { state.idx--; render(); } }
document.getElementById('prev').addEventListener('click', prevProblem);
document.getElementById('next').addEventListener('click', nextProblem);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') prevProblem();
  else if (e.key === 'ArrowRight') nextProblem();
  else if (e.key === 'Escape') toggleSidebar(false);
});

const hb = document.getElementById('hamburger');
const sb = document.getElementById('sidebar');
const ov = document.getElementById('overlay');
function toggleSidebar(open) {
  const isOpen = (typeof open === 'boolean') ? open : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  hb.classList.toggle('open', isOpen);
  ov.classList.toggle('show', isOpen);
}
hb.addEventListener('click', () => toggleSidebar());
ov.addEventListener('click', () => toggleSidebar(false));

const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️'; themeBtn.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙'; themeBtn.title = 'Switch to dark mode';
  }
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next); localStorage.setItem('theme', next);
});


function renderBriefView() {
  const families = [
    { title: 'Setup',         cmds: [['Driver JAR','org.xerial:sqlite-jdbc:3.46.x'],['JDBC URL','jdbc:sqlite:app.db'],['DriverManager','quick + tests'],['DataSource (Hikari)','default for real apps'],['Class.forName','NOT NEEDED in Java 6+']] },
    { title: 'Schema',        cmds: [['CREATE IF NOT EXISTS','idempotent bootstrap'],['INTEGER PRIMARY KEY','SQLite auto-increment'],['UNIQUE / NOT NULL','data hygiene'],['CREATE INDEX','speed reads'],['Migrations','Flyway / Liquibase']] },
    { title: 'CRUD',          cmds: [['PreparedStatement','always for parameters'],['? placeholders','set 1-indexed'],['executeUpdate','rows affected'],['executeQuery','ResultSet'],['getGeneratedKeys','newly inserted id'],['addBatch / executeBatch','bulk load']] },
    { title: 'Transactions',  cmds: [['setAutoCommit(false)','start txn'],['commit / rollback','always in finally'],['Savepoint','partial rollback'],['Isolation','READ_COMMITTED default'],['Short txns','no user think-time inside']] },
    { title: 'Production',    cmds: [['HikariCP','connection pool'],['WAL journal mode','readers + writer'],['fetchSize','stream big results'],['EXPLAIN QUERY PLAN','find missing indexes'],['leakDetectionThreshold','catch unclosed connections']] },
    { title: 'Higher-level',  cmds: [['JdbcClient (Spring 6.1+)','fluent API'],['JdbcTemplate','older Spring'],['JOOQ','type-safe SQL DSL'],['JPA / Hibernate','entity-level'],['MyBatis','SQL-mapper']] },
  ];

  const decisionFlow = `
<span class="q">Q1.</span> What's the right database?
   ├── <span class="a">desktop / CLI / tests / single-process</span> → <span class="alg">SQLite (jdbc:sqlite:app.db)</span>
   ├── <span class="a">multi-tenant web app</span>                   → <span class="alg">Postgres / MySQL</span>
   └── <span class="a">in-memory unit test</span>                    → <span class="alg">jdbc:sqlite::memory: or jdbc:h2:mem:test</span>

<span class="q">Q2.</span> How do I get a Connection?
   ├── <span class="a">script / test</span>     → <span class="alg">DriverManager.getConnection(url)</span>
   ├── <span class="a">real app</span>          → <span class="alg">HikariCP DataSource</span>
   └── <span class="a">Spring Boot</span>       → <span class="alg">spring.datasource.* — auto-wired</span>

<span class="q">Q3.</span> Inserting a value?
   ├── <span class="a">single insert</span>    → <span class="alg">PreparedStatement + setX + executeUpdate</span>
   ├── <span class="a">need the new id</span>  → <span class="alg">RETURN_GENERATED_KEYS + getGeneratedKeys</span>
   ├── <span class="a">many rows</span>        → <span class="alg">addBatch / executeBatch + commit once</span>
   └── <span class="a">may already exist</span>→ <span class="alg">ON CONFLICT(col) DO UPDATE / INSERT OR IGNORE</span>

<span class="q">Q4.</span> Reading rows?
   ├── <span class="a">one row</span>          → <span class="alg">ps + LIMIT 1, rs.next() once</span>
   ├── <span class="a">few rows</span>         → <span class="alg">ps + while(rs.next()) → List<Record></span>
   ├── <span class="a">many rows / streaming</span> → <span class="alg">setFetchSize + autoCommit=false (for Postgres)</span>
   └── <span class="a">parent + children</span>→ <span class="alg">JOIN once, group in Java by parent id</span>

<span class="q">Q5.</span> Multi-step write?
   ├── <span class="a">single statement</span> → <span class="alg">auto-commit ON is fine</span>
   └── <span class="a">two or more</span>      → <span class="alg">setAutoCommit(false) → ... → commit / rollback in finally</span>
`;

  const recipeCards = [
    { b: 'Open SQLite',          s: "DriverManager.getConnection(\"jdbc:sqlite:app.db\")" },
    { b: 'Pool with Hikari',     s: "HikariConfig + setJdbcUrl + setMaximumPoolSize" },
    { b: 'Parameterised query',  s: "ps.setX(idx, val); ps.executeQuery()" },
    { b: 'Get inserted id',      s: "prepareStatement(sql, RETURN_GENERATED_KEYS)" },
    { b: 'Bulk insert',          s: "addBatch + executeBatch + commit once" },
    { b: 'Manual transaction',   s: "setAutoCommit(false); commit / rollback" },
    { b: 'Upsert (SQLite/PG)',   s: "ON CONFLICT(col) DO UPDATE SET col = excluded.col" },
    { b: 'Avoid N+1',            s: "one JOIN + group in Java by parent id" },
    { b: 'Stream big result',    s: "ps.setFetchSize(1000)" },
    { b: 'WAL mode (SQLite)',    s: "PRAGMA journal_mode=WAL; synchronous=NORMAL" },
    { b: 'Migrations',           s: "Flyway: src/main/resources/db/migration/V1__init.sql" },
    { b: 'Spring JdbcClient',    s: "db.sql(...).param(...).query(T.class).optional()" },
  ];

  const families_html = families.map(f => `
    <div class="panel">
      <h3>${escapeHtml(f.title)}</h3>
      <div class="grid">
        ${f.cmds.map(c => `<div class="card-mini"><b>${escapeHtml(c[0])}</b><span>${escapeHtml(c[1])}</span></div>`).join('')}
      </div>
    </div>`).join('');

  const recipes_html = `
    <div class="panel">
      <h3>One-Liner Recipes</h3>
      <div class="grid">
        ${recipeCards.map(c => `<div class="card-mini"><b>${escapeHtml(c.b)}</b><span>${escapeHtml(c.s)}</span></div>`).join('')}
      </div>
    </div>`;

  return `
    <div class="brief-root">
      <header class="brief-header">
        <div class="brief-subtitle">J A V A &nbsp; + &nbsp; J D B C &nbsp; + &nbsp; S Q L I T E</div>
        <h1 class="brief-title">Driver · URL · Connection · Statement · ResultSet</h1>
        <p class="brief-tagline">Five types. One mental model. Every database.</p>
      </header>
      <div class="panel">
        <h3>The 5-Question Decision Flow</h3>
        <div class="flow">${decisionFlow}</div>
      </div>
      ${recipes_html}
      ${families_html}
    </div>`;
}

renderTabs();
bindTabs();
renderTOC();
render();
</script>
