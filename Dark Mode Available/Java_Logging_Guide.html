  [data-theme="dark"] .cheat-table tr:nth-child(even) td:not(:first-child) { background: rgba(255,255,255,.02); }

<script>
const PROBLEMS = [];


PROBLEMS.push({
  num: 0, title: "The Java Logging Mental Model (read this first)", diff: "veasy",
  family: "Foundations",
  problem: "Java logging splits cleanly into two layers. (1) The API your CODE talks to — almost always SLF4J. (2) The IMPLEMENTATION that decides WHERE messages go — Logback, Log4j2, or JUL. SLF4J is the facade; Logback / Log4j2 are the engines. Same code, different bindings, different config files.",
  intuition: "Code against SLF4J. Pick a backend (Logback by default, Log4j2 if you need its async logger or fancier patterns). Don't reach for System.out.println — it bypasses everything: no levels, no timestamps, no correlation IDs, no log rotation. The whole point of a logging framework is that you can change verbosity, formatting, destinations, retention WITHOUT touching application code.",
  hints: [
    "API: SLF4J (org.slf4j.Logger). The interface every modern library logs against.",
    "Implementations: Logback (default for Spring Boot), Log4j2 (high-perf async), java.util.logging (JUL — built-in, ugly).",
    "Levels (least → most severe): TRACE < DEBUG < INFO < WARN < ERROR.",
    "Loggers form a hierarchy by package: 'com.acme' is parent of 'com.acme.api' is parent of 'com.acme.api.UserService'.",
    "Appenders are sinks (Console, File, RollingFile, Syslog, Kafka, GELF, ...).",
    "Layouts / Encoders format messages (Pattern, JSON, Logstash-encoded JSON).",
    "MDC (Mapped Diagnostic Context) — per-thread key/value bag for correlation IDs.",
    "Don't println. Don't catch + log + rethrow. Don't log secrets."
  ],
  tips: [
    "Always declare loggers as `private static final Logger log = LoggerFactory.getLogger(MyClass.class)` — one per class.",
    "Use parameterised messages — `log.info(\"user {} logged in\", userId)` — so the toString isn't computed when the level is disabled.",
    "Don't log AND throw the same error — pick one or you get duplicate noise.",
    "Set INFO in prod, DEBUG only on the package you're debugging.",
    "ALWAYS log the exception object as the LAST argument: `log.error(\"failed to load {}\", id, ex)`. Don't string-concat ex.getMessage()."
  ],
  cheatsheetHtml: `
    <table class="cheat-table">
      <thead><tr><th>Layer</th><th>Standard choices</th></tr></thead>
      <tbody>
        <tr><td>API (Facade)</td><td>SLF4J — what your code calls. Bridges from JCL, JUL, Log4j 1.x → SLF4J also exist.</td></tr>
        <tr><td>Implementation</td><td>Logback (default) / Log4j2 (async powerhouse) / JUL (built-in, avoid for new code)</td></tr>
        <tr><td>Config file</td><td>logback.xml / logback-spring.xml / log4j2.xml / log4j2.yaml</td></tr>
        <tr><td>Levels</td><td>TRACE → DEBUG → INFO → WARN → ERROR (← most severe)</td></tr>
        <tr><td>Appenders</td><td>Console, File, RollingFile, Async, Socket, Syslog, Kafka, GELF, OpenTelemetry</td></tr>
        <tr><td>Encoders</td><td>PatternLayout (text), JsonEncoder / LogstashEncoder (structured)</td></tr>
        <tr><td>Correlation</td><td>MDC.put(\"requestId\", ...), tracing IDs from OpenTelemetry / Sleuth / Micrometer</td></tr>
      </tbody>
    </table>
    <p><b>Common Maven coordinates:</b></p>
    <ul class="hints">
      <li><code>org.slf4j:slf4j-api:2.x</code> — facade.</li>
      <li><code>ch.qos.logback:logback-classic:1.5.x</code> — Logback (brings slf4j-api transitively).</li>
      <li><code>org.apache.logging.log4j:log4j-slf4j2-impl:2.x</code> — Log4j2 binding for SLF4J.</li>
      <li><code>net.logstash.logback:logstash-logback-encoder:7.x</code> — JSON output for Logback.</li>
    </ul>
  `,
  code: `// The two lines on top of every class
import org.slf4j.Logger;
import org.slf4j.LoggerFactory;

public class UserService {
    private static final Logger log = LoggerFactory.getLogger(UserService.class);

    public User load(String id) {
        log.debug("loading user {}", id);                       // parameterised
        try {
            return repo.findById(id);
        } catch (RuntimeException ex) {
            log.error("failed to load user {}", id, ex);        // exception as LAST arg
            throw ex;
        }
    }
}`,
  complexity: "Disabled levels: O(1) check, no allocation. Enabled: format + I/O cost."
});


/* ===================== API (SLF4J) ===================== */

PROBLEMS.push({
  num: 1, title: "SLF4J — the facade everyone codes against", diff: "easy",
  family: "API",
  problem: "SLF4J (Simple Logging Facade for Java) is the de-facto API every modern Java library uses. Your code calls it; at runtime, exactly one implementation (Logback / Log4j2 / JUL bridge) provides the actual loggers.",
  intuition: "The point of a facade is to keep your code free of any one engine. Tomorrow you may swap Logback for Log4j2 — the application doesn't change. SLF4J also normalises the parameterised-message style: `log.info(\"x={}\", x)` works identically across all bindings.",
  hints: [
    "Put `slf4j-api` on the classpath as a normal dependency.",
    "Add EXACTLY ONE binding: logback-classic OR log4j-slf4j2-impl OR slf4j-jdk14.",
    "If multiple bindings are present, SLF4J prints a warning and picks one — that's a bug.",
    "Logger creation: `LoggerFactory.getLogger(MyClass.class)`.",
    "Levels (methods): trace, debug, info, warn, error.",
    "Each level has an isXxxEnabled() check — usually unnecessary because parameterised messages already avoid work."
  ],
  tips: [
    "Use `Logger log = LoggerFactory.getLogger(MyClass.class)` — class-based, so logger names match the package hierarchy.",
    "Don't pass a string name unless you have a reason (frameworks sometimes do for runtime-defined loggers).",
    "Bridges (jcl-over-slf4j, log4j-over-slf4j, jul-to-slf4j) let you ROUTE other frameworks' logs through your single backend — essential for unified logging.",
    "If you see weird 'No SLF4J providers were found' warnings, your binding is missing or shadowed."
  ],
  code: `// pom.xml
// <dependency>
//   <groupId>org.slf4j</groupId>
//   <artifactId>slf4j-api</artifactId>
//   <version>2.0.13</version>
// </dependency>

import org.springframework.web.filter.OncePerRequestFilter;
import org.slf4j.MDC;

public class AccessLogFilter extends OncePerRequestFilter {

    protected void doFilterInternal(HttpServletRequest req, HttpServletResponse res,

  num: 23, title: "Recipe: Propagate MDC across Threads / Executors", diff: "hard",
  family: "Recipes",
  problem: "MDC is thread-local. Hand a task off to a thread pool and the MDC is gone — the worker thread starts blank. Wrap your Executor / Runnable / Callable to copy the calling MDC into the worker.",
  intuition: "Wrap once, propagate everywhere. The classic technique: capture the caller's MDC map, then reset it in the worker before running, clear it after. Spring's TaskDecorator or a custom ExecutorService wrapper makes this clean.",
  hints: [
    "Map<String,String> copy = MDC.getCopyOfContextMap(); MDC.setContextMap(copy); MDC.clear();",
    "Spring: register a TaskDecorator on TaskExecutor → all submitted Runnables get wrapped.",
    "CompletableFuture: use a custom executor that wraps tasks; supplyAsync(() -> ..., wrappedExec).",
    "Reactor / WebFlux: MDC doesn't fit; use Context-aware logging via Hooks.onEachOperator or hooks.",
    "Always CLEAR MDC at the end of the worker task — pooled threads survive between tasks."
  ],
  tips: [
    "If you forget to clear, the next task on the same thread inherits stale fields. Hard to debug.",
    "OpenTelemetry's javaagent automatically maintains traceId / spanId in MDC across hops — enable it instead of rolling your own.",
    "Reactive frameworks need their own correlation strategy; don't try to bend MDC to fit them.",
    "If you see log lines with nullified MDC fields under load, check the executor wrapper."
  ],
  code: `import org.springframework.core.task.TaskDecorator;

public class MdcTaskDecorator implements TaskDecorator {
    @Override
    public Runnable decorate(Runnable runnable) {
        java.util.Map<String,String> copy = org.slf4j.MDC.getCopyOfContextMap();
        return () -> {
            try {
                if (copy != null) org.slf4j.MDC.setContextMap(copy);
                runnable.run();
            } finally {
                org.slf4j.MDC.clear();
            }
        };
    }
}

// Wire into Spring's ThreadPoolTaskExecutor
@org.springframework.context.annotation.Bean
public org.springframework.core.task.TaskExecutor taskExecutor(MdcTaskDecorator d) {
    var ex = new org.springframework.scheduling.concurrent.ThreadPoolTaskExecutor();
    ex.setCorePoolSize(8);
    ex.setMaxPoolSize(32);
    ex.setQueueCapacity(1024);
    ex.setTaskDecorator(d);
    ex.initialize();
    return ex;
}`,
  complexity: "One small allocation per submitted task."
});

log.error("failed for {}", id, ex);

// 5. BAD
log.info("login: user={} password={}", user, password);   // never

// 6. BAD: missing finally MDC.clear() in async runnable

// 7. BAD: classpath has both logback-classic AND log4j-slf4j-impl

// 8. BAD: <root level="DEBUG"> in production`,
  complexity: "Each is preventable with one line of vigilance."
});


/* ----------------------- RENDERING ENGINE ----------------------- */
const DIFF_LABEL = { veasy: 'Foundations', easy: 'Easy', med: 'Medium', hard: 'Hard', brief: 'Brief' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightJava(src) {
  let s = escapeHtml(src);
  const stash = [];
  const stashIt = (html) => { stash.push(html); return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001'; };
  s = s.replace(/\/\/[^\n]*/g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/&quot;([^&\n]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  s = s.replace(/&#39;.&#39;|&#39;\\.&#39;/g, m => stashIt('<span class="str">' + m + '</span>'));

  const types = ['String','Integer','Long','Boolean','Character','Double','Float','Object',
    'List','Map','Set','HashMap','ArrayList',
    'Logger','LoggerFactory','MDC','Marker','MarkerFactory','Level','LoggerContext','ListAppender','ILoggingEvent',
    'Filter','FilterChain','OncePerRequestFilter','HttpServletRequest','HttpServletResponse','ServletRequest','ServletResponse','ServletException',
    'TaskExecutor','TaskDecorator','ThreadPoolTaskExecutor','Runnable','Callable','ExecutorService','CompletableFuture',
    'Optional','Stream','Collectors',
    'SLF4JBridgeHandler','PatternLayoutEncoder',
    'User','UserService','OrderService','Order','Ex','RuntimeException','DataAccessException','ServiceException','UncheckedIOException','IOException',
    'NullPointerException','NoSuchElementException','TimeUnit'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  const kws = ['void','int','long','boolean','char','double','float','byte','short',
    'public','private','protected','static','final','abstract','class','interface','enum','record',
    'return','if','else','for','while','do','break','continue','switch','case','default','yield',
    'new','null','true','false','this','super','try','catch','finally','throw','throws',
    'import','package','extends','implements','instanceof','var'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  s = s.replace(/\b(0x[0-9A-Fa-f_]+L?|\d+(?:_\d+)*L?)\b/g, '<span class="num">$1</span>');
  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

function getProblems(diff) {
  return PROBLEMS.filter(p => p.diff === diff).sort((a, b) => a.num - b.num);
}

const state = { diff: 'veasy', idx: 0 };

function renderTOC() {
  const toc = document.getElementById('toc');
  const groups = [
    { diff: 'veasy', label: 'Foundations' },
    { diff: 'easy',  label: 'Easy' },
    { diff: 'med',   label: 'Medium' },
    { diff: 'hard',  label: 'Hard' },
  ];
  const html = groups.map(g => {
    const items = getProblems(g.diff)
      .map((p, i) => `<a data-diff="${g.diff}" data-idx="${i}"><span class="num">${p.num === 0 ? '★' : '#' + p.num}</span>${escapeHtml(p.title)}</a>`)
      .join('');
    return `<div class="group-title">${g.label}</div>${items}`;
  }).join('');
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      state.diff = a.dataset.diff;
      state.idx = +a.dataset.idx;
      render();
      toggleSidebar(false);
    });
  });
}

function renderTabs() {
  document.getElementById('cnt-veasy').textContent = '(' + getProblems('veasy').length + ')';
  document.getElementById('cnt-easy').textContent  = '(' + getProblems('easy').length + ')';
  document.getElementById('cnt-med').textContent   = '(' + getProblems('med').length + ')';
  document.getElementById('cnt-hard').textContent  = '(' + getProblems('hard').length + ')';
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      if (state.diff !== t.dataset.diff) { state.diff = t.dataset.diff; state.idx = 0; render(); }
    };
  });
}

function familyPillClass(family) {
  if (!family) return '';
  const f = family.toLowerCase();
  if (f.includes('api'))            return 'api';
  if (f.includes('implementation')) return 'impl';
  if (f.includes('config'))         return 'cfg';
  if (f.includes('level'))          return 'lvl';
  if (f.includes('append'))         return 'app';
  if (f.includes('format'))         return 'fmt';
  if (f.includes('production'))     return 'prod';
  if (f.includes('test'))           return 'cfg';
  if (f.includes('recipe'))         return 'prod';
  if (f.includes('pitfall'))        return 'app';
  return '';
}


function render() {
  const main = document.getElementById('main');
  if (state.diff === 'brief') {
    document.body.classList.add('brief-mode');
    main.innerHTML = renderBriefView();
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.diff === state.diff));
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  document.body.classList.remove('brief-mode');

  const problems = getProblems(state.diff);
  if (state.idx >= problems.length) state.idx = problems.length - 1;
  if (state.idx < 0) state.idx = 0;
  const p = problems[state.idx];
  const numTag = p.num === 0 ? '★ Foundation' : '#' + p.num;

  const cheatBlock = p.cheatsheetHtml ? `<div class="section-title">Cheatsheet</div>${p.cheatsheetHtml}` : '';
  const formulaBlock = p.formula ? `<div class="section-title">Format / Syntax</div><div class="formula">${escapeHtml(p.formula)}</div>` : '';
  const familyPill = p.family ? `<span class="pill ${familyPillClass(p.family)}">${escapeHtml(p.family)}</span>` : '';

  main.innerHTML = `
    <div class="problem-card">
      <h2>
        <span class="num-tag">${numTag}</span>
        ${escapeHtml(p.title)}
        <span class="badge ${p.diff}">${DIFF_LABEL[p.diff]}</span>
        ${familyPill}
      </h2>
      <div class="section-title">Why You Use It</div>
      <p>${escapeHtml(p.problem)}</p>
      <div class="section-title">Intuition</div>
      <div class="intuition">${escapeHtml(p.intuition)}</div>
      ${formulaBlock}
      ${cheatBlock}
      <div class="section-title">Methods &amp; Patterns</div>
      <ol class="hints">${p.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ol>
      <div class="section-title">Tips &amp; Tricks</div>
      <div class="tips-block"><ul class="tips">${p.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>
      <div class="section-title">Java Code / Config</div>
      <pre class="code"><code>${highlightJava(p.code)}</code></pre>
      ${p.complexity ? `<div class="complexity"><b>Complexity / Cost:</b> ${escapeHtml(p.complexity)}</div>` : ''}
    </div>`;

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.diff === state.diff));
  document.getElementById('prev').disabled = state.idx === 0;
  document.getElementById('next').disabled = state.idx === problems.length - 1;
  document.getElementById('nav-info').textContent = `${DIFF_LABEL[state.diff]} · ${state.idx + 1} / ${problems.length}`;
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.toggle('active', a.dataset.diff === state.diff && +a.dataset.idx === state.idx));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextProblem() {
  const arr = getProblems(state.diff);
  if (state.idx < arr.length - 1) { state.idx++; render(); }
}
function prevProblem() {
  if (state.idx > 0) { state.idx--; render(); }
}
document.getElementById('prev').addEventListener('click', prevProblem);
document.getElementById('next').addEventListener('click', nextProblem);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') prevProblem();
  else if (e.key === 'ArrowRight') nextProblem();
  else if (e.key === 'Escape') toggleSidebar(false);
});

const hb = document.getElementById('hamburger');
const sb = document.getElementById('sidebar');
const ov = document.getElementById('overlay');
function toggleSidebar(open) {
  const isOpen = (typeof open === 'boolean') ? open : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  hb.classList.toggle('open', isOpen);
  ov.classList.toggle('show', isOpen);
}
hb.addEventListener('click', () => toggleSidebar());
ov.addEventListener('click', () => toggleSidebar(false));

const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️'; themeBtn.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙'; themeBtn.title = 'Switch to dark mode';
  }
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next); localStorage.setItem('theme', next);
});


function renderBriefView() {
  const families = [
    { title: 'API',           cmds: [['SLF4J','the facade — code calls this'],['Logger.getLogger(Class)','one logger per class'],['{} placeholders','parameterised, lazy'],['log.error(\"...\", ex)','exception as LAST arg'],['JUL bridge','route JDK logs through SLF4J']] },
    { title: 'Implementations',cmds: [['Logback','default for Spring Boot'],['Log4j2','async powerhouse, disruptor'],['JUL','built-in, avoid for apps']] },
    { title: 'Levels',        cmds: [['TRACE','step-through detail'],['DEBUG','dev investigations'],['INFO','prod lifecycle (default)'],['WARN','recovered problems'],['ERROR','request failed → alert']] },
    { title: 'Appenders',     cmds: [['ConsoleAppender','stdout — container default'],['RollingFileAppender','size+time rotation'],['AsyncAppender','wrap I/O off hot path'],['SyslogAppender','UDP/TCP to syslog'],['JSON / Logstash','centralised log shipping']] },
    { title: 'Format',        cmds: [['PatternLayout','%d %level %logger %msg %n'],['LogstashEncoder','one JSON line per event'],['MDC','per-thread correlation IDs'],['Markers','tag events for routing']] },
    { title: 'Production',    cmds: [['INFO root + per-pkg DEBUG','sane prod default'],['Async + bounded queue','no blocking I/O'],['JSON to stdout','let platform ship logs'],['Mask secrets at encoder','never log tokens / PII'],['Rotation: 100MB · 14d · 5GB','disk hygiene']] },
  ];

  const decisionFlow = `
<span class="q">Q1.</span> What level should this be?
   ├── <span class="a">step-through detail</span>     → <span class="alg">TRACE</span>
   ├── <span class="a">developer-useful state</span>  → <span class="alg">DEBUG</span>
   ├── <span class="a">app-lifecycle event</span>     → <span class="alg">INFO</span>
   ├── <span class="a">recovered problem</span>       → <span class="alg">WARN</span>
   └── <span class="a">request failed</span>          → <span class="alg">ERROR (+ exception last)</span>

<span class="q">Q2.</span> Where do logs go?
   ├── <span class="a">local dev</span>         → <span class="alg">ConsoleAppender (pretty pattern)</span>
   ├── <span class="a">container in k8s/ECS</span> → <span class="alg">ConsoleAppender (JSON encoder) — platform ships stdout</span>
   ├── <span class="a">VM with disk</span>      → <span class="alg">RollingFileAppender + AsyncAppender</span>
   └── <span class="a">syslog server</span>     → <span class="alg">SyslogAppender</span>

<span class="q">Q3.</span> How do I correlate logs to requests?
   ├── <span class="a">single-service</span>   → <span class="alg">MDC.put(\"requestId\", id) at boundary</span>
   ├── <span class="a">distributed</span>      → <span class="alg">OpenTelemetry → traceId/spanId in MDC</span>
   └── <span class="a">async / executor</span> → <span class="alg">TaskDecorator copies MDC into worker</span>

<span class="q">Q4.</span> Logs are too slow / too verbose?
   ├── <span class="a">CPU on formatting</span>  → <span class="alg">parameterised messages, drop %F %M %L</span>
   ├── <span class="a">I/O blocking app</span>   → <span class="alg">AsyncAppender / Log4j2 AsyncLogger</span>
   ├── <span class="a">repeated lines</span>     → <span class="alg">DuplicateMessageFilter</span>
   └── <span class="a">noisy library</span>      → <span class="alg">per-package level WARN/ERROR</span>

<span class="q">Q5.</span> Tests need to assert log output?
   ├── <span class="a">single class</span>      → <span class="alg">Logback ListAppender</span>
   ├── <span class="a">Spring Boot</span>       → <span class="alg">@OutputCaptureExtension + CapturedOutput</span>
   └── <span class="a">stand-alone unit</span>  → <span class="alg">slf4j-test library</span>
`;

  const recipeCards = [
    { b: 'Class-level logger',     s: "Logger log = LoggerFactory.getLogger(Cls.class)" },
    { b: 'Parameterised + ex',     s: "log.error(\"failed for {}\", id, ex)" },
    { b: 'MDC scope',              s: "try (var c = MDC.putCloseable(\"k\", v)) { ... }" },
    { b: 'Exclude noisy lib',      s: "<logger name=\"org.x\" level=\"WARN\"/>" },
    { b: 'JSON to stdout',         s: "ConsoleAppender + LogstashEncoder" },
    { b: 'Rolling file',           s: "SizeAndTimeBasedRollingPolicy 100MB · 14d" },
    { b: 'Async wrap',             s: "<AsyncAppender><appender-ref ref=FILE/>" },
    { b: 'Audit marker',           s: "log.info(MarkerFactory.getMarker(\"AUDIT\"), \"...\")" },
    { b: 'Test capture',           s: "ListAppender + assertThat(.list)" },
    { b: 'Dynamic level (Boot)',   s: "POST /actuator/loggers/com.acme {configuredLevel:DEBUG}" },
    { b: 'Per-request log',        s: "OncePerRequestFilter + MDC + log INFO at end" },
    { b: 'Mask secrets',           s: "Custom encoder regex on password|token|secret" },
  ];

  const families_html = families.map(f => `
    <div class="panel">
      <h3>${escapeHtml(f.title)}</h3>
      <div class="grid">
        ${f.cmds.map(c => `<div class="card-mini"><b>${escapeHtml(c[0])}</b><span>${escapeHtml(c[1])}</span></div>`).join('')}
      </div>
    </div>`).join('');

  const recipes_html = `
    <div class="panel">
      <h3>One-Liner Recipes</h3>
      <div class="grid">
        ${recipeCards.map(c => `<div class="card-mini"><b>${escapeHtml(c.b)}</b><span>${escapeHtml(c.s)}</span></div>`).join('')}
      </div>
    </div>`;

  return `
    <div class="brief-root">
      <header class="brief-header">
        <div class="brief-subtitle">J A V A &nbsp; L O G G I N G</div>
        <h1 class="brief-title">SLF4J · Backend · Pattern · Pipeline</h1>
        <p class="brief-tagline">Code against the facade. Configure once. Ship structured.</p>
      </header>
      <div class="panel">
        <h3>The 5-Question Decision Flow</h3>
        <div class="flow">${decisionFlow}</div>
      </div>
      ${recipes_html}
      ${families_html}
    </div>`;
}

renderTabs();
bindTabs();
renderTOC();
render();
</script>
