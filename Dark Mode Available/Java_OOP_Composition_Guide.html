<script>
const PROBLEMS = [];


PROBLEMS.push({
  num: 0, title: "OOP Mental Model — class, object, state, behaviour", diff: "veasy",
  family: "Foundations",
  problem: "Object-oriented programming organises code around OBJECTS — bundles of state (fields) and behaviour (methods) that interact with each other. A CLASS is the blueprint; an OBJECT is an instance.",
  intuition: "Procedural code: you have data, then functions that act on it. OOP: each piece of data IS the object that knows how to act on itself. Bank.deposit(account, x) becomes account.deposit(x). Code lives close to data; mutation is encapsulated; behaviour is composable.",
  hints: [
    "CLASS — blueprint defining fields + methods.",
    "OBJECT — instance created with `new`. Lives on the heap.",
    "STATE — values held by an object's fields.",
    "BEHAVIOUR — what an object does (its methods).",
    "IDENTITY — every object has a unique reference, even if equal in value.",
    "Java's 4 OOP pillars: ENCAPSULATION, INHERITANCE, POLYMORPHISM, ABSTRACTION."
  ],
  tips: [
    "Don't conflate 'class' and 'object'. The class is the recipe; the object is the meal.",
    "Java is class-based and reference-typed. Variables hold REFERENCES to heap objects, never the objects themselves (except primitives).",
    "OOP isn't always the right tool. For data-only structs, records are cleaner. For pure transformations, functions/streams.",
    "Modern Java (records, sealed classes, switch patterns) makes OOP lighter without losing the model."
  ],
  cheatsheetHtml: `
    <table class="cheat-table">
      <thead><tr><th>Concept</th><th>One-liner</th><th>Java keyword(s)</th></tr></thead>
      <tbody>
        <tr><td>Encapsulation</td><td>hide state behind methods</td><td>private, public, protected</td></tr>
        <tr><td>Inheritance</td><td>child IS-A parent</td><td>extends</td></tr>
        <tr><td>Polymorphism</td><td>one type, many forms</td><td>override, interface</td></tr>
        <tr><td>Abstraction</td><td>focus on what, not how</td><td>abstract, interface</td></tr>
        <tr><td>Composition</td><td>object HAS-A object</td><td>(field of another type)</td></tr>
        <tr><td>Aggregation</td><td>HAS-A but loosely owned</td><td>(field, often shared)</td></tr>
      </tbody>
    </table>
  `,
  code: `// Smallest meaningful class
public class Counter {
    private int value;                       // state
    public Counter() { this.value = 0; }     // constructor
    public void increment() { value++; }     // behaviour
    public int get() { return value; }       // accessor
}

// Using it
Counter c = new Counter();      // class is the blueprint; c is an object
c.increment();
c.increment();
System.out.println(c.get());    // 2

// Identity vs equality
Counter a = new Counter();
Counter b = new Counter();
System.out.println(a == b);          // false (different objects)
System.out.println(a.get() == b.get());  // true (both 0)`,
  complexity: "—"
});

PROBLEMS.push({
  num: 1, title: "Encapsulation — private fields, public methods", diff: "veasy",
  family: "Foundations",
  problem: "Encapsulation hides an object's INTERNAL state behind a controlled API. Fields are private; access goes through methods. Callers depend on the contract, not the layout.",
  intuition: "Public fields couple every caller to your storage choice. Make them private and you can change `int balance` to `BigDecimal` later without breaking anyone. Encapsulation = freedom to refactor.",
  hints: [
    "Default to `private` for fields. Open them via getters / setters only when needed.",
    "Better than getters: methods that express intent — `transfer(x)` instead of `setBalance(getBalance() - x)`.",
    "Validate inside setters / mutators: throw on bad input rather than silently accepting.",
    "Immutable objects don't need setters at all — fields are private + final, set once in the constructor.",
    "Records (Java 14+) are concise immutable data carriers with auto-generated accessors."
  ],
  tips: [
    "Avoid 'anaemic' classes that are just bag-of-getters. Behaviour belongs IN the class, not in a service that pokes its data.",
    "If a setter feels weird (negative balance, future timestamp), it probably IS weird. Validate.",
    "Don't return mutable internals (`return this.list`) — return defensive copies or unmodifiable views.",
    "Lombok's `@Getter` / `@Setter` reduce boilerplate; records eliminate it for value types."
  ],
  code: `// BAD — fields exposed; any caller can corrupt the state
class BankAccountBad {
    public double balance;
}
BankAccountBad a = new BankAccountBad();
a.balance = -1_000_000;  // nothing stops this nonsense

// GOOD — encapsulation
public class BankAccount {
    private double balance;

    public void deposit(double amount) {
        if (amount <= 0) throw new IllegalArgumentException("amount must be > 0");
        balance += amount;
    }
    public void withdraw(double amount) {
        if (amount <= 0) throw new IllegalArgumentException();
        if (amount > balance) throw new IllegalStateException("insufficient funds");
        balance -= amount;
    }
    public double getBalance() { return balance; }
}

// Defensive copy when returning collections
public class Roster {
    private final List<String> members = new ArrayList<>();
    public List<String> getMembers() { return List.copyOf(members); }   // immutable view
}`,
  complexity: "—"
});

PROBLEMS.push({
  num: 2, title: "The Four Pillars — Encapsulation, Inheritance, Polymorphism, Abstraction", diff: "veasy",
  family: "Foundations",
  problem: "Every OOP textbook lists the same four pillars. Knowing them is table-stakes; knowing WHEN each helps and when each hurts is the actual skill.",
  intuition: "Encapsulation hides state. Abstraction hides implementation. Inheritance reuses behaviour through IS-A. Polymorphism uses one interface for many types. The first two are nearly always good. The last two need a 'why' — used badly, they make code worse, not better.",
  hints: [
    "ENCAPSULATION: data + behaviour in one place; visibility modifiers enforce the boundary.",
    "ABSTRACTION: callers see WHAT it does, not HOW. Interface and abstract class are Java's tools.",
    "INHERITANCE: `class Dog extends Animal` — Dog IS-A Animal. Use SPARINGLY; favour composition first.",
    "POLYMORPHISM: same call site, different runtime behaviour. Achieved via overriding (subtype) or interface (ad-hoc).",
    "Polymorphism + abstraction = Strategy / Template / Bridge — most design patterns."
  ],
  tips: [
    "Default mental model: 'compose objects, code to interfaces, inherit only when there's a real IS-A'.",
    "Inheritance is a TIGHT coupling — every superclass change ripples to subclasses. Composition is loose.",
    "Polymorphism via interfaces is great. Polymorphism via deep inheritance trees is a maintenance trap.",
    "Abstraction without consumers (interfaces with one implementor) is over-engineering."

import java.util.*;

class CountingSetBad<E> extends HashSet<E> {
    private int adds = 0;
    @Override public boolean add(E e) { adds++; return super.add(e); }
    @Override public boolean addAll(Collection<? extends E> c) {
        adds += c.size();                         // problem: addAll calls add() internally
        return super.addAll(c);                    // → each element is counted TWICE
    }
    public int adds() { return adds; }
}
CountingSetBad<Integer> bad = new CountingSetBad<>();
bad.addAll(List.of(1, 2, 3));

class CountingSetGood<E> {
    private final Set<E> delegate;
    private int adds = 0;
    public CountingSetGood(Set<E> delegate) { this.delegate = delegate; }
    public boolean add(E e) { adds++; return delegate.add(e); }
    public boolean addAll(Collection<? extends E> c) {
        boolean changed = false;
        for (E e : c) changed |= add(e);          // counted exactly once
        return changed;
    }
    public int adds() { return adds; }
    public int size() { return delegate.size(); }

class EventBus {
    private final Map<Class<?>, List<Consumer<Object>>> subs = new HashMap<>();

record HttpResponse(int status, String body) {}

interface Interceptor {
    HttpResponse intercept(HttpRequest req, Chain chain);
    interface Chain { HttpResponse proceed(HttpRequest req); }
}

class AuthInterceptor implements Interceptor {
    private final String token;
    public AuthInterceptor(String t) { this.token = t; }
    public HttpResponse intercept(HttpRequest req, Chain chain) {
        Map<String, String> h = new HashMap<>(req.headers());
        h.put("Authorization", "Bearer " + token);
        return chain.proceed(new HttpRequest(req.url(), h, req.body()));
    }

class LoggingInterceptor implements Interceptor {
    public HttpResponse intercept(HttpRequest req, Chain chain) {
        System.out.println("→ " + req.url());
        long t0 = System.nanoTime();
        HttpResponse res = chain.proceed(req);
        long ms = (System.nanoTime() - t0) / 1_000_000;
        System.out.println("← " + res.status() + " in " + ms + "ms");
        return res;
    }
}

class RetryInterceptor implements Interceptor {
    private final int max;
    public RetryInterceptor(int max) { this.max = max; }
    public HttpResponse intercept(HttpRequest req, Chain chain) {
        for (int i = 0; i < max - 1; i++) {
            HttpResponse r = chain.proceed(req);
            if (r.status() < 500) return r;
        }
        return chain.proceed(req);
    }
}

class HttpClient {
    private final List<Interceptor> interceptors;
    public HttpClient(List<Interceptor> i) { this.interceptors = i; }

    public HttpResponse send(HttpRequest req) {
        return new RealChain(interceptors, 0).proceed(req);
    }

    private record RealChain(List<Interceptor> interceptors, int idx) implements Interceptor.Chain {
        public HttpResponse proceed(HttpRequest req) {
            if (idx < interceptors.size())
                return interceptors.get(idx).intercept(req, new RealChain(interceptors, idx + 1));
            // terminal — actual network call
            return new HttpResponse(200, "OK");
        }
    }

  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next); localStorage.setItem('theme', next);
});


function renderBriefView() {
  const families = [
    { title: 'Foundations',         cmds: [['Class & Object','blueprint vs instance'],['4 Pillars','encap · inh · poly · abst'],['Encapsulation','private fields, methods'],['equals + hashCode','contract']] },
    { title: 'Class Basics',        cmds: [['Constructor','validate, leave object valid'],['this / super','disambiguate, chain'],['static','class-level'],['Access modifiers','private → public']] },
    { title: 'Inheritance',         cmds: [['extends','IS-A relationship'],['Override','same sig, different impl'],['Abstract class','state + abstract methods'],['Interface','pure contract'],['Polymorphism','one type, many forms'],['Liskov','subtypes substitutable']] },
    { title: 'Composition',         cmds: [['HAS-A','outer holds inner'],['Why beats inheritance','5 reasons'],['Aggregation','HAS-A but loosely owned'],['Delegation','forward selectively'],['DI','accept deps via constructor']] },
    { title: 'Advanced',            cmds: [['Generics','parametric types'],['Inner classes','static, inner, local, anonymous'],['Records','immutable data carriers'],['Sealed types','closed family of variants'],['Enums as classes','full OOP power'],['Variance','? extends, ? super'],['Mixins','interface default methods'],['Thread-safe','immutable / Concurrent / Atomic']] },
    { title: 'SOLID & Patterns',    cmds: [['SRP','one reason to change'],['OCP','extend without modifying'],['LSP','subtypes substitutable'],['ISP','small interfaces'],['DIP','depend on abstractions'],['Strategy','swappable algorithms'],['Observer','pub/sub'],['Decorator','stack behaviour'],['Builder','complex construction'],['Singleton','use enum'],['State','lifecycle phases'],['Adapter','interface conversion'],['Composite','tree of uniform parts'],['Facade','front door over subsystem']] },
    { title: 'Anti-patterns',       cmds: [['Anaemic domain','data with no behaviour'],['God class','too many responsibilities'],['Train wreck','a.b().c().d()'],['Primitive obsession','String for everything'],['Deep inheritance','>3 levels = smell']] },
    { title: 'Composition Examples',cmds: [['Order + Address','#16'],['Email Builder','#17'],['Payment Processor','#18'],['Beverage Decorators','#19'],['Game Character','#20'],['Servlet Filters','#40'],['Event Bus','#41'],['HTTP Interceptors','#42'],['Document Editor','#43'],['Plugin Registry','#44']] },
  ];

  const decisionFlow = `
<span class="q">Q1.</span> Modelling a relationship between classes
   ├── <span class="a">"X is a Y"</span>          → <span class="alg">Inheritance (carefully)</span>
   ├── <span class="a">"X has a Y"</span>         → <span class="alg">Composition</span>
   └── <span class="a">"X can do Y"</span>        → <span class="alg">Interface</span>

<span class="q">Q2.</span> Need shared behaviour?
   ├── <span class="a">+ shared STATE</span>      → <span class="alg">Abstract class</span>
   ├── <span class="a">+ default impl only</span> → <span class="alg">Interface with default methods</span>
   └── <span class="a">+ swap at runtime</span>   → <span class="alg">Composition + Strategy</span>

<span class="q">Q3.</span> Constructing complex objects?
   ├── <span class="a">few args</span>            → <span class="alg">Constructor</span>
   ├── <span class="a">many optional args</span>  → <span class="alg">Builder</span>
   ├── <span class="a">picking from variants</span>→ <span class="alg">Factory</span>
   └── <span class="a">immutable data</span>      → <span class="alg">Record</span>

<span class="q">Q4.</span> Need polymorphism?
   ├── <span class="a">many concrete types</span> → <span class="alg">Strategy / Polymorphic interface</span>
   ├── <span class="a">closed family</span>       → <span class="alg">Sealed interface + records</span>
   └── <span class="a">enum-bound options</span>  → <span class="alg">Enum with abstract methods</span>

<span class="q">Q5.</span> Cross-cutting concerns?
   ├── <span class="a">add behaviour</span>       → <span class="alg">Decorator (composition)</span>
   ├── <span class="a">notify others</span>       → <span class="alg">Observer / EventBus</span>
   ├── <span class="a">wrap legacy API</span>     → <span class="alg">Adapter</span>
   ├── <span class="a">simplify subsystem</span>  → <span class="alg">Facade</span>
   └── <span class="a">filter / interceptor</span>→ <span class="alg">Chain of Responsibility</span>
`;

  const recipeCards = [
    { b: 'Encapsulation',         s: "private fields + public methods" },
    { b: 'Composition over inh',  s: "HAS-A is more flexible than IS-A" },
    { b: 'Open/Closed',           s: "interface + new class per variant" },
    { b: 'Liskov test',           s: "subtype must work where parent expected" },
    { b: 'Builder',               s: "fluent setters + build() validate" },
    { b: 'Strategy',              s: "interface + impls + DI" },
    { b: 'Observer',              s: "subject + List<Observer>" },
    { b: 'Decorator',             s: "wrapper IS-A and HAS-A target" },
    { b: 'State',                 s: "delegate to current state object" },
    { b: 'Singleton',             s: "enum SINGLE { INSTANCE; }" },
    { b: 'Immutable',             s: "final class + final fields + copies" },
    { b: 'equals + hashCode',     s: "Objects.equals + Objects.hash" },
    { b: 'Record for value',      s: "record Money(BigDecimal amt, String c) {}" },
    { b: 'Sealed family',         s: "sealed interface + records permits" },
    { b: 'PECS',                  s: "Producer Extends, Consumer Super" },
    { b: 'DI',                    s: "constructor takes interfaces" },
  ];

  const families_html = families.map(f => `
    <div class="panel">
      <h3>${escapeHtml(f.title)}</h3>
      <div class="grid">
        ${f.cmds.map(c => `<div class="card-mini"><b>${escapeHtml(c[0])}</b><span>${escapeHtml(c[1])}</span></div>`).join('')}
      </div>
    </div>`).join('');

  const recipes_html = `
    <div class="panel">
      <h3>One-Liner Recipes</h3>
      <div class="grid">
        ${recipeCards.map(c => `<div class="card-mini"><b>${escapeHtml(c.b)}</b><span>${escapeHtml(c.s)}</span></div>`).join('')}
      </div>
    </div>`;

  return `
    <div class="brief-root">
      <header class="brief-header">
        <div class="brief-subtitle">J A V A &nbsp; O O P &nbsp; + &nbsp; C O M P O S I T I O N</div>
        <h1 class="brief-title">Compose · Don't Extend · Code to Interfaces</h1>
        <p class="brief-tagline">50 cards · Basics → Advanced · Heavy on real-world Composition examples</p>
      </header>
      <div class="panel">
        <h3>The 5-Question Decision Flow</h3>
        <div class="flow">${decisionFlow}</div>
      </div>
      ${recipes_html}
      ${families_html}
    </div>`;
}

renderTabs();
bindTabs();
renderTOC();
render();
</script>
