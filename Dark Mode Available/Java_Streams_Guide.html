<style>

    --card: #ffffff;
    --code-bg: #f8fafc;
    --code-fg: #24292f;
    --kw:  #cf222e;
    --typ: #6f42c1;
    --bi:  #b91c1c;
    --str: #0a7d4d;
    --cmt: #6a737d;
    --num: #0550ae;
    --veasy: #0891b2;
    --easy:  #16a34a;
    --med:   #d97706;
    --hard:  #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
  }
  .hamburger {
    position: fixed; top: 14px; left: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 5px; cursor: pointer; z-index: 1001;
  }
  .hamburger span {
    display: block; width: 22px; height: 2.5px;
    background: #1e1e25; border-radius: 2px;
    transition: transform .25s, opacity .2s;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
  .sidebar {
    position: fixed; top: 0; left: 0;
    height: 100vh; width: 360px; max-width: 90vw;
    background: #ffffff;
    border-right: 1px solid var(--border);
    box-shadow: 2px 0 14px rgba(0,0,0,.06);

  .sidebar .group-title {

    border-bottom: 1px dashed var(--border);

  .theme-toggle:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }

    --kw: #ff7b72; --typ: #d2a8ff; --bi: #ffa657; --str: #a5d6ff; --cmt: #8b949e; --num: #79c0ff;

<script>
const PROBLEMS = [];


PROBLEMS.push({
  num: 0, title: "The Java Streams Mental Model (read this first)", diff: "veasy",
  family: "Foundations",
  problem: "A Stream<T> is a lazy, single-use pipeline of values. You build it as: SOURCE → INTERMEDIATE operations (filter, map, sorted, distinct, ...) → ONE TERMINAL operation (collect, reduce, forEach, count, toList, anyMatch, ...). Nothing actually runs until the terminal call — the intermediate ops just describe the work.",
  intuition: "Streams are NOT a faster for-loop. They're a different way to EXPRESS the work — a description of WHAT instead of HOW. The win is readability: 'filter, group by department, sum the salaries' becomes one short pipeline instead of three nested loops with a HashMap. The cost is allocation overhead and a slight runtime tax. Use streams when the chain reads better than the loop; reach for a tight loop in hot inner paths.",
  hints: [
    "Three pieces of the pipeline: SOURCE (collection / array / generator) → ZERO+ INTERMEDIATE OPS (lazy, return Stream) → ONE TERMINAL OP (eager, returns a result or void).",
    "Lazy means nothing runs until the terminal. .map() with a side effect that's never reached on a short-circuiting terminal will simply not execute.",
    "Streams are SINGLE-USE. Reusing a consumed Stream throws IllegalStateException.",
    "Stream != Collection. A stream has no storage of its own; it pulls from a source on demand.",
    "Primitive specialisations exist: IntStream, LongStream, DoubleStream — avoid boxing on hot paths.",
    "parallelStream() splits across the common ForkJoinPool. Don't use it by default; profile first."
  ],
  tips: [
    "Default to .stream(), and only switch to .parallelStream() when (a) the data is large, (b) the per-element work is CPU-heavy, and (c) you've measured a win.",
    "Don't mutate shared state inside a stream — that's a classic correctness bug.",
    "Don't reach for streams when a 5-line for loop is clearer. They're a tool, not a religion.",
    "Always know your terminal — without one, the pipeline does nothing."
  ],
  cheatsheetHtml: `
    <table class="cheat-table">
      <thead><tr><th>Stage</th><th>Examples</th></tr></thead>
      <tbody>
        <tr><td>Sources</td><td>Collection.stream(), Arrays.stream(arr), Stream.of(...), Stream.iterate, Stream.generate, Files.lines, IntStream.range</td></tr>
        <tr><td>Intermediate (stateless)</td><td>filter, map, mapToInt/Long/Double, flatMap, peek, takeWhile (9+), dropWhile (9+)</td></tr>
        <tr><td>Intermediate (stateful)</td><td>sorted, distinct, limit, skip</td></tr>
        <tr><td>Short-circuiting terminals</td><td>findFirst, findAny, anyMatch, allMatch, noneMatch, limit (also intermediate)</td></tr>
        <tr><td>Reducing terminals</td><td>reduce, collect, count, sum, min, max, average, toList (16+), toArray</td></tr>
        <tr><td>Iterating terminals</td><td>forEach, forEachOrdered</td></tr>
      </tbody>
    </table>
  `,
  code: `import java.util.*;
import java.util.stream.*;

// The three pieces:
List<String> names = people.stream()                     // SOURCE
    .filter(p -> p.age() >= 18)                          // intermediate
    .map(Person::name)                                   // intermediate
    .sorted()                                            // intermediate (stateful)
    .toList();                                           // TERMINAL (Java 16+)

// Without a terminal, NOTHING happens:
people.stream().filter(p -> { System.out.println(p); return true; });
// → prints nothing. There's no terminal.`,
  complexity: "Pipeline cost = sum of per-element costs over N elements. Most pipelines are O(N); sorted() adds O(N log N)."
});


/* ===================== SOURCES ===================== */

PROBLEMS.push({
  num: 1, title: "Stream Sources — where streams begin", diff: "easy",
  family: "Sources",
  problem: "Every pipeline starts from a source. The five you'll use 95% of the time: Collection.stream(), Arrays.stream(arr), Stream.of(varargs), IntStream.range(lo, hi), Files.lines(path).",
  intuition: "Pick the source that matches your input shape. From a list/set: Collection.stream(). From an array: Arrays.stream(arr). For a fixed list of values: Stream.of(...). For an integer range: IntStream.range — primitive, no boxing. For a big text file line-by-line: Files.lines — lazy, you can chain filter/map and never load the whole file into memory.",
  hints: [
    "list.stream() / set.stream() / map.entrySet().stream() — most common.",
    "Arrays.stream(int[]) → IntStream; Arrays.stream(T[]) → Stream<T>.",
    "Stream.of(\"a\",\"b\",\"c\") — varargs literal.",
    "IntStream.range(0, n) (exclusive end) / IntStream.rangeClosed(0, n) (inclusive).",
    "Stream.empty() — sometimes useful in chained logic.",
    "Files.lines(Path) returns Stream<String>; CLOSE IT (try-with-resources)."
  ],
  tips: [
    "For huge log files, Files.lines + filter is dramatically less memory than Files.readAllLines.",
    "Stream.iterate(seed, hasNext, next) — the bounded form (Java 9+) — is the safe one. Old Stream.iterate(seed, fn) is infinite; combine with .limit(n).",
    "Stream.generate(Supplier) is for infinite generators (random, ticks). Always pair with .limit().",
    "BufferedReader.lines() is older and equivalent to Files.lines for already-open readers."
  ],
  code: `import java.util.*;
import java.util.stream.*;
import java.nio.file.*;

// from a collection
List<Integer> xs = List.of(1,2,3,4,5);
xs.stream().filter(x -> x > 2).count();          // 3

// from an array
int[] arr = {1,2,3};
Arrays.stream(arr).sum();                         // 6

// fixed values
Stream.of("a","b","c").forEach(System.out::println);

// integer range
int sum = IntStream.range(0, 1_000_000).sum();

// generators (infinite — always limit!)
Stream.iterate(1, n -> n * 2).limit(10).toList();         // [1,2,4,8,..,512]
Stream.generate(Math::random).limit(5).toList();

// big file, line by line — close the stream!

    'Function','BiFunction','Predicate','Consumer','BiConsumer','Supplier','BinaryOperator','UnaryOperator','ToIntFunction','ToLongFunction','ToDoubleFunction','IntFunction',
    'Comparator','Comparable','Objects','Arrays','Collections','Iterator','Iterable',
    'Path','Paths','Files','BufferedReader','BufferedWriter','InputStream','OutputStream','UncheckedIOException','IOException',
    'IntSummaryStatistics','LongSummaryStatistics','DoubleSummaryStatistics',
    'CompletableFuture','ExecutorService','Executors','ForkJoinPool','ThreadLocalRandom','Random',
    'Person','Order','Item','Employee','User','Sale','Event','Enriched','MyMath'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  const kws = ['void','int','long','boolean','char','double','float','byte','short',
    'public','private','protected','static','final','abstract','class','interface','enum','record',
    'return','if','else','for','while','do','break','continue','switch','case','default','yield',
    'new','null','true','false','this','super','try','catch','finally','throw','throws',
    'import','package','extends','implements','instanceof','var'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  s = s.replace(/\b(0x[0-9A-Fa-f_]+L?|\d+(?:_\d+)*L?)\b/g, '<span class="num">$1</span>');
  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

function getProblems(diff) {
  return PROBLEMS.filter(p => p.diff === diff).sort((a, b) => a.num - b.num);
}

const state = { diff: 'veasy', idx: 0 };

function renderTOC() {
  const toc = document.getElementById('toc');
  const groups = [
    { diff: 'veasy', label: 'Foundations' },
    { diff: 'easy',  label: 'Easy' },
    { diff: 'med',   label: 'Medium' },
    { diff: 'hard',  label: 'Hard' },
  ];
  const html = groups.map(g => {
    const items = getProblems(g.diff)
      .map((p, i) => `<a data-diff="${g.diff}" data-idx="${i}"><span class="num">${p.num === 0 ? '★' : '#' + p.num}</span>${escapeHtml(p.title)}</a>`)
      .join('');
    return `<div class="group-title">${g.label}</div>${items}`;
  }).join('');
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      state.diff = a.dataset.diff;
      state.idx = +a.dataset.idx;
      render();
      toggleSidebar(false);
    });
  });
}

function renderTabs() {
  document.getElementById('cnt-veasy').textContent = '(' + getProblems('veasy').length + ')';
  document.getElementById('cnt-easy').textContent  = '(' + getProblems('easy').length + ')';
  document.getElementById('cnt-med').textContent   = '(' + getProblems('med').length + ')';
  document.getElementById('cnt-hard').textContent  = '(' + getProblems('hard').length + ')';
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      if (state.diff !== t.dataset.diff) { state.diff = t.dataset.diff; state.idx = 0; render(); }
    };
  });
}

function familyPillClass(family) {
  if (!family) return '';
  const f = family.toLowerCase();
  if (f.includes('source'))    return 'src';
  if (f.includes('intermed'))  return 'itm';
  if (f.includes('terminal'))  return 'term';
  if (f.includes('collector')) return 'coll';
  if (f.includes('parallel'))  return 'par';
  if (f.includes('optional'))  return 'opt';
  return '';
}


function render() {
  const main = document.getElementById('main');
  if (state.diff === 'brief') {
    document.body.classList.add('brief-mode');
    main.innerHTML = renderBriefView();
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.diff === state.diff));
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  document.body.classList.remove('brief-mode');

  const problems = getProblems(state.diff);
  if (state.idx >= problems.length) state.idx = problems.length - 1;
  if (state.idx < 0) state.idx = 0;
  const p = problems[state.idx];
  const numTag = p.num === 0 ? '★ Foundation' : '#' + p.num;

  const cheatBlock = p.cheatsheetHtml ? `<div class="section-title">Cheatsheet</div>${p.cheatsheetHtml}` : '';
  const formulaBlock = p.formula ? `<div class="section-title">Format / Syntax</div><div class="formula">${escapeHtml(p.formula)}</div>` : '';
  const familyPill = p.family ? `<span class="pill ${familyPillClass(p.family)}">${escapeHtml(p.family)}</span>` : '';

  main.innerHTML = `
    <div class="problem-card">
      <h2>
        <span class="num-tag">${numTag}</span>
        ${escapeHtml(p.title)}
        <span class="badge ${p.diff}">${DIFF_LABEL[p.diff]}</span>
        ${familyPill}
      </h2>
      <div class="section-title">Why You Use It</div>
      <p>${escapeHtml(p.problem)}</p>
      <div class="section-title">Intuition</div>
      <div class="intuition">${escapeHtml(p.intuition)}</div>
      ${formulaBlock}
      ${cheatBlock}
      <div class="section-title">Methods &amp; Patterns</div>
      <ol class="hints">${p.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ol>
      <div class="section-title">Tips &amp; Tricks</div>
      <div class="tips-block"><ul class="tips">${p.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>
      <div class="section-title">Java Code</div>
      <pre class="code"><code>${highlightJava(p.code)}</code></pre>
      ${p.complexity ? `<div class="complexity"><b>Complexity:</b> ${escapeHtml(p.complexity)}</div>` : ''}
    </div>`;

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.diff === state.diff));
  document.getElementById('prev').disabled = state.idx === 0;
  document.getElementById('next').disabled = state.idx === problems.length - 1;
  document.getElementById('nav-info').textContent = `${DIFF_LABEL[state.diff]} · ${state.idx + 1} / ${problems.length}`;
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.toggle('active', a.dataset.diff === state.diff && +a.dataset.idx === state.idx));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextProblem() {
  const arr = getProblems(state.diff);
  if (state.idx < arr.length - 1) { state.idx++; render(); }
}
function prevProblem() {
  if (state.idx > 0) { state.idx--; render(); }
}
document.getElementById('prev').addEventListener('click', prevProblem);
document.getElementById('next').addEventListener('click', nextProblem);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') prevProblem();
  else if (e.key === 'ArrowRight') nextProblem();
  else if (e.key === 'Escape') toggleSidebar(false);
});

const hb = document.getElementById('hamburger');
const sb = document.getElementById('sidebar');
const ov = document.getElementById('overlay');
function toggleSidebar(open) {
  const isOpen = (typeof open === 'boolean') ? open : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  hb.classList.toggle('open', isOpen);
  ov.classList.toggle('show', isOpen);
}
hb.addEventListener('click', () => toggleSidebar());
ov.addEventListener('click', () => toggleSidebar(false));

const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️'; themeBtn.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙'; themeBtn.title = 'Switch to dark mode';
  }
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next); localStorage.setItem('theme', next);
});


function renderBriefView() {
  const families = [
    { title: 'Sources',     cmds: [['Collection.stream()','from list/set/map'],['Arrays.stream(arr)','from array'],['Stream.of(...)','varargs literal'],['IntStream.range(lo,hi)','int range'],['Files.lines(path)','file line-by-line'],['Stream.iterate / generate','infinite (use limit)']] },
    { title: 'Intermediate', cmds: [['filter(p)','keep matches'],['map(fn)','transform 1→1'],['mapToInt/Long/Double','no boxing'],['flatMap(fn)','transform 1→many'],['sorted(cmp)','stateful, O(N log N)'],['distinct','dedup, stateful'],['limit/skip','slice'],['takeWhile/dropWhile','prefix slicing']] },
    { title: 'Terminals',   cmds: [['toList()','Java 16+, immutable'],['count / sum / avg','aggregations'],['anyMatch / allMatch','short-circuit booleans'],['findFirst / findAny','first / any element'],['reduce(id, op)','custom fold'],['forEach','side effect terminal']] },
    { title: 'Collectors',  cmds: [['toList / toSet / toMap','materialise'],['groupingBy(k)','SQL GROUP BY'],['partitioningBy(p)','split true/false'],['counting / summingInt','aggregations'],['joining(sep)','string concat'],['mapping(fn, downstream)','transform inside group'],['teeing(c1, c2, merger)','two collectors at once']] },
    { title: 'Optional',    cmds: [['orElse / orElseGet','default'],['orElseThrow','strict unwrap'],['map / flatMap','chained transform'],['ifPresent / ifPresentOrElse','side effect on value'],['stream()','flatten in stream pipeline']] },
    { title: 'Parallel',    cmds: [['parallelStream()','split across cores'],['unordered()','allow reordering'],['When to use','CPU-bound + large + splittable'],['When NOT','I/O, small N, shared state']] },
  ];

  const decisionFlow = `
<span class="q">Q1.</span> What kind of source?
   ├── <span class="a">Collection</span>     → <span class="alg">coll.stream()</span>
   ├── <span class="a">Array</span>          → <span class="alg">Arrays.stream(arr)</span>
   ├── <span class="a">Range of ints</span>  → <span class="alg">IntStream.range(lo,hi)</span>
   ├── <span class="a">File lines</span>     → <span class="alg">Files.lines(path)</span>  (close it!)
   └── <span class="a">Generator</span>      → <span class="alg">Stream.iterate / generate + limit</span>

<span class="q">Q2.</span> What transformation?
   ├── <span class="a">keep matches</span>   → <span class="alg">filter(p)</span>
   ├── <span class="a">project field</span>  → <span class="alg">map(T::field)</span>
   ├── <span class="a">explode lists</span>  → <span class="alg">flatMap(t -> t.items().stream())</span>
   ├── <span class="a">arithmetic</span>     → <span class="alg">mapToInt(...).sum()/avg()</span>
   └── <span class="a">prefix slicing</span> → <span class="alg">takeWhile / dropWhile</span>

<span class="q">Q3.</span> What's the output shape?
   ├── <span class="a">List<T></span>            → <span class="alg">.toList()</span>
   ├── <span class="a">Set<T></span>             → <span class="alg">collect(toSet())</span>
   ├── <span class="a">Map<K,V></span>           → <span class="alg">collect(toMap(k, v, merge))</span>
   ├── <span class="a">Map<K, List<V>></span>    → <span class="alg">collect(groupingBy(k))</span>
   ├── <span class="a">String</span>             → <span class="alg">collect(joining(sep))</span>
   ├── <span class="a">single value</span>       → <span class="alg">reduce / sum / count / max / findFirst</span>
   └── <span class="a">side effect only</span>   → <span class="alg">forEach</span>

<span class="q">Q4.</span> Empty result possible?
   └── <span class="alg">Optional<T> — orElse / orElseThrow / map / ifPresent</span>

<span class="q">Q5.</span> Should I parallelise?
   ├── <span class="a">small N or I/O-bound</span>     → <span class="alg">NO — sequential</span>
   ├── <span class="a">huge + CPU-bound + splittable</span> → <span class="alg">.parallel() — measure first</span>
   └── <span class="a">unsure</span>                    → <span class="alg">NO — sequential by default</span>
`;

  const recipeCards = [
    { b: 'Filter + project',     s: "stream().filter(p).map(fn).toList()" },
    { b: 'Group by + count',     s: "collect(groupingBy(k, counting()))" },
    { b: 'Group by + sum',       s: "collect(groupingBy(k, summingInt(v)))" },
    { b: 'Index by id',          s: "collect(toMap(T::id, identity(), (a,b)->a))" },
    { b: 'Top-K (small K)',      s: "PriorityQueue size K + map.entries" },
    { b: 'Sum a column',         s: "stream().mapToInt(T::amount).sum()" },
    { b: 'Stats in one pass',    s: "stream().mapToInt(...).summaryStatistics()" },
    { b: 'Join two lists',       s: "build right-Map with toMap, then map left" },
    { b: 'Join strings',         s: "collect(joining(\", \", \"[\", \"]\"))" },
    { b: 'Split true / false',   s: "collect(partitioningBy(p))" },
    { b: 'Count + average',      s: "collect(teeing(counting(), averagingInt(v), pair))" },
    { b: 'Big file → results',   s: "Files.lines(p) inside try-with-resources" },
  ];

  const families_html = families.map(f => `
    <div class="panel">
      <h3>${escapeHtml(f.title)}</h3>
      <div class="grid">
        ${f.cmds.map(c => `<div class="card-mini"><b>${escapeHtml(c[0])}</b><span>${escapeHtml(c[1])}</span></div>`).join('')}
      </div>
    </div>`).join('');

  const recipes_html = `
    <div class="panel">
      <h3>One-Liner Recipes</h3>
      <div class="grid">
        ${recipeCards.map(c => `<div class="card-mini"><b>${escapeHtml(c.b)}</b><span>${escapeHtml(c.s)}</span></div>`).join('')}
      </div>
    </div>`;

  return `
    <div class="brief-root">
      <header class="brief-header">
        <div class="brief-subtitle">J A V A &nbsp; S T R E A M S</div>
        <h1 class="brief-title">Source · Transform · Terminal</h1>
        <p class="brief-tagline">Lazy pipelines. One terminal. No reuse.</p>
      </header>
      <div class="panel">
        <h3>The 5-Question Decision Flow</h3>
        <div class="flow">${decisionFlow}</div>
      </div>
      ${recipes_html}
      ${families_html}
    </div>`;
}

renderTabs();
bindTabs();
renderTOC();
render();
</script>

<!-- KIRO_CROSS_TAB_NAV_START -->
<script id="kiro-cross-tab-nav">
(function(){
  if(window.__kiroCrossTabNav) return;
  window.__kiroCrossTabNav = true;
  function init(){
    if(typeof getProblems !== 'function' || typeof window.render !== 'function' || typeof state === 'undefined') return;
    var ORDER = ['veasy','easy','med','hard'];
    function diffs(){ return ORDER.filter(function(d){ try { return getProblems(d).length > 0; } catch(e){ return false; } }); }

    function updateNavButtons(){
      var prevB = document.getElementById('prev');
      var nextB = document.getElementById('next');
      if(!prevB || !nextB) return;
      if(state.diff === 'brief'){ return; }
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      prevB.disabled = (di <= 0 && state.idx <= 0);
      nextB.disabled = (di === list.length - 1 && state.idx >= arr.length - 1);
    }

    var origRender = window.render;
    window.render = function(){
      var r = origRender.apply(this, arguments);
      try { updateNavButtons(); } catch(e){}
      return r;
    };

    function goNext(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      if(state.idx < arr.length - 1){ state.idx++; window.render(); return; }
      if(di < list.length - 1){ state.diff = list[di + 1]; state.idx = 0; window.render(); }
    }
    function goPrev(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      if(state.idx > 0){ state.idx--; window.render(); return; }
      if(di > 0){
        var pd = list[di - 1];
        state.diff = pd;
        var parr = getProblems(pd);
        state.idx = Math.max(0, parr.length - 1);
        window.render();
      }
    }

    window.nextProblem = goNext;
    window.prevProblem = goPrev;

    ['prev','next'].forEach(function(id){
      var b = document.getElementById(id);
      if(!b) return;
      var clone = b.cloneNode(true);
      b.parentNode.replaceChild(clone, b);
      clone.addEventListener('click', id === 'next' ? goNext : goPrev);
    });

    updateNavButtons();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<!-- KIRO_CROSS_TAB_NAV_END -->
