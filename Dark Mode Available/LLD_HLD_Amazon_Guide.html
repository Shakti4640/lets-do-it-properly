<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LLD &amp; HLD for Amazon SDE — Worked Examples, Patterns &amp; AWS</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<style>
  :root {
    --bg: #f6f7fb;
    --fg: #1f2330;
    --muted: #6b7280;
    --accent: #ff9900;          /* Amazon orange */
    --accent2: #232f3e;
    --border: #e3e6ee;
    --card: #ffffff;
    --code-bg: #f8fafc;
    --code-fg: #24292f;
    --kw:  #cf222e;
    --typ: #6f42c1;
    --bi:  #b91c1c;
    --str: #0a7d4d;
    --cmt: #6a737d;
    --num: #0550ae;
    --veasy: #0891b2;
    --easy:  #16a34a;
    --med:   #d97706;
    --hard:  #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; }
  .hamburger { position: fixed; top: 14px; left: 14px; width: 44px; height: 44px; border-radius: 10px; background: #ffffff; border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,.08); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; cursor: pointer; z-index: 1001; }
  .hamburger span { display: block; width: 22px; height: 2.5px; background: #1e1e25; border-radius: 2px; transition: transform .25s, opacity .2s; }
  .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
  .sidebar { position: fixed; top: 0; left: 0; height: 100vh; width: 360px; max-width: 90vw; background: #ffffff; border-right: 1px solid var(--border); box-shadow: 2px 0 14px rgba(0,0,0,.06); transform: translateX(-100%); transition: transform .28s ease; overflow-y: auto; z-index: 1000; padding: 70px 18px 32px; }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2 { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sidebar .group-title { margin-top: 18px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; border-bottom: 1px dashed var(--border); }
  .sidebar a { display: flex; align-items: center; gap: 8px; padding: 7px 8px; margin: 2px 0; text-decoration: none; color: #1f2330; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
  .sidebar a:hover { background: #fff7e6; color: var(--accent); }
  .sidebar a.active { background: #fff7e6; color: var(--accent); font-weight: 600; }
  .sidebar a .num { display: inline-block; min-width: 32px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; font-family: "JetBrains Mono", Consolas, monospace; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 999; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .topbar { background: #ffffff; border-bottom: 1px solid var(--border); padding: 18px 24px 0; padding-left: 76px; position: sticky; top: 0; z-index: 50; }
  .topbar h1 { margin: 0 0 6px; font-size: 20px; }
  .topbar p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { padding: 9px 16px; border: 1px solid var(--border); border-bottom: none; background: #f1f3f9; color: var(--muted); border-top-left-radius: 8px; border-top-right-radius: 8px; cursor: pointer; font-size: 13.5px; font-weight: 600; transition: background .15s; }
  .tab:hover { background: #e7eaf3; color: var(--fg); }
  .tab.active { background: #ffffff; color: var(--fg); border-bottom: 2px solid #ffffff; margin-bottom: -1px; box-shadow: 0 -2px 0 var(--accent) inset; }
  .tab .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  .tab.veasy .dot { background: var(--veasy); }
  .tab.easy .dot { background: var(--easy); }
  .tab.med .dot { background: var(--med); }
  .tab.hard .dot { background: var(--hard); }
  .tab.brief .dot { background: #8b5cf6; }
  .tab .count { color: var(--muted); margin-left: 6px; font-weight: 500; }

  main { max-width: 1020px; margin: 0 auto; padding: 28px 24px 120px; }
  .problem-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 26px 28px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .problem-card h2 { margin: 0 0 6px; font-size: 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .num-tag { background: #fff7e6; color: var(--accent); padding: 3px 10px; border-radius: 6px; font-size: 13px; font-weight: 700; font-family: "JetBrains Mono", Consolas, monospace; }
  .badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 999px; color: #fff; font-weight: 700; letter-spacing: .05em; }
  .badge.veasy { background: var(--veasy); }
  .badge.easy { background: var(--easy); }
  .badge.med { background: var(--med); }
  .badge.hard { background: var(--hard); }
  .pill { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; background: #fff7e6; color: #b45309; font-weight: 600; letter-spacing: .03em; }
  .pill.lld   { background:#dbeafe; color:#1e40af; }
  .pill.hld   { background:#dcfce7; color:#166534; }
  .pill.pat   { background:#ede9fe; color:#5b21b6; }
  .pill.aws   { background:#fef3c7; color:#92400e; }
  .pill.amz   { background:#fff7e6; color:#c2410c; }
  .pill.fnd   { background:#fce7f3; color:#9d174d; }

  .section-title { font-size: 13.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; border-left: 3px solid var(--accent); padding-left: 10px; }
  .problem-card p { margin: 8px 0; font-size: 15px; }
  .intuition { background: #fff7e6; border-left: 4px solid #ff9900; border-radius: 6px; padding: 12px 16px; margin: 8px 0; }
  .formula { background: #ecfeff; border-left: 4px solid #06b6d4; border-radius: 6px; padding: 10px 16px; margin: 8px 0; font-family: "JetBrains Mono", Consolas, monospace; font-size: 13.5px; overflow-x: auto; white-space: pre; }
  .hints, .tips { margin: 6px 0 6px 4px; padding: 0 0 0 22px; }
  .hints li, .tips li { margin: 6px 0; font-size: 14.5px; }
  .tips-block { background: #fef9c3; border-left: 4px solid #ca8a04; border-radius: 6px; padding: 10px 16px; margin: 8px 0; }
  .complexity { margin-top: 12px; color: var(--muted); font-size: 13.5px; }
  .cheat-table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; font-size: 14px; }
  .cheat-table th, .cheat-table td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
  .cheat-table th { background: #fff7e6; color: #b45309; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; }
  .cheat-table td:first-child { font-family: "JetBrains Mono", Consolas, monospace; background: #fffbeb; white-space: nowrap; color: #92400e; }
  .cheat-table tr:nth-child(even) td:not(:first-child) { background: #fafbff; }

  pre.code { background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.55; margin: 6px 0; }
  pre.code code { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; }
  .kw { color: var(--kw); font-weight: 600; }
  .typ { color: var(--typ); font-weight: 500; }
  .bi { color: var(--bi); font-weight: 500; }
  .str { color: var(--str); }
  .cmt { color: var(--cmt); font-style: italic; }
  .num { color: var(--num); }

  .nav-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 60; box-shadow: 0 -2px 8px rgba(0,0,0,.04); }
  .nav-btn { display: inline-flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--fg); font-weight: 500; }
  .nav-btn:hover:not(:disabled) { background: #fff7e6; color: var(--accent); border-color: #fcd34d; }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .nav-info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kbd { display: inline-block; border: 1px solid #d0d7de; border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; background: #f6f8fa; font-family: monospace; font-size: 11px; color: #444; }

  body.brief-mode .nav-bar { display: none; }
  .brief-root { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
  .brief-root .brief-header { text-align: center; margin-bottom: 24px; }
  .brief-root .brief-subtitle { font-size: 11px; letter-spacing: 8px; color: var(--muted); margin-bottom: 8px; }
  .brief-root .brief-title { font-size: clamp(28px, 6vw, 48px); font-weight: 900; margin: 0; background: linear-gradient(90deg, #ff9900, #232f3e, #146eb4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -1px; }
  .brief-root .brief-tagline { color: var(--muted); margin-top: 8px; font-size: 13px; }
  .brief-root .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 24px; margin-bottom: 20px; }
  .brief-root .panel h3 { margin: 0 0 12px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .brief-root .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .brief-root .card-mini { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: #fff7e6; }
  .brief-root .card-mini b { color: var(--accent); display: block; margin-bottom: 4px; font-size: 13.5px; font-family: "JetBrains Mono", Consolas, monospace; }
  .brief-root .card-mini span { color: var(--muted); font-size: 13px; }
  .brief-root .flow { border: 1px dashed var(--border); border-radius: 12px; padding: 16px; background: var(--code-bg); font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; line-height: 1.9; overflow-x: auto; white-space: pre; margin: 0; color: var(--fg); }
  .brief-root .flow .q { color: var(--accent); font-weight: 700; }
  .brief-root .flow .a { color: var(--str); }
  .brief-root .flow .alg { color: var(--bi); font-weight: 700; }

  @media (max-width: 600px) {
    .topbar { padding-left: 70px; padding-right: 70px; }
    main { padding: 20px 14px 130px; }
    .problem-card { padding: 18px 18px; }
    .problem-card h2 { font-size: 19px; }
  }
  .theme-toggle { position: fixed; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,.08); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1001; font-size: 20px; line-height: 1; color: var(--fg); transition: background .15s, color .15s, border-color .15s, transform .15s; }
  .theme-toggle:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }

  [data-theme="dark"] {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --accent: #ffb84d;
    --border: #30363d; --card: #161b22; --code-bg: #0b0f15; --code-fg: #e6edf3;
    --kw: #ff7b72; --typ: #d2a8ff; --bi: #ffa657; --str: #a5d6ff; --cmt: #8b949e; --num: #79c0ff;
  }
  [data-theme="dark"] .hamburger { background: var(--card); }
  [data-theme="dark"] .hamburger span { background: var(--fg); }
  [data-theme="dark"] .sidebar { background: var(--card); }
  [data-theme="dark"] .sidebar a { color: var(--fg); }
  [data-theme="dark"] .sidebar a:hover, [data-theme="dark"] .sidebar a.active { background: rgba(255,184,77,.15); color: var(--accent); }
  [data-theme="dark"] .topbar { background: var(--card); }
  [data-theme="dark"] .tab { background: #0d1117; border-color: var(--border); }
  [data-theme="dark"] .tab:hover { background: #1c2128; color: var(--fg); }
  [data-theme="dark"] .tab.active { background: var(--card); border-bottom-color: var(--card); color: var(--fg); }
  [data-theme="dark"] .num-tag { background: rgba(255,184,77,.15); color: var(--accent); }
  [data-theme="dark"] .intuition { background: rgba(255,153,0,.10); }
  [data-theme="dark"] .formula { background: rgba(6,182,212,.10); }
  [data-theme="dark"] .tips-block { background: rgba(202,138,4,.10); }
  [data-theme="dark"] .pill     { background: rgba(180,83,9,.18);  color: #fde68a; }
  [data-theme="dark"] .pill.lld { background: rgba(30,64,175,.18); color: #bfdbfe; }
  [data-theme="dark"] .pill.hld { background: rgba(22,101,52,.18); color: #bbf7d0; }
  [data-theme="dark"] .pill.pat { background: rgba(91,33,182,.18); color: #ddd6fe; }
  [data-theme="dark"] .pill.aws { background: rgba(146,64,14,.18); color: #fde68a; }
  [data-theme="dark"] .pill.amz { background: rgba(194,65,12,.18); color: #fed7aa; }
  [data-theme="dark"] .pill.fnd { background: rgba(157,23,77,.18); color: #fbcfe8; }
  [data-theme="dark"] .nav-bar { background: var(--card); }
  [data-theme="dark"] .nav-btn { background: var(--card); color: var(--fg); }
  [data-theme="dark"] .nav-btn:hover:not(:disabled) { background: rgba(255,184,77,.15); color: var(--accent); border-color: var(--accent); }
  [data-theme="dark"] .kbd { background: #1c2128; border-color: var(--border); color: var(--muted); }
  [data-theme="dark"] pre.code { background: var(--code-bg); }
  [data-theme="dark"] .overlay { background: rgba(0,0,0,.55); }
  [data-theme="dark"] .cheat-table th { background: rgba(255,184,77,.15); color: var(--accent); }
  [data-theme="dark"] .cheat-table td:first-child { background: var(--code-bg); color: #fcd34d; }
  [data-theme="dark"] .cheat-table tr:nth-child(even) td:not(:first-child) { background: rgba(255,255,255,.02); }
  [data-theme="dark"] .brief-root .card-mini { background: rgba(255,184,77,.07); }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar"><h2>Table of Contents</h2><div id="toc"></div></aside>
<header class="topbar">

  </div>
</header>

</div>
<script>
const PROBLEMS = [];


PROBLEMS.push({
  num: 0, title: "Amazon SDE Interview Loop — what's actually evaluated", diff: "veasy",
  family: "Foundations",
  problem: "An Amazon SDE loop is typically 4-6 onsites: 1-2 coding, 1 LLD, 1 HLD (system design — SDE2+), and at least one Bar Raiser. Every round is double-scored: technical ability AND Leadership Principles. You can write perfect code and still fail the loop on the LP signal.",
  intuition: "The bar isn't 'can this candidate code?' — it's 'would this person raise the bar at Amazon?'. Bar Raiser has explicit veto power. Every answer should be technically sound AND tell a Leadership Principle story (Customer Obsession, Ownership, Bias for Action, Insist on the Highest Standards, Are Right-A-Lot, etc.).",
  hints: [
    "Coding rounds (SDE-I+): 2 problems, ~25 min each. Speed AND clean code AND tests AND complexity analysis.",
    "LLD round (SDE-I+): design a class hierarchy for one focused thing — parking lot, cache, rate limiter, splitwise. ~45 min.",
    "HLD round (SDE-II+): design a system end-to-end — URL shortener, news feed, S3-like service. ~50 min.",
    "Bar Raiser: senior engineer from another team. Mostly LP-focused; may probe technical depth at any moment.",
    "Leadership Principles: pick 4-5 you can demo with concrete past stories. Use STAR: Situation, Task, Action, Result.",
    "Total time: ~5 hours of interviews. Decision is per-round + a debrief vote."
  ],
  tips: [
    "Always think OUT LOUD. Silent thinking gets you no signal.",
    "When given a problem, restate it. Confirm scope. List functional + non-functional requirements. THEN start designing.",
    "Verbal trade-off discussions matter as much as the chosen design. 'I'd pick X because Y; the trade-off is Z.'",
    "Drive the interview. Don't wait for the interviewer to ask 'what about scaling?' — bring it up first.",
    "Memorise 4-5 STAR stories that you can stretch across multiple LPs. One project, multiple angles."
  ],
  cheatsheetHtml: `
    <table class="cheat-table">
      <thead><tr><th>Round</th><th>What's tested</th><th>Time</th></tr></thead>
      <tbody>
        <tr><td>Coding × 2</td><td>Problem solving, clean code, edge cases, complexity, language fluency</td><td>~25 min each</td></tr>
        <tr><td>LLD</td><td>OOP, design patterns, SOLID, class hierarchy, extensibility, testability</td><td>~45 min</td></tr>
        <tr><td>HLD (SDE-II+)</td><td>Scaling, sharding, replication, caching, async, AWS services, trade-offs</td><td>~50 min</td></tr>
        <tr><td>Bar Raiser</td><td>Leadership Principles, deep behavioural, holistic 'raises the bar'</td><td>~50 min</td></tr>
        <tr><td>Hiring Manager</td><td>Team fit, motivation, future projects, LP probing</td><td>~30-45 min</td></tr>
      </tbody>
    </table>
    <p><b>Top Leadership Principles to internalise:</b></p>
    <ul class="hints">
      <li><b>Customer Obsession</b> — start from customer working backwards.</li>
      <li><b>Ownership</b> — long-term thinking; never say "that's not my job".</li>
      <li><b>Bias for Action</b> — speed matters; many decisions are reversible.</li>
      <li><b>Insist on the Highest Standards</b> — relentlessly raise the bar.</li>
      <li><b>Dive Deep</b> — operate at all levels, audit frequently, no detail too small.</li>
      <li><b>Are Right, A Lot</b> — strong judgement, seek diverse perspectives.</li>
      <li><b>Deliver Results</b> — focus on key inputs; deliver with quality on time.</li>
    </ul>
  `,
  code: `// Round-by-round playbook
//
// CODING:
//   1) Restate problem in your own words.
//   2) Ask: input size? edge cases? duplicates? sorted?
//   3) State approach + complexity BEFORE coding.
//   4) Code clean, name variables well, handle nulls.
//   5) Walk through a small example.
//   6) State complexity again. Suggest one improvement.
//
// LLD:
//   1) Clarify scope (functional + non-functional).
//   2) List entities + relationships + actions.
//   3) Choose 1-2 design patterns FIT for the problem (not all of them).
//   4) Sketch class diagram on the whiteboard / shared screen.
//   5) Code the most important class with TODOs for the rest.
//   6) Discuss extensibility, testability, edge cases.
//
// HLD:
//   1) Clarify scope: features, scale (QPS, data size, latency SLA).
//   2) Capacity estimate: QPS, storage, bandwidth.
//   3) High-level boxes: client, LB, app, cache, DB, queue, async workers.
//   4) Drill into 2-3 critical components: data model, sharding, caching.
//   5) Discuss trade-offs explicitly.
//   6) Cover failure modes, monitoring, deploy.
//
// BAR RAISER:
//   1) STAR-format every story.
//   2) Lead with "I" (your contribution), not "we".
//   3) Quantify impact: numbers, percentages, timelines.
//   4) Be honest about failures + lessons.
//   5) Ask the interviewer questions back at the end.`,
  complexity: "Loop length: ~5 hours. Prep: ~2-3 months for a strong loop."
});

PROBLEMS.push({
  num: 1, title: "LLD vs HLD — what's actually different", diff: "veasy",
  family: "Foundations",
  problem: "LLD = OOP design at the class level. HLD = system architecture at the service level. Different vocabularies, different deliverables, different evaluation.",
  intuition: "LLD asks 'how do classes interact?' — interfaces, inheritance, design patterns, SOLID. HLD asks 'how do machines interact?' — services, queues, databases, replication, sharding, caching. Both are 'design' but the granularity is two orders of magnitude apart.",
  hints: [
    "LLD deliverables: class diagram, key methods + signatures, working code for the core entity.",
    "HLD deliverables: architecture diagram with boxes (services, DBs, queues, caches), data flow, capacity estimates.",
    "LLD scope: a Java app you could build in a week.",
    "HLD scope: a system you'd build with 10 engineers over 6 months.",
    "LLD common patterns: Strategy, Observer, Factory, Decorator, Singleton, State.",
    "HLD common building blocks: Load Balancer, API Gateway, microservices, RDB/NoSQL, Redis, Kafka, S3, CDN."
  ],
  tips: [
    "If asked for HLD and you start drawing classes — you've misread the round. Confirm scope with the interviewer first.",
    "If asked for LLD and you start drawing AWS services — same mistake. LLD is about Java classes.",
    "Many problems have BOTH layers. 'Design a parking lot' starts as LLD; 'Design a parking system for 10,000 lots' becomes HLD.",
    "When unsure, ask: 'should I focus on the class structure or the system architecture?'"
  ],
  code: `// QUICK MENTAL MODEL
//
// LLD answer shape:
//   interface Vehicle { ... }
//   class Car implements Vehicle { ... }
//   class ParkingLot { Map<SpotId, Spot> spots; ... }

  family: "LLD Examples",
  problem: "Design a generic LRU cache with O(1) get/put. Bonus: thread-safe, with size + TTL eviction. Common phone screen and onsite question.",
  intuition: "HashMap + doubly-linked list. HashMap gives O(1) lookup; the list keeps order. On get/put, move the node to the head (most-recent). On overflow, evict the tail (least-recent). Thread safety: synchronised methods (simple) or ConcurrentHashMap + segmented locking (complex).",
  hints: [
    "Node: key, value, prev, next.",
    "Map<K, Node<K,V>> for O(1) lookup; Node head/tail pointers for the list.",
    "get(k): lookup; if hit, move to head, return value.",
    "put(k, v): lookup; if present, update + move to head; else create node + add to head; evict tail if size > cap.",
    "Java has LinkedHashMap with access-order — override removeEldestEntry to get an LRU in 6 lines.",
    "Thread-safe variant: wrap in Collections.synchronizedMap, or use Caffeine for production."
  ],
  tips: [
    "Mention LinkedHashMap as the 'simplest correct answer' — but write the manual version because it's what they want.",
    "For TTL: store an expiresAt long with each node; check on get; lazy-evict on access.",
    "For very high concurrency, segmented locks (per-bucket) outperform a single lock.",
    "Caffeine is the Java standard library for production caches — mention as the real-world choice."
  ],
  code: `import java.util.*;
import java.util.concurrent.locks.*;

class LRUCache<K, V> {
    static class Node<K, V> {
        K key; V value; Node<K, V> prev, next;
        Node(K k, V v) { key = k; value = v; }
    }

    private final int capacity;
    private final Map<K, Node<K, V>> map = new HashMap<>();
    private final Node<K, V> head = new Node<>(null, null);   // sentinels
    private final Node<K, V> tail = new Node<>(null, null);
    private final ReentrantLock lock = new ReentrantLock();

    public LRUCache(int capacity) {
        this.capacity = capacity;
        head.next = tail; tail.prev = head;
    }

    public V get(K key) {
        lock.lock();
        try {
            Node<K, V> n = map.get(key);
            if (n == null) return null;
            moveToHead(n);
            return n.value;
        } finally { lock.unlock(); }
    }

    public void put(K key, V value) {
        lock.lock();
        try {
            Node<K, V> n = map.get(key);
            if (n != null) { n.value = value; moveToHead(n); return; }
            n = new Node<>(key, value);
            map.put(key, n);
            addToHead(n);
            if (map.size() > capacity) {
                Node<K, V> lru = tail.prev;
                remove(lru); map.remove(lru.key);
            }
        } finally { lock.unlock(); }
    }

    private void addToHead(Node<K, V> n) {
        n.next = head.next; n.prev = head;
        head.next.prev = n; head.next = n;
    }
    private void remove(Node<K, V> n) {
        n.prev.next = n.next; n.next.prev = n.prev;
    }
    private void moveToHead(Node<K, V> n) { remove(n); addToHead(n); }
}

// SHORTCUT — LinkedHashMap with access-order = LRU
class LRUCacheShort<K, V> extends LinkedHashMap<K, V> {
    private final int cap;
    public LRUCacheShort(int cap) { super(cap, 0.75f, true); this.cap = cap; }
    protected boolean removeEldestEntry(Map.Entry<K, V> e) { return size() > cap; }
}`,
  complexity: "get/put: O(1). Memory: O(capacity)."
});

import java.util.concurrent.*;
import java.util.concurrent.locks.*;

interface RateLimiter {
    boolean allow(String userId);

// TOKEN BUCKET
class TokenBucketLimiter implements RateLimiter {
    private final int capacity;
    private final double refillPerMs;
    private final Map<String, State> users = new ConcurrentHashMap<>();

    TokenBucketLimiter(int capacity, double refillPerSec) {
        this.capacity = capacity;
        this.refillPerMs = refillPerSec / 1000.0;
    }

    public boolean allow(String userId) {

            long now = System.currentTimeMillis();
            double refill = (now - s.lastRefillMs) * refillPerMs;
            s.tokens = Math.min(capacity, s.tokens + refill);
            s.lastRefillMs = now;
            if (s.tokens >= 1) { s.tokens -= 1; return true; }
            return false;
        }
    }
    private static class State { double tokens; long lastRefillMs;
        State(double t, long m){tokens=t; lastRefillMs=m;} }
}

// SLIDING WINDOW LOG
class SlidingWindowLogLimiter implements RateLimiter {
    private final int limit;
    private final long windowMs;
    private final Map<String, Deque<Long>> users = new ConcurrentHashMap<>();

    SlidingWindowLogLimiter(int limit, long windowMs) {
        this.limit = limit;
        this.windowMs = windowMs;
    }

    public boolean allow(String userId) {
        Deque<Long> q = users.computeIfAbsent(userId, k -> new ArrayDeque<>());
        synchronized (q) {
            long now = System.currentTimeMillis();
            while (!q.isEmpty() && q.peekFirst() <= now - windowMs) q.pollFirst();
            if (q.size() >= limit) return false;
            q.offerLast(now);
            return true;
        }
    }
}`,
  complexity: "Token bucket: O(1) per request, O(1) per user. Sliding log: O(1) amortised, O(limit) per user."

  code: `import java.util.*;
import java.math.BigDecimal;

interface SplitStrategy {
    Map<String, BigDecimal> split(BigDecimal total, List<String> participants, Map<String, ?> extras);
}
class EqualSplit implements SplitStrategy {
    public Map<String, BigDecimal> split(BigDecimal total, List<String> p, Map<String,?> _e) {
        BigDecimal share = total.divide(BigDecimal.valueOf(p.size()), 2, java.math.RoundingMode.HALF_UP);
        Map<String, BigDecimal> out = new HashMap<>();
        for (String u : p) out.put(u, share);
        return out;
    }
}

class Expense {
    String id, payerId;
    BigDecimal amount;
    Map<String, BigDecimal> shares;       // user → owed
}

class BalanceSheet {
    private final Map<String, Map<String, BigDecimal>> book = new HashMap<>();

    public synchronized void apply(Expense e) {
        for (var entry : e.shares.entrySet()) {
            String owedBy = entry.getKey();
            BigDecimal amt = entry.getValue();
            if (owedBy.equals(e.payerId)) continue;
            adjust(owedBy, e.payerId, amt);
        }
    }

    private void adjust(String from, String to, BigDecimal amt) {
        // from now owes 'to' an additional amt. Net the books symmetrically.
        BigDecimal cur = book.computeIfAbsent(from, k -> new HashMap<>())
                             .getOrDefault(to, BigDecimal.ZERO);
        BigDecimal newVal = cur.add(amt);
        book.get(from).put(to, newVal);
        book.computeIfAbsent(to, k -> new HashMap<>()).put(from, newVal.negate());
    }

    public BigDecimal balance(String a, String b) {
        return book.getOrDefault(a, Map.of()).getOrDefault(b, BigDecimal.ZERO);
    }
}

class SplitwiseService {
    private final BalanceSheet sheet = new BalanceSheet();

    public Expense addExpense(String payer, BigDecimal total, List<String> users, SplitStrategy strat) {
        Expense e = new Expense();
        e.id = UUID.randomUUID().toString();
        e.payerId = payer;
        e.amount = total;
        e.shares = strat.split(total, users, Map.of());
        sheet.apply(e);
        return e;
    }
}`,
  complexity: "addExpense: O(participants). balance lookup: O(1)."
});

  num: 12, title: "LLD Example: Tic-Tac-Toe — minimal game engine", diff: "easy",
  family: "LLD Examples",
  problem: "Design a 3×3 (or NxN) Tic-Tac-Toe game with two players, move validation, win/draw detection. Often a warm-up question; the bar is clean modelling, not algorithmic depth.",
  intuition: "Board is a 2D grid. Players alternate. After each move, check 3 things: row, column, both diagonals. Maintain row/col/diag counters for O(1) win check instead of scanning the board.",
  hints: [
    "Entities: Player (X/O), Board, Game.",
    "Use enum Symbol { X, O, EMPTY }.",
    "O(1) win check: int[] rowSum, colSum; int diagSum, antiDiagSum. +1 for X, -1 for O. |sum| == N → that player won.",
    "Track moves played; if == N*N and no winner → draw.",
    "Generalise to an arbitrary N to show extensibility."
  ],
  tips: [
    "Don't write a full GUI — interview wants the engine.",
    "Validate every move: in bounds, cell empty, correct turn.",
    "Consider testability: methods return enums (PLAYING/X_WIN/O_WIN/DRAW), not throw.",
    "Bonus extensions: Connect 4 (drop), Gomoku (5-in-a-row), online multiplayer (state machine + persistence)."
  ],
  code: `enum Symbol { X, O, EMPTY }
enum GameState { PLAYING, X_WIN, O_WIN, DRAW }

class Board {
    private final int N;
    private final Symbol[][] grid;
    private final int[] rowSum, colSum;
    private int diag, antiDiag;
    private int moves;

    Board(int n) {
        this.N = n;
        grid = new Symbol[n][n];
        for (Symbol[] row : grid) Arrays.fill(row, Symbol.EMPTY);
        rowSum = new int[n]; colSum = new int[n];
    }

    public GameState makeMove(int r, int c, Symbol s) {
        if (r < 0 || r >= N || c < 0 || c >= N) throw new IllegalArgumentException();
        if (grid[r][c] != Symbol.EMPTY) throw new IllegalStateException("cell taken");
        if (s == Symbol.EMPTY) throw new IllegalArgumentException();
        grid[r][c] = s;
        moves++;
        int delta = (s == Symbol.X) ? 1 : -1;
        rowSum[r] += delta; colSum[c] += delta;
        if (r == c)         diag     += delta;
        if (r + c == N - 1) antiDiag += delta;
        if (Math.abs(rowSum[r]) == N || Math.abs(colSum[c]) == N
            || Math.abs(diag) == N || Math.abs(antiDiag) == N) {
            return s == Symbol.X ? GameState.X_WIN : GameState.O_WIN;
        }
        if (moves == N * N) return GameState.DRAW;
        return GameState.PLAYING;
    }
}

class Game {
    private final Board board;
    private final List<Symbol> turnOrder;
    private int turnIdx;
    Game(int n) { board = new Board(n); turnOrder = List.of(Symbol.X, Symbol.O); }

    public GameState play(int r, int c) {
        Symbol turn = turnOrder.get(turnIdx);
        GameState s = board.makeMove(r, c, turn);
        turnIdx = (turnIdx + 1) % turnOrder.size();
        return s;
    }
}`,
  complexity: "Move + win check: O(1)."
});

class Book {

class BookCopy {

class Member {

interface FineStrategy { BigDecimal compute(Loan l); }
class FlatPerDayFine implements FineStrategy {
    private final BigDecimal perDay;
    FlatPerDayFine(BigDecimal pd) { this.perDay = pd; }
    public BigDecimal compute(Loan l) {
        if (l.returnedAt == null || !l.returnedAt.isAfter(l.dueAt)) return BigDecimal.ZERO;
        long days = Duration.between(l.dueAt, l.returnedAt).toDays();
        return perDay.multiply(BigDecimal.valueOf(days));

  family: "LLD Examples",
  problem: "Design a building's elevator system: N elevators, M floors, two-button calls (up/down) on each floor, internal floor-buttons inside each cabin. Dispatcher chooses which elevator answers each call.",
  intuition: "Two layers: the ELEVATOR controller (each one's state machine and cabin queue) and the DISPATCHER (which elevator handles which external call). Strategy pattern for dispatching — nearest, lowest-load, look-ahead. The elevator follows SCAN-style movement to minimise direction reversals.",
  hints: [
    "Entities: Elevator (state, currentFloor, direction, queue), Floor, ExternalCall, InternalCall, Dispatcher.",
    "Direction enum: UP, DOWN, IDLE.",
    "Each elevator maintains a TreeSet of pending stops; pops the closest in the current direction.",
    "Dispatcher implementations: NearestCar, LookAhead, BalancedLoad — all behind a Strategy interface.",
    "Concurrency: per-elevator queue; dispatcher synchronises writes."
  ],
  tips: [
    "SCAN algorithm = elevator keeps going in one direction until no more stops, then reverses. Mention it as the classic OS-disk-scheduling analogue.",
    "Scoring an elevator for a call: distance + same-direction bonus + capacity check.",
    "Don't try to model physics (acceleration, voltage). Model TIME as discrete or assume constant per-floor cost.",
    "Bonus extension: priority elevator (express to executive floor), VIP override."
  ],
  code: `import java.util.*;

enum Direction { UP, DOWN, IDLE }

class Elevator {
    final int id;
    int currentFloor = 0;
    Direction direction = Direction.IDLE;
    final TreeSet<Integer> upStops = new TreeSet<>();        // floors above current going UP
    final TreeSet<Integer> downStops = new TreeSet<>(Comparator.reverseOrder());
    final int capacity;
    int load;

    Elevator(int id, int cap) { this.id = id; this.capacity = cap; }

    public synchronized void addStop(int floor) {
        if (floor > currentFloor) upStops.add(floor);
        else if (floor < currentFloor) downStops.add(floor);
        if (direction == Direction.IDLE) direction = floor > currentFloor ? Direction.UP : Direction.DOWN;
    }

    public synchronized void step() {
        if (direction == Direction.UP) {
            if (upStops.isEmpty()) { switchDir(); return; }
            currentFloor++;
            if (upStops.contains(currentFloor)) { upStops.remove(currentFloor); /* doors open */ }
        } else if (direction == Direction.DOWN) {
            if (downStops.isEmpty()) { switchDir(); return; }
            currentFloor--;
            if (downStops.contains(currentFloor)) { downStops.remove(currentFloor); /* doors open */ }
        }
    }
    private void switchDir() {
        if (!upStops.isEmpty())   direction = Direction.UP;
        else if (!downStops.isEmpty()) direction = Direction.DOWN;
        else direction = Direction.IDLE;
    }
}

interface Dispatcher {
    Elevator pick(List<Elevator> elevators, int callFloor, Direction callDir);
}
class NearestDispatcher implements Dispatcher {
    public Elevator pick(List<Elevator> elevators, int callFloor, Direction callDir) {
        Elevator best = null; int bestDist = Integer.MAX_VALUE;
        for (Elevator e : elevators) {
            if (e.load >= e.capacity) continue;
            int d = Math.abs(e.currentFloor - callFloor);
            if (e.direction == callDir || e.direction == Direction.IDLE) d -= 1;     // bonus
            if (d < bestDist) { bestDist = d; best = e; }
        }
        return best;
    }
}

class ElevatorSystem {
    private final List<Elevator> elevators;
    private final Dispatcher dispatcher;
    ElevatorSystem(List<Elevator> es, Dispatcher d) { this.elevators = es; this.dispatcher = d; }

    public void externalCall(int floor, Direction direction) {
        Elevator e = dispatcher.pick(elevators, floor, direction);
        if (e != null) e.addStop(floor);
    }
    public void internalCall(int elevatorId, int floor) {
        elevators.get(elevatorId).addStop(floor);
    }
}`,
  complexity: "addStop O(log floors). step O(1). dispatcher O(elevators)."
});

import java.time.*;
import java.util.concurrent.*;
import java.math.BigDecimal;

enum SeatType { GOLD, SILVER, BRONZE }
enum SeatStatus { AVAILABLE, HELD, BOOKED }

class Seat { String id; SeatType type; SeatStatus status = SeatStatus.AVAILABLE; }
class Show { String id; String movieId; String screenId; Instant startsAt; Map<String, Seat> seats = new HashMap<>(); }
class SeatHold { String holdId; String userId; String showId; Set<String> seatIds; Instant expiresAt; }
class Booking { String id; String userId; Set<String> seatIds; BigDecimal amount; }

interface PricingStrategy { BigDecimal price(Show show, SeatType type); }
class TierPricing implements PricingStrategy {
    public BigDecimal price(Show s, SeatType t) {
        return switch (t) { case GOLD -> new BigDecimal("400"); case SILVER -> new BigDecimal("250"); case BRONZE -> new BigDecimal("150"); };
    }
}

class BookingService {
    private final Map<String, Show> shows;
    private final Map<String, SeatHold> holds = new ConcurrentHashMap<>();
    private final Duration HOLD_TTL = Duration.ofMinutes(5);
    private final PricingStrategy pricing = new TierPricing();
    BookingService(Map<String, Show> shows) { this.shows = shows; }

    public synchronized SeatHold hold(String userId, String showId, Set<String> seatIds) {
        Show show = shows.get(showId);
        for (String sid : seatIds) {
            Seat s = show.seats.get(sid);
            if (s == null || s.status != SeatStatus.AVAILABLE) throw new IllegalStateException("seat unavailable: " + sid);
        }
        SeatHold h = new SeatHold();
        h.holdId = UUID.randomUUID().toString();
        h.userId = userId;
        h.showId = showId;
        h.seatIds = Set.copyOf(seatIds);
        h.expiresAt = Instant.now().plus(HOLD_TTL);
        for (String sid : seatIds) show.seats.get(sid).status = SeatStatus.HELD;
        holds.put(h.holdId, h);
        return h;
    }

    public synchronized Booking confirm(String holdId, String paymentId) {
        SeatHold h = holds.remove(holdId);
        if (h == null || Instant.now().isAfter(h.expiresAt)) throw new IllegalStateException("hold expired");
        Show show = shows.get(h.showId);
        BigDecimal total = BigDecimal.ZERO;
        for (String sid : h.seatIds) {
            Seat s = show.seats.get(sid);
            s.status = SeatStatus.BOOKED;
            total = total.add(pricing.price(show, s.type));
        }
        Booking b = new Booking(); b.id = UUID.randomUUID().toString(); b.userId = h.userId; b.seatIds = h.seatIds; b.amount = total;
        return b;
    }

    // Background sweeper: release holds whose expiresAt < now
    public void sweep() {
        Instant now = Instant.now();
        for (SeatHold h : holds.values()) {
            if (now.isAfter(h.expiresAt)) {
                synchronized (this) {
                    if (holds.remove(h.holdId) != null) {
                        Show show = shows.get(h.showId);
                        for (String sid : h.seatIds) {
                            Seat s = show.seats.get(sid);
                            if (s.status == SeatStatus.HELD) s.status = SeatStatus.AVAILABLE;
                        }
                    }
                }
            }
        }
    }
}`,

});

  intuition: "This question is a meta-test: do you know how Logback / Log4j2 work? Three abstractions: Logger (named, hierarchical), Appender (where it goes), Formatter (how it looks). Logger holds the level + appenders; events bubble up the parent chain unless additivity is disabled.",
  hints: [
    "LogLevel enum with int rank for comparison.",
    "Logger has: name, level, parent, List<Appender>. log(level, msg) checks level then formats and dispatches.",
    "Appender interface: append(LogEvent). Concrete: ConsoleAppender, FileAppender, AsyncAppender wrapper.",
    "Formatter interface: format(LogEvent) -> String. Concrete: PatternFormatter, JsonFormatter.",
    "LogManager: singleton-ish factory that returns/creates loggers by name; root logger is the parent of all.",
    "Async appender: BlockingQueue + dedicated worker thread."
  ],
  tips: [
    "Don't reinvent the entire SLF4J. Show the SHAPE — the interviewer recognises it.",
    "Mention parameterised messages (`log.info(\"x={}\", x)`) so format is lazy.",

  code: `import java.util.*;
import java.util.concurrent.*;

enum LogLevel {
    DEBUG(0), INFO(1), WARN(2), ERROR(3);
    final int rank;
    LogLevel(int r) { this.rank = r; }
}

class LogEvent {
    final Instant ts; final LogLevel level; final String logger; final String message; final Throwable error;
    LogEvent(LogLevel l, String n, String m, Throwable e) {
        this.ts = Instant.now(); this.level = l; this.logger = n; this.message = m; this.error = e;
    }
}

interface Formatter { String format(LogEvent e); }
class PatternFormatter implements Formatter {
    public String format(LogEvent e) {
        return e.ts + " [" + e.level + "] " + e.logger + " - " + e.message + (e.error != null ? " ex=" + e.error : "");
    }
}

interface Appender { void append(LogEvent e); }
class ConsoleAppender implements Appender {
    private final Formatter fmt;
    ConsoleAppender(Formatter fmt) { this.fmt = fmt; }
    public void append(LogEvent e) { System.out.println(fmt.format(e)); }
}
class AsyncAppender implements Appender {
    private final Appender delegate;
    private final BlockingQueue<LogEvent> q = new LinkedBlockingQueue<>(10_000);
    AsyncAppender(Appender d) {
        this.delegate = d;
        Thread t = new Thread(() -> { try { while (true) delegate.append(q.take()); } catch (InterruptedException ignored) {} });
        t.setDaemon(true); t.start();
    }
    public void append(LogEvent e) { q.offer(e); }     // non-blocking; drops on overflow if you want
}

class Logger {
    private final String name;
    private final Logger parent;
    private LogLevel level;
    private final List<Appender> appenders = new ArrayList<>();
    private boolean additive = true;

    Logger(String name, Logger parent) { this.name = name; this.parent = parent; }

    public void setLevel(LogLevel l)   { this.level = l; }
    public void addAppender(Appender a){ appenders.add(a); }

    public void info (String msg)               { log(LogLevel.INFO,  msg, null); }
    public void error(String msg, Throwable t)  { log(LogLevel.ERROR, msg, t); }

    private void log(LogLevel l, String msg, Throwable t) {
        if (l.rank < effectiveLevel().rank) return;
        LogEvent e = new LogEvent(l, name, msg, t);
        dispatch(e);
    }
    private LogLevel effectiveLevel() {
        return level != null ? level : (parent != null ? parent.effectiveLevel() : LogLevel.INFO);
    }
    private void dispatch(LogEvent e) {
        for (Appender a : appenders) a.append(e);
        if (additive && parent != null) parent.dispatch(e);
    }
}

class LogManager {
    private static final Map<String, Logger> loggers = new ConcurrentHashMap<>();
    private static final Logger ROOT = new Logger("ROOT", null);
    public static Logger get(String name) {
        return loggers.computeIfAbsent(name, n -> new Logger(n, ROOT));
    }
    public static Logger root() { return ROOT; }
}
import java.time.Instant;`,

  tips: [

    "Discuss DRAW conditions: 50-move rule, threefold repetition, insufficient material.",
    "Bonus snake: increasing speed, multiplayer two-snake board, leaderboards."

  code: `// SNAKE — minimal engine
import java.util.*;
class SnakeGame {
    private final int rows, cols;
    private final Deque<int[]> body = new ArrayDeque<>();
    private final Set<Long> bodySet = new HashSet<>();
    private int[] food;
    private int score;
    private final Random rng = new Random();

    SnakeGame(int r, int c) {
        this.rows = r; this.cols = c;
        body.offerLast(new int[]{0, 0}); bodySet.add(0L);
        food = randomEmptyCell();
    }

    public boolean step(int dr, int dc) {
        int[] head = body.peekLast();
        int nr = head[0] + dr, nc = head[1] + dc;
        if (nr<0||nr>=rows||nc<0||nc>=cols) return false;
        long key = (long) nr * cols + nc;
        boolean eats = nr == food[0] && nc == food[1];
        if (!eats) { int[] tail = body.pollFirst(); bodySet.remove((long) tail[0] * cols + tail[1]); }
        if (bodySet.contains(key)) return false;
        body.offerLast(new int[]{nr, nc}); bodySet.add(key);
        if (eats) { score++; food = randomEmptyCell(); }
        return true;
    }
    private int[] randomEmptyCell() {
        while (true) {
            int r = rng.nextInt(rows), c = rng.nextInt(cols);
            if (!bodySet.contains((long) r * cols + c)) return new int[]{r, c};
        }
    }
}

// CHESS — sketch
abstract class Piece {
    enum Color { WHITE, BLACK }
    final Color color;
    Piece(Color c) { this.color = c; }
    abstract boolean canMove(int fr, int fc, int tr, int tc, Piece[][] board);
}
class Knight extends Piece {
    Knight(Color c) { super(c); }
    public boolean canMove(int fr, int fc, int tr, int tc, Piece[][] b) {
        int dr = Math.abs(fr - tr), dc = Math.abs(fc - tc);
        if (!((dr == 2 && dc == 1) || (dr == 1 && dc == 2))) return false;
        Piece dest = b[tr][tc];
        return dest == null || dest.color != color;
    }
}`,
  complexity: "Snake step: O(1). Chess move validation: O(board) worst case."
});

  num: 19, title: "LLD Example: Notification Service — multi-channel observer", diff: "med",
  family: "LLD Examples",
  problem: "Design a notification service: events (order placed, payment failed) trigger notifications across channels (Email, SMS, Push, In-app). Users have per-channel preferences and 'do not disturb' windows.",
  intuition: "Observer + Strategy. The producer publishes a NotificationEvent; the dispatcher fans out to channels selected by the user's preferences and the event's importance. Each channel is a Strategy. Add quiet hours, retry policy, throttling.",
  hints: [
    "Entities: NotificationEvent, User, Preference, Channel (interface), Dispatcher.",
    "Channels: EmailChannel, SmsChannel, PushChannel — each implements send(User, Event).",
    "Dispatcher iterates channels enabled for the user + event importance; respects quiet hours.",
    "Async via BlockingQueue + worker pool. Retries with exponential backoff and dead-letter queue on permanent failure.",
    "Templates: NotificationTemplate per (event type, channel) — Strategy applied to formatting."
  ],
  tips: [
    "Mention idempotency: same eventId should not produce duplicate notifications.",
    "Mention rate limiting per channel (e.g. AWS SES has a sending rate).",
    "Bonus: A/B testing channel preferences, opt-out tokens for compliance.",
    "If asked about scaling, say SQS as the queue + Lambda or ECS workers per channel — ties into HLD."
  ],
  code: `import java.util.*;
import java.time.*;
import java.util.concurrent.*;

enum ChannelType { EMAIL, SMS, PUSH, IN_APP }
enum Importance { LOW, MEDIUM, HIGH, CRITICAL }

class NotificationEvent {
    String eventId, type;
    Importance importance;
    String userId;
    Map<String, Object> payload;
}

class UserPrefs {
    String userId;
    Set<ChannelType> enabledChannels = EnumSet.allOf(ChannelType.class);
    LocalTime quietStart, quietEnd;     // null = no quiet hours
    boolean isQuiet(LocalTime now) {
        if (quietStart == null || quietEnd == null) return false;
        return !now.isBefore(quietStart) && !now.isAfter(quietEnd);
    }
}

interface Channel {
    ChannelType type();
    void send(UserPrefs prefs, NotificationEvent e);
}
class EmailChannel implements Channel {
    public ChannelType type() { return ChannelType.EMAIL; }
    public void send(UserPrefs p, NotificationEvent e) { /* ... */ }
}

class NotificationService {
    private final Map<ChannelType, Channel> channels;
    private final Map<String, UserPrefs> prefs;
    private final BlockingQueue<NotificationEvent> queue = new LinkedBlockingQueue<>();
    private final Set<String> seen = ConcurrentHashMap.newKeySet();   // idempotency

    public NotificationService(Map<ChannelType, Channel> c, Map<String, UserPrefs> p) {
        this.channels = c; this.prefs = p;
        for (int i = 0; i < 4; i++) {
            Thread t = new Thread(this::worker); t.setDaemon(true); t.start();
        }
    }

    public void publish(NotificationEvent e) {
        if (!seen.add(e.eventId)) return;       // dup
        queue.offer(e);
    }

    private void worker() {
        while (true) {
            try {
                NotificationEvent e = queue.take();
                UserPrefs p = prefs.get(e.userId);
                if (p == null) continue;
                LocalTime now = LocalTime.now();
                boolean quiet = p.isQuiet(now);
                for (ChannelType ct : p.enabledChannels) {
                    if (quiet && e.importance.ordinal() < Importance.CRITICAL.ordinal()) continue;
                    Channel ch = channels.get(ct);
                    if (ch != null) tryWithRetry(ch, p, e);
                }
            } catch (InterruptedException ignored) {}
        }
    }
    private void tryWithRetry(Channel ch, UserPrefs p, NotificationEvent e) {
        long delay = 100;
        for (int attempt = 0; attempt < 3; attempt++) {
            try { ch.send(p, e); return; }
            catch (RuntimeException ex) {
                try { Thread.sleep(delay); } catch (InterruptedException ignored) {}
                delay *= 2;
            }
        }
        // dead-letter: write to DLQ
    }
}`,
  complexity: "publish: O(1). per-event dispatch: O(enabledChannels)."
});

    "Code generation: counter-based (need a global ID service like Snowflake/DynamoDB atomic counter) → base62 encode 7 chars covers 62^7 ≈ 3.5 trillion.",
    "Storage: DynamoDB partition key = short_code; row contains long_url, owner_id, created_at, expires_at.",
    "Hot cache: Redis with TTL = 1 day; write-through on POST, read-through on GET.",
    "Edge: CloudFront cache 302 responses for popular codes; ~50ms global p99.",

  ],
  tips: [
    "Don't generate codes via random hashing alone — collisions get expensive at scale. Counter + base62 is collision-free.",
    "Custom aliases require a precheck on insert; use DynamoDB conditional put (attribute_not_exists).",
    "If asked about brute-force enumeration, mention rate limiting + non-sequential codes (XOR with secret).",
    "Trade-off: write-through cache vs cache-aside — write-through is simpler, slightly more write latency."
  ],
  code: `// HLD DIAGRAM (text form)
//
// Client → CloudFront → API Gateway → Lambda (shorten + redirect)
//                                       ├─ DynamoDB urls (PK=short_code)
//                                       ├─ ElastiCache Redis (hot codes)
//                                       └─ Kinesis Firehose → S3 → Athena
//
// SHORTEN flow:
//   1. id = atomic counter (DynamoDB UpdateItem on counter row)
//   2. shortCode = base62Encode(id)        // 7 chars at id ~ 62^7
//   3. DynamoDB.PutItem(PK=shortCode, longUrl, ownerId, createdAt, ttl)
//   4. cache.set(shortCode, longUrl, TTL=1d)
//   5. return shortCode
//
// REDIRECT flow:
//   1. v = cache.get(shortCode)
//   2. if null: v = DynamoDB.GetItem(shortCode); cache.set(shortCode, v, TTL=1d)
//   3. emit click event to Kinesis (async, fire-and-forget)
//   4. return 302 Location: v.longUrl
//
// CAPACITY
//   Writes: 1200 QPS  →  DynamoDB on-demand handles. WCU ~ 1200.
//   Reads:  600K peak →  Redis cluster (8-16 nodes) absorbs >99%; DynamoDB sees < 6K QPS.
//   Storage: 100M/day × 365 × 5 × ~500 bytes ≈ 100 TB; DynamoDB scales out, $$ matters.
//   Cache  : 20M hot × 500 = 10 GB; Redis cluster, very small.

// Java-side code generator (sketch)
class Base62 {
    static final String ALPH = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
    static String encode(long id) {
        StringBuilder sb = new StringBuilder();
        while (id > 0) { sb.append(ALPH.charAt((int)(id % 62))); id /= 62; }
        while (sb.length() < 7) sb.append('0');
        return sb.reverse().toString();
    }
}`,
  complexity: "Redirect: O(1) on cache hit (~5ms). Shorten: O(1) DDB write + cache."

  num: 33, title: "HLD Example: Distributed Cache (Memcached / Redis Cluster)", diff: "hard",
  family: "HLD Examples",
  problem: "Design a distributed in-memory cache: shard data across many nodes, support GET/PUT, handle node failures, scale to 100M ops/sec.",
  intuition: "CONSISTENT HASHING distributes keys across nodes such that adding/removing a node moves only ~K/N of keys. Each node is replicated for HA. Client uses a smart driver that knows the topology and routes directly to the right node. Persistence (optional) for warm restarts.",
  hints: [
    "Consistent hashing ring: each physical node gets ~256 'virtual nodes' for uniform distribution.",
    "Client SDK: caches the topology; on miss, refresh from a coordination service (ZooKeeper / etcd).",
    "Replication: each key has 1 primary + 2 replicas. Async replication for writes by default; sync for stronger guarantees.",
    "Failure detection: gossip protocol; node marked DOWN → replicas promoted → ring rebalanced.",
    "Eviction policy: LRU per node, configurable maxMemory.",
    "Persistence: optional RDB snapshot + AOF (append-only log) for warm-restart."
  ],
  tips: [
    "Always mention CONSISTENT HASHING by name. It's the central idea.",
    "Discuss write-through vs cache-aside; the cache itself is dumb, the application chooses the policy.",
    "Hot keys are the killer: 1% of keys can take 50% of traffic. Fix with client-side caching or replication-on-hot-keys.",
    "Bonus: mention Redis Cluster vs sentinels; ElastiCache for managed."
  ],
  code: `// HLD DIAGRAM
//
// Client SDK (smart driver)
//   ↓ direct connect (TCP)
// Cache Cluster — N nodes, each owning ~K/N of the keyspace via consistent hashing
//   - Primary + 2 replicas per virtual node
//   - Gossip protocol for failure detection
//   - Optional AOF + RDB persistence
//   ↑↑
// Coordinator (ZooKeeper / etcd) — stores ring topology, leadership, config
//
// CONSISTENT HASHING
//
//   ring[hash(key)] → owner virtual node → physical node
//   adding a node: only K/N keys remap (the ones whose hash falls in the new node's slice)
//
// CLIENT FLOW
//
//   GET key:
//     node = ring.lookup(key)
//     try node.get(key)
//     on TIMEOUT → fall back to replica → mark primary suspect
//
//   PUT key v:
//     node = ring.lookup(key)
//     node.put(key, v) → async replicate to 2 replicas
//
// FAILURE / REBALANCE
//
//   gossip detects node DOWN → coordinator promotes a replica → ring updated
//   clients refresh topology on next miss / TTL refresh
//
// CAPACITY
//   100M ops/sec → cluster of ~1000 small nodes (each 100K ops/sec)
//   Memory: dataset / num_nodes; with 1 TB total and 1000 nodes → 1 GB each, fine

// SAMPLE — consistent hashing ring (Java sketch)
import java.util.*;
class ConsistentHash<T> {
    private final int virtualPerNode;
    private final TreeMap<Long, T> ring = new TreeMap<>();
    public ConsistentHash(int v) { this.virtualPerNode = v; }
    public void addNode(T n) {
        for (int i = 0; i < virtualPerNode; i++)
            ring.put(hash(n.toString() + "#" + i), n);
    }
    public T owner(String key) {
        if (ring.isEmpty()) return null;
        Map.Entry<Long, T> e = ring.ceilingEntry(hash(key));
        if (e == null) e = ring.firstEntry();
        return e.getValue();
    }
    long hash(String s) { return s.hashCode() & 0xFFFFFFFFL; }
}`,
  complexity: "GET/PUT: O(log V) ring lookup + 1 RTT (~200μs in-DC)."
});

PROBLEMS.push({
  num: 47, title: "LLD: Document Editor / Word-style application", diff: "hard",
  family: "LLD Examples",
  problem: "Design a document editor (Google Docs / Word style): elements (paragraph, image, table), undo/redo, formatting, save. Bonus: collaborative editing.",
  intuition: "Document = tree of Element nodes (Composite). Every user action = Command (Command pattern); undo/redo = Stack of commands. Formatting = Decorator. Collaborative editing → operational transformation (OT) or CRDTs.",
  hints: [
    "Composite: Document → Section → Paragraph → Run (text + formatting).",
    "Command pattern: every user action returns a Command with execute() and undo() methods. Push to undo stack on execute.",
    "Decorator: a Run wrapped in Bold(Italic(Run)) builds up formatting.",
    "Save / Load: serialize the tree (JSON / XML / proprietary). Auto-save every 30s on a debounced timer.",
    "Collaborative: each operation has a unique ID + parent ID; OT or CRDT engine merges remote ops."
  ],
  tips: [
    "Start with single-user; add collaboration as a follow-up.",
    "Composite + Command together is a near-canonical answer for editor design.",
    "For undo, mention SNAPSHOT vs INVERTED-COMMAND approaches; commands scale better.",
    "Bonus: real-time collab via WebSocket gateway + operation log per document."
  ],
  code: `import java.util.*;

interface DocElement { void render(StringBuilder sb); }
class Run implements DocElement {
    String text; boolean bold, italic;
    public void render(StringBuilder sb) { sb.append(text); }
}
class Paragraph implements DocElement {
    List<Run> runs = new ArrayList<>();
    public void render(StringBuilder sb) { for (Run r : runs) r.render(sb); sb.append('\\n'); }
}
class Document {
    List<Paragraph> paragraphs = new ArrayList<>();
}

interface Command { void execute(); void undo(); }
class InsertText implements Command {
    Paragraph p; int pos; String text; Run inserted;
    InsertText(Paragraph p, int pos, String text) { this.p = p; this.pos = pos; this.text = text; }
    public void execute() {
        inserted = new Run();
        inserted.text = text;
        p.runs.add(pos, inserted);
    }
    public void undo() { p.runs.remove(inserted); }
}
class Bold implements Command {
    Run r; boolean prev;
    Bold(Run r) { this.r = r; }
    public void execute() { prev = r.bold; r.bold = true; }
    public void undo() { r.bold = prev; }
}

class Editor {
    Document doc = new Document();
    Deque<Command> undo = new ArrayDeque<>();
    Deque<Command> redo = new ArrayDeque<>();

    public void apply(Command c) {
        c.execute();
        undo.push(c);
        redo.clear();
    }
    public void undo() {
        if (undo.isEmpty()) return;
        Command c = undo.pop();
        c.undo();
        redo.push(c);
    }
    public void redo() {
        if (redo.isEmpty()) return;
        Command c = redo.pop();
        c.execute();
        undo.push(c);
    }
}

/* ----------------------- RENDERING ENGINE ----------------------- */
const DIFF_LABEL = { veasy: 'Foundations', easy: 'Easy', med: 'Medium', hard: 'Hard', brief: 'Brief' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightJava(src) {
  let s = escapeHtml(src);
  const stash = [];
  const stashIt = (html) => { stash.push(html); return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001'; };
  s = s.replace(/\/\/[^\n]*/g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/&quot;([^&\n]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  s = s.replace(/&#39;.&#39;|&#39;\\.&#39;/g, m => stashIt('<span class="str">' + m + '</span>'));

  const types = ['String','Integer','Long','Boolean','Character','Double','Float','Object','BigDecimal','UUID',
    'List','Map','Set','HashMap','HashSet','TreeMap','TreeSet','LinkedHashMap','LinkedHashSet','EnumSet',
    'ArrayList','LinkedList','ArrayDeque','Queue','Deque','PriorityQueue','BlockingQueue','LinkedBlockingQueue',
    'ConcurrentHashMap','ConcurrentMap','ConcurrentSkipListMap','CopyOnWriteArrayList',
    'StringBuilder','Optional','Comparator','Comparable','Objects','Arrays','Collections','Iterator','Iterable',
    'Math','Random','ReentrantLock','UnionFind','LRUCache','Trie','TrieNode','Logger','LogLevel','LogEvent','Appender','Formatter',
    'PaymentMethod','FeeStrategy','HourlyFee','FlatDailyFee','OrderObserver','Order','OrderStatus','OrderEvent',
    'EmailNotifier','SmsNotifier','AnalyticsRecorder','Vehicle','Car','Bike','Truck','VehicleType','Spot','Floor',
    'Ticket','ParkingService','ParkingLot','VendingMachine','VendingState','IdleState','AcceptingPaymentState','DispensingState',
    'OrderState','PlacedState','ShippedState','CancelledState','Beverage','Espresso','Topping','Milk','Sugar',
    'FsNode','File1','Folder','Pizza','Size','User','UserPrefs','Channel','EmailChannel','ChannelType','Importance',
    'NotificationEvent','NotificationService','BookingService','SeatHold','Show','SeatStatus','SeatType','Booking',
    'PricingStrategy','TierPricing','SnakeGame','Piece','Knight','Color','Loan','LoanStatus','BookCopy','Member',
    'Book','LibraryService','Elevator','Direction','Dispatcher','NearestDispatcher','ElevatorSystem',
    'Result','Request','InventoryService','TokenBucketLimiter','SlidingWindowLogLimiter','RateLimiter','ConsistentHash',
    'Base62','BalanceSheet','Expense','SplitStrategy','EqualSplit','SplitwiseService','Symbol','GameState','Board','Game',
    'Suggestion','TreeNode','ListNode','Node','Instant','LocalTime','Duration','LocalDateTime',
    'IllegalStateException','IllegalArgumentException','RuntimeException','NoSuchElementException','InterruptedException',
    'ConditionalCheckFailedException'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  const kws = ['void','int','long','boolean','char','double','float','byte','short',
    'public','private','protected','static','final','abstract','class','interface','enum','record',
    'return','if','else','for','while','do','break','continue','switch','case','default','yield',
    'new','null','true','false','this','super','try','catch','finally','throw','throws',
    'import','package','extends','implements','instanceof','var','synchronized'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  s = s.replace(/\b(0x[0-9A-Fa-f_]+L?|\d+(?:_\d+)*L?)\b/g, '<span class="num">$1</span>');
  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

function getProblems(diff) {
  return PROBLEMS.filter(p => p.diff === diff).sort((a, b) => a.num - b.num);
}

const state = { diff: 'brief', idx: 0 };

function renderTOC() {
  const toc = document.getElementById('toc');
  const groups = [
    { diff: 'veasy', label: 'Foundations' },
    { diff: 'easy',  label: 'Easy' },
    { diff: 'med',   label: 'Medium' },
    { diff: 'hard',  label: 'Hard' },
  ];
  const html = groups.map(g => {
    const items = getProblems(g.diff)
      .map((p, i) => `<a data-diff="${g.diff}" data-idx="${i}"><span class="num">${p.num === 0 ? '★' : '#' + p.num}</span>${escapeHtml(p.title)}</a>`)
      .join('');
    return `<div class="group-title">${g.label}</div>${items}`;
  }).join('');
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      state.diff = a.dataset.diff;
      state.idx = +a.dataset.idx;
      render();
      toggleSidebar(false);
    });
  });
}

function renderTabs() {
  document.getElementById('cnt-veasy').textContent = '(' + getProblems('veasy').length + ')';
  document.getElementById('cnt-easy').textContent  = '(' + getProblems('easy').length + ')';
  document.getElementById('cnt-med').textContent   = '(' + getProblems('med').length + ')';
  document.getElementById('cnt-hard').textContent  = '(' + getProblems('hard').length + ')';
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => { if (state.diff !== t.dataset.diff) { state.diff = t.dataset.diff; state.idx = 0; render(); } };
  });
}

function familyPillClass(family) {
  if (!family) return '';
  const f = family.toLowerCase();
  if (f.includes('lld example'))     return 'lld';
  if (f.includes('hld example'))     return 'hld';
  if (f.includes('lld foundation'))  return 'lld';
  if (f.includes('hld foundation'))  return 'hld';
  if (f.includes('design pattern'))  return 'pat';
  if (f.includes('leadership'))      return 'amz';
  if (f.includes('practice'))        return 'amz';
  if (f.includes('foundations'))     return 'fnd';
  return '';
}


function render() {
  const main = document.getElementById('main');
  if (state.diff === 'brief') {
    document.body.classList.add('brief-mode');
    main.innerHTML = renderBriefView();
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.diff === state.diff));
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  document.body.classList.remove('brief-mode');

  const problems = getProblems(state.diff);
  if (state.idx >= problems.length) state.idx = problems.length - 1;
  if (state.idx < 0) state.idx = 0;
  const p = problems[state.idx];
  const numTag = p.num === 0 ? '★ Foundation' : '#' + p.num;

  const cheatBlock = p.cheatsheetHtml ? `<div class="section-title">Cheatsheet</div>${p.cheatsheetHtml}` : '';
  const formulaBlock = p.formula ? `<div class="section-title">Format / Syntax</div><div class="formula">${escapeHtml(p.formula)}</div>` : '';
  const familyPill = p.family ? `<span class="pill ${familyPillClass(p.family)}">${escapeHtml(p.family)}</span>` : '';

  main.innerHTML = `
    <div class="problem-card">
      <h2>
        <span class="num-tag">${numTag}</span>
        ${escapeHtml(p.title)}
        <span class="badge ${p.diff}">${DIFF_LABEL[p.diff]}</span>
        ${familyPill}
      </h2>
      <div class="section-title">Problem / Context</div>
      <p>${escapeHtml(p.problem)}</p>
      <div class="section-title">Approach &amp; Intuition</div>
      <div class="intuition">${escapeHtml(p.intuition)}</div>
      ${formulaBlock}
      ${cheatBlock}
      <div class="section-title">Key Hints</div>
      <ol class="hints">${p.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ol>
      <div class="section-title">Tips &amp; Trade-offs</div>
      <div class="tips-block"><ul class="tips">${p.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>
      <div class="section-title">Code / Diagram</div>
      <pre class="code"><code>${highlightJava(p.code)}</code></pre>
      ${p.complexity ? `<div class="complexity"><b>Complexity / Cost:</b> ${escapeHtml(p.complexity)}</div>` : ''}
    </div>`;

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.diff === state.diff));
  document.getElementById('prev').disabled = state.idx === 0;
  document.getElementById('next').disabled = state.idx === problems.length - 1;
  document.getElementById('nav-info').textContent = `${DIFF_LABEL[state.diff]} · ${state.idx + 1} / ${problems.length}`;
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.toggle('active', a.dataset.diff === state.diff && +a.dataset.idx === state.idx));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextProblem() { const arr = getProblems(state.diff); if (state.idx < arr.length - 1) { state.idx++; render(); } }
function prevProblem() { if (state.idx > 0) { state.idx--; render(); } }
document.getElementById('prev').addEventListener('click', prevProblem);
document.getElementById('next').addEventListener('click', nextProblem);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') prevProblem();
  else if (e.key === 'ArrowRight') nextProblem();
  else if (e.key === 'Escape') toggleSidebar(false);
});

const hb = document.getElementById('hamburger');
const sb = document.getElementById('sidebar');
const ov = document.getElementById('overlay');
function toggleSidebar(open) {
  const isOpen = (typeof open === 'boolean') ? open : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  hb.classList.toggle('open', isOpen);
  ov.classList.toggle('show', isOpen);
}
hb.addEventListener('click', () => toggleSidebar());
ov.addEventListener('click', () => toggleSidebar(false));

const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️'; themeBtn.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙'; themeBtn.title = 'Switch to dark mode';
  }
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next); localStorage.setItem('theme', next);
});


function renderBriefView() {
  const families = [
    { title: 'LLD Building Blocks', cmds: [['SOLID','S/O/L/I/D — cite when designing'],['Strategy','interchangeable algorithms'],['Observer','pub/sub on state change'],['Factory / Builder','construction'],['State / Decorator / Adapter','lifecycle / wrap / convert']] },
    { title: 'LLD Examples', cmds: [['Parking Lot','classic; Strategy + Factory'],['LRU Cache','HashMap + DLL'],['Rate Limiter','token bucket / sliding'],['Splitwise','double-entry ledger'],['Tic-Tac-Toe / Snake / Chess','board games'],['Vending Machine','State pattern'],['Library','aggregate roots'],['Elevator','dispatch + scan'],['BookMyShow','seat hold + TTL'],['Logging','Logger + Appender'],['Notification','Observer + channels']] },
    { title: 'HLD Building Blocks', cmds: [['Capacity estimates','QPS · storage · bandwidth'],['LB / API GW','edge'],['Cache','Redis cache-aside'],['Queue','SQS / Kafka decoupling'],['CDN','CloudFront edge'],['Sharding','consistent hashing'],['Replication','sync / async / quorum'],['CAP / consistency','CP vs AP'],['Idempotency / retries / DLQ','op patterns']] },
    { title: 'HLD Examples', cmds: [['URL Shortener','base62 + DDB + Redis'],['News Feed','fanout-on-write hybrid'],['S3-like','metadata + chunks + EC'],['Real-time Chat','WS gateway + Kafka'],['E-commerce / Order','SAGA / Step Functions'],['Video Streaming','CDN + HLS / DASH'],['Ride Sharing','geohash + dispatch'],['Web Crawler','frontier + bloom + dedup'],['Distributed Cache','consistent hashing'],['Payment Ledger','double-entry'],['Autocomplete','trie + Redis'],['Rate Limiter at scale','Redis Lua'],['Scheduler','sharded leader + DDB'],['Metrics','Kafka + TSDB'],['Inventory','DDB conditional update']] },
    { title: 'AWS Map (cite by name)', cmds: [['DynamoDB','NoSQL key-value'],['Aurora / RDS','SQL with replicas'],['ElastiCache (Redis)','hot cache'],['SQS / SNS / Kafka','queue / pub-sub / stream'],['CloudFront','CDN'],['API Gateway','front door'],['Lambda / ECS / EC2','compute'],['S3','object store'],['Step Functions','SAGA orchestrator'],['CloudWatch / X-Ray','observability'],['IAM / KMS / Cognito','security']] },
    { title: 'LP / Bar Raiser', cmds: [['Customer Obsession','start from customer'],['Ownership','long-term, no "not my job"'],['Bias for Action','speed; reversible'],['Insist on Highest Standards','raise the bar'],['Dive Deep','operate at all levels'],['Are Right A Lot','strong judgement'],['Earn Trust','candid + respectful'],['STAR','Situation Task Action Result']] },
  ];

  const decisionFlow = `
<span class="q">Q1.</span> Which round?
   ├── <span class="a">Coding</span>     → restate · approach · code clean · tests · complexity
   ├── <span class="a">LLD</span>        → 5-7 classes · SOLID · pattern justified · code one class fully
   ├── <span class="a">HLD</span>        → REQ-MENTS · capacity · API · data · architecture · trade-offs
   └── <span class="a">Bar Raiser</span> → STAR stories · own failures · 5-deep follow-ups

<span class="q">Q2.</span> LLD problem keyword
   ├── <span class="a">"types of X" / extensibility</span> → <span class="alg">Strategy / Factory</span>
   ├── <span class="a">"lifecycle / state"</span>          → <span class="alg">State pattern</span>
   ├── <span class="a">"notify / observe"</span>           → <span class="alg">Observer</span>
   ├── <span class="a">"hierarchy / tree"</span>           → <span class="alg">Composite</span>
   ├── <span class="a">"stack / wrap"</span>               → <span class="alg">Decorator</span>
   ├── <span class="a">"complex constructor"</span>        → <span class="alg">Builder</span>
   └── <span class="a">"only one instance"</span>          → <span class="alg">Singleton (sparingly)</span>

<span class="q">Q3.</span> HLD problem keyword
   ├── <span class="a">"shorten / lookup"</span>           → <span class="alg">DDB + Redis + CDN</span>
   ├── <span class="a">"feed / timeline"</span>            → <span class="alg">Fanout hybrid</span>
   ├── <span class="a">"chat / realtime"</span>            → <span class="alg">WS gateway + Kafka + Cassandra</span>
   ├── <span class="a">"order / payment"</span>            → <span class="alg">SAGA + Step Functions + Aurora</span>
   ├── <span class="a">"video / stream"</span>             → <span class="alg">CDN + HLS + S3</span>
   ├── <span class="a">"location / dispatch"</span>        → <span class="alg">geohash / H3 + Redis geo</span>
   ├── <span class="a">"crawl / dedup"</span>              → <span class="alg">frontier + bloom + S3</span>
   ├── <span class="a">"counter / inventory"</span>        → <span class="alg">DDB conditional updates</span>
   ├── <span class="a">"metrics / time-series"</span>      → <span class="alg">Kafka + TSDB + S3</span>
   └── <span class="a">"autocomplete / search"</span>      → <span class="alg">Trie / OpenSearch + Redis</span>

<span class="q">Q4.</span> Capacity sanity-check
   ├── DAU × actions/user/day = total ops/day
   ├── peak QPS ≈ 5 × avg
   ├── storage = ops × bytes × replication × retention
   └── if ops > 100K/sec, you're sharding; > 1M/sec → CDN reads

<span class="q">Q5.</span> Always discuss
   ├── consistency model (strong vs eventual, per use case)
   ├── failure modes (region, AZ, node) + RPO/RTO
   ├── monitoring (metrics, logs, traces, alerts)
   ├── deploy strategy (blue/green, canary, rollback)
   └── security (auth, encryption at rest + in transit, secrets)
`;

  const recipeCards = [
    { b: 'Restate problem',          s: "1-2 sentences before designing" },
    { b: 'Capacity estimate',        s: "DAU × actions × bytes × retention" },
    { b: 'Open / Closed',            s: "interface + new class for each variant" },
    { b: 'Strategy pattern',         s: "interchangeable algorithms" },
    { b: 'State pattern',            s: "lifecycle phases as classes" },
    { b: 'Observer pattern',         s: "pub/sub on state change" },
    { b: 'Cache-aside',              s: "lazy load + write-through invalidate" },
    { b: 'Idempotency key',          s: "client uuid + server dedup table" },
    { b: 'Sharding',                 s: "hash key → uniform; range → ordered" },
    { b: 'SAGA',                     s: "Step Functions + compensating txn" },
    { b: 'Quorum',                   s: "N=3, W=2, R=2 → strong consistency" },
    { b: 'STAR story',               s: "Situation Task Action Result + LP tag" },
    { b: 'AWS for shorten',          s: "API GW + Lambda + DDB + Redis + CF" },
    { b: 'AWS for chat',             s: "ALB WS + ECS + Kafka + Cassandra" },
    { b: 'AWS for order',            s: "API GW + ECS + Aurora + Step Functions" },
    { b: 'Bar Raiser tip',           s: "lead with 'I'; quantify impact" },
  ];

  const families_html = families.map(f => `
    <div class="panel">
      <h3>${escapeHtml(f.title)}</h3>
      <div class="grid">
        ${f.cmds.map(c => `<div class="card-mini"><b>${escapeHtml(c[0])}</b><span>${escapeHtml(c[1])}</span></div>`).join('')}
      </div>
    </div>`).join('');

  const recipes_html = `
    <div class="panel">
      <h3>One-Liner Recipes</h3>
      <div class="grid">
        ${recipeCards.map(c => `<div class="card-mini"><b>${escapeHtml(c.b)}</b><span>${escapeHtml(c.s)}</span></div>`).join('')}
      </div>
    </div>`;

  return `
    <div class="brief-root">
      <header class="brief-header">
        <div class="brief-subtitle">A M A Z O N &nbsp; S D E &nbsp; L L D &nbsp; / &nbsp; H L D</div>
        <h1 class="brief-title">Patterns · AWS · LP · Worked Examples</h1>
        <p class="brief-tagline">Restate · Quantify · Choose · Justify · Trade-off · Deliver.</p>
      </header>
      <div class="panel">
        <h3>The 5-Question Decision Flow</h3>
        <div class="flow">${decisionFlow}</div>
      </div>
      ${recipes_html}
      ${families_html}
    </div>`;
}

renderTabs();
bindTabs();
renderTOC();
render();
</script>
