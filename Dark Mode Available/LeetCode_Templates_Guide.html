<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LeetCode Pattern Templates — Java Boilerplate, Easy to Adapt</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<style>
  :root {
    --bg: #f6f7fb;
    --fg: #1f2330;
    --muted: #6b7280;
    --accent: #7c3aed;          /* purple */
    --accent2: #db2777;
    --border: #e3e6ee;
    --card: #ffffff;
    --code-bg: #f8fafc;
    --code-fg: #24292f;
    --kw:  #cf222e;
    --typ: #6f42c1;
    --bi:  #b91c1c;
    --str: #0a7d4d;
    --cmt: #6a737d;
    --num: #0550ae;
    --veasy: #0891b2;
    --easy:  #16a34a;
    --med:   #d97706;
    --hard:  #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; }
  .hamburger { position: fixed; top: 14px; left: 14px; width: 44px; height: 44px; border-radius: 10px; background: #ffffff; border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,.08); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; cursor: pointer; z-index: 1001; }
  .hamburger span { display: block; width: 22px; height: 2.5px; background: #1e1e25; border-radius: 2px; transition: transform .25s, opacity .2s; }
  .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
  .sidebar { position: fixed; top: 0; left: 0; height: 100vh; width: 360px; max-width: 90vw; background: #ffffff; border-right: 1px solid var(--border); box-shadow: 2px 0 14px rgba(0,0,0,.06); transform: translateX(-100%); transition: transform .28s ease; overflow-y: auto; z-index: 1000; padding: 70px 18px 32px; }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2 { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sidebar .group-title { margin-top: 18px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; border-bottom: 1px dashed var(--border); }
  .sidebar a { display: flex; align-items: center; gap: 8px; padding: 7px 8px; margin: 2px 0; text-decoration: none; color: #1f2330; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
  .sidebar a:hover { background: #ede9fe; color: var(--accent); }
  .sidebar a.active { background: #ede9fe; color: var(--accent); font-weight: 600; }
  .sidebar a .num { display: inline-block; min-width: 32px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; font-family: "JetBrains Mono", Consolas, monospace; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 999; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .topbar { background: #ffffff; border-bottom: 1px solid var(--border); padding: 18px 24px 0; padding-left: 76px; position: sticky; top: 0; z-index: 50; }
  .topbar h1 { margin: 0 0 6px; font-size: 20px; }
  .topbar p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { padding: 9px 16px; border: 1px solid var(--border); border-bottom: none; background: #f1f3f9; color: var(--muted); border-top-left-radius: 8px; border-top-right-radius: 8px; cursor: pointer; font-size: 13.5px; font-weight: 600; transition: background .15s; }
  .tab:hover { background: #e7eaf3; color: var(--fg); }
  .tab.active { background: #ffffff; color: var(--fg); border-bottom: 2px solid #ffffff; margin-bottom: -1px; box-shadow: 0 -2px 0 var(--accent) inset; }
  .tab .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  .tab.veasy .dot { background: var(--veasy); }
  .tab.easy .dot { background: var(--easy); }
  .tab.med .dot { background: var(--med); }
  .tab.hard .dot { background: var(--hard); }
  .tab.brief .dot { background: #8b5cf6; }
  .tab .count { color: var(--muted); margin-left: 6px; font-weight: 500; }

  main { max-width: 1020px; margin: 0 auto; padding: 28px 24px 120px; }
  .problem-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 26px 28px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .problem-card h2 { margin: 0 0 6px; font-size: 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .num-tag { background: #ede9fe; color: var(--accent); padding: 3px 10px; border-radius: 6px; font-size: 13px; font-weight: 700; font-family: "JetBrains Mono", Consolas, monospace; }
  .badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 999px; color: #fff; font-weight: 700; letter-spacing: .05em; }
  .badge.veasy { background: var(--veasy); }
  .badge.easy { background: var(--easy); }
  .badge.med { background: var(--med); }
  .badge.hard { background: var(--hard); }
  .pill { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; background: #ede9fe; color: #5b21b6; font-weight: 600; letter-spacing: .03em; }
  .pill.arr  { background:#dbeafe; color:#1e40af; }
  .pill.str  { background:#fce7f3; color:#9d174d; }
  .pill.dp   { background:#fef3c7; color:#92400e; }
  .pill.bs   { background:#dcfce7; color:#166534; }
  .pill.bt   { background:#ede9fe; color:#5b21b6; }
  .pill.ll   { background:#fef9c3; color:#854d0e; }
  .pill.tr   { background:#e0f2fe; color:#075985; }
  .pill.gr   { background:#d1fae5; color:#065f46; }
  .pill.dp2  { background:#fff7ed; color:#c2410c; }
  .pill.misc { background:#f3f4f6; color:#374151; }

  .section-title { font-size: 13.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; border-left: 3px solid var(--accent); padding-left: 10px; }
  .problem-card p { margin: 8px 0; font-size: 15px; }
  .intuition { background: #f5f3ff; border-left: 4px solid #8b5cf6; border-radius: 6px; padding: 12px 16px; margin: 8px 0; }
  .formula { background: #ecfeff; border-left: 4px solid #06b6d4; border-radius: 6px; padding: 10px 16px; margin: 8px 0; font-family: "JetBrains Mono", Consolas, monospace; font-size: 13.5px; overflow-x: auto; white-space: pre; }
  .hints, .tips { margin: 6px 0 6px 4px; padding: 0 0 0 22px; }
  .hints li, .tips li { margin: 6px 0; font-size: 14.5px; }
  .tips-block { background: #fef9c3; border-left: 4px solid #ca8a04; border-radius: 6px; padding: 10px 16px; margin: 8px 0; }
  .complexity { margin-top: 12px; color: var(--muted); font-size: 13.5px; }
  .cheat-table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; font-size: 14px; }
  .cheat-table th, .cheat-table td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
  .cheat-table th { background: #ede9fe; color: var(--accent); font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; }
  .cheat-table td:first-child { font-family: "JetBrains Mono", Consolas, monospace; background: #f5f3ff; white-space: nowrap; color: #5b21b6; }
  .cheat-table tr:nth-child(even) td:not(:first-child) { background: #fafbff; }

  pre.code { background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.55; margin: 6px 0; }
  pre.code code { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; }
  .kw { color: var(--kw); font-weight: 600; }
  .typ { color: var(--typ); font-weight: 500; }
  .bi { color: var(--bi); font-weight: 500; }
  .str { color: var(--str); }
  .cmt { color: var(--cmt); font-style: italic; }
  .num { color: var(--num); }

  .nav-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 60; box-shadow: 0 -2px 8px rgba(0,0,0,.04); }
  .nav-btn { display: inline-flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--fg); font-weight: 500; }
  .nav-btn:hover:not(:disabled) { background: #ede9fe; color: var(--accent); border-color: #c4b5fd; }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .nav-info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kbd { display: inline-block; border: 1px solid #d0d7de; border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; background: #f6f8fa; font-family: monospace; font-size: 11px; color: #444; }

  body.brief-mode .nav-bar { display: none; }
  .brief-root { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
  .brief-root .brief-header { text-align: center; margin-bottom: 24px; }
  .brief-root .brief-subtitle { font-size: 11px; letter-spacing: 8px; color: var(--muted); margin-bottom: 8px; }
  .brief-root .brief-title { font-size: clamp(28px, 6vw, 48px); font-weight: 900; margin: 0; background: linear-gradient(90deg, #7c3aed, #db2777, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -1px; }
  .brief-root .brief-tagline { color: var(--muted); margin-top: 8px; font-size: 13px; }
  .brief-root .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 24px; margin-bottom: 20px; }
  .brief-root .panel h3 { margin: 0 0 12px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .brief-root .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .brief-root .card-mini { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: #f5f3ff; }
  .brief-root .card-mini b { color: var(--accent); display: block; margin-bottom: 4px; font-size: 13.5px; font-family: "JetBrains Mono", Consolas, monospace; }
  .brief-root .card-mini span { color: var(--muted); font-size: 13px; }
  .brief-root .flow { border: 1px dashed var(--border); border-radius: 12px; padding: 16px; background: var(--code-bg); font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; line-height: 1.9; overflow-x: auto; white-space: pre; margin: 0; color: var(--fg); }
  .brief-root .flow .q { color: var(--accent); font-weight: 700; }
  .brief-root .flow .a { color: var(--str); }
  .brief-root .flow .alg { color: var(--bi); font-weight: 700; }

  @media (max-width: 600px) {
    .topbar { padding-left: 70px; padding-right: 70px; }
    main { padding: 20px 14px 130px; }
    .problem-card { padding: 18px 18px; }
    .problem-card h2 { font-size: 19px; }
  }
  .theme-toggle { position: fixed; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,.08); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1001; font-size: 20px; line-height: 1; color: var(--fg); transition: background .15s, color .15s, border-color .15s, transform .15s; }
  .theme-toggle:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }

  [data-theme="dark"] {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --accent: #c084fc;
    --border: #30363d; --card: #161b22; --code-bg: #0b0f15; --code-fg: #e6edf3;
    --kw: #ff7b72; --typ: #d2a8ff; --bi: #ffa657; --str: #a5d6ff; --cmt: #8b949e; --num: #79c0ff;
  }
  [data-theme="dark"] .hamburger { background: var(--card); }
  [data-theme="dark"] .hamburger span { background: var(--fg); }
  [data-theme="dark"] .sidebar { background: var(--card); }
  [data-theme="dark"] .sidebar a { color: var(--fg); }
  [data-theme="dark"] .sidebar a:hover, [data-theme="dark"] .sidebar a.active { background: rgba(192,132,252,.15); color: var(--accent); }
  [data-theme="dark"] .topbar { background: var(--card); }
  [data-theme="dark"] .tab { background: #0d1117; border-color: var(--border); }
  [data-theme="dark"] .tab:hover { background: #1c2128; color: var(--fg); }
  [data-theme="dark"] .tab.active { background: var(--card); border-bottom-color: var(--card); color: var(--fg); }
  [data-theme="dark"] .num-tag { background: rgba(192,132,252,.15); color: var(--accent); }
  [data-theme="dark"] .intuition { background: rgba(139,92,246,.10); }
  [data-theme="dark"] .formula { background: rgba(6,182,212,.10); }
  [data-theme="dark"] .tips-block { background: rgba(202,138,4,.10); }
  [data-theme="dark"] .pill      { background: rgba(91,33,182,.18);  color: #ddd6fe; }
  [data-theme="dark"] .pill.arr  { background: rgba(30,64,175,.18); color: #bfdbfe; }
  [data-theme="dark"] .pill.str  { background: rgba(157,23,77,.18); color: #fbcfe8; }
  [data-theme="dark"] .pill.dp   { background: rgba(146,64,14,.18); color: #fde68a; }
  [data-theme="dark"] .pill.bs   { background: rgba(22,101,52,.18); color: #bbf7d0; }
  [data-theme="dark"] .pill.bt   { background: rgba(91,33,182,.18); color: #ddd6fe; }
  [data-theme="dark"] .pill.ll   { background: rgba(133,77,14,.18); color: #fef08a; }
  [data-theme="dark"] .pill.tr   { background: rgba(7,89,133,.18);  color: #bae6fd; }
  [data-theme="dark"] .pill.gr   { background: rgba(6,95,70,.18);   color: #6ee7b7; }
  [data-theme="dark"] .pill.dp2  { background: rgba(194,65,12,.18); color: #fed7aa; }
  [data-theme="dark"] .pill.misc { background: rgba(55,65,81,.30);  color: #d1d5db; }
  [data-theme="dark"] .nav-bar { background: var(--card); }
  [data-theme="dark"] .nav-btn { background: var(--card); color: var(--fg); }
  [data-theme="dark"] .nav-btn:hover:not(:disabled) { background: rgba(192,132,252,.15); color: var(--accent); border-color: var(--accent); }
  [data-theme="dark"] .kbd { background: #1c2128; border-color: var(--border); color: var(--muted); }
  [data-theme="dark"] pre.code { background: var(--code-bg); }
  [data-theme="dark"] .overlay { background: rgba(0,0,0,.55); }
  [data-theme="dark"] .cheat-table th { background: rgba(192,132,252,.15); color: var(--accent); }
  [data-theme="dark"] .cheat-table td:first-child { background: var(--code-bg); color: #ddd6fe; }
  [data-theme="dark"] .cheat-table tr:nth-child(even) td:not(:first-child) { background: rgba(255,255,255,.02); }
  [data-theme="dark"] .brief-root .card-mini { background: rgba(192,132,252,.07); }
</style>
</head>
<body>
<button class="hamburger" id="hamburger" aria-label="Open menu"><span></span><span></span><span></span></button>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar"><h2>Table of Contents</h2><div id="toc"></div></aside>
<header class="topbar">
  <h1>LeetCode Pattern Templates — Java Boilerplate, Easy to Adapt</h1>
  <p>Click a difficulty tab. Use <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> arrow keys to navigate.</p>
  <div class="tabs" id="tabs">
    <div class="tab brief" data-diff="brief"><span class="dot"></span>Brief</div>
    <div class="tab veasy" data-diff="veasy"><span class="dot"></span>Foundations<span class="count" id="cnt-veasy"></span></div>
    <div class="tab easy"  data-diff="easy"><span class="dot"></span>Easy<span class="count" id="cnt-easy"></span></div>
    <div class="tab med"   data-diff="med"><span class="dot"></span>Medium<span class="count" id="cnt-med"></span></div>
    <div class="tab hard"  data-diff="hard"><span class="dot"></span>Hard<span class="count" id="cnt-hard"></span></div>
  </div>
</header>
<main id="main"></main>
<div class="nav-bar">
  <button class="nav-btn" id="prev">&larr; Previous</button>
  <div class="nav-info" id="nav-info"></div>
  <button class="nav-btn" id="next">Next &rarr;</button>
</div>
<script>
const PROBLEMS = [];


PROBLEMS.push({
  num: 0, title: "How to Use This Guide — adapt-don't-rewrite", diff: "veasy",
  family: "Foundations",
  problem: "This guide is a TEMPLATE LIBRARY for the ~35 patterns that cover roughly 90% of LeetCode mediums and hards. Each card has: when to recognise the pattern, the canonical Java template, comments showing where to swap in your problem-specific bits, and 5-10 LeetCode problems where this template applies almost verbatim.",
  intuition: "The interview skill isn't reinventing algorithms under pressure — it's recognising the pattern from the prompt and SWAPPING the small problem-specific bits into a template you know cold. Memorise the templates here, practise filling them in, and your time-to-correct-solution drops dramatically.",
  hints: [
    "Each template has clearly-marked TODO sections — those are the bits you customise per problem.",
    "Templates are deliberately verbose so the comments explain intent. Strip them once you've internalised.",
    "The cheatsheet table on most cards lists 5-10 LeetCode problems where the template applies almost as-is.",
    "Difficulty tag = the difficulty of the PATTERN itself, not the LeetCode-rated problems it solves.",
    "Templates assume Java 17+ (records, var, switch expressions). Backporting to older Java is mechanical."
  ],
  tips: [
    "Practice by SOLVING in your head, not typing — pattern-matching first, then code. Speed comes from recognition, not typing.",
    "If you bomb a problem, REVISIT it 24-48h later. Spaced repetition is the only thing that makes patterns stick.",
    "When two patterns could fit, pick the one with cleaner edge cases on YOUR problem.",
    "The prompt is the strongest signal. 'subarray', 'longest', 'k-th', 'palindrome', 'two arrays', 'tree path', 'rotated array' — each maps to a small set of templates."
  ],
  cheatsheetHtml: `
    <table class="cheat-table">
      <thead><tr><th>Family</th><th>Templates</th></tr></thead>
      <tbody>
        <tr><td>Two Pointers / Sliding Window</td><td>opposite-ends, fast/slow, fixed-window, variable-window, monotonic deque</td></tr>
        <tr><td>Binary Search</td><td>boundary, on answer (parametric), rotated array, peak finding</td></tr>
        <tr><td>Hash Map / Counting</td><td>two-sum lookup, prefix-sum + map, group-by, frequency counter</td></tr>
        <tr><td>Stack</td><td>monotonic stack, parentheses, expression eval</td></tr>
        <tr><td>Heap / PriorityQueue</td><td>top-K, k-way merge, scheduling</td></tr>
        <tr><td>Linked List</td><td>fast/slow (cycle, mid), reverse, merge</td></tr>
        <tr><td>Trees</td><td>DFS recursion, BFS level-order, tree DP, LCA, serialize</td></tr>
        <tr><td>Graphs</td><td>BFS, DFS, Dijkstra, topological, Union-Find, MST, bipartite</td></tr>
        <tr><td>Backtracking</td><td>subsets, permutations, combinations, n-queens</td></tr>
        <tr><td>DP</td><td>1D, 2D, knapsack, LIS, LCS, edit distance, partition, interval, bitmask, digit, tree DP</td></tr>
        <tr><td>Bit Manipulation</td><td>set/clear/toggle bit, count bits, XOR tricks, bitmask</td></tr>
        <tr><td>Greedy</td><td>interval scheduling, sort + scan, exchange argument</td></tr>
        <tr><td>Math</td><td>GCD, sieve, modular arithmetic, fast power</td></tr>
      </tbody>
    </table>
  `,
  code: `// HOW TO USE A TEMPLATE
//
// 1) Read the prompt twice; underline the keyword(s).
// 2) Match keyword → pattern (use the Brief tab's decision flow).
// 3) Open the template card; copy the template block.
// 4) Replace the marked sections (// TODO ...) with your problem's specifics.
// 5) Run the small example by hand to verify the swap is correct.
// 6) Submit, then revisit any failed test case to refine.
//
// Each template's comments mark exactly the "knobs" you adjust:
//   // TODO: predicate / condition / score function / state shape
//
// Once you've solved 5+ problems with a template, you can drop the comments
// and write it from memory in ~60 seconds.`,
  complexity: "Reading time: a few minutes per pattern. Memorisation: a couple of weeks of focused practice."
});


/* ========== TWO POINTERS / SLIDING WINDOW ========== */

PROBLEMS.push({
  num: 1, title: "Two Pointers — opposite ends", diff: "easy",
  family: "Two Pointers",
  problem: "Two pointers starting from opposite ends of a sorted array, moving toward each other. Used for: two-sum on sorted, container with most water, valid palindrome, 3Sum / 4Sum.",
  intuition: "Sorted input + 'pair / triple with property' = opposite-ends. The sortedness lets you decide direction in O(1): too small → move left up; too big → move right down. O(N) after the sort.",
  hints: [
    "Initialise: int l = 0, r = n - 1.",
    "Loop while (l < r): evaluate; advance l, r, or both based on the condition.",
    "For 3Sum: outer loop fixes a[i], inner uses two pointers on a[i+1..n-1].",
    "Skip duplicates by advancing past equal values after a hit.",
    "Don't forget to sort first if input isn't sorted."
  ],
  tips: [
    "If input ISN'T sorted but you don't need original indices, sort and use two pointers.",
    "If you DO need original indices (Two Sum I), HashMap is better than sort + two pointers.",
    "Palindrome check: l < r, compare a[l] vs a[r]; advance both. Add isAlphaNum filter for the 'easy' Valid Palindrome variant.",
    "LeetCode hits: Two Sum II, 3Sum, 4Sum, Container With Most Water, Trapping Rain Water (with twist), Valid Palindrome."
  ],
  code: `// TEMPLATE — opposite-ends two pointers on a SORTED array
import java.util.*;

List<List<Integer>> twoPointersTemplate(int[] a, int target) {
    Arrays.sort(a);                            // remove if already sorted
    List<List<Integer>> out = new ArrayList<>();
    int l = 0, r = a.length - 1;
    while (l < r) {
        int sum = a[l] + a[r];                 // TODO: replace with your condition
        if (sum == target) {
            out.add(List.of(a[l], a[r]));
            l++; r--;

    int[] parent, rank;
    int count;

    UnionFind(int n) {
        parent = new int[n]; rank = new int[n]; count = n;
        for (int i = 0; i < n; i++) parent[i] = i;
    }

    int find(int x) {
        while (parent[x] != x) { parent[x] = parent[parent[x]]; x = parent[x]; }

        count--;

    }

class Trie {
    static class Node { Node[] kids = new Node[26]; boolean end; }
    Node root = new Node();

    public void insert(String w) {
        Node cur = root;
        for (char c : w.toCharArray()) {
            int i = c - 'a';
            if (cur.kids[i] == null) cur.kids[i] = new Node();
            cur = cur.kids[i];
        }
        cur.end = true;
    }

    public boolean search(String w)        { Node n = walk(w); return n != null && n.end; }
    public boolean startsWith(String pref) { return walk(pref) != null; }

    private Node walk(String s) {
        Node cur = root;
        for (char c : s.toCharArray()) {
            int i = c - 'a';

            cur = cur.kids[i];

    for (int[] it : intervals) {
        if (it[0] >= end) { count++; end = it[1]; }
    }

int gcd(int a, int b) { while (b != 0) { int t = a % b; a = b; b = t; } return a; }
long lcm(int a, int b) { return (long) a / gcd(a, b) * b; }

// Sieve
boolean[] sieve(int n) {
    boolean[] composite = new boolean[n + 1];
    for (int i = 2; (long) i * i <= n; i++)
        if (!composite[i])
            for (int j = i * i; j <= n; j += i) composite[j] = true;
    return composite;
}

// Fast power: base^n  (mod MOD if needed)
long fastPow(long base, long n, long MOD) {
    long r = 1 % MOD; base %= MOD;
    while (n > 0) {
        if ((n & 1) == 1) r = r * base % MOD;
        base = base * base % MOD;
        n >>= 1;
    }
    return r;

String longestPalindrome(String s) {
    int start = 0, len = 0;
    for (int i = 0; i < s.length(); i++) {
        int a = expand(s, i, i);                 // odd
        int b = expand(s, i, i + 1);             // even
        int m = Math.max(a, b);
        if (m > len) { len = m; start = i - (m - 1) / 2; }
    }
    return s.substring(start, start + len);
}
int expand(String s, int l, int r) {
    while (l >= 0 && r < s.length() && s.charAt(l) == s.charAt(r)) { l--; r++; }
    return r - l - 1;
}

// KMP failure function
int[] kmpFailure(String p) {

    for (int i = 1, k = 0; i < p.length(); i++) {
        while (k > 0 && p.charAt(k) != p.charAt(i)) k = pi[k - 1];
        if (p.charAt(k) == p.charAt(i)) k++;
        pi[i] = k;

    return pi;

const DIFF_LABEL = { veasy: 'Foundations', easy: 'Easy', med: 'Medium', hard: 'Hard', brief: 'Brief' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightJava(src) {
  let s = escapeHtml(src);
  const stash = [];
  const stashIt = (html) => { stash.push(html); return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001'; };
  s = s.replace(/\/\/[^\n]*/g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/&quot;([^&\n]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  s = s.replace(/&#39;.&#39;|&#39;\\.&#39;/g, m => stashIt('<span class="str">' + m + '</span>'));

  const types = ['String','Integer','Long','Boolean','Character','Double','Float','Object',
    'List','Map','Set','HashMap','HashSet','TreeMap','TreeSet','LinkedHashMap','LinkedHashSet',
    'ArrayList','LinkedList','ArrayDeque','Queue','Deque','PriorityQueue','BlockingQueue',
    'StringBuilder','Optional','Comparator','Comparable','Objects','Arrays','Collections','Iterator','Iterable',
    'Math','Random','TreeNode','Node','ListNode','UnionFind','Trie','MedianFinder','IntPredicate'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  const kws = ['void','int','long','boolean','char','double','float','byte','short',
    'public','private','protected','static','final','abstract','class','interface','enum','record',
    'return','if','else','for','while','do','break','continue','switch','case','default','yield',
    'new','null','true','false','this','super','try','catch','finally','throw','throws',
    'import','package','extends','implements','instanceof','var'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  s = s.replace(/\b(0x[0-9A-Fa-f_]+L?|\d+(?:_\d+)*L?)\b/g, '<span class="num">$1</span>');
  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

    { b: 'Topo Kahn',             s: "in-degree + queue, emit zeros" },
    { b: 'Backtracking',          s: "add → recurse → REMOVE" },
    { b: 'Knapsack 0/1',          s: "1D dp; loop w from W down to weight" },
    { b: 'Knapsack unbounded',    s: "1D dp; loop w from weight up to W" },
    { b: 'LIS O(N log N)',        s: "tails[]; binary-search insert" },
    { b: 'Interval DP',           s: "len 2..N outer; i, j inside" },
    { b: 'Tree DP',               s: "post-order returns chain; global = path" },
    { b: 'XOR cancellation',      s: "result ^= x  (pairs cancel)" },
  ];

  const families_html = families.map(f => `
    <div class="panel">
      <h3>${escapeHtml(f.title)}</h3>
      <div class="grid">
        ${f.cmds.map(c => `<div class="card-mini"><b>${escapeHtml(c[0])}</b><span>${escapeHtml(c[1])}</span></div>`).join('')}
      </div>
    </div>`).join('');

  const recipes_html = `
    <div class="panel">
      <h3>One-Liner Recipes</h3>
      <div class="grid">
        ${recipeCards.map(c => `<div class="card-mini"><b>${escapeHtml(c.b)}</b><span>${escapeHtml(c.s)}</span></div>`).join('')}
      </div>
    </div>`;

  return `
    <div class="brief-root">
      <header class="brief-header">
        <div class="brief-subtitle">L E E T C O D E &nbsp; T E M P L A T E S</div>
        <h1 class="brief-title">36 Patterns · Copy · Adapt · Submit</h1>
        <p class="brief-tagline">Read the prompt. Match the pattern. Drop in the template. Tweak the marked spots.</p>
      </header>
      <div class="panel">
        <h3>The 4-Question Decision Flow</h3>
        <div class="flow">${decisionFlow}</div>
      </div>
      ${recipes_html}
      ${families_html}
    </div>`;
}

renderTabs();
bindTabs();
renderTOC();
render();
</script>
