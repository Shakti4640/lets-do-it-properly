ICON_UPDATE<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>~100 Linux Commands — Cheatsheet, Why You Use It, and Recipes</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<style>
  :root {
    --bg: #f6f7fb;
    --fg: #1f2330;
    --muted: #6b7280;
    --accent: #16a34a;          /* terminal green */
    --accent2: #0d9488;
    --border: #e3e6ee;
    --card: #ffffff;
    --code-bg: #0b1020;
    --code-fg: #e6edf3;
    --kw:  #ff8a65;             /* keywords / builtins */
    --typ: #c084fc;             /* commands */
    --bi:  #ffd166;             /* flags */
    --str: #a5d6ff;             /* strings */
    --cmt: #8b949e;             /* comments */
    --num: #79c0ff;             /* numbers */
    --pth: #9ae6b4;             /* paths */
    --veasy: #0891b2;
    --easy:  #16a34a;
    --med:   #d97706;
    --hard:  #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
  }

  /* HAMBURGER + TOC SIDEBAR */
  .hamburger {
    position: fixed; top: 14px; left: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 5px; cursor: pointer; z-index: 1001;
  }
  .hamburger span {
    display: block; width: 22px; height: 2.5px;
    background: #1e1e25; border-radius: 2px;
    transition: transform .25s, opacity .2s;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

  .sidebar {
    position: fixed; top: 0; left: 0;
    height: 100vh; width: 360px; max-width: 90vw;
    background: #ffffff;
    border-right: 1px solid var(--border);
    box-shadow: 2px 0 14px rgba(0,0,0,.06);
    transform: translateX(-100%);
    transition: transform .28s ease;
    overflow-y: auto;
    z-index: 1000;
    padding: 70px 18px 32px;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2 {
    margin: 0 0 12px;
    font-size: 13px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .sidebar .group-title {
    margin-top: 18px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .sidebar a {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px;
    margin: 2px 0;
    text-decoration: none;
    color: #1f2330;
    border-radius: 6px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .sidebar a:hover { background: #dcfce7; color: var(--accent); }
  .sidebar a.active { background: #dcfce7; color: var(--accent); font-weight: 600; }
  .sidebar a .num {
    display: inline-block;
    min-width: 32px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    font-family: "JetBrains Mono", Consolas, monospace;
  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.25);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 999;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  /* HERO + TABS */
  .topbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 18px 24px 0;
    padding-left: 76px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 { margin: 0 0 6px; font-size: 20px; }
  .topbar p  { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: #f1f3f9;
    color: var(--muted);
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    transition: background .15s;
  }
  .tab:hover { background: #e7eaf3; color: var(--fg); }
  .tab.active {
    background: #ffffff;
    color: var(--fg);
    border-bottom: 2px solid #ffffff;
    margin-bottom: -1px;
    box-shadow: 0 -2px 0 var(--accent) inset;
  }
  .tab .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: 1px;
  }
  .tab.veasy .dot { background: var(--veasy); }
  .tab.easy  .dot { background: var(--easy); }
  .tab.med   .dot { background: var(--med); }
  .tab.hard  .dot { background: var(--hard); }
  .tab.brief .dot { background: #8b5cf6; }
  .tab .count { color: var(--muted); margin-left: 6px; font-weight: 500; }

  /* MAIN */
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 24px 120px;
  }
  .problem-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .problem-card h2 {
    margin: 0 0 6px;
    font-size: 24px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .num-tag {
    background: #dcfce7; color: var(--accent);
    padding: 3px 10px; border-radius: 6px;
    font-size: 13px; font-weight: 700;
    font-family: "JetBrains Mono", Consolas, monospace;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff; font-weight: 700; letter-spacing: .05em;
  }
  .badge.veasy { background: var(--veasy); }
  .badge.easy  { background: var(--easy); }
  .badge.med   { background: var(--med); }
  .badge.hard  { background: var(--hard); }
  .pill {
    display: inline-block;
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 999px;
    background: #ecfdf5;
    color: #047857;
    font-weight: 600;
    letter-spacing: .03em;
  }
  .pill.fs   { background:#eef2ff; color:#3730a3; }
  .pill.proc { background:#fef3c7; color:#92400e; }
  .pill.net  { background:#fce7f3; color:#9d174d; }
  .pill.text { background:#e0e7ff; color:#3730a3; }
  .pill.sec  { background:#fef2f2; color:#991b1b; }
  .pill.pkg  { background:#f3e8ff; color:#6b21a8; }
  .pill.sys  { background:#fff7ed; color:#c2410c; }

  .section-title {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 8px;
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }
  .problem-card p { margin: 8px 0; font-size: 15px; }
  .intuition {
    background: #f0fdf4;
    border-left: 4px solid #22c55e;
    border-radius: 6px;
    padding: 12px 16px;
    margin: 8px 0;
  }
  .formula {
    background: #ecfeff;
    border-left: 4px solid #06b6d4;
    border-radius: 6px;
    padding: 10px 16px;
    margin: 8px 0;
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    font-size: 13.5px;
    overflow-x: auto;
    white-space: pre;
  }
  .hints, .tips { margin: 6px 0 6px 4px; padding: 0 0 0 22px; }
  .hints li, .tips li { margin: 6px 0; font-size: 14.5px; }
  .tips-block {
    background: #fff7ed;
    border-left: 4px solid #f59e0b;
    border-radius: 6px;
    padding: 10px 16px;
    margin: 8px 0;
  }
  .complexity { margin-top: 12px; color: var(--muted); font-size: 13.5px; }

  /* CHEATSHEET TABLE */
  .cheat-table {
    border-collapse: collapse;
    width: 100%;
    margin: 8px 0 16px;
    font-size: 14px;
  }
  .cheat-table th, .cheat-table td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  .cheat-table th {
    background: #dcfce7;
    color: var(--accent);
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .cheat-table td:first-child {
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    background: #f0fdf4;
    white-space: nowrap;
    color: #166534;
  }
  .cheat-table tr:nth-child(even) td:not(:first-child) { background: #fafbff; }

  /* CODE — terminal style */
  pre.code {
    background: var(--code-bg);
    color: var(--code-fg);
    border: 1px solid #1c2333;
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 13.5px;
    line-height: 1.55;
    margin: 6px 0;
  }
  pre.code code {
    font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
  }
  .kw  { color: var(--kw);  font-weight: 600; }   /* shell keywords (if/then/etc) */
  .typ { color: var(--typ); font-weight: 600; }   /* command name */
  .bi  { color: var(--bi);  font-weight: 500; }   /* flags */
  .str { color: var(--str); }                     /* strings */
  .cmt { color: var(--cmt); font-style: italic; }
  .num { color: var(--num); }
  .pth { color: var(--pth); }                     /* paths starting with / or ~ */
  .pmt { color: #4ade80; font-weight: 700; }      /* prompt $ # */

  /* PREV/NEXT BAR */
  .nav-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #ffffff;
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    z-index: 60;
    box-shadow: 0 -2px 8px rgba(0,0,0,.04);
  }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--fg);
    font-weight: 500;
  }
  .nav-btn:hover:not(:disabled) { background: #dcfce7; color: var(--accent); border-color: #86efac; }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .nav-info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kbd {
    display: inline-block;
    border: 1px solid #d0d7de;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    background: #f6f8fa;
    font-family: monospace;
    font-size: 11px;
    color: #444;
  }

  /* BRIEF TAB */
  body.brief-mode .nav-bar { display: none; }
  .brief-root { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
  .brief-root .brief-header { text-align: center; margin-bottom: 24px; }
  .brief-root .brief-subtitle {
    font-size: 11px; letter-spacing: 8px; color: var(--muted); margin-bottom: 8px;
  }
  .brief-root .brief-title {
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 900; margin: 0;
    background: linear-gradient(90deg, #16a34a, #06b6d4, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
  }
  .brief-root .brief-tagline { color: var(--muted); margin-top: 8px; font-size: 13px; }
  .brief-root .panel {
    background: var(--card); border-radius: 16px;
    border: 1px solid var(--border); padding: 24px; margin-bottom: 20px;
  }
  .brief-root .panel h3 {
    margin: 0 0 12px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent);
  }
  .brief-root .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
  .brief-root .card-mini {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; background: #f0fdf4;
  }
  .brief-root .card-mini b { color: var(--accent); display:block; margin-bottom:4px; font-size:13.5px;
    font-family: "JetBrains Mono", Consolas, monospace; }
  .brief-root .card-mini span { color: var(--muted); font-size: 13px; }
  .brief-root .flow {
    border: 1px dashed var(--border); border-radius: 12px;
    padding: 16px; background: var(--code-bg);
    color: var(--code-fg);
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 13px; line-height: 1.9;
    overflow-x: auto;
    white-space: pre;
    margin: 0;
  }
  .brief-root .flow .q { color: #4ade80; font-weight:700; }
  .brief-root .flow .a { color: #fbbf24; }
  .brief-root .flow .alg { color: #c084fc; font-weight:700; }

  @media (max-width: 600px) {
    .topbar { padding-left: 70px; padding-right: 70px; }
    main { padding: 20px 14px 130px; }
    .problem-card { padding: 18px 18px; }
    .problem-card h2 { font-size: 19px; }
  }

  /* THEME TOGGLE */
  .theme-toggle {
    position: fixed; top: 14px; right: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 1001;
    font-size: 20px;
    line-height: 1;
    color: var(--fg);
    transition: background .15s, color .15s, border-color .15s, transform .15s;
  }
  .theme-toggle:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }
  .theme-toggle:active { transform: scale(0.95); }

  /* DARK MODE */
  [data-theme="dark"] {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #4ade80;
    --border: #30363d;
    --card: #161b22;
    --code-bg: #060a14;
    --code-fg: #e6edf3;
  }
  [data-theme="dark"] .hamburger { background: var(--card); }
  [data-theme="dark"] .hamburger span { background: var(--fg); }
  [data-theme="dark"] .sidebar { background: var(--card); box-shadow: 2px 0 14px rgba(0,0,0,.4); }
  [data-theme="dark"] .sidebar a { color: var(--fg); }
  [data-theme="dark"] .sidebar a:hover,
  [data-theme="dark"] .sidebar a.active { background: rgba(74,222,128,.15); color: var(--accent); }
  [data-theme="dark"] .topbar { background: var(--card); }
  [data-theme="dark"] .tab { background: #0d1117; border-color: var(--border); }
  [data-theme="dark"] .tab:hover { background: #1c2128; color: var(--fg); }
  [data-theme="dark"] .tab.active { background: var(--card); border-bottom-color: var(--card); color: var(--fg); }
  [data-theme="dark"] .num-tag { background: rgba(74,222,128,.15); color: var(--accent); }
  [data-theme="dark"] .intuition { background: rgba(34,197,94,.10); }
  [data-theme="dark"] .formula { background: rgba(6,182,212,.10); }
  [data-theme="dark"] .tips-block { background: rgba(245,158,11,.10); }
  [data-theme="dark"] .pill { background: rgba(4,120,87,.18); color: #a7f3d0; }
  [data-theme="dark"] .pill.fs   { background: rgba(67,56,202,.18);  color: #c7d2fe; }
  [data-theme="dark"] .pill.proc { background: rgba(146,64,14,.18); color: #fde68a; }
  [data-theme="dark"] .pill.net  { background: rgba(157,23,77,.18); color: #fbcfe8; }
  [data-theme="dark"] .pill.text { background: rgba(55,48,163,.18); color: #c7d2fe; }
  [data-theme="dark"] .pill.sec  { background: rgba(153,27,27,.18); color: #fecaca; }
  [data-theme="dark"] .pill.pkg  { background: rgba(107,33,168,.18); color: #e9d5ff; }
  [data-theme="dark"] .pill.sys  { background: rgba(194,65,12,.18); color: #fed7aa; }
  [data-theme="dark"] .nav-bar { background: var(--card); box-shadow: 0 -2px 8px rgba(0,0,0,.3); }
  [data-theme="dark"] .nav-btn { background: var(--card); color: var(--fg); }
  [data-theme="dark"] .nav-btn:hover:not(:disabled) { background: rgba(74,222,128,.15); color: var(--accent); border-color: var(--accent); }
  [data-theme="dark"] .kbd { background: #1c2128; border-color: var(--border); color: var(--muted); }
  [data-theme="dark"] pre.code { background: var(--code-bg); }
  [data-theme="dark"] .overlay { background: rgba(0,0,0,.55); }
  [data-theme="dark"] .cheat-table th { background: rgba(74,222,128,.15); color: var(--accent); }
  [data-theme="dark"] .cheat-table td:first-child { background: var(--code-bg); color: #86efac; }
  [data-theme="dark"] .cheat-table tr:nth-child(even) td:not(:first-child) { background: rgba(255,255,255,.02); }
  [data-theme="dark"] .brief-root .card-mini { background: rgba(74,222,128,.07); }
</style>
</head>
<body>

<button class="hamburger" id="hamburger" aria-label="Open menu">
  <span></span><span></span><span></span>
</button>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <h2>Table of Contents</h2>
  <div id="toc"></div>
</aside>

<header class="topbar">
  <h1>~100 Linux Commands — Cheatsheet, Why You Use It &amp; Recipes</h1>
  <p>Click a difficulty tab. Use <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> arrow keys to navigate within the tab.</p>
  <div class="tabs" id="tabs">
    <div class="tab veasy" data-diff="veasy"><span class="dot"></span>Foundations<span class="count" id="cnt-veasy"></span></div>
    <div class="tab easy"  data-diff="easy"><span class="dot"></span>Easy<span class="count" id="cnt-easy"></span></div>
    <div class="tab med"   data-diff="med"><span class="dot"></span>Medium<span class="count" id="cnt-med"></span></div>
    <div class="tab hard"  data-diff="hard"><span class="dot"></span>Hard<span class="count" id="cnt-hard"></span></div>
    <div class="tab brief" data-diff="brief"><span class="dot"></span>Brief</div>
  </div>
</header>

<main id="main"></main>

<div class="nav-bar">
  <button class="nav-btn" id="prev">&larr; Previous</button>
  <div class="nav-info" id="nav-info"></div>
  <button class="nav-btn" id="next">Next &rarr;</button>
</div>

<script>
/* ----------------------- DATA: ALL COMMANDS ----------------------- */
const PROBLEMS = [];


/* ===================== FOUNDATION ===================== */
PROBLEMS.push({
  num: 0, title: "The Linux Command Mental Model (read this first)", diff: "veasy",
  family: "Foundations",
  problem: "Almost every Linux command follows the same shape: command [flags] [args] — the command does one thing well, flags tweak how it behaves, and args tell it what to operate on. Output goes to stdout (1), errors go to stderr (2), and you can pipe (|) the output of one command as the input of the next. That's it. The other 95% of mastering Linux is just learning which commands to chain.",
  intuition: "The shell is a glue language built around three primitives: PROCESSES (each command is a program), FILES (everything is a file — devices, sockets, /proc, /sys), and PIPES (composing programs together via streams of bytes). Once you internalise this, the 100 commands stop feeling like 100 things to memorise and start feeling like a small set of building blocks you compose. ls, cat, grep, sort, uniq, wc, head, tail, find, xargs, sed, awk — that's already 80% of daily work.",
  hints: [
    "Two prompts in a terminal: $ means a regular user, # means root.",
    "Streams: stdin (0) ← keyboard, stdout (1) → screen, stderr (2) → screen. Redirect with <, >, 2>, &>.",
    "Pipe |: command1 | command2 — stdout of #1 becomes stdin of #2. Build pipelines, not loops.",
    "Quoting matters: 'single' = literal, \"double\" = expand variables, `backtick` / $(cmd) = run a subshell.",
    "Exit code 0 = success, non-zero = failure. Chain with && (run if previous succeeded) or || (run if it failed).",
    "Help in three flavours: --help (quick), man cmd (full manual), tldr cmd (modern community examples)."
  ],
  tips: [
    "Tab-completion is your superpower — type the first 2-3 letters and press Tab.",
    "History: ↑/↓ arrows, Ctrl+R for reverse-search, !! re-runs the previous command, !$ is the last argument.",
    "Don't run as root unless you must. sudo for one-shot privilege; passwordless sudo for trusted scripts.",
    "When a command silently does nothing scary, that means it worked (Unix tradition).",
    "If a command is taking too long, Ctrl+C cancels it. Ctrl+Z suspends it (then `bg` or `fg`)."
  ],
  cheatsheetHtml: `
    <table class="cheat-table">
      <thead><tr><th>Family</th><th>Commands you'll use daily</th></tr></thead>
      <tbody>
        <tr><td>Navigation</td><td>pwd, ls, cd, tree, pushd, popd</td></tr>
        <tr><td>Files</td><td>cp, mv, rm, mkdir, rmdir, touch, ln, stat, file</td></tr>
        <tr><td>View / edit</td><td>cat, less, head, tail, nano, vim, view</td></tr>
        <tr><td>Search</td><td>grep, find, locate, which, type, fzf</td></tr>
        <tr><td>Text munging</td><td>sort, uniq, wc, cut, tr, sed, awk, paste, join, comm</td></tr>

/* ----------------------- RENDERING ENGINE ----------------------- */

const DIFF_LABEL = { veasy: 'Foundations', easy: 'Easy', med: 'Medium', hard: 'Hard', brief: 'Brief' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Lightweight Shell / Bash highlighter. Designed for the snippets in this guide
   (not a full bash parser — just makes the code blocks readable). */
function highlightShell(src) {
  let s = escapeHtml(src);
  const stash = [];
  const stashIt = (html) => {
    stash.push(html);
    return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001';
  };

  // line comments (#) — but NOT a leading # at line-start when followed by a !
  // and NOT inside numbers/colours we already produced. Simple form: # to end-of-line
  // as long as it is preceded by whitespace, line-start, or ;.
  s = s.replace(/(^|[\s;|&])(#[^\n]*)/g, (_, pre, c) => pre + stashIt('<span class="cmt">' + c + '</span>'));

  // double-quoted strings
  s = s.replace(/&quot;([^&\n]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  // single-quoted strings (no escapes inside)
  s = s.replace(/&#39;[^&\n]*?&#39;/g,                 m => stashIt('<span class="str">' + m + '</span>'));

  // prompt at start of a line: $  or  #  (followed by space)
  s = s.replace(/(^|\n)(\$|#) /g, (_, nl, ch) => nl + stashIt('<span class="pmt">' + ch + '</span>') + ' ');

  // long flags first, then short flags (so '--abc' wins over '-a')
  s = s.replace(/(?<=\s)--?[A-Za-z][A-Za-z0-9_-]*/g, m => stashIt('<span class="bi">' + m + '</span>'));

  // absolute paths (start with /) and home paths (start with ~/)
  s = s.replace(/(?<=\s)(~?\/[A-Za-z0-9_./*?-]+)/g, (m) => stashIt('<span class="pth">' + m + '</span>'));

  // common command names (highlighted as 'type')
  const cmds = ['ls','cd','pwd','cat','less','more','head','tail','echo','printf','mkdir','rmdir','touch',
    'cp','mv','rm','ln','stat','file','find','grep','locate','sort','uniq','cut','tr','sed','awk','wc',
    'tee','xargs','watch','diff','patch','tar','gzip','gunzip','zcat','zip','unzip','xz','bzip2','curl',
    'wget','ssh','scp','sftp','rsync','ping','traceroute','mtr','dig','nslookup','host','ip','ifconfig',
    'ss','netstat','nc','tcpdump','tshark','nmap','sudo','su','passwd','chmod','chown','chgrp','umask',
    'whoami','id','who','w','last','history','env','export','set','unset','alias','unalias','jobs','bg',
    'fg','nohup','disown','kill','pkill','killall','pidof','ps','top','htop','iotop','iostat','vmstat',
    'free','uptime','uname','date','cal','df','du','ncdu','lsblk','blkid','fdisk','parted','mount',
    'umount','systemctl','journalctl','service','crontab','at','atq','atrm','apt','apt-get','dnf','yum',
    'pacman','dpkg','rpm','snap','lsof','strace','ltrace','perf','sar','dstat','pidstat','ufw','iptables',
    'nftables','nft','fail2ban-client','ausearch','aureport','auditctl','augenrules','openssl','tmux',
    'screen','vim','vi','nano','git','jq','yq','docker','podman','kubectl','helm','make','tree','fzf',
    'parallel','inotifywait','inotifywatch','entr','dd','ddrescue','photorec','testdisk','shred',
    'pvcreate','vgcreate','lvcreate','lvextend','resize2fs','vgs','lvs','pvs','logrotate','mktemp',
    'unshare','nsenter','lsns','sysctl','hostnamectl','tldr','man','type','which','whereis','readlink',
    'realpath','pushd','popd','source','exec','trap','test','true','false','time','bpftrace','opensnoop',
    'execsnoop','tcplife','iotop','htop','btop','atop','bat','rg','fd','fzf','wireshark','smbclient',
    'getent','sshd','setsid'];
  const cmdRe = new RegExp('\\b(' + cmds.join('|') + ')\\b', 'g');
  s = s.replace(cmdRe, m => stashIt('<span class="typ">' + m + '</span>'));

  // shell keywords
  const kws = ['if','then','else','elif','fi','for','while','do','done','case','esac','in','function',
    'local','return','break','continue','export','source','let','select','time'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, m => stashIt('<span class="kw">' + m + '</span>'));

  // numbers (avoid being inside identifiers)
  s = s.replace(/(?<![A-Za-z_])\b(\d+(?:\.\d+)?)\b/g, '<span class="num">$1</span>');

  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

function getProblems(diff) {
  return PROBLEMS
    .filter(p => p.diff === diff)
    .sort((a, b) => a.num - b.num);
}

const state = { diff: 'veasy', idx: 0 };

function renderTOC() {
  const toc = document.getElementById('toc');
  const groups = [
    { diff: 'veasy', label: 'Foundations' },
    { diff: 'easy',  label: 'Easy' },
    { diff: 'med',   label: 'Medium' },
    { diff: 'hard',  label: 'Hard' },
  ];
  const html = groups.map(g => {
    const items = getProblems(g.diff)
      .map((p, i) => `<a data-diff="${g.diff}" data-idx="${i}"><span class="num">${p.num === 0 ? '★' : '#' + p.num}</span>${escapeHtml(p.title)}</a>`)
      .join('');
    return `<div class="group-title">${g.label}</div>${items}`;
  }).join('');
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      state.diff = a.dataset.diff;
      state.idx = +a.dataset.idx;
      render();
      toggleSidebar(false);
    });
  });
}

function renderTabs() {
  document.getElementById('cnt-veasy').textContent = '(' + getProblems('veasy').length + ')';
  document.getElementById('cnt-easy').textContent  = '(' + getProblems('easy').length + ')';
  document.getElementById('cnt-med').textContent   = '(' + getProblems('med').length + ')';
  document.getElementById('cnt-hard').textContent  = '(' + getProblems('hard').length + ')';
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      if (state.diff !== t.dataset.diff) {
        state.diff = t.dataset.diff;
        state.idx = 0;
        render();
      }
    };
  });
}

function familyPillClass(family) {
  if (!family) return '';
  const f = family.toLowerCase();
  if (f.includes('filesystem')) return 'fs';
  if (f.includes('process'))    return 'proc';
  if (f.includes('network'))    return 'net';
  if (f.includes('text'))       return 'text';
  if (f.includes('security'))   return 'sec';
  if (f.includes('packages'))   return 'pkg';
  if (f.includes('system'))     return 'sys';
  return '';
}

function render() {
  const main = document.getElementById('main');

  if (state.diff === 'brief') {
    document.body.classList.add('brief-mode');
    main.innerHTML = renderBriefView();
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.diff === state.diff);
    });
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  document.body.classList.remove('brief-mode');

  const problems = getProblems(state.diff);
  if (state.idx >= problems.length) state.idx = problems.length - 1;
  if (state.idx < 0) state.idx = 0;
  const p = problems[state.idx];
  const numTag = p.num === 0 ? '★ Foundation' : '#' + p.num;

  const cheatBlock = p.cheatsheetHtml
    ? `<div class="section-title">Cheatsheet</div>${p.cheatsheetHtml}`
    : '';

  const formulaBlock = p.formula
    ? `<div class="section-title">Format / Syntax</div><div class="formula">${escapeHtml(p.formula)}</div>`
    : '';

  const familyPill = p.family
    ? `<span class="pill ${familyPillClass(p.family)}">${escapeHtml(p.family)}</span>`
    : '';

  main.innerHTML = `
    <div class="problem-card">
      <h2>
        <span class="num-tag">${numTag}</span>
        ${escapeHtml(p.title)}
        <span class="badge ${p.diff}">${DIFF_LABEL[p.diff]}</span>
        ${familyPill}
      </h2>

      <div class="section-title">Why You Use It</div>
      <p>${escapeHtml(p.problem)}</p>

      <div class="section-title">Intuition</div>
      <div class="intuition">${escapeHtml(p.intuition)}</div>

      ${formulaBlock}
      ${cheatBlock}

      <div class="section-title">Step-by-step Hints</div>
      <ol class="hints">${p.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ol>

      <div class="section-title">Tips & Tricks</div>
      <div class="tips-block"><ul class="tips">${p.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>

      <div class="section-title">Shell Recipes</div>
      <pre class="code"><code>${highlightShell(p.code)}</code></pre>

      ${p.complexity ? `<div class="complexity"><b>Complexity / Cost:</b> ${escapeHtml(p.complexity)}</div>` : ''}
    </div>
  `;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.diff === state.diff);
  });

  document.getElementById('prev').disabled = state.idx === 0;
  document.getElementById('next').disabled = state.idx === problems.length - 1;
  document.getElementById('nav-info').textContent =
    `${DIFF_LABEL[state.diff]} · ${state.idx + 1} / ${problems.length}`;

  document.querySelectorAll('.sidebar a').forEach(a => {
    a.classList.toggle('active', a.dataset.diff === state.diff && +a.dataset.idx === state.idx);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextProblem() {
  const arr = getProblems(state.diff);
  if (state.idx < arr.length - 1) { state.idx++; render(); }
}
function prevProblem() {
  if (state.idx > 0) { state.idx--; render(); }
}
document.getElementById('prev').addEventListener('click', prevProblem);
document.getElementById('next').addEventListener('click', nextProblem);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') prevProblem();
  else if (e.key === 'ArrowRight') nextProblem();
  else if (e.key === 'Escape') toggleSidebar(false);
});

const hb = document.getElementById('hamburger');
const sb = document.getElementById('sidebar');
const ov = document.getElementById('overlay');
function toggleSidebar(open) {
  const isOpen = (typeof open === 'boolean') ? open : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  hb.classList.toggle('open', isOpen);
  ov.classList.toggle('show', isOpen);
}
hb.addEventListener('click', () => toggleSidebar());
ov.addEventListener('click', () => toggleSidebar(false));

/* theme toggle */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️';
    themeBtn.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙';
    themeBtn.title = 'Switch to dark mode';
  }
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('theme', next);
});

   ├── per filesystem      → <span class="alg">df -h</span>
   ├── per directory       → <span class="alg">du -sh */ | sort -h   /   ncdu</span>
   ├── deleted-but-open    → <span class="alg">lsof | grep deleted</span>
   └── inodes exhausted    → <span class="alg">df -i</span>

<span class="q">Q3.</span> Something is slow / unresponsive?
   ├── load + free RAM     → <span class="alg">uptime · free -h</span>
   ├── per-CPU / per-process CPU → <span class="alg">top · htop · pidstat -u 1</span>
   ├── disk I/O            → <span class="alg">iostat -xz 1 · iotop -oP</span>
   ├── what's on the wire  → <span class="alg">ss -s · tcpdump · iftop</span>
   └── deep / hot fns      → <span class="alg">perf top · bpftrace</span>

<span class="q">Q4.</span> I need to send / move data
   ├── one file, fast        → <span class="alg">scp / rsync</span>
   ├── many files, smart     → <span class="alg">rsync -avzhP</span>
   ├── stream into a pipe    → <span class="alg">tar -cz src/ | ssh host 'tar -xz -C dst'</span>
   ├── HTTP API              → <span class="alg">curl -fsSL · jq</span>
   └── over flaky link       → <span class="alg">rsync -P (resume)  /  wget -c</span>

<span class="q">Q5.</span> Run, schedule, or persist work
   ├── one-shot, foreground   → <span class="alg">cmd</span>
   ├── one-shot, background   → <span class="alg">cmd &  /  nohup cmd &</span>
   ├── recurring              → <span class="alg">crontab -e   /   systemd timer</span>
   ├── one-time future        → <span class="alg">at 22:00</span>
   ├── parallel batch         → <span class="alg">xargs -P / parallel</span>
   └── service / on-boot      → <span class="alg">systemctl enable --now myapp</span>
`;

  const recipeCards = [
    { b: 'Top 10 IPs in access log',      s: "awk '{print $1}' access.log | sort | uniq -c | sort -nr | head" },
    { b: 'Disk hogs in current dir',      s: "du -sh */ | sort -h" },
    { b: 'Live tail multiple logs',       s: "tail -F /var/log/{nginx,app}/*.log" },
    { b: 'Find files modified today',     s: "find . -type f -mtime -1" },
    { b: 'Replace string across project', s: "grep -rl OLD . | xargs sed -i 's/OLD/NEW/g'" },
    { b: 'Who is on port 443?',           s: "sudo ss -tulpn 'sport = :443'" },
    { b: 'Tunnel remote DB to laptop',    s: "ssh -L 5432:db:5432 bastion" },
    { b: 'Backup with deletion mirror',   s: "rsync -avzhP --delete src/ dst/" },
    { b: 'How big is this dir tree?',     s: "du -sh dir/   /   ncdu dir/" },
    { b: 'Cert expires in N days?',       s: "openssl s_client -connect h:443 < /dev/null 2>/dev/null | openssl x509 -noout -dates" },
    { b: 'JSON pretty + filter',          s: "curl -s URL | jq '.users[] | select(.active) | .email'" },
    { b: 'Gzip a CSV but keep it',        s: "gzip -k data.csv  →  data.csv + data.csv.gz" },
  ];

  const families_html = families.map(f => `
    <div class="panel">
      <h3>${escapeHtml(f.title)}</h3>
      <div class="grid">
        ${f.cmds.map(c => `<div class="card-mini"><b>${escapeHtml(c[0])}</b><span>${escapeHtml(c[1])}</span></div>`).join('')}
      </div>
    </div>`).join('');

  const recipes_html = `
    <div class="panel">
      <h3>One-Liner Recipes</h3>
      <div class="grid">
        ${recipeCards.map(c => `<div class="card-mini"><b>${escapeHtml(c.b)}</b><span>${escapeHtml(c.s)}</span></div>`).join('')}
      </div>
    </div>`;

  return `
    <div class="brief-root">
      <header class="brief-header">
        <div class="brief-subtitle">L I N U X &nbsp; C O M M A N D S</div>
        <h1 class="brief-title">100 Commands · One Decision</h1>
        <p class="brief-tagline">Pick the question. The command picks itself.</p>
      </header>

      <div class="panel">
        <h3>The 5-Question Decision Flow</h3>
        <div class="flow">${decisionFlow}</div>
      </div>

      ${recipes_html}
      ${families_html}
    </div>
  `;
}

renderTabs();
bindTabs();
renderTOC();
render();
</script>

<!-- KIRO_CROSS_TAB_NAV_START -->
<script id="kiro-cross-tab-nav">
(function(){
  if(window.__kiroCrossTabNav) return;
  window.__kiroCrossTabNav = true;
  function init(){
    if(typeof getProblems !== 'function' || typeof window.render !== 'function' || typeof state === 'undefined') return;
    var ORDER = ['veasy','easy','med','hard'];
    function diffs(){ return ORDER.filter(function(d){ try { return getProblems(d).length > 0; } catch(e){ return false; } }); }

    function updateNavButtons(){
      var prevB = document.getElementById('prev');
      var nextB = document.getElementById('next');
      if(!prevB || !nextB) return;
      if(state.diff === 'brief'){ return; }
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      prevB.disabled = (di <= 0 && state.idx <= 0);
      nextB.disabled = (di === list.length - 1 && state.idx >= arr.length - 1);
    }

    var origRender = window.render;
    window.render = function(){
      var r = origRender.apply(this, arguments);
      try { updateNavButtons(); } catch(e){}
      return r;
    };

    function goNext(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      if(state.idx < arr.length - 1){ state.idx++; window.render(); return; }
      if(di < list.length - 1){ state.diff = list[di + 1]; state.idx = 0; window.render(); }
    }
    function goPrev(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      if(state.idx > 0){ state.idx--; window.render(); return; }
      if(di > 0){
        var pd = list[di - 1];
        state.diff = pd;
        var parr = getProblems(pd);
        state.idx = Math.max(0, parr.length - 1);
        window.render();
      }
    }

    window.nextProblem = goNext;
    window.prevProblem = goPrev;

    ['prev','next'].forEach(function(id){
      var b = document.getElementById(id);
      if(!b) return;
      var clone = b.cloneNode(true);
      b.parentNode.replaceChild(clone, b);
      clone.addEventListener('click', id === 'next' ? goNext : goPrev);
    });

    updateNavButtons();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<!-- KIRO_CROSS_TAB_NAV_END -->
