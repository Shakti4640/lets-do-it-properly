<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Merge Intervals — Patterns, Cheatsheet & Java Snippets</title>
<style>
  :root {
    --bg: #f6f7fb;
    --fg: #1f2330;
    --muted: #6b7280;
    --accent: #2563eb;
    --border: #e3e6ee;
    --card: #ffffff;
    --code-bg: #f8fafc;
    --code-fg: #24292f;
    --kw: #cf222e;
    --typ: #6f42c1;
    --str: #0a7d4d;
    --cmt: #6a737d;
    --num: #0550ae;
    --veasy: #0891b2;
    --easy: #16a34a;
    --med: #d97706;
    --hard: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
  }

  /* HAMBURGER + TOC SIDEBAR */
  .hamburger {
    position: fixed; top: 14px; left: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 5px; cursor: pointer; z-index: 1001;
  }
  .hamburger span {
    display: block; width: 22px; height: 2.5px;
    background: #1e1e25; border-radius: 2px;
    transition: transform .25s, opacity .2s;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

  .sidebar {
    position: fixed; top: 0; left: 0;
    height: 100vh; width: 360px; max-width: 90vw;
    background: #ffffff;
    border-right: 1px solid var(--border);
    box-shadow: 2px 0 14px rgba(0,0,0,.06);
    transform: translateX(-100%);
    transition: transform .28s ease;
    overflow-y: auto;
    z-index: 1000;
    padding: 70px 18px 32px;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2 {
    margin: 0 0 12px;
    font-size: 13px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .sidebar .group-title {
    margin-top: 18px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .sidebar a {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px;
    margin: 2px 0;
    text-decoration: none;
    color: #1f2330;
    border-radius: 6px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .sidebar a:hover { background: #eef2ff; color: var(--accent); }
  .sidebar a.active { background: #eef2ff; color: var(--accent); font-weight: 600; }
  .sidebar a .num {
    display: inline-block;
    min-width: 28px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.25);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 999;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  /* HERO + TABS */
  .topbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 18px 24px 0;
    padding-left: 76px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 { margin: 0 0 6px; font-size: 20px; }
  .topbar p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: #f1f3f9;
    color: var(--muted);
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    transition: background .15s;
  }
  .tab:hover { background: #e7eaf3; color: var(--fg); }
  .tab.active {
    background: #ffffff;
    color: var(--fg);
    border-bottom: 2px solid #ffffff;
    margin-bottom: -1px;
    box-shadow: 0 -2px 0 var(--accent) inset;
  }
  .tab .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: 1px;
  }
  .tab.veasy .dot { background: var(--veasy); }
  .tab.easy .dot { background: var(--easy); }
  .tab.med .dot { background: var(--med); }
  .tab.hard .dot { background: var(--hard); }
  .tab.brief .dot { background: #8b5cf6; }
  .tab .count { color: var(--muted); margin-left: 6px; font-weight: 500; }

  /* ===== BRIEF TAB (interactive interval explorer) ===== */
  body.brief-mode .nav-bar { display: none; }

  .brief-root {
    font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
    color: var(--fg);
  }
  .brief-root .brief-header { text-align: center; margin-bottom: 32px; }
  .brief-root .brief-subtitle {
    font-size: 11px; letter-spacing: 8px; color: var(--muted); margin-bottom: 8px;
  }
  .brief-root .brief-title {
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 900; margin: 0;
    background: linear-gradient(90deg, #2563eb, #16a34a, #d97706);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
  }
  [data-theme="dark"] .brief-root .brief-title {
    background: linear-gradient(90deg, #58a6ff, #76ff03, #ffd740);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .brief-root .brief-tagline { color: var(--muted); margin-top: 8px; font-size: 13px; }

  .brief-root .op-tabs {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-bottom: 28px;
  }
  .brief-root .op-tab {
    padding: 8px 16px; border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--card); color: var(--muted);
    cursor: pointer; font-family: inherit;
    font-weight: 700; font-size: 14px;
    transition: all 0.18s;
  }

  .brief-root .panel {
    background: var(--card); border-radius: 16px;
    border: 1px solid var(--border); padding: 24px; margin-bottom: 24px;
  }
  .brief-root .op-badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 700; letter-spacing: 1px;
  }
  .brief-root .op-desc { margin: 10px 0 4px; color: var(--fg); font-size: 14px; }
  .brief-root .op-rule { color: var(--muted); font-size: 12px; }

  .brief-root .calc-box {
    background: var(--code-bg); border-radius: 12px;
    padding: 20px; margin: 20px 0; border: 1px solid var(--border);
  }
  .brief-root .input-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .brief-root .input-label { color: var(--muted); font-size: 12px; min-width: 60px; }
  .brief-root input[type=number] {
    width: 70px; padding: 6px 10px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--fg); font-family: inherit; font-size: 14px;
  }

  /* Interval timeline visualization */
  .brief-root .timeline {
    position: relative; height: 36px; margin: 6px 0 18px 0;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  }
  .brief-root .timeline .track {
    position: absolute; top: 8px; height: 20px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 700;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .brief-root .axis {
    display: flex; justify-content: space-between;
    color: var(--muted); font-size: 10px; margin-top: -10px; padding: 0 2px;
  }
  .brief-root .result-line { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .brief-root .result-pill {
    display: inline-block; padding: 4px 12px;
    border-radius: 20px; font-weight: 700; font-size: 12px;
    margin-left: 8px;
  }
  .brief-root .result-pill.yes { background: rgba(22,163,74,.15); color: var(--easy); border: 1px solid var(--easy); }
  .brief-root .result-pill.no  { background: rgba(220,38,38,.15); color: var(--hard); border: 1px solid var(--hard); }

  .brief-root .section-label {
    font-size: 11px; color: var(--muted);
    letter-spacing: 3px; margin-bottom: 12px;
  }
  .brief-root .ex-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .brief-root .ex-tab {
    padding: 6px 14px; border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent; color: var(--muted);
    cursor: pointer; font-size: 12px;
    font-family: inherit; transition: all 0.18s;
  }

  .brief-root .ex-box {
    background: var(--code-bg); border-radius: 10px;
    overflow: hidden; border: 1px solid var(--border);
  }
  .brief-root .ex-title { padding: 10px 16px; font-size: 13px; font-weight: 700; }
  .brief-root pre.brief-pre {
    margin: 0; padding: 16px; font-size: 13px; line-height: 1.7;
    color: var(--code-fg); overflow-x: auto;
    white-space: pre-wrap; word-break: break-word;
    background: var(--code-bg);
    font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
  }
  [data-theme="dark"] .brief-root pre.brief-pre { color: #c8e6c9; }
  .brief-root .why-toggle {
    padding: 10px 16px; cursor: pointer;
    border-top: 1px solid var(--border);
    font-size: 12px; display: flex; align-items: center; gap: 8px;
    user-select: none; color: var(--muted);
  }
  .brief-root .why-body {
    padding: 12px 16px; font-size: 13px; line-height: 1.7;
    color: var(--fg); display: none;
  }
  .brief-root .why-body.visible { display: block; }

  .brief-root .cheat {
    background: var(--card); border-radius: 16px;
    border: 1px solid var(--border); padding: 24px; margin-bottom: 16px;
  }
  .brief-root .cheat-row {
    display: flex; justify-content: space-between; flex-wrap: wrap;
    gap: 8px; padding: 8px 0;
    border-bottom: 1px solid var(--border); align-items: center;
  }
  .brief-root .cheat-name { color: var(--muted); font-size: 13px; }
  .brief-root .cheat-code {
    color: var(--str); font-size: 12px;
    background: var(--code-bg);
    padding: 2px 10px; border-radius: 4px;
    font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
  }
  .brief-root .brief-footer {
    text-align: center; color: var(--muted);
    font-size: 11px; letter-spacing: 2px; margin-top: 8px;
  }

  /* MAIN */
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 24px 120px;
  }
  .problem-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .problem-card h2 {
    margin: 0 0 6px;
    font-size: 24px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .num-tag {
    background: #eef2ff; color: var(--accent);
    padding: 3px 10px; border-radius: 6px;
    font-size: 13px; font-weight: 700;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff; font-weight: 700; letter-spacing: .05em;
  }
  .badge.veasy { background: var(--veasy); }
  .badge.easy { background: var(--easy); }
  .badge.med { background: var(--med); }
  .badge.hard { background: var(--hard); }

  .section-title {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 8px;
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }
  .problem-card p { margin: 8px 0; font-size: 15px; }
  .intuition {
    background: #ecfeff;
    border-left: 4px solid #06b6d4;
    border-radius: 6px;
    padding: 12px 16px;
    margin: 8px 0;
  }
  .hints, .tips {
    margin: 6px 0 6px 4px;
    padding: 0 0 0 22px;
  }
  .hints li, .tips li { margin: 6px 0; font-size: 14.5px; }
  .tips-block {
    background: #fff7ed;
    border-left: 4px solid #f59e0b;
    border-radius: 6px;
    padding: 10px 16px;
    margin: 8px 0;
  }
  .complexity {
    margin-top: 12px;
    color: var(--muted);
    font-size: 13.5px;
  }

  /* CHEATSHEET TABLE */
  .cheat-table {
    border-collapse: collapse;
    width: 100%;
    margin: 8px 0 16px;
    font-size: 14px;
  }
  .cheat-table th, .cheat-table td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  .cheat-table th {
    background: #eef2ff;
    color: var(--accent);
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .cheat-table td:first-child {
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    background: var(--code-bg);
    white-space: nowrap;
    color: var(--num);
  }
  .cheat-table tr:nth-child(even) td:not(:first-child) { background: #fafbff; }

  /* CODE */
  pre.code {
    background: var(--code-bg);
    color: var(--code-fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 13.5px;
    line-height: 1.55;
    margin: 6px 0;
  }
  pre.code code {
    font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
  }
  .kw  { color: var(--kw);  font-weight: 600; }
  .typ { color: var(--typ); font-weight: 500; }
  .str { color: var(--str); }
  .cmt { color: var(--cmt); font-style: italic; }
  .num { color: var(--num); }

  /* PREV/NEXT BAR */
  .nav-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #ffffff;
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    z-index: 60;
    box-shadow: 0 -2px 8px rgba(0,0,0,.04);
  }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--fg);
    font-weight: 500;
  }
  .nav-btn:hover:not(:disabled) { background: #eef2ff; color: var(--accent); border-color: #c7d2fe; }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .nav-info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kbd {
    display: inline-block;
    border: 1px solid #d0d7de;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    background: #f6f8fa;
    font-family: monospace;
    font-size: 11px;
    color: #444;
  }

  @media (max-width: 600px) {
    .topbar { padding-left: 70px; padding-right: 70px; }
    main { padding: 20px 14px 130px; }
    .problem-card { padding: 18px 18px; }
    .problem-card h2 { font-size: 19px; }
  }

  /* THEME TOGGLE */
  .theme-toggle {
    position: fixed; top: 14px; right: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 1001;
    font-size: 20px;
    line-height: 1;
    color: var(--fg);
    transition: background .15s, color .15s, border-color .15s, transform .15s;
  }
  .theme-toggle:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }
  .theme-toggle:active { transform: scale(0.95); }

  /* DARK MODE */
  [data-theme="dark"] {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --border: #30363d;
    --card: #161b22;
    --code-bg: #0b0f15;
    --code-fg: #e6edf3;
    --kw:  #ff7b72;
    --typ: #d2a8ff;
    --str: #a5d6ff;
    --cmt: #8b949e;
    --num: #79c0ff;
  }
  [data-theme="dark"] .hamburger { background: var(--card); }
  [data-theme="dark"] .hamburger span { background: var(--fg); }
  [data-theme="dark"] .sidebar { background: var(--card); box-shadow: 2px 0 14px rgba(0,0,0,.4); }
  [data-theme="dark"] .sidebar a { color: var(--fg); }
  [data-theme="dark"] .sidebar a:hover,
  [data-theme="dark"] .sidebar a.active { background: rgba(88,166,255,.15); color: var(--accent); }
  [data-theme="dark"] .topbar { background: var(--card); }
  [data-theme="dark"] .tab { background: #0d1117; border-color: var(--border); }
  [data-theme="dark"] .tab:hover { background: #1c2128; color: var(--fg); }
  [data-theme="dark"] .tab.active { background: var(--card); border-bottom-color: var(--card); color: var(--fg); }
  [data-theme="dark"] .num-tag { background: rgba(88,166,255,.15); color: var(--accent); }
  [data-theme="dark"] .intuition { background: rgba(6,182,212,.10); }
  [data-theme="dark"] .tips-block { background: rgba(245,158,11,.10); }
  [data-theme="dark"] .nav-bar { background: var(--card); box-shadow: 0 -2px 8px rgba(0,0,0,.3); }
  [data-theme="dark"] .nav-btn { background: var(--card); color: var(--fg); }
  [data-theme="dark"] .nav-btn:hover:not(:disabled) { background: rgba(88,166,255,.15); color: var(--accent); border-color: var(--accent); }
  [data-theme="dark"] .kbd { background: #1c2128; border-color: var(--border); color: var(--muted); }
  [data-theme="dark"] pre.code { background: var(--code-bg); }
  [data-theme="dark"] .overlay { background: rgba(0,0,0,.55); }
  [data-theme="dark"] .cheat-table th { background: rgba(88,166,255,.15); color: var(--accent); }
  [data-theme="dark"] .cheat-table td:first-child { background: var(--code-bg); color: var(--num); }
  [data-theme="dark"] .cheat-table tr:nth-child(even) td:not(:first-child) { background: rgba(255,255,255,.02); }
</style>
</head>
<body>

<button class="hamburger" id="hamburger" aria-label="Open menu">
  <span></span><span></span><span></span>
</button>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <h2>Table of Contents</h2>
  <div id="toc"></div>
</aside>

<header class="topbar">
  <h1>Merge Intervals — Patterns, Cheatsheet & Java Snippets</h1>
  <p>Click a difficulty tab. Use <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> arrow keys to navigate within the tab.</p>
  <div class="tabs" id="tabs">
    <div class="tab veasy" data-diff="veasy"><span class="dot"></span>Very Easy<span class="count" id="cnt-veasy"></span></div>
    <div class="tab easy"  data-diff="easy"><span class="dot"></span>Easy<span class="count" id="cnt-easy"></span></div>
    <div class="tab med"   data-diff="med"><span class="dot"></span>Medium<span class="count" id="cnt-med"></span></div>
    <div class="tab hard"  data-diff="hard"><span class="dot"></span>Hard<span class="count" id="cnt-hard"></span></div>
    <div class="tab brief" data-diff="brief"><span class="dot"></span>Brief</div>
  </div>
</header>

<main id="main"></main>

<div class="nav-bar">
  <button class="nav-btn" id="prev">&larr; Previous</button>
  <div class="nav-info" id="nav-info"></div>
  <button class="nav-btn" id="next">Next &rarr;</button>
</div>

<script>
/* ----------------------- DATA: ALL PROBLEMS ----------------------- */
const PROBLEMS = [];



/* ===================== TEMPLATE / FOUNDATION ===================== */
PROBLEMS.push({
  num: 0, title: "The Merge Intervals Cheatsheet (read this first)", diff: "veasy",
  problem: "Merge-Intervals problems give you a list of intervals — meeting times, ranges of integers, segments on a number line — and ask you to merge, count, intersect, or arrange them. Almost every variant collapses into one of three patterns: (1) sort by start and sweep, (2) sweep-line via paired events (+1 / -1) sorted by time, or (3) maintain an ordered structure (TreeMap / heap) of active intervals.",
  intuition: "Once intervals are sorted by start time, two adjacent intervals [a, b] and [c, d] either overlap (c <= b) or don't (c > b). That single inequality drives merging, gap-finding, conflict-detection, insertion, and erasure. When the question is about COUNTS over time (max concurrent meetings, busiest hour, skyline), the right lens is sweep line: split each interval into a +1 event at start and -1 event at end, sort all events, and walk the timeline keeping a running counter. Memorize the table below — every recipe in this guide is built from it.",
  hints: [
    "Step 1 in 80% of these problems: sort by interval start (sometimes by end for greedy variants like LC 435).",

  code: `/*
 * The seven idioms you'll reach for in 90% of interval problems.
 * Memorize each line — every other technique is just a combination of these.
 */

// ---- 1. OVERLAP / DISJOINT / CONTAINMENT (closed intervals) ---------
boolean overlap   (int[] a, int[] b) { return a[0] <= b[1] && b[0] <= a[1]; }
boolean disjoint  (int[] a, int[] b) { return a[1] <  b[0] || b[1] <  a[0]; }
boolean contains  (int[] a, int[] b) { return a[0] <= b[0] && b[1] <= a[1]; }

// De Morgan check: !overlap(a,b) is equivalent to disjoint(a,b)
//   !(a[0] <= b[1] && b[0] <= a[1])
//     == (a[0] >  b[1]) || (b[0] >  a[1])    (De Morgan)
//     == (b[1] <  a[0]) || (a[1] <  b[0])    (rewrite)
// which is exactly disjoint(a, b).

// ---- 2. INTERSECTION of two overlapping intervals -------------------
int[] intersect(int[] a, int[] b) {
    int lo = Math.max(a[0], b[0]);
    int hi = Math.min(a[1], b[1]);
    return lo <= hi ? new int[]{lo, hi} : null;     // null if disjoint
}

// ---- 3. MERGE a sorted list (sort by start, then sweep) -------------
int[][] mergeSorted(int[][] in) {
    Arrays.sort(in, (x, y) -> Integer.compare(x[0], y[0]));
    List<int[]> res = new ArrayList<>();
    for (int[] cur : in) {
        if (!res.isEmpty() && cur[0] <= res.get(res.size() - 1)[1]) {
            res.get(res.size() - 1)[1] = Math.max(res.get(res.size() - 1)[1], cur[1]);
        } else {
            res.add(cur);
        }
    }
    return res.toArray(new int[0][]);
}

// ---- 4. SWEEP LINE: max concurrent intervals -----------------------
int maxConcurrent(int[][] intervals) {
    int n = intervals.length;
    int[][] events = new int[2 * n][2];          // {time, +1 / -1}
    int k = 0;
    for (int[] in : intervals) {
        events[k++] = new int[]{in[0],  +1};     // start
        events[k++] = new int[]{in[1],  -1};     // end (closed: process AFTER starts at same t)
    }
    // Tie-break: process +1 BEFORE -1 if "touching counts as overlap".
    Arrays.sort(events, (a, b) -> a[0] != b[0] ? a[0] - b[0] : b[1] - a[1]);

    int active = 0, best = 0;
    for (int[] e : events) {
        active += e[1];
        best = Math.max(best, active);
    }
    return best;
}

// ---- 5. TWO-POINTER min meeting rooms (no heap) --------------------
int minRooms(int[][] intervals) {
    int n = intervals.length;
    int[] starts = new int[n], ends = new int[n];
    for (int i = 0; i < n; i++) { starts[i] = intervals[i][0]; ends[i] = intervals[i][1]; }
    Arrays.sort(starts); Arrays.sort(ends);

    int rooms = 0, j = 0;
    for (int i = 0; i < n; i++) {
        if (starts[i] < ends[j]) rooms++;        // need a new room
        else j++;                                // free up the one ending earliest
    }
    return rooms;
}

// ---- 6. GREEDY: max non-overlapping (sort by END) ------------------
int maxNonOverlapping(int[][] intervals) {
    Arrays.sort(intervals, (a, b) -> Integer.compare(a[1], b[1]));
    int count = 0, lastEnd = Integer.MIN_VALUE;
    for (int[] in : intervals) {
        if (in[0] >= lastEnd) {                  // strict for half-open; >= for "touch ok"
            count++; lastEnd = in[1];
        }
    }
    return count;
}

// ---- 7. DIFFERENCE ARRAY (bulk range +k updates) -------------------
//    For each [l, r, +k]:  diff[l] += k;  diff[r + 1] -= k;
//    Then prefix-sum diff[] to get the final value at each index.
//    O(N + numUpdates). The bounded-range cousin of sweep line.`,
  complexity: "Sort-and-sweep is O(n log n) time, O(n) extra space. Sweep line is O(n log n) time. TreeMap-based online variants are O(log n) per insert / query. Difference arrays are O(N + range)."
});

    List<int[]> res = new ArrayList<>();

 *   1) copy strictly-before

 *   3) copy strictly-after

int[][] insert(int[][] intervals, int[] newInterval) {

    List<int[]> res = new ArrayList<>();
    int i = 0, n = intervals.length;

        newInterval[1] = Math.max(newInterval[1], intervals[i][1]);

    "Two-pointer is faster (no heap) but the heap version generalizes more naturally to weighted resource problems.",
    "If two meetings touch (one ends at 10, next starts at 10), use `>=` so they share a room.",
    "Variant 'how many bullets to burst all balloons' (LC 452) is a sort-by-end greedy, not min-rooms."
  ],
  code: `/*
 * Min Meeting Rooms — TWO POINTER (no heap).
 * Sort starts and ends separately; whenever a meeting starts before the
 * earliest end, we need another room.
 */
int minMeetingRooms(int[][] intervals) {

    int n = intervals.length;
    if (n == 0) return 0;

    int[] starts = new int[n], ends = new int[n];
    for (int i = 0; i < n; i++) {
        starts[i] = intervals[i][0];
        ends[i]   = intervals[i][1];
    }
    Arrays.sort(starts);
    Arrays.sort(ends);

    int rooms = 0, j = 0;
    for (int i = 0; i < n; i++) {
        if (starts[i] < ends[j]) rooms++;        // overlapping with the earliest-ending one
        else j++;                                // earliest-ending room frees up
    }
    return rooms;
}

/*
 * Same problem with a MIN-HEAP — useful as a template for resource scheduling.
 */
int minMeetingRoomsHeap(int[][] intervals) {

    Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));
    PriorityQueue<Integer> pq = new PriorityQueue<>();           // min-heap of end times

    for (int[] in : intervals) {
        if (!pq.isEmpty() && pq.peek() <= in[0]) pq.poll();      // reuse the freed room
        pq.offer(in[1]);
    }
    return pq.size();
}`,

});

 * Non-overlapping Intervals. Sort by END; greedily keep the earliest-ending
 * non-conflicting interval.
 */
int eraseOverlapIntervals(int[][] intervals) {

    if (intervals.length == 0) return 0;
    Arrays.sort(intervals, (a, b) -> Integer.compare(a[1], b[1]));

    public boolean queryRange(int left, int right) {
        Map.Entry<Integer, Integer> floor = map.floorEntry(left);
        return floor != null && floor.getValue() >= right;
    }

    public void removeRange(int left, int right) {
        Integer L = map.floorKey(left);
        if (L != null && map.get(L) > left) {            // split the range that contains 'left'
            int oldR = map.get(L);
            if (L < left) map.put(L, left);
            else map.remove(L);
            if (oldR > right) map.put(right, oldR);
        }

        Map.Entry<Integer, Integer> e;
        while ((e = map.ceilingEntry(left)) != null && e.getKey() < right) {
            int oldR = e.getValue();
            map.remove(e.getKey());
            if (oldR > right) map.put(right, oldR);
        }
    }
}`,
  complexity: "Amortized O(log n) per operation; each range is inserted and removed O(1) times globally."
});

    "Same trick with `+= delta` solves 'count how many ranges cover point p' on a stream of insertions."

 * My Calendar III. Difference array on a TreeMap; sweep after each book().
 */
class MyCalendarThree {

    private TreeMap<Integer, Integer> delta = new TreeMap<>();

    public int book(int start, int end) {
        delta.merge(start, 1, Integer::sum);
        delta.merge(end,  -1, Integer::sum);

        int active = 0, best = 0;
        for (int d : delta.values()) {
            active += d;
            best = Math.max(best, active);
        }
        return best;
    }

PROBLEMS.push({
  num: 850, title: "Rectangle Area II", diff: "hard",
  problem: "Given a list of axis-aligned rectangles, return the total area of their union, modulo 10^9 + 7.",
  intuition: "Sweep line vertically. Coordinate-compress all unique y-values; sort rectangles' x-events. As you sweep x left to right, maintain a count for each y-strip of how many rectangles currently cover it; the active 'total y length' times the x delta is the area added in this slice.",
  hints: [
    "Build events {x, y1, y2, +1 / -1} for each rectangle's left and right edges; sort by x.",
    "Coordinate-compress y values into a sorted unique array.",
    "For each x slice, compute total active y length via the count array, multiply by Δx, accumulate."
  ],
  tips: [
    "A segment tree with lazy propagation gets O(N log N); the brute count-array variant is O(N^2) and fine for N ≤ 200 (LC's bound).",
    "Coordinate compression is the only way to avoid O(maxCoord) blow-ups.",
    "Modular arithmetic only at the end — keep the intermediate sums in `long`."
  ],
  code: `/*
 * Rectangle Area II — sweep over x with a coordinate-compressed y axis.
 * Brute O(n^2) version (clear and passes LC's constraints).
 */
int rectangleArea(int[][] rectangles) {

    final int MOD = 1_000_000_007;

    // Collect and compress all unique y coordinates.
    TreeSet<Integer> ys = new TreeSet<>();
    for (int[] r : rectangles) { ys.add(r[1]); ys.add(r[3]); }
    Integer[] ya = ys.toArray(new Integer[0]);
    Map<Integer, Integer> yIdx = new HashMap<>();
    for (int i = 0; i < ya.length; i++) yIdx.put(ya[i], i);

    // Events: for each rectangle, +1 at x1 across [y1, y2], -1 at x2.
    List<int[]> ev = new ArrayList<>();
    for (int[] r : rectangles) {
        ev.add(new int[]{r[0], yIdx.get(r[1]), yIdx.get(r[3]),  1}); // open
        ev.add(new int[]{r[2], yIdx.get(r[1]), yIdx.get(r[3]), -1}); // close
    }
    ev.sort((a, b) -> Integer.compare(a[0], b[0]));

    int[] count = new int[ya.length];                    // active rect count per y-strip
    long area = 0;
    int prevX = ev.get(0)[0];

    int idx = 0;
    while (idx < ev.size()) {

        int curX = ev.get(idx)[0];

        // Add slice from prevX → curX using the previous active strips.
        long activeY = 0;
        for (int i = 0; i + 1 < ya.length; i++) {
            if (count[i] > 0) activeY += (long)(ya[i + 1] - ya[i]);
        }
        area = (area + activeY * (curX - prevX)) % MOD;
        prevX = curX;

        // Apply ALL events at this x.
        while (idx < ev.size() && ev.get(idx)[0] == curX) {
            int[] e = ev.get(idx++);
            for (int i = e[1]; i < e[2]; i++) count[i] += e[3];
        }
    }
    return (int) area;
}`,
  complexity: "Time O(N^2) for the brute version, O(N log N) with a segment tree. Space O(N)."
});

  num: 352, title: "Data Stream as Disjoint Intervals", diff: "hard",
  problem: "Implement a stream where you addNum(x) values one at a time and getIntervals() returns the current set of disjoint intervals as a sorted list.",
  intuition: "Maintain a TreeMap<Integer, Integer> keyed by interval start with value = end. On addNum(x), find the predecessor (floor) and successor (ceiling). If x is already inside an existing range, do nothing. Otherwise possibly extend the predecessor, merge with the successor, or insert a singleton.",
  hints: [
    "If `floor != null && floor.value >= x` → x is already covered.",
    "If `floor != null && floor.value == x - 1` → extend floor.value to x; then check whether ceiling.key == x + 1 to merge further.",
    "If `ceiling != null && ceiling.key == x + 1` → replace ceiling with [x, ceiling.value]."
  ],
  tips: [
    "Single-point intervals are just [x, x] — easy to forget when handling the empty TreeMap.",
    "Build the answer in getIntervals() by streaming the entries — they're already sorted by start.",
    "If you only need intervals lazily, store events and lazily compact in getIntervals() — but TreeMap is the textbook answer."
  ],
  code: `/*
 * Data Stream as Disjoint Intervals — TreeMap<start, end>.
 */
class SummaryRanges {

    private TreeMap<Integer, Integer> map = new TreeMap<>();

    public void addNum(int x) {
        if (map.containsKey(x)) return;

        Integer left  = map.floorKey(x);                    // greatest start <= x
        Integer right = map.ceilingKey(x);                  // smallest start >  x

        boolean joinLeft  = left  != null && map.get(left) >= x - 1;
        boolean joinRight = right != null && right == x + 1;

        if (joinLeft && joinRight) {
            map.put(left, map.get(right));
            map.remove(right);
        } else if (joinLeft) {
            map.put(left, Math.max(map.get(left), x));
        } else if (joinRight) {
            map.put(x, map.get(right));
            map.remove(right);
        } else {
            map.put(x, x);
        }
    }

    public int[][] getIntervals() {
        int[][] res = new int[map.size()][2];
        int i = 0;
        for (Map.Entry<Integer, Integer> e : map.entrySet()) {
            res[i++] = new int[]{e.getKey(), e.getValue()};
        }
        return res;
    }
}`,
  complexity: "addNum O(log n). getIntervals O(n). Space O(n)."
});

PROBLEMS.push({
  num: 1851, title: "Min Interval to Include Each Query (Offline)", diff: "hard",
  problem: "Given intervals[i] = [l_i, r_i] and queries[j], return for each query q the size (r - l + 1) of the SMALLEST interval that contains q, or -1.",
  intuition: "Offline + min-heap. Sort intervals by left. Sort queries by value (remember original indices). Walk queries in order: push every interval with left <= q into a min-heap keyed by interval size; lazily pop intervals whose right < q. The heap top is the answer for q.",
  hints: [
    "Sort intervals by left ascending.",
    "Pair each query with its original index and sort by query value.",
    "Maintain `PriorityQueue<int[]>{size, right}` ordered by size.",
    "For each query: push all unprocessed intervals with left <= q; pop top while top.right < q; assign top.size as the answer."
  ],
  tips: [
    "Lazy deletion is the trick — actively removing entries from a heap is O(n).",
    "If queries could be online, you'd need a segment tree of sizes keyed by left/right ranges — heavier but available.",
    "Watch out: 'size' is r - l + 1 for closed intervals. Off-by-one in the size formula is a common bug."
  ],
  code: `/*
 * Minimum Interval to Include Each Query — offline sweep with a min-heap.
 */
int[] minInterval(int[][] intervals, int[] queries) {

    Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));

    Integer[] order = new Integer[queries.length];
    for (int i = 0; i < queries.length; i++) order[i] = i;
    Arrays.sort(order, (a, b) -> Integer.compare(queries[a], queries[b]));

    int[] ans = new int[queries.length];
    PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> Integer.compare(a[0], b[0]));
    int j = 0;

    for (int idx : order) {

        int q = queries[idx];

        // Push every interval whose left <= q.
        while (j < intervals.length && intervals[j][0] <= q) {
            int size = intervals[j][1] - intervals[j][0] + 1;
            pq.offer(new int[]{size, intervals[j][1]});
            j++;
        }
        // Discard intervals whose right < q (lazy deletion).
        while (!pq.isEmpty() && pq.peek()[1] < q) pq.poll();

        ans[idx] = pq.isEmpty() ? -1 : pq.peek()[0];
    }
    return ans;
}`,
  complexity: "Time O((N + Q) log N). Space O(N + Q)."
});

PROBLEMS.push({
  num: 1235, title: "Maximum Profit in Job Scheduling (DP + Binary Search)", diff: "hard",
  problem: "Given startTime[], endTime[], profit[], schedule a non-overlapping subset of jobs to maximize total profit. Two jobs can share an exact endpoint.",
  intuition: "Sort jobs by end time. dp[i] = max profit using only jobs in indices [0..i]. Transition: either skip job i (dp[i-1]) or take it. Taking gives `profit[i] + dp[k]` where k is the largest index with `endTime[k] <= startTime[i]` — found by binary search on the sorted ends.",
  hints: [
    "Build `Job{start, end, profit}` and sort by end ascending.",
    "ends[] = the sorted end array. For each i, binary-search for the largest j with ends[j] <= jobs[i].start.",
    "dp[i] = max(dp[i-1], jobs[i].profit + (j >= 0 ? dp[j] : 0))."
  ],
  tips: [
    "Same skeleton solves Weighted Interval Scheduling — the textbook DP.",
    "If the dp is just a 1D array, you can store it inline and skip the explicit dp[].",
    "If you forget to sort by END, the binary search target is wrong and the DP silently breaks."
  ],
  code: `/*
 * Job Scheduling. Weighted Interval Scheduling DP.
 *   Sort by END. For each job i, binary-search the latest job that
 *   ends at or before jobs[i].start; combine with dp.
 */
int jobScheduling(int[] startTime, int[] endTime, int[] profit) {

    int n = startTime.length;
    int[][] jobs = new int[n][3];
    for (int i = 0; i < n; i++) jobs[i] = new int[]{startTime[i], endTime[i], profit[i]};
    Arrays.sort(jobs, (a, b) -> Integer.compare(a[1], b[1]));

    int[] ends = new int[n];
    for (int i = 0; i < n; i++) ends[i] = jobs[i][1];

    int[] dp = new int[n];
    dp[0] = jobs[0][2];

    for (int i = 1; i < n; i++) {
        int j = upperBound(ends, jobs[i][0]) - 1;        // last job with end <= start
        int take = jobs[i][2] + (j >= 0 ? dp[j] : 0);
        dp[i] = Math.max(dp[i - 1], take);
    }
    return dp[n - 1];
}

/* upperBound: smallest index with ends[idx] > target.  */
private int upperBound(int[] ends, int target) {
    int lo = 0, hi = ends.length;
    while (lo < hi) {
        int mid = (lo + hi) >>> 1;
        if (ends[mid] <= target) lo = mid + 1;
        else hi = mid;
    }
    return lo;
}`,
  complexity: "Time O(n log n). Space O(n)."
});

const DIFF_LABEL = { veasy: 'Very Easy', easy: 'Easy', med: 'Medium', hard: 'Hard' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Lightweight Java syntax highlighter. */
function highlightJava(src) {
  let s = escapeHtml(src);
  const stash = [];
  const stashIt = (html) => {
    stash.push(html);
    return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001';
  };
  s = s.replace(/\/\/[^\n]*/g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/&quot;([^&]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  s = s.replace(/&#39;.&#39;|&#39;\\.&#39;/g, m => stashIt('<span class="str">' + m + '</span>'));

  const types = ['String','Integer','Long','Boolean','Character','Double','Float',
    'List','Map','Set','HashMap','HashSet','TreeMap','TreeSet','ArrayList','LinkedList',
    'ArrayDeque','Queue','Deque','PriorityQueue','StringBuilder','BitSet','Stack',
    'TreeNode','Random','Collections','Arrays','Math','Comparator','Objects','Map.Entry'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  const kws = ['void','int','long','boolean','char','double','float','byte','short',
    'public','private','protected','static','final','abstract','class','interface','enum',
    'return','if','else','for','while','do','break','continue','switch','case','default',
    'new','null','true','false','this','super','try','catch','finally','throw','throws',
    'import','package','extends','implements','instanceof'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  s = s.replace(/\b(0x[0-9A-Fa-f_]+L?|\d+(?:_\d+)*L?)\b/g, '<span class="num">$1</span>');

  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

    id:"merge", name:"Merge", color:"#d97706", colorDark:"#ffd740",
    desc:"Sort by start, then sweep. If next.start <= last.end → extend last.end = max(last.end, next.end).",
    rule:"cur[0] <= last[1]  →  last[1] = max(last[1], cur[1])",
    fn:(a,b,c,d) => c <= b,
    label:"MERGE",
    examples:[
      { title:"LC 56 — Merge Intervals",
        code:`int[][] merge(int[][] intervals) {
    Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));
    List<int[]> res = new ArrayList<>();
    res.add(intervals[0]);
    for (int i = 1; i < intervals.length; i++) {
        int[] last = res.get(res.size() - 1);
        if (intervals[i][0] <= last[1]) {
            last[1] = Math.max(last[1], intervals[i][1]);
        } else {
            res.add(intervals[i]);
        }
    }
    return res.toArray(new int[0][]);
}`,
        why:"After sorting, you only need to compare each interval with the LAST one in the result list." },
    ],
  },
  {
    id:"sweep", name:"Sweep Line", color:"#9333ea", colorDark:"#ea80fc",
    desc:"Each interval becomes (+1) at start and (-1) at end. Sort by time; running sum = active count.",
    rule:"events[start] = +1, events[end] = -1; max(prefix sum) = max overlap",
    fn:(a,b,c,d) => true,
    label:"SWEEP LINE",
    examples:[
      { title:"Min Meeting Rooms via two-pointer (LC 253)",
        code:`int minMeetingRooms(int[][] intervals) {
    int n = intervals.length;
    int[] starts = new int[n], ends = new int[n];
    for (int i = 0; i < n; i++) {
        starts[i] = intervals[i][0];
        ends[i]   = intervals[i][1];
    }
    Arrays.sort(starts);
    Arrays.sort(ends);
    int rooms = 0, j = 0;
    for (int i = 0; i < n; i++) {
        if (starts[i] < ends[j]) rooms++;
        else j++;
    }
    return rooms;
}`,
        why:"Equivalent to sweep line but encoded as two sorted arrays. Cleanest 'min rooms' you'll write." },
    ],
  },
  {
    id:"greedy", name:"Greedy by End", color:"#dc2626", colorDark:"#ff7b72",
    desc:"Sort by END. Keep an interval iff it starts at-or-after the last kept end. Maximizes count.",
    rule:"sort(intervals, by end ASC); accept if start >= lastEnd",
    fn:(a,b,c,d) => c >= b,
    label:"EARLIEST DEADLINE",
    examples:[
      { title:"LC 435 — Min Removals to make non-overlapping",
        code:`int eraseOverlapIntervals(int[][] intervals) {
    Arrays.sort(intervals, (a, b) -> Integer.compare(a[1], b[1]));
    int kept = 1, lastEnd = intervals[0][1];
    for (int i = 1; i < intervals.length; i++) {
        if (intervals[i][0] >= lastEnd) {
            kept++;
            lastEnd = intervals[i][1];
        }
    }
    return intervals.length - kept;
}`,
        why:"Sorting by END (not start) is what makes the greedy optimal. Same skeleton as LC 452." },
    ],
  },
  {
    id:"demorgan", name:"De Morgan", color:"#0d9488", colorDark:"#a7ffeb",
    desc:"NOT(A AND B) == (NOT A) OR (NOT B). Flip overlap into disjoint and back.",
    rule:"!(a<=d && c<=b)  ≡  (a>d) || (c>b)  ≡  disjoint",
    fn:(a,b,c,d) => true,
    label:"DE MORGAN",
    examples:[
      { title:"Refactor 'bad case' into 'good case'",
        code:`// 'bad': they DON'T overlap (one ends strictly before the other starts)
boolean disjoint(int[] a, int[] b) {
    return a[1] < b[0] || b[1] < a[0];
}

// Negate via De Morgan to get 'good':
boolean overlap(int[] a, int[] b) {
    return a[1] >= b[0] && b[1] >= a[0];   // == a[0] <= b[1] && b[0] <= a[1]
}`,
        why:"Flipping NOTs across AND/OR is the single most useful refactor in interval problems." },
      { title:"Strict vs non-strict pitfall",
        code:`// CARE: NOT (x < y)  is  (x >= y), NOT  (x > y).
// CARE: NOT (x <= y) is  (x > y),  NOT  (x >= y).
// One off-by-one inversion = wrong overlap test.`,
        why:"De Morgan flips AND↔OR, but each individual term must also be flipped correctly. This is where 90% of interval bugs live." },
    ],
  },
];

const BRIEF_CHEAT_ITEMS = [
  ["Overlap (closed)",        "a[0] <= b[1] && b[0] <= a[1]"],
  ["Disjoint (closed)",       "a[1] < b[0] || b[1] < a[0]"],
  ["Intersection",            "[max(a[0],b[0]), min(a[1],b[1])]"],
  ["Containment",             "a[0] <= b[0] && b[1] <= a[1]"],
  ["Sort by start",           "(a,b) -> Integer.compare(a[0], b[0])"],
  ["Sort by end",             "(a,b) -> Integer.compare(a[1], b[1])"],
  ["Merge step",              "last[1] = Math.max(last[1], cur[1])"],
  ["Sweep events",            "+1 at start, -1 at end; sort; prefix-sum"],
  ["Min rooms (2-ptr)",       "if (starts[i] < ends[j]) rooms++; else j++;"],
  ["Diff array",              "diff[l]+=k; diff[r+1]-=k; then prefix-sum"],
  ["Calendar TreeMap",        "floorEntry(start) / ceilingEntry(start)"],
];

let briefCurrentOp = BRIEF_OPS[0];
let briefCurrentEx = 0;
let briefWhyOpen = {};
let briefA = [2, 6];
let briefB = [4, 9];

function briefOpColor(op) {
  return document.documentElement.getAttribute('data-theme') === 'dark'
    ? (op.colorDark || op.color)
    : op.color;
}

function briefRenderTimeline(intervals, colors, scaleMax) {
  const span = scaleMax || 12;
  let html = '';
  intervals.forEach((iv, i) => {
    if (!iv) return;
    const left  = (iv[0] / span) * 100;
    const width = ((iv[1] - iv[0]) / span) * 100;
    html += `<div class="track" style="left:${left}%; width:${width}%; background:${colors[i]}; top:${4 + i * 12}px;">[${iv[0]}, ${iv[1]}]</div>`;
  });
  let axis = '';
  for (let i = 0; i <= span; i++) axis += `<span>${i}</span>`;
  return `<div class="timeline" style="height:${12 + intervals.length * 14}px;">${html}</div><div class="axis">${axis}</div>`;
}

function briefRenderPanel() {

  const op = briefCurrentOp;
  const color = briefOpColor(op);
  const a0 = briefA[0], a1 = briefA[1], b0 = briefB[0], b1 = briefB[1];

  // Compute live result based on op.
  let resultLine = '';
  if (op.id === 'overlap') {
    const ok = (a0 <= b1) && (b0 <= a1);
    resultLine = `overlap(A, B) = <span class="result-pill ${ok ? 'yes' : 'no'}">${ok ? 'TRUE' : 'FALSE'}</span>`;
  } else if (op.id === 'intersect') {
    const lo = Math.max(a0, b0), hi = Math.min(a1, b1);
    resultLine = lo <= hi
      ? `intersection = <span class="result-pill yes">[${lo}, ${hi}]</span>`
      : `intersection = <span class="result-pill no">EMPTY</span>`;
  } else if (op.id === 'merge') {
    if (b0 <= a1) {
      const mLo = Math.min(a0, b0), mHi = Math.max(a1, b1);
      resultLine = `merge(A, B) = <span class="result-pill yes">[${mLo}, ${mHi}]</span>`;
    } else {
      resultLine = `merge(A, B) = <span class="result-pill no">[A], [B]  (disjoint, no merge)</span>`;
    }
  } else if (op.id === 'sweep') {
    // count active at each integer time
    let maxActive = 0;
    for (let t = Math.min(a0, b0); t <= Math.max(a1, b1); t++) {
      let active = 0;
      if (a0 <= t && t <= a1) active++;
      if (b0 <= t && t <= b1) active++;
      maxActive = Math.max(maxActive, active);
    }
    resultLine = `max concurrent = <span class="result-pill ${maxActive > 1 ? 'yes' : 'no'}">${maxActive}</span>`;
  } else if (op.id === 'greedy') {
    const ok = (b0 >= a1);
    resultLine = `B accepted after A? <span class="result-pill ${ok ? 'yes' : 'no'}">${ok ? 'YES' : 'NO (overlap)'}</span>`;
  } else {
    const overlap = (a0 <= b1) && (b0 <= a1);
    const disjoint = (a1 < b0) || (b1 < a0);
    resultLine = `overlap = <span class="result-pill ${overlap ? 'yes' : 'no'}">${overlap}</span>  &nbsp; disjoint = <span class="result-pill ${disjoint ? 'yes' : 'no'}">${disjoint}</span>  &nbsp; (NOT overlap == disjoint)`;
  }

  const exTabs = op.examples.map((e, i) =>
    `<div class="ex-tab" data-i="${i}" style="${i === briefCurrentEx ? 'background:'+color+'22; color:'+color+'; border-color:'+color : ''}">${escapeHtml(e.title)}</div>`
  ).join('');

  const ex = op.examples[briefCurrentEx];
  const whyOpen = briefWhyOpen[op.id + ':' + briefCurrentEx];

  document.getElementById('briefMainPanel').innerHTML = `
    <div class="op-badge" style="background:${color}22; color:${color}; border:1px solid ${color}">${op.label}</div>
    <div class="op-desc">${escapeHtml(op.desc)}</div>
    <div class="op-rule">${escapeHtml(op.rule)}</div>

    <div class="calc-box">
      <div class="input-row">
        <span class="input-label">A =</span>
        [<input type="number" id="briefA0" value="${a0}" />,
         <input type="number" id="briefA1" value="${a1}" />]
      </div>
      <div class="input-row">
        <span class="input-label">B =</span>
        [<input type="number" id="briefB0" value="${b0}" />,
         <input type="number" id="briefB1" value="${b1}" />]
      </div>
      ${briefRenderTimeline([briefA, briefB], [color, '#888'], 12)}
      <div class="result-line">${resultLine}</div>
    </div>

    <div class="section-label">EXAMPLES</div>
    <div class="ex-tabs">${exTabs}</div>
    <div class="ex-box">
      <div class="ex-title" style="color:${color}">${escapeHtml(ex.title)}</div>
      <pre class="brief-pre"><code>${highlightJava(ex.code)}</code></pre>
      <div class="why-toggle" data-key="${op.id}:${briefCurrentEx}">${whyOpen ? '▼' : '▶'} Why does this work?</div>
      <div class="why-body ${whyOpen ? 'visible' : ''}">${escapeHtml(ex.why)}</div>
    </div>
  `;

  // Wire input handlers.
  ['briefA0','briefA1','briefB0','briefB1'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', () => {
      briefA = [parseInt(document.getElementById('briefA0').value || 0, 10),
                parseInt(document.getElementById('briefA1').value || 0, 10)];
      briefB = [parseInt(document.getElementById('briefB0').value || 0, 10),
                parseInt(document.getElementById('briefB1').value || 0, 10)];
      briefRenderPanel();
    });
  });

  // Example tabs.
  document.querySelectorAll('#briefMainPanel .ex-tab').forEach(t => {
    t.addEventListener('click', () => {
      briefCurrentEx = +t.dataset.i;
      briefRenderPanel();
    });
  });

  // Why toggle.
  const wt = document.querySelector('#briefMainPanel .why-toggle');
  if (wt) {
    wt.addEventListener('click', () => {
      const key = wt.dataset.key;
      briefWhyOpen[key] = !briefWhyOpen[key];
      briefRenderPanel();
    });
  }
}

function briefRenderOpTabs() {
  const html = BRIEF_OPS.map(op => {
    const color = briefOpColor(op);
    const active = op.id === briefCurrentOp.id;
    return `<div class="op-tab" data-id="${op.id}"
      style="${active ? 'background:'+color+'22; color:'+color+'; border-color:'+color : ''}">${escapeHtml(op.name)}</div>`;
  }).join('');
  document.getElementById('briefOpTabs').innerHTML = html;
  document.querySelectorAll('#briefOpTabs .op-tab').forEach(t => {
    t.addEventListener('click', () => {
      briefCurrentOp = BRIEF_OPS.find(o => o.id === t.dataset.id);
      briefCurrentEx = 0;
      briefRenderOpTabs();
      briefRenderPanel();
    });
  });
}

function briefRenderCheatSheet() {
  document.getElementById('briefCheatSheet').innerHTML = BRIEF_CHEAT_ITEMS.map(([n, c]) =>
    `<div class="cheat-row"><span class="cheat-name">${escapeHtml(n)}</span><span class="cheat-code">${escapeHtml(c)}</span></div>`
  ).join('');
}

function initBriefMode() {
  briefRenderOpTabs();
  briefRenderPanel();
  briefRenderCheatSheet();
}

// Re-render brief when the theme toggles so colors track CSS vars.
const briefThemeObserver = new MutationObserver(() => {
  if (state.diff === 'brief') {
    briefRenderOpTabs();
    briefRenderPanel();
  }
});
briefThemeObserver.observe(document.documentElement, {
  attributes: true,
  attributeFilter: ['data-theme'],
});

</script>
