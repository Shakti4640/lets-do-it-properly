<title>Monotonic Stack — Hints, Tricks & Java Snippets</title>

<style>
  :root {
    --bg: #f6f7fb;
    --fg: #1f2330;
    --muted: #6b7280;
    --accent: #2563eb;
    --border: #e3e6ee;
    --card: #ffffff;

    --kw: #cf222e;

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
  }

  /* HAMBURGER + TOC SIDEBAR */
  .hamburger {
    position: fixed; top: 14px; left: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 5px; cursor: pointer; z-index: 1001;
  }
  .hamburger span {
    display: block; width: 22px; height: 2.5px;
    background: #1e1e25; border-radius: 2px;
    transition: transform .25s, opacity .2s;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

  .sidebar {
    position: fixed; top: 0; left: 0;
    height: 100vh; width: 360px; max-width: 90vw;
    background: #ffffff;
    border-right: 1px solid var(--border);
    box-shadow: 2px 0 14px rgba(0,0,0,.06);
    transform: translateX(-100%);
    transition: transform .28s ease;
    overflow-y: auto;
    z-index: 1000;
    padding: 70px 18px 32px;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2 {
    margin: 0 0 12px;
    font-size: 13px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .sidebar .group-title {
    margin-top: 18px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .sidebar a {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px;
    margin: 2px 0;
    text-decoration: none;
    color: #1f2330;
    border-radius: 6px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .sidebar a:hover { background: #eef2ff; color: var(--accent); }
  .sidebar a.active { background: #eef2ff; color: var(--accent); font-weight: 600; }
  .sidebar a .num {
    display: inline-block;
    min-width: 28px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.25);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 999;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  /* HERO + TABS */
  .topbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 18px 24px 0;
    padding-left: 76px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 { margin: 0 0 6px; font-size: 20px; }
  .topbar p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: #f1f3f9;
    color: var(--muted);
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    transition: background .15s;
  }
  .tab:hover { background: #e7eaf3; color: var(--fg); }
  .tab.active {
    background: #ffffff;
    color: var(--fg);
    border-bottom: 2px solid #ffffff;
    margin-bottom: -1px;
    box-shadow: 0 -2px 0 var(--accent) inset;
  }
  .tab .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: 1px;
  }
  .tab.veasy .dot { background: var(--veasy); }
  .tab.easy .dot { background: var(--easy); }
  .tab.med .dot { background: var(--med); }
  .tab.hard .dot { background: var(--hard); }
  .tab .count { color: var(--muted); margin-left: 6px; font-weight: 500; }

  /* MAIN */
  main { max-width: 980px; margin: 0 auto; padding: 28px 24px 120px; }
  .problem-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .problem-card h2 {
    margin: 0 0 6px;
    font-size: 24px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .num-tag {
    background: #eef2ff; color: var(--accent);
    padding: 3px 10px; border-radius: 6px;
    font-size: 13px; font-weight: 700;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff; font-weight: 700; letter-spacing: .05em;
  }
  .badge.veasy { background: var(--veasy); }
  .badge.easy { background: var(--easy); }
  .badge.med { background: var(--med); }
  .badge.hard { background: var(--hard); }

  .section-title {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 8px;
    border-left: 3px solid var(--accent);

  .tips-block {
    background: #fff7ed;

    border-radius: 6px;

  pre.code {
    background: var(--code-bg);
    color: var(--code-fg);
    border: 1px solid var(--border);
    border-radius: 8px;

    overflow-x: auto;
    font-size: 13.5px;
    line-height: 1.55;
    margin: 6px 0;

  }
  .kw  { color: var(--kw);  font-weight: 600; }
  .typ { color: var(--typ); font-weight: 500; }
  .str { color: var(--str); }

  /* PREV/NEXT BAR */

    border-radius: 4px;
    padding: 1px 6px;
    background: #f6f8fa;
    font-family: monospace;
    font-size: 11px;

  }

  @media (max-width: 600px) {
    .topbar { padding-left: 70px; padding-right: 70px; }
    main { padding: 20px 14px 130px; }
    .problem-card { padding: 18px 18px; }
    .problem-card h2 { font-size: 19px; }
  }

  /* THEME TOGGLE BUTTON */
  .theme-toggle {
    position: fixed; top: 14px; right: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);

  }
  .theme-toggle:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }
  .theme-toggle:active { transform: scale(0.95); }

  /* ===================== DARK MODE ===================== */
  [data-theme="dark"] {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --border: #30363d;
    --card: #161b22;
    --code-bg: #0b0f15;
    --code-fg: #e6edf3;
    --kw:  #ff7b72;
    --typ: #d2a8ff;
    --str: #a5d6ff;
    --cmt: #8b949e;
    --num: #79c0ff;
  }
  [data-theme="dark"] .hamburger { background: var(--card); }
  [data-theme="dark"] .hamburger span { background: var(--fg); }
  [data-theme="dark"] .sidebar { background: var(--card); box-shadow: 2px 0 14px rgba(0,0,0,.4); }
  [data-theme="dark"] .sidebar a { color: var(--fg); }
  [data-theme="dark"] .sidebar a:hover,
  [data-theme="dark"] .sidebar a.active { background: rgba(88,166,255,.15); color: var(--accent); }
  [data-theme="dark"] .topbar { background: var(--card); }
  [data-theme="dark"] .tab { background: #0d1117; border-color: var(--border); }
  [data-theme="dark"] .tab:hover { background: #1c2128; color: var(--fg); }
  [data-theme="dark"] .tab.active { background: var(--card); border-bottom-color: var(--card); color: var(--fg); }
  [data-theme="dark"] .num-tag { background: rgba(88,166,255,.15); color: var(--accent); }
  [data-theme="dark"] .intuition { background: rgba(6,182,212,.10); }
  [data-theme="dark"] .tips-block { background: rgba(245,158,11,.10); }
  [data-theme="dark"] .nav-bar { background: var(--card); box-shadow: 0 -2px 8px rgba(0,0,0,.3); }
  [data-theme="dark"] .nav-btn { background: var(--card); color: var(--fg); }
  [data-theme="dark"] .nav-btn:hover:not(:disabled) { background: rgba(88,166,255,.15); color: var(--accent); border-color: var(--accent); }
  [data-theme="dark"] .kbd { background: #1c2128; border-color: var(--border); color: var(--muted); }
  [data-theme="dark"] pre.code { background: var(--code-bg); }
  [data-theme="dark"] .overlay { background: rgba(0,0,0,.55); }
</style>

<script>
/* ----------------------- DATA: ALL PROBLEMS ----------------------- */
const PROBLEMS = [];


/* ===================== TEMPLATE / FOUNDATION ===================== */
PROBLEMS.push({
  num: 0, title: "The Monotonic Stack Template (read this first)", diff: "veasy",
  problem: "A monotonic stack is an ordinary stack that you keep sorted (either always increasing or always decreasing from bottom to top) by popping elements that would break the order before you push. It is the go-to tool for 'next greater / next smaller / previous greater / previous smaller element' questions and for span/area problems like Largest Rectangle in Histogram — anything where each element needs to find its nearest bigger or smaller boundary.",
  intuition: "Imagine scanning left to right while holding a stack of 'candidates still waiting for their answer'. When a new value arrives, it RESOLVES every waiting candidate it dominates: those get popped, and the new value (or the element now on top) is their answer. Because each element is pushed once and popped once, the whole scan is O(n) even though it feels like nested comparisons. The direction of the inequality (increasing vs decreasing) and what you store (index vs value) are the only two dials you ever turn.",
  hints: [
    "Decide FOUR things up front: (1) scan left→right or right→left, (2) stack increasing or decreasing, (3) store indices or values, (4) pop on '<' or '<=' (strict vs non-strict).",
    "RULE OF THUMB: 'next greater' → maintain a DECREASING stack and pop while the new element is greater. 'next smaller' → maintain an INCREASING stack.",
    "Store INDICES, not values, whenever you also need distance/width (e.g., Daily Temperatures, Histogram). You can always read the value via arr[stack.top()].",
    "Whatever is left on the stack at the end had no qualifying neighbour → its answer is the default (0, -1, or n).",
    "The moment you POP an element is the moment its answer is known: the popper (or the new top) is its nearest greater/smaller neighbour."
  ],
  tips: [
    "Use ArrayDeque as both stack (push/pop/peek) and deque — never the legacy java.util.Stack.",
    "Strict vs non-strict (< vs <=) decides how DUPLICATES are handled. For counting/area problems this choice prevents double counting — pick one side strict and the other non-strict.",
    "'Previous' questions = scan left→right and read the stack top BEFORE pushing. 'Next' questions = scan and resolve elements as you pop them.",
    "Circular array? Iterate the index from 0 to 2n-1 and use i % n. Don't physically duplicate the array.",
    "If you find yourself writing an O(n^2) double loop to find a nearest bigger/smaller element, that's the signal to reach for a monotonic stack."
  ],
  code: `/*
 * THE CANONICAL TEMPLATE — "next greater element to the right".
 * Maintain a DECREASING stack of INDICES. When a taller bar arrives, it is
 * the answer for every shorter bar waiting on the stack.
 */
int[] nextGreater(int[] a) {
    int n = a.length;
    int[] ans = new int[n];
    Arrays.fill(ans, -1);                         // default: no greater element
    Deque<Integer> st = new ArrayDeque<>();       // stores INDICES, values decreasing

    for (int i = 0; i < n; i++) {
        // current a[i] resolves everything smaller still on the stack
        while (!st.isEmpty() && a[st.peek()] < a[i]) {
            int idx = st.pop();                   // idx's answer is found NOW
            ans[idx] = a[i];                      // ...it is a[i]
        }
        st.push(i);                               // i now waits for ITS greater
    }
    return ans;                                   // leftover indices keep -1
}

/*
 * MENTAL CHECKLIST you fill in for every variant:
 *   direction : left->right  (use right->left for "previous"-style scans)
 *   monotone  : decreasing   (use increasing for "next/prev SMALLER")
 *   store     : indices       (needed for widths/distances)
 *   pop test  : a[top] < a[i] (use <= to make duplicates non-strict)
 *
 * Tiny trace for a = [2, 1, 2, 4, 3]:
 *   i=0 push0            stack=[0]            (values: 2)
 *   i=1 push1            stack=[0,1]          (2,1)
 *   i=2 a[1]=1<2 pop1 ans[1]=2; a[0]=2<2? no; push2  stack=[0,2]
 *   i=3 a[2]=2<4 pop2 ans[2]=4; a[0]=2<4 pop0 ans[0]=4; push3 stack=[3]
 *   i=4 a[3]=4<3? no; push4   stack=[3,4]
 *   leftover 3,4 -> ans[3]=ans[4]=-1   =>   ans = [4,2,4,-1,-1]
 */`,
  complexity: "Time O(n): each index is pushed once and popped at most once. Space O(n) for the stack."
});

/* ===================== VERY EASY (PATTERN BUILDING) ===================== */

PROBLEMS.push({
  num: 496, title: "Next Greater Element I", diff: "veasy",
  problem: "Given nums1 (a subset of nums2), for each value in nums1 find the first greater element to its right in nums2. Return -1 where none exists.",
  intuition: "Precompute the 'next greater' for EVERY element of nums2 once using the decreasing-stack template, store the results in a map keyed by value (values are unique), then answer each nums1 query in O(1).",
  hints: [
    "Run the standard next-greater scan over nums2.",
    "Each time you pop index/value v because a bigger value g appeared, record map[v] = g.",
    "Anything still on the stack at the end has no greater element → leave it out of the map (default -1).",
    "Finally map each nums1 value through the table."
  ],
  tips: [
    "Because nums2 has unique values, you can key the map by value instead of index — cleaner.",
    "This 'precompute once, answer many' shape is why the problem feels easy despite the subset twist."
  ],
  code: `/*
 * LC 496 — precompute next-greater for nums2, then map nums1 queries.
 */
int[] nextGreaterElement(int[] nums1, int[] nums2) {

    Map<Integer, Integer> next = new HashMap<>();
    Deque<Integer> st = new ArrayDeque<>();       // decreasing stack of VALUES

    for (int x : nums2) {
        while (!st.isEmpty() && st.peek() < x)    // x resolves smaller values
            next.put(st.pop(), x);
        st.push(x);
    }
    // values left on the stack have no greater element -> default below

    int[] ans = new int[nums1.length];
    for (int i = 0; i < nums1.length; i++)
        ans[i] = next.getOrDefault(nums1[i], -1);
    return ans;
}`,
  complexity: "Time O(n + m). Space O(n) for the stack and map."
});

PROBLEMS.push({
  num: 739, title: "Daily Temperatures", diff: "veasy",
  problem: "Given daily temperatures, return an array where answer[i] is the number of days you must wait until a warmer temperature. If none, put 0.",
  intuition: "Identical to next-greater, but the answer is the DISTANCE, not the value. So store INDICES on the stack; when day j resolves a waiting day i, the wait is j - i.",
  hints: [
    "Keep a decreasing stack of day indices.",
    "When temps[i] > temps[stack.top()], pop and set answer[top] = i - top.",
    "Push i and continue.",
    "Indices still on the stack at the end keep their default 0 (no warmer day)."
  ],
  tips: [
    "This is the textbook 'store indices to get distances' use case.",
    "Iterating right→left with a different formulation also works, but left→right with distances is the cleanest."
  ],
  code: `/*
 * LC 739 — next warmer day; store INDICES so we can return the gap.
 */
int[] dailyTemperatures(int[] temps) {

    int n = temps.length;
    int[] ans = new int[n];                       // defaults to 0
    Deque<Integer> st = new ArrayDeque<>();       // decreasing stack of indices

    for (int i = 0; i < n; i++) {
        while (!st.isEmpty() && temps[st.peek()] < temps[i]) {
            int j = st.pop();
            ans[j] = i - j;                        // days waited = distance
        }
        st.push(i);
    }
    return ans;
}`,
  complexity: "Time O(n). Space O(n)."
});

PROBLEMS.push({
  num: 503, title: "Next Greater Element II (Circular)", diff: "veasy",
  problem: "Given a CIRCULAR integer array, return the next greater element for each position (wrapping around the end back to the start). Return -1 where none exists.",
  intuition: "The only change from the linear case is that the array wraps. Simulate the wrap by iterating the index from 0 to 2n-1 and using i % n. Push real indices only on the first pass; the second pass just resolves leftovers.",
  hints: [
    "Loop i from 0 to 2n-1; the working index is i % n.",
    "Keep a decreasing stack of indices, resolving as usual.",
    "Only push during the first n iterations (i < n) so each index enters the stack once.",
    "Whatever survives both passes truly has no greater element → -1."
  ],
  tips: [
    "Do NOT physically concatenate the array; the modulo trick is O(1) extra space conceptually and avoids copies.",
    "The second pass is purely for elements that wrap around to find their answer at the front."
  ],
  code: `/*
 * LC 503 — circular next-greater via a 2n virtual scan with i % n.
 */
int[] nextGreaterElements(int[] nums) {

    int n = nums.length;
    int[] ans = new int[n];
    Arrays.fill(ans, -1);
    Deque<Integer> st = new ArrayDeque<>();       // decreasing stack of indices

    for (int i = 0; i < 2 * n; i++) {
        int cur = nums[i % n];
        while (!st.isEmpty() && nums[st.peek()] < cur)
            ans[st.pop()] = cur;                   // resolve, possibly across wrap
        if (i < n) st.push(i);                     // push each real index once
    }
    return ans;
}`,
  complexity: "Time O(n) (2n iterations). Space O(n)."
});


/* ===================== EASY ===================== */

PROBLEMS.push({
  num: 901, title: "Online Stock Span", diff: "easy",
  problem: "Design a class that, for each new daily price, returns the span: the number of consecutive days (ending today, going back) whose price was <= today's price.",
  intuition: "The span back from today stops at the first earlier day with a strictly greater price — a 'previous greater element' problem, solved online. Keep a decreasing stack of (price, span) pairs; when today's price swallows shorter days, add their spans into today's.",
  hints: [
    "Maintain a stack of [price, span] pairs, decreasing by price from bottom to top.",
    "For a new price, start span = 1.",
    "While the stack top's price <= today's price, pop it and add its span to today's.",
    "Push [price, accumulatedSpan] and return that span."

  hints: [
    "Build prefix sums of length n+1.",
    "Maintain a deque of indices with increasing prefix-sum values.",
    "For each i: while P[i] - P[front] >= K, record i - front and pop the front (it can't help a later, longer answer).",
    "While P[i] <= P[back], pop the back (P[i] dominates: smaller and more recent)."
  ],
  tips: [
    "Negatives break the plain sliding-window approach — that's why the monotonic deque on prefix sums is needed.",
    "Popping the back when P[i] <= P[back] keeps the deque increasing AND prefers later indices for shorter subarrays.",
    "Use long for prefix sums to avoid overflow."
  ],
  code: `/*
 * LC 862 — monotonic increasing deque over prefix sums (handles negatives).
 */
int shortestSubarray(int[] nums, int K) {

    int n = nums.length;
    long[] P = new long[n + 1];
    for (int i = 0; i < n; i++) P[i + 1] = P[i] + nums[i];

    int ans = n + 1;
    Deque<Integer> dq = new ArrayDeque<>();        // indices, P increasing front->back

    for (int i = 0; i <= n; i++) {
        // front qualifies: P[i] - P[front] >= K -> record and discard front
        while (!dq.isEmpty() && P[i] - P[dq.peekFirst()] >= K)
            ans = Math.min(ans, i - dq.pollFirst());
        // back is useless if its prefix sum >= current (current is smaller & later)
        while (!dq.isEmpty() && P[dq.peekLast()] >= P[i])
            dq.pollLast();
        dq.offerLast(i);
    }
    return ans <= n ? ans : -1;
}`,
  complexity: "Time O(n). Space O(n)."
});


/* ----------------------- RENDERING ENGINE ----------------------- */

const DIFF_LABEL = { veasy: 'Very Easy', easy: 'Easy', med: 'Medium', hard: 'Hard' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Lightweight Java syntax highlighter. */
function highlightJava(src) {
  let s = escapeHtml(src);
  const stash = [];
  const stashIt = (html) => {
    stash.push(html);
    return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001';
  };
  s = s.replace(/\/\/[^\n]*/g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/&quot;([^&]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  s = s.replace(/&#39;.&#39;|&#39;\\.&#39;/g, m => stashIt('<span class="str">' + m + '</span>'));

  const types = ['String','Integer','Long','Boolean','Character','Double','Float',
    'List','Map','Set','HashMap','HashSet','TreeMap','TreeSet','ArrayList','LinkedList',
    'ArrayDeque','Queue','Deque','PriorityQueue','StringBuilder','BitSet','Stack',
    'TreeNode','ListNode','StockSpanner','Random','Collections','Arrays','Math','Comparator','Objects'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  const kws = ['void','int','long','boolean','char','double','float','byte','short',
    'public','private','protected','static','final','abstract','class','interface','enum',
    'return','if','else','for','while','do','break','continue','switch','case','default',
    'new','null','true','false','this','super','try','catch','finally','throw','throws',
    'import','package','extends','implements','instanceof'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  s = s.replace(/\b(\d+(?:_\d+)*L?)\b/g, '<span class="num">$1</span>');

  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

function getProblems(diff) {
  return PROBLEMS.filter(p => p.diff === diff);
}

const state = { diff: 'veasy', idx: 0 };

function renderTOC() {
  const toc = document.getElementById('toc');
  const groups = [
    { diff: 'veasy', label: 'Very Easy' },
    { diff: 'easy',  label: 'Easy' },
    { diff: 'med',   label: 'Medium' },
    { diff: 'hard',  label: 'Hard' },
  ];
  const html = groups.map(g => {
    const items = getProblems(g.diff)
      .map((p, i) => `<a data-diff="${g.diff}" data-idx="${i}"><span class="num">${p.num === 0 ? '★' : '#' + p.num}</span>${escapeHtml(p.title)}</a>`)
      .join('');
    return `<div class="group-title">${g.label}</div>${items}`;
  }).join('');
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      state.diff = a.dataset.diff;
      state.idx = +a.dataset.idx;
      render();
      toggleSidebar(false);
    });
  });
}

function renderTabs() {
  document.getElementById('cnt-veasy').textContent = '(' + getProblems('veasy').length + ')';
  document.getElementById('cnt-easy').textContent  = '(' + getProblems('easy').length + ')';
  document.getElementById('cnt-med').textContent   = '(' + getProblems('med').length + ')';
  document.getElementById('cnt-hard').textContent  = '(' + getProblems('hard').length + ')';
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      if (state.diff !== t.dataset.diff) {
        state.diff = t.dataset.diff;
        state.idx = 0;
        render();
      }
    };
  });
}

function render() {
  const problems = getProblems(state.diff);
  if (state.idx >= problems.length) state.idx = problems.length - 1;
  if (state.idx < 0) state.idx = 0;
  const p = problems[state.idx];
  const main = document.getElementById('main');
  const numTag = p.num === 0 ? '★ Foundation' : '#' + p.num;
  main.innerHTML = `
    <div class="problem-card">
      <h2>
        <span class="num-tag">${numTag}</span>
        ${escapeHtml(p.title)}
        <span class="badge ${p.diff}">${DIFF_LABEL[p.diff]}</span>
      </h2>

      <div class="section-title">Problem</div>
      <p>${escapeHtml(p.problem)}</p>

      <div class="section-title">Intuition</div>
      <div class="intuition">${escapeHtml(p.intuition)}</div>

      <div class="section-title">Step-by-step Hints</div>
      <ol class="hints">${p.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ol>

      <div class="section-title">Tips & Tricks</div>
      <div class="tips-block"><ul class="tips">${p.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>

      <div class="section-title">Java Code</div>
      <pre class="code"><code>${highlightJava(p.code)}</code></pre>

      ${p.complexity ? `<div class="complexity"><b>Complexity:</b> ${escapeHtml(p.complexity)}</div>` : ''}
    </div>
  `;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.diff === state.diff);
  });

  document.getElementById('prev').disabled = state.idx === 0;
  document.getElementById('next').disabled = state.idx === problems.length - 1;
  document.getElementById('nav-info').textContent =
    `${DIFF_LABEL[state.diff]} · ${state.idx + 1} / ${problems.length}`;

  document.querySelectorAll('.sidebar a').forEach(a => {
    a.classList.toggle('active', a.dataset.diff === state.diff && +a.dataset.idx === state.idx);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextProblem() {
  const arr = getProblems(state.diff);
  if (state.idx < arr.length - 1) { state.idx++; render(); }
}
function prevProblem() {
  if (state.idx > 0) { state.idx--; render(); }
}
document.getElementById('prev').addEventListener('click', prevProblem);
document.getElementById('next').addEventListener('click', nextProblem);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') prevProblem();
  else if (e.key === 'ArrowRight') nextProblem();
  else if (e.key === 'Escape') toggleSidebar(false);
});

const hb = document.getElementById('hamburger');
const sb = document.getElementById('sidebar');
const ov = document.getElementById('overlay');
function toggleSidebar(open) {
  const isOpen = (typeof open === 'boolean') ? open : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  hb.classList.toggle('open', isOpen);
  ov.classList.toggle('show', isOpen);
}
hb.addEventListener('click', () => toggleSidebar());
ov.addEventListener('click', () => toggleSidebar(false));

const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️';
    themeBtn.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙';
    themeBtn.title = 'Switch to dark mode';
  }
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('theme', next);
});

/* boot */
renderTabs();
bindTabs();
renderTOC();
render();

</script>

<!-- KIRO_CROSS_TAB_NAV_START -->
<script id="kiro-cross-tab-nav">
(function(){
  if(window.__kiroCrossTabNav) return;
  window.__kiroCrossTabNav = true;
  function init(){
    if(typeof getProblems !== 'function' || typeof window.render !== 'function' || typeof state === 'undefined') return;
    var ORDER = ['veasy','easy','med','hard'];
    function diffs(){ return ORDER.filter(function(d){ try { return getProblems(d).length > 0; } catch(e){ return false; } }); }

    function updateNavButtons(){
      var prevB = document.getElementById('prev');
      var nextB = document.getElementById('next');
      if(!prevB || !nextB) return;
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      prevB.disabled = (di <= 0 && state.idx <= 0);
      nextB.disabled = (di === list.length - 1 && state.idx >= arr.length - 1);
    }

    var origRender = window.render;
    window.render = function(){
      var r = origRender.apply(this, arguments);
      try { updateNavButtons(); } catch(e){}
      return r;
    };

    function goNext(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      if(state.idx < arr.length - 1){ state.idx++; window.render(); return; }
      if(di < list.length - 1){ state.diff = list[di + 1]; state.idx = 0; window.render(); }
    }
    function goPrev(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      if(state.idx > 0){ state.idx--; window.render(); return; }
      if(di > 0){
        var pd = list[di - 1];
        state.diff = pd;
        var parr = getProblems(pd);
        state.idx = Math.max(0, parr.length - 1);
        window.render();
      }
    }

    window.nextProblem = goNext;
    window.prevProblem = goPrev;

    ['prev','next'].forEach(function(id){
      var b = document.getElementById(id);
      if(!b) return;
      var clone = b.cloneNode(true);
      b.parentNode.replaceChild(clone, b);
      clone.addEventListener('click', id === 'next' ? goNext : goPrev);
    });

    updateNavButtons();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<!-- KIRO_CROSS_TAB_NAV_END -->
