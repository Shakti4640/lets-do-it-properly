<style>

    color: var(--fg);

  }

  /* HAMBURGER + TOC SIDEBAR */
  .hamburger {
    position: fixed; top: 14px; left: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 5px; cursor: pointer; z-index: 1001;
  }
  .hamburger span {
    display: block; width: 22px; height: 2.5px;
    background: #1e1e25; border-radius: 2px;
    transition: transform .25s, opacity .2s;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

  .sidebar {
    position: fixed; top: 0; left: 0;
    height: 100vh; width: 360px; max-width: 90vw;
    background: #ffffff;
    border-right: 1px solid var(--border);
    box-shadow: 2px 0 14px rgba(0,0,0,.06);
    transform: translateX(-100%);

    overflow-y: auto;
    z-index: 1000;
    padding: 70px 18px 32px;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2 {
    margin: 0 0 12px;
    font-size: 13px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .sidebar .group-title {
    margin-top: 18px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .sidebar a {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px;
    margin: 2px 0;
    text-decoration: none;
    color: #1f2330;
    border-radius: 6px;
    font-size: 13.5px;
    cursor: pointer;
  }

  .sidebar a.active { background: #eef2ff; color: var(--accent); font-weight: 600; }
  .sidebar a .num {
    display: inline-block;
    min-width: 28px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.25);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 999;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .topbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 18px 24px 0;
    padding-left: 76px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 { margin: 0 0 6px; font-size: 20px; }
  .topbar p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: #f1f3f9;
    color: var(--muted);
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    transition: background .15s;

  .tab.active {
    background: #ffffff;
    color: var(--fg);
    border-bottom: 2px solid #ffffff;
    margin-bottom: -1px;
    box-shadow: 0 -2px 0 var(--accent) inset;

    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%;

  .tab.easy .dot { background: var(--easy); }

  }

    background: #eef2ff; color: var(--accent);

    font-size: 13px; font-weight: 700;

  .badge {
    display: inline-block;
    font-size: 11px;

    border-radius: 999px;

  }
  .badge.veasy { background: var(--veasy); }
  .badge.easy { background: var(--easy); }
  .badge.med { background: var(--med); }
  .badge.hard { background: var(--hard); }

  .section-title {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);

  @media (max-width: 600px) {
    .topbar { padding-left: 70px; padding-right: 70px; }

  /* THEME TOGGLE BUTTON */

  /* ===================== DARK MODE ===================== */

  }
  [data-theme="dark"] .hamburger { background: var(--card); }

  [data-theme="dark"] .sidebar { background: var(--card); box-shadow: 2px 0 14px rgba(0,0,0,.4); }
  [data-theme="dark"] .sidebar a { color: var(--fg); }

  [data-theme="dark"] .tab.active { background: var(--card); border-bottom-color: var(--card); color: var(--fg); }

<script>
/* ----------------------- DATA: ALL PROBLEMS ----------------------- */
const PROBLEMS = [];


/* ===================== TEMPLATE / FOUNDATION ===================== */
PROBLEMS.push({
  num: 0, title: "The Topological Sort Template (read this first)", diff: "veasy",
  problem: "Topological sort produces a linear ordering of the vertices of a Directed Acyclic Graph (DAG) such that for every directed edge u -> v, u appears before v in the ordering. It answers the question: \"Given a pile of tasks with prerequisites, in what order can I do them?\" It only exists when the graph has NO cycle — a cycle means a circular dependency that can never be satisfied.",
  intuition: "Think of edges as the arrow of 'must-come-before'. A node with no incoming arrows has nothing blocking it, so it can go first. Remove it, and some other nodes lose their last blocker and become free. Repeat. That peeling process is Kahn's algorithm (BFS on indegrees). The mirror image is DFS: dive to the deepest dependency, and a node is only finished once everything it points to is finished — so the order in which nodes FINISH, reversed, is a valid topological order.",
  hints: [
    "Two standard implementations: (1) Kahn's BFS — repeatedly pop nodes whose indegree is 0; (2) DFS — push a node onto a stack AFTER all its descendants are visited, then reverse the stack.",
    "CYCLE DETECTION is free in Kahn's: if you process fewer than V nodes, the leftover nodes are stuck in a cycle. In DFS you need a 3-color (white/gray/black) marker to spot a back edge to a gray node.",
    "Build the graph as an adjacency list AND an indegree[] array for Kahn's. Edge a -> b means 'a before b', so indegree[b]++.",
    "Decide edge direction carefully. 'Course a needs prerequisite b' means b -> a (do b first). Drawing one tiny example on paper prevents reversed-edge bugs.",
    "The topological order is generally NOT unique. If a problem wants the lexicographically smallest order, swap the plain queue for a PriorityQueue."
  ],
  tips: [
    "Kahn's is usually the safer default in interviews: it detects cycles naturally and never blows the recursion stack on deep graphs.",
    "If you need 'levels' (how many rounds / minimum semesters), process the BFS queue one full layer at a time and count layers.",
    "Longest path in a DAG = process nodes in topological order and relax dp[v] = max(dp[v], dp[u] + w). This is the backbone of critical-path problems.",
    "For DFS topo sort, remember to REVERSE the finish-order list (or use a stack) — forgetting the reverse is the classic bug.",
    "Self-loop (a -> a) is an instant cycle; watch for it when inputs allow duplicate or reflexive edges."
  ],
  code: `/*
 * KAHN'S ALGORITHM (BFS on indegrees) — the workhorse template.
 * Returns a valid topological order, or an empty list if a cycle exists.
 *   edges[i] = {u, v} meaning u must come BEFORE v   (u -> v)
 */
int[] topoSort(int n, int[][] edges) {

    // ---- 1. BUILD GRAPH + INDEGREE --------------------------------------
    List<List<Integer>> adj = new ArrayList<>();
    for (int i = 0; i < n; i++) adj.add(new ArrayList<>());
    int[] indeg = new int[n];
    for (int[] e : edges) {
        adj.get(e[0]).add(e[1]);      // u -> v
        indeg[e[1]]++;                // v gains an incoming edge
    }

    // ---- 2. SEED THE QUEUE WITH EVERY 0-INDEGREE NODE -------------------
    Deque<Integer> q = new ArrayDeque<>();
    for (int i = 0; i < n; i++) if (indeg[i] == 0) q.offer(i);

    // ---- 3. PEEL NODES ONE BY ONE ---------------------------------------
    int[] order = new int[n];
    int idx = 0;
    while (!q.isEmpty()) {
        int u = q.poll();
        order[idx++] = u;             // u is safe to place next
        for (int v : adj.get(u)) {
            if (--indeg[v] == 0)      // v just lost its last blocker
                q.offer(v);
        }
    }

    // ---- 4. CYCLE CHECK -------------------------------------------------
    // If we couldn't place all n nodes, the rest sit inside a cycle.
    return idx == n ? order : new int[0];
}

/*
 * DFS VARIANT — push on the way OUT, then reverse.
 * color: 0 = unvisited, 1 = in-progress (on stack), 2 = done.
 * Seeing a '1' node again = back edge = cycle.
 */
boolean dfs(int u, List<List<Integer>> adj, int[] color, Deque<Integer> out) {
    color[u] = 1;                                 // mark in-progress
    for (int v : adj.get(u)) {
        if (color[v] == 1) return false;          // back edge -> cycle
        if (color[v] == 0 && !dfs(v, adj, color, out)) return false;
    }
    color[u] = 2;                                 // fully explored
    out.push(u);                                  // finished -> push to stack
    return true;                                  // (stack reverses finish order)
}`,
  complexity: "Both Kahn's and DFS run in O(V + E) time and O(V + E) space. Cycle detection is included at no extra asymptotic cost."
});

/* ===================== VERY EASY (PATTERN BUILDING) ===================== */

PROBLEMS.push({
  num: 1, title: "Kahn's Algorithm (Indegree BFS)", diff: "veasy",
  problem: "Given a DAG with n nodes and a list of directed edges, return any valid topological ordering using the indegree / BFS method.",
  intuition: "A node can go next exactly when every node that must precede it has already been placed — i.e., when its indegree drops to 0. Maintain a queue of all currently-free nodes and drain it.",
  hints: [
    "Precompute indegree[v] = number of edges pointing INTO v.",
    "Seed a queue with all nodes whose indegree is 0.",
    "Pop a node, append to the order, and decrement the indegree of each neighbour; push any neighbour that hits 0.",
    "Continue until the queue is empty."
  ],
  tips: [
    "Use ArrayDeque, not LinkedList, for the queue — same Big-O, less overhead.",
    "Keep a counter of placed nodes; comparing it to n at the end is your cycle test."
  ],
  code: `/*
 * Kahn's algorithm, isolated. Returns the order list (empty if a cycle exists).
 */
List<Integer> kahn(int n, List<List<Integer>> adj) {

    int[] indeg = new int[n];
    for (int u = 0; u < n; u++)
        for (int v : adj.get(u)) indeg[v]++;      // count incoming edges

    Deque<Integer> q = new ArrayDeque<>();
    for (int i = 0; i < n; i++)
        if (indeg[i] == 0) q.offer(i);            // free nodes first

    List<Integer> order = new ArrayList<>();
    while (!q.isEmpty()) {
        int u = q.poll();
        order.add(u);
        for (int v : adj.get(u))
            if (--indeg[v] == 0) q.offer(v);       // unlock dependents
    }

    return order.size() == n ? order : new ArrayList<>();   // cycle -> empty
}`,
  complexity: "Time O(V + E). Space O(V) for the indegree array and queue."
});

PROBLEMS.push({
  num: 2, title: "DFS-Based Topological Sort", diff: "veasy",
  problem: "Produce a topological order of a DAG using post-order DFS instead of indegrees.",
  intuition: "A node is only truly 'finished' once every node it depends on (points to) is finished. So if you record nodes in the order they FINISH and then reverse that list, dependencies always come out before the nodes that need them.",
  hints: [
    "Maintain a visited[] array and an output stack (or list you reverse at the end).",
    "For each unvisited node, DFS into all neighbours first, THEN push the node.",
    "After all DFS calls complete, pop the stack (or reverse the list) for the order.",
    "Use a separate in-progress marker if you also need to detect cycles."
  ],
  tips: [
    "The 'push after the loop' placement is the whole trick — push before and you get the wrong order.",
    "Very deep graphs can overflow the recursion stack; prefer Kahn's if depth could be large."
  ],
  code: `/*
 * Post-order DFS topological sort. Push each node AFTER its subtree is done,
 * then reverse (here a Deque used as a stack does the reversing for us).
 */
void dfs(int u, List<List<Integer>> adj, boolean[] vis, Deque<Integer> stack) {

    vis[u] = true;
    for (int v : adj.get(u))
        if (!vis[v]) dfs(v, adj, vis, stack);     // finish all descendants first

    stack.push(u);                                // now u is finished -> record
}

List<Integer> topoDFS(int n, List<List<Integer>> adj) {
    boolean[] vis = new boolean[n];
    Deque<Integer> stack = new ArrayDeque<>();
    for (int i = 0; i < n; i++)
        if (!vis[i]) dfs(i, adj, vis, stack);     // cover disconnected parts

    List<Integer> order = new ArrayList<>();
    while (!stack.isEmpty()) order.add(stack.pop());   // stack reverses finish order
    return order;
}`,
  complexity: "Time O(V + E). Space O(V) for recursion + the output stack."
});

PROBLEMS.push({
  num: 3, title: "Detect a Cycle in a Directed Graph", diff: "veasy",
  problem: "Return true if a directed graph contains at least one cycle. A topological order exists if and only if the graph is acyclic.",
  intuition: "During DFS, color a node GRAY while it's still on the recursion stack and BLACK once fully explored. If you ever reach a GRAY node again, you've looped back along the current path — a back edge — which is exactly a cycle.",
  hints: [
    "Use an int[] color with 0 = white (unseen), 1 = gray (in recursion stack), 2 = black (done).",
    "Set color = gray on entry, recurse, set color = black on exit.",
    "If a neighbour is gray, return true (cycle found).",
    "Equivalently: run Kahn's and check whether fewer than V nodes get processed."
  ],
  tips: [
    "A plain boolean 'visited' is NOT enough — you must distinguish 'on the current path' from 'already finished'.",
    "Kahn's-based detection avoids recursion entirely and is often cleaner in interviews."
  ],
  code: `/*
 * 3-color DFS cycle detection in a directed graph.
 * 0 = white (unvisited), 1 = gray (on current DFS path), 2 = black (done).
 */
boolean hasCycle(int u, List<List<Integer>> adj, int[] color) {

    color[u] = 1;                                 // entering: mark gray
    for (int v : adj.get(u)) {
        if (color[v] == 1) return true;           // back edge to gray -> cycle
        if (color[v] == 0 && hasCycle(v, adj, color)) return true;
    }
    color[u] = 2;                                 // leaving: mark black
    return false;
}

boolean isCyclic(int n, List<List<Integer>> adj) {
    int[] color = new int[n];
    for (int i = 0; i < n; i++)

    List<List<Integer>> adj = new ArrayList<>();
    for (int i = 0; i < numCourses; i++) adj.add(new ArrayList<>());

    for (int[] p : prerequisites) {
        adj.get(p[1]).add(p[0]);                  // b -> a

  problem: "Given a tree (connected, undirected, n-1 edges), find all root choices that minimize the tree's height. Return the list of such roots (one or two nodes).",
  intuition: "The best roots are the 'center(s)' of the tree. Find them by topological-style PEELING: repeatedly strip away all current leaves (degree 1). The last 1 or 2 nodes standing are the centroids — the most balanced roots.",
  hints: [
    "Build an undirected adjacency list and a degree[] array.",
    "Seed a queue with all leaves (degree == 1).",
    "Peel layer by layer: remove leaves, decrement neighbours' degree, new leaves join the next layer.",
    "Stop when 2 or fewer nodes remain — those are the answer."
  ],
  tips: [
    "This is topological sort adapted to undirected graphs: 'indegree' becomes 'degree', and you stop early rather than draining fully.",
    "Edge cases: n == 1 → return [0]; n == 2 → both nodes are centers.",
    "A tree always has exactly one or two centroids — never more."
  ],
  code: `/*
 * LC 310 — peel leaves layer by layer; the final 1-2 nodes are the centroids.
 */
List<Integer> findMinHeightTrees(int n, int[][] edges) {

    if (n == 1) return List.of(0);

    List<Set<Integer>> adj = new ArrayList<>();
    for (int i = 0; i < n; i++) adj.add(new HashSet<>());
    for (int[] e : edges) {
        adj.get(e[0]).add(e[1]);
        adj.get(e[1]).add(e[0]);                  // undirected
    }

    // initial leaves = degree 1
    List<Integer> leaves = new ArrayList<>();
    for (int i = 0; i < n; i++)
        if (adj.get(i).size() == 1) leaves.add(i);

    int remaining = n;
    while (remaining > 2) {                       // stop when <=2 left
        remaining -= leaves.size();
        List<Integer> next = new ArrayList<>();
        for (int leaf : leaves) {
            int nb = adj.get(leaf).iterator().next();
            adj.get(nb).remove(leaf);             // detach leaf
            if (adj.get(nb).size() == 1) next.add(nb);   // new leaf
        }
        leaves = next;
    }
    return leaves;                                // 1 or 2 centroids
}`,
  complexity: "Time O(V + E). Space O(V + E)."
});

  hints: [

    "Guard every write with a head != null check so leftovers stay -1."
  ],
  tips: [
    "Included for tracking; the technique is matrix simulation, not topological sort.",
    "Stopping mid-side when the list ends is the only subtlety."
  ],
  code: `/*
 * LC 2326 — spiral boundary simulation (NOT topo sort).
 */
int[][] spiralMatrix(int m, int n, ListNode head) {
    int[][] g = new int[m][n];
    for (int[] row : g) Arrays.fill(row, -1);

    int top = 0, bottom = m - 1, left = 0, right = n - 1;
    while (head != null && top <= bottom && left <= right) {
        for (int c = left; c <= right && head != null; c++) { g[top][c] = head.val; head = head.next; }
        top++;
        for (int r = top; r <= bottom && head != null; r++) { g[r][right] = head.val; head = head.next; }
        right--;
        for (int c = right; c >= left && head != null; c--) { g[bottom][c] = head.val; head = head.next; }
        bottom--;
        for (int r = bottom; r >= top && head != null; r--) { g[r][left] = head.val; head = head.next; }
        left++;
    }
    return g;
}`,
  complexity: "Time O(m·n). Space O(1) beyond the output."
});

    "Watch the invalid prefix case: if word1 is longer than word2 but word2 is a prefix of word1 (e.g. \"abc\" before \"ab\"), it's impossible → return \"\".",

  ],
  tips: [
    "Only the FIRST differing character gives information — stop comparing the pair after you add one edge.",
    "Use a Map<Character, Set<Character>> to avoid adding duplicate edges (duplicates would corrupt indegree counts).",
    "Initialize indegree entries for every letter, even those with no edges, so isolated letters still appear."
  ],
  code: `/*
 * LC 269 — build a letter graph from adjacent word comparisons, then topo sort.
 */
String alienOrder(String[] words) {

    Map<Character, Set<Character>> adj = new HashMap<>();
    Map<Character, Integer> indeg = new HashMap<>();
    for (String w : words)
        for (char c : w.toCharArray()) {
            adj.putIfAbsent(c, new HashSet<>());
            indeg.putIfAbsent(c, 0);              // every letter must appear
        }

    for (int i = 0; i + 1 < words.length; i++) {
        String a = words[i], b = words[i + 1];
        int len = Math.min(a.length(), b.length());
        // invalid: longer word is a prefix-superset of the next
        if (a.length() > b.length() && a.startsWith(b)) return "";
        for (int j = 0; j < len; j++) {
            char x = a.charAt(j), y = b.charAt(j);
            if (x != y) {                         // first difference => x before y
                if (adj.get(x).add(y)) indeg.merge(y, 1, Integer::sum);
                break;                            // only first diff matters
            }
        }
    }

    Deque<Character> q = new ArrayDeque<>();
    for (var e : indeg.entrySet())
        if (e.getValue() == 0) q.offer(e.getKey());

    StringBuilder sb = new StringBuilder();
    while (!q.isEmpty()) {
        char u = q.poll();
        sb.append(u);
        for (char v : adj.get(u))
            if (indeg.merge(v, -1, Integer::sum) == 0) q.offer(v);
    }

    return sb.length() == indeg.size() ? sb.toString() : "";   // cycle -> ""
}`,

});

  problem: "n courses with prerequisite relations. Each semester you may take any number of courses whose prerequisites are all met. Return the minimum number of semesters to finish all courses, or -1 if impossible.",
  intuition: "This is layered (level-order) topological sort. Every semester you take ALL currently-free courses at once — that's exactly one BFS layer of Kahn's algorithm. Count the layers.",
  hints: [
    "Build relations[i] = [a, b] as edge a -> b, indegree[b]++.",
    "Run Kahn's BFS but process the queue one full layer per iteration.",
    "Increment a semester counter for each layer that has work.",
    "If you finish fewer than n courses, a cycle exists → return -1."
  ],
  tips: [
    "Snapshot the queue size at the start of each semester loop; only those nodes belong to the current layer.",
    "This 'count the layers' trick reappears in any 'minimum rounds' graph problem.",
    "The number of semesters equals the length of the longest dependency chain."
  ],
  code: `/*
 * LC 1136 — level-order (layered) Kahn's. Each BFS layer = one semester.
 */
int minimumSemesters(int n, int[][] relations) {

    List<List<Integer>> adj = new ArrayList<>();
    for (int i = 0; i <= n; i++) adj.add(new ArrayList<>());
    int[] indeg = new int[n + 1];                 // courses are 1-indexed
    for (int[] r : relations) {
        adj.get(r[0]).add(r[1]);                  // r[0] before r[1]
        indeg[r[1]]++;
    }

    Deque<Integer> q = new ArrayDeque<>();
    for (int i = 1; i <= n; i++)
        if (indeg[i] == 0) q.offer(i);

    int semesters = 0, taken = 0;
    while (!q.isEmpty()) {
        int layer = q.size();                     // all courses free this term
        semesters++;
        for (int k = 0; k < layer; k++) {
            int u = q.poll();
            taken++;
            for (int v : adj.get(u))
                if (--indeg[v] == 0) q.offer(v);
        }
    }

    return taken == n ? semesters : -1;           // leftover => cycle
}`,
  complexity: "Time O(V + E). Space O(V + E)."
});

    "The single node popped at each step must match nums at that position.",
    "Validate that every number 1..n actually appears in seqs, and that no number is out of range."
  ],
  tips: [
    "'Unique topological order' ⇔ 'the queue size is always exactly 1' is a powerful, reusable insight.",
    "Be careful to add an edge only between adjacent elements of a seq, not all pairs.",
    "Edge cases: empty seqs, seqs containing numbers outside 1..n, or seqs that miss a number."
  ],
  code: `/*
 * LC 444 — nums is the unique topo order iff Kahn's queue is size 1 each step.
 */
boolean sequenceReconstruction(int[] nums, List<List<Integer>> seqs) {

    int n = nums.length;
    List<List<Integer>> adj = new ArrayList<>();
    for (int i = 0; i <= n; i++) adj.add(new ArrayList<>());
    int[] indeg = new int[n + 1];
    Arrays.fill(indeg, -1);                       // -1 marks "not seen yet"

    boolean any = false;
    for (List<Integer> s : seqs) {
        for (int i = 0; i < s.size(); i++) {
            int x = s.get(i);
            if (x < 1 || x > n) return false;     // out of range
            if (indeg[x] == -1) indeg[x] = 0;     // mark present
            if (i > 0) {
                adj.get(s.get(i - 1)).add(x);
                indeg[x]++;
                any = true;
            }
        }
    }

    Deque<Integer> q = new ArrayDeque<>();
    for (int i = 1; i <= n; i++)
        if (indeg[i] == 0) q.offer(i);

    int idx = 0;
    while (!q.isEmpty()) {
        if (q.size() > 1) return false;           // ambiguous order
        int u = q.poll();
        if (idx == n || nums[idx++] != u) return false;   // must match nums
        for (int v : adj.get(u))
            if (--indeg[v] == 0) q.offer(v);
    }

    return idx == n;                              // all reconstructed uniquely
}`,
  complexity: "Time O(V + E) where E is the total length of all seqs. Space O(V + E)."
});

 * LC 802 — safe = cannot reach a cycle. Kahn's on the REVERSED graph,
 * seeded from terminal (outdegree-0) nodes.
 */

    int n = graph.length;
    List<List<Integer>> rev = new ArrayList<>();
    for (int i = 0; i < n; i++) rev.add(new ArrayList<>());
    int[] outdeg = new int[n];

        outdeg[u] = graph[u].length;
        for (int v : graph[u]) rev.get(v).add(u);   // reverse edge v -> u
    }

    Deque<Integer> q = new ArrayDeque<>();
    for (int i = 0; i < n; i++)
        if (outdeg[i] == 0) q.offer(i);             // terminal nodes are safe

        int u = q.poll();
        safe[u] = true;
        for (int p : rev.get(u))                    // predecessors of u
            if (--outdeg[p] == 0) q.offer(p);        // all successors safe -> p safe

  code: `/*
 * LC 1976 — Dijkstra + path counting over the shortest-path DAG
 * (topological-order DP on that DAG).
 */
int countPaths(int n, int[][] roads) {
    final int MOD = 1_000_000_007;
    List<long[]>[] adj = new List[n];
    for (int i = 0; i < n; i++) adj[i] = new ArrayList<>();
    for (int[] r : roads) {
        adj[r[0]].add(new long[]{r[1], r[2]});
        adj[r[1]].add(new long[]{r[0], r[2]});
    }

    long[] dist = new long[n];
    Arrays.fill(dist, Long.MAX_VALUE);
    long[] ways = new long[n];
    dist[0] = 0; ways[0] = 1;

    PriorityQueue<long[]> pq = new PriorityQueue<>((a, b) -> Long.compare(a[1], b[1]));
    pq.offer(new long[]{0, 0});
    while (!pq.isEmpty()) {
        long[] cur = pq.poll();
        int u = (int) cur[0];
        if (cur[1] > dist[u]) continue;            // stale entry
        for (long[] e : adj[u]) {
            int v = (int) e[0]; long w = e[1];
            if (dist[u] + w < dist[v]) {
                dist[v] = dist[u] + w;
                ways[v] = ways[u];                 // new best -> inherit count
                pq.offer(new long[]{v, dist[v]});
            } else if (dist[u] + w == dist[v]) {
                ways[v] = (ways[v] + ways[u]) % MOD;   // tie -> add count

    find(root, destValue, pd);

PROBLEMS.push({
  num: 1203, title: "Sort Items by Groups Respecting Dependencies", diff: "hard",
  problem: "n items belong to groups (some ungrouped). There are item-level and group-level dependencies. Return an order of items so that all dependencies hold AND items of the same group are contiguous. Return [] if impossible.",
  intuition: "Two-level topological sort. First topo-sort the GROUPS using group dependencies. Then topo-sort the ITEMS within each group. Concatenate items group-by-group in group order. Either sort failing (a cycle) makes the whole thing impossible.",
  hints: [
    "Assign every ungrouped item its own unique group id so the 'contiguous' rule is trivially satisfied.",
    "For each item dependency a -> b: it's an item edge; if a and b are in different groups it's ALSO a group edge.",
    "Topo-sort groups; topo-sort items; bucket sorted items by group; emit in group order.",
    "If either topological sort can't place all its nodes, return an empty array."
  ],
  tips: [
    "The 'give each loner its own group' trick collapses the special case and unifies the logic.",
    "Keep two independent Kahn's runs — one over groups, one over items — then merge.",
    "This is essentially nested topo sort; getting the two graphs cleanly separated is the hard part."
  ],
  code: `/*
 * LC 1203 — topo sort GROUPS, topo sort ITEMS, then emit items grouped in
 * group order. Returns [] if any cycle is detected.
 */
int[] sortItems(int n, int m, int[] group, List<List<Integer>> beforeItems) {

    // give each ungrouped item a fresh group id
    for (int i = 0; i < n; i++) if (group[i] == -1) group[i] = m++;

    List<List<Integer>> itemAdj = new ArrayList<>(), groupAdj = new ArrayList<>();
    int[] itemIn = new int[n], groupIn = new int[m];
    for (int i = 0; i < n; i++) itemAdj.add(new ArrayList<>());
    for (int i = 0; i < m; i++) groupAdj.add(new ArrayList<>());

    for (int i = 0; i < n; i++)
        for (int prev : beforeItems.get(i)) {
            itemAdj.get(prev).add(i); itemIn[i]++;            // item edge prev -> i
            if (group[prev] != group[i]) {                    // cross-group edge
                groupAdj.get(group[prev]).add(group[i]); groupIn[group[i]]++;
            }
        }

    List<Integer> itemOrder  = kahn(itemAdj, itemIn);
    List<Integer> groupOrder = kahn(groupAdj, groupIn);
    if (itemOrder.isEmpty() || groupOrder.isEmpty()) return new int[0];  // cycle

    // bucket items by group, preserving item topological order
    Map<Integer, List<Integer>> byGroup = new HashMap<>();
    for (int item : itemOrder)
        byGroup.computeIfAbsent(group[item], k -> new ArrayList<>()).add(item);

    int[] res = new int[n]; int idx = 0;
    for (int g : groupOrder)
        for (int item : byGroup.getOrDefault(g, List.of()))
            res[idx++] = item;
    return res;
}

// standard Kahn's helper; returns [] on cycle
List<Integer> kahn(List<List<Integer>> adj, int[] indeg) {
    Deque<Integer> q = new ArrayDeque<>();
    for (int i = 0; i < indeg.length; i++) if (indeg[i] == 0) q.offer(i);
    List<Integer> order = new ArrayList<>();
    while (!q.isEmpty()) {
        int u = q.poll(); order.add(u);
        for (int v : adj.get(u)) if (--indeg[v] == 0) q.offer(v);
    }
    return order.size() == indeg.length ? order : new ArrayList<>();
}`,
  complexity: "Time O(V + E) across both levels. Space O(V + E)."
});

  num: 1494, title: "Parallel Courses II", diff: "hard",
  problem: "n courses with prerequisite relations. In each semester you may take AT MOST k courses whose prerequisites are all already satisfied. Return the minimum number of semesters to finish every course.",
  intuition: "Topological order tells you WHICH courses are eligible each semester, but the 'at most k' cap makes the greedy choice fail — picking the wrong k eligible courses can cost extra semesters. So do a bitmask DP over sets of completed courses: from each state, find every currently-eligible course and try each size-≤k subset of them as one semester.",
  hints: [
    "Precompute pre[c] = bitmask of prerequisites for course c.",
    "dp[mask] = min semesters to reach the completed-set 'mask'; start dp[0] = 0.",
    "From mask, available = courses not in mask whose pre[c] is fully contained in mask.",
    "Enumerate every subset 'sub' of available with bitCount(sub) ≤ k; relax dp[mask | sub] = dp[mask] + 1."
  ],
  tips: [
    "Subset enumeration trick: for (int sub = avail; sub > 0; sub = (sub - 1) & avail).",
    "Plain topological sort (greedily take any k) is NOT optimal here — topo only validates prerequisite legality; the k-cap forces the DP.",
    "Total work is O(3^n) over mask/subset pairs, feasible because n ≤ 15 in this problem."
  ],
  code: `/*
 * LC 1494 — Parallel Courses II. Prereqs form a DAG (topological legality),
 * but the 'at most k per semester' cap forces a bitmask DP over completed sets.
 */
int minNumberOfSemesters(int n, int[][] relations, int k) {

    int[] pre = new int[n];                         // prerequisite mask per course
    for (int[] r : relations)
        pre[r[1] - 1] |= 1 << (r[0] - 1);           // course r[1] needs r[0]

    int full = (1 << n) - 1;
    int[] dp = new int[1 << n];
    Arrays.fill(dp, Integer.MAX_VALUE);
    dp[0] = 0;

    for (int mask = 0; mask <= full; mask++) {
        if (dp[mask] == Integer.MAX_VALUE) continue;

        // courses whose prerequisites are fully satisfied and not yet taken
        int avail = 0;
        for (int c = 0; c < n; c++)
            if ((mask & (1 << c)) == 0 && (mask & pre[c]) == pre[c])
                avail |= 1 << c;

        // try every subset of 'avail' with at most k courses this semester
        for (int sub = avail; sub > 0; sub = (sub - 1) & avail) {
            if (Integer.bitCount(sub) > k) continue;
            int next = mask | sub;
            dp[next] = Math.min(dp[next], dp[mask] + 1);
        }
    }
    return dp[full];
}`,
  complexity: "Time O(3^n) over mask/subset pairs (n ≤ 15). Space O(2^n)."
});


PROBLEMS.push({
  num: 1627, title: "Graph Connectivity With Threshold", diff: "hard",
  problem: "Cities 1..n. Two cities are directly connected if they share a common divisor strictly greater than 'threshold'. For each query [a, b], answer whether a and b are connected (directly or indirectly).",
  intuition: "Not topological sort — it is a Union-Find connectivity problem. For every z greater than the threshold, union z with all of its multiples (they share the divisor z). Then each query is a same-root check.",
  hints: [
    "Initialize a DSU over cities 1..n.",
    "For each z from threshold+1 to n, union z with 2z, 3z, ... (all multiples ≤ n).",
    "Path compression + union keeps it near-linear.",
    "Answer each query by comparing the roots of a and b."
  ],
  tips: [
    "Included for tracking; the technique is union-find, not topological sort.",
    "The harmonic-series union loop runs in about O(n log n) total unions."
  ],
  code: `/*
 * LC 1627 — Union-Find: union every z>threshold with its multiples (NOT topo).
 */
int[] parent;

int find(int x) { return parent[x] == x ? x : (parent[x] = find(parent[x])); }
void union(int a, int b) { parent[find(a)] = find(b); }

List<Boolean> areConnected(int n, int threshold, int[][] queries) {
    parent = new int[n + 1];
    for (int i = 0; i <= n; i++) parent[i] = i;

    for (int z = threshold + 1; z <= n; z++)
        for (int m = 2 * z; m <= n; m += z)
            union(z, m);                           // z divides m -> connected

    List<Boolean> ans = new ArrayList<>();
    for (int[] q : queries) ans.add(find(q[0]) == find(q[1]));
    return ans;
}`,
  complexity: "Time ~O(n log n · α + Q·α). Space O(n)."
});

PROBLEMS.push({
  num: 1671, title: "Minimum Number of Removals to Make Mountain Array", diff: "hard",
  problem: "Remove the fewest elements so the remaining array is a 'mountain': it strictly increases to a single peak, then strictly decreases (with at least one element on each side of the peak). Return the minimum removals.",
  intuition: "Not topological sort — it is a longest-increasing-subsequence DP. For each index compute the longest strictly increasing run ending there (lis) and the longest strictly decreasing run starting there (lds). A valid peak needs lis>1 and lds>1; the largest mountain keeps lis[i]+lds[i]-1 elements, so removals = n minus that.",
  hints: [
    "Compute lis[i] = longest strictly increasing subsequence ending at i.",
    "Compute lds[i] = longest strictly decreasing subsequence starting at i.",
    "Only indices with lis[i]>1 AND lds[i]>1 can be a peak.",
    "Answer = n - max(lis[i] + lds[i] - 1) over valid peaks."
  ],
  tips: [
    "Included for tracking; the technique is DP (LIS/LDS), not topological sort.",
    "The O(n^2) DP is fine for the constraints; an O(n log n) patience-sorting version exists if needed."
  ],
  code: `/*
 * LC 1671 — LIS from the left + LDS from the right; keep the best peak (NOT topo).
 */
int minimumMountainRemovals(int[] nums) {
    int n = nums.length;
    int[] lis = new int[n], lds = new int[n];

    for (int i = 0; i < n; i++) {
        lis[i] = 1;
        for (int j = 0; j < i; j++)
            if (nums[j] < nums[i]) lis[i] = Math.max(lis[i], lis[j] + 1);
    }
    for (int i = n - 1; i >= 0; i--) {
        lds[i] = 1;
        for (int j = n - 1; j > i; j--)
            if (nums[j] < nums[i]) lds[i] = Math.max(lds[i], lds[j] + 1);
    }

    int best = 0;
    for (int i = 0; i < n; i++)
        if (lis[i] > 1 && lds[i] > 1)              // needs a rise AND a fall
            best = Math.max(best, lis[i] + lds[i] - 1);
    return n - best;
}`,
  complexity: "Time O(n^2). Space O(n)."
});


/* ----------------------- RENDERING ENGINE ----------------------- */

const DIFF_LABEL = { veasy: 'Very Easy', easy: 'Easy', med: 'Medium', hard: 'Hard' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Lightweight Java syntax highlighter. */
function highlightJava(src) {
  let s = escapeHtml(src);
  const stash = [];
  const stashIt = (html) => {
    stash.push(html);
    return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001';
  };
  s = s.replace(/\/\/[^\n]*/g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/&quot;([^&]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  s = s.replace(/&#39;.&#39;|&#39;\\.&#39;/g, m => stashIt('<span class="str">' + m + '</span>'));

  const types = ['String','Integer','Long','Boolean','Character','Double','Float',
    'List','Map','Set','HashMap','HashSet','TreeMap','TreeSet','ArrayList','LinkedList',
    'ArrayDeque','Queue','Deque','PriorityQueue','StringBuilder','BitSet','Stack',
    'TreeNode','ListNode','Random','Collections','Arrays','Math','Comparator','Objects'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  const kws = ['void','int','long','boolean','char','double','float','byte','short',
    'public','private','protected','static','final','abstract','class','interface','enum',
    'return','if','else','for','while','do','break','continue','switch','case','default',
    'new','null','true','false','this','super','try','catch','finally','throw','throws',
    'import','package','extends','implements','instanceof'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  s = s.replace(/\b(\d+(?:_\d+)*L?)\b/g, '<span class="num">$1</span>');

  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

function getProblems(diff) {
  return PROBLEMS.filter(p => p.diff === diff);
}

const state = { diff: 'veasy', idx: 0 };

function renderTOC() {
  const toc = document.getElementById('toc');
  const groups = [
    { diff: 'veasy', label: 'Very Easy' },
    { diff: 'easy',  label: 'Easy' },
    { diff: 'med',   label: 'Medium' },
    { diff: 'hard',  label: 'Hard' },
  ];
  const html = groups.map(g => {
    const items = getProblems(g.diff)
      .map((p, i) => `<a data-diff="${g.diff}" data-idx="${i}"><span class="num">${p.num === 0 ? '★' : '#' + p.num}</span>${escapeHtml(p.title)}</a>`)
      .join('');
    return `<div class="group-title">${g.label}</div>${items}`;
  }).join('');
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      state.diff = a.dataset.diff;
      state.idx = +a.dataset.idx;
      render();
      toggleSidebar(false);
    });
  });
}

function renderTabs() {
  document.getElementById('cnt-veasy').textContent = '(' + getProblems('veasy').length + ')';
  document.getElementById('cnt-easy').textContent  = '(' + getProblems('easy').length + ')';
  document.getElementById('cnt-med').textContent   = '(' + getProblems('med').length + ')';
  document.getElementById('cnt-hard').textContent  = '(' + getProblems('hard').length + ')';
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      if (state.diff !== t.dataset.diff) {
        state.diff = t.dataset.diff;
        state.idx = 0;
        render();
      }
    };
  });
}

function render() {
  const problems = getProblems(state.diff);
  if (state.idx >= problems.length) state.idx = problems.length - 1;
  if (state.idx < 0) state.idx = 0;
  const p = problems[state.idx];
  const main = document.getElementById('main');
  const numTag = p.num === 0 ? '★ Foundation' : '#' + p.num;
  main.innerHTML = `
    <div class="problem-card">
      <h2>
        <span class="num-tag">${numTag}</span>
        ${escapeHtml(p.title)}
        <span class="badge ${p.diff}">${DIFF_LABEL[p.diff]}</span>
      </h2>

      <div class="section-title">Problem</div>
      <p>${escapeHtml(p.problem)}</p>

      <div class="section-title">Intuition</div>
      <div class="intuition">${escapeHtml(p.intuition)}</div>

      <div class="section-title">Step-by-step Hints</div>
      <ol class="hints">${p.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ol>

      <div class="section-title">Tips & Tricks</div>
      <div class="tips-block"><ul class="tips">${p.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>

      <div class="section-title">Java Code</div>
      <pre class="code"><code>${highlightJava(p.code)}</code></pre>

      ${p.complexity ? `<div class="complexity"><b>Complexity:</b> ${escapeHtml(p.complexity)}</div>` : ''}
    </div>
  `;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.diff === state.diff);
  });

  document.getElementById('prev').disabled = state.idx === 0;
  document.getElementById('next').disabled = state.idx === problems.length - 1;
  document.getElementById('nav-info').textContent =
    `${DIFF_LABEL[state.diff]} · ${state.idx + 1} / ${problems.length}`;

  document.querySelectorAll('.sidebar a').forEach(a => {
    a.classList.toggle('active', a.dataset.diff === state.diff && +a.dataset.idx === state.idx);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextProblem() {
  const arr = getProblems(state.diff);
  if (state.idx < arr.length - 1) { state.idx++; render(); }
}
function prevProblem() {
  if (state.idx > 0) { state.idx--; render(); }
}
document.getElementById('prev').addEventListener('click', prevProblem);
document.getElementById('next').addEventListener('click', nextProblem);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') prevProblem();
  else if (e.key === 'ArrowRight') nextProblem();
  else if (e.key === 'Escape') toggleSidebar(false);
});

const hb = document.getElementById('hamburger');
const sb = document.getElementById('sidebar');
const ov = document.getElementById('overlay');
function toggleSidebar(open) {
  const isOpen = (typeof open === 'boolean') ? open : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  hb.classList.toggle('open', isOpen);
  ov.classList.toggle('show', isOpen);
}
hb.addEventListener('click', () => toggleSidebar());
ov.addEventListener('click', () => toggleSidebar(false));

const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️';
    themeBtn.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙';
    themeBtn.title = 'Switch to dark mode';
  }
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('theme', next);
});

/* boot */
renderTabs();
bindTabs();
renderTOC();
render();

</script>

<!-- KIRO_CROSS_TAB_NAV_START -->
<script id="kiro-cross-tab-nav">
(function(){
  if(window.__kiroCrossTabNav) return;
  window.__kiroCrossTabNav = true;
  function init(){
    if(typeof getProblems !== 'function' || typeof window.render !== 'function' || typeof state === 'undefined') return;
    var ORDER = ['veasy','easy','med','hard'];
    function diffs(){ return ORDER.filter(function(d){ try { return getProblems(d).length > 0; } catch(e){ return false; } }); }

    function updateNavButtons(){
      var prevB = document.getElementById('prev');
      var nextB = document.getElementById('next');
      if(!prevB || !nextB) return;
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      prevB.disabled = (di <= 0 && state.idx <= 0);
      nextB.disabled = (di === list.length - 1 && state.idx >= arr.length - 1);
    }

    var origRender = window.render;
    window.render = function(){
      var r = origRender.apply(this, arguments);
      try { updateNavButtons(); } catch(e){}
      return r;
    };

    function goNext(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      var arr = getProblems(state.diff);
      if(state.idx < arr.length - 1){ state.idx++; window.render(); return; }
      if(di < list.length - 1){ state.diff = list[di + 1]; state.idx = 0; window.render(); }
    }
    function goPrev(){
      var list = diffs();
      var di = list.indexOf(state.diff);
      if(di === -1) return;
      if(state.idx > 0){ state.idx--; window.render(); return; }
      if(di > 0){
        var pd = list[di - 1];
        state.diff = pd;
        var parr = getProblems(pd);
        state.idx = Math.max(0, parr.length - 1);
        window.render();
      }
    }

    window.nextProblem = goNext;
    window.prevProblem = goPrev;

    ['prev','next'].forEach(function(id){
      var b = document.getElementById(id);
      if(!b) return;
      var clone = b.cloneNode(true);
      b.parentNode.replaceChild(clone, b);
      clone.addEventListener('click', id === 'next' ? goNext : goPrev);
    });

    updateNavButtons();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<!-- KIRO_CROSS_TAB_NAV_END -->
