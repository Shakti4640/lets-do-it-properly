<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Two Pointers — Patterns, Cheatsheet & Java Snippets</title>
<style>
  :root {
    --bg: #f6f7fb;
    --fg: #1f2330;
    --muted: #6b7280;
    --accent: #2563eb;
    --border: #e3e6ee;

  html, body { margin: 0; padding: 0; }
  body {

  .hamburger {

    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);

  }
  .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

    position: fixed; top: 0; left: 0;

    box-shadow: 2px 0 14px rgba(0,0,0,.06);

  .sidebar .group-title {

    border-bottom: 1px dashed var(--border);
  }
  .sidebar a {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px;

  .sidebar a:hover { background: #eef2ff; color: var(--accent); }
  .sidebar a.active { background: #eef2ff; color: var(--accent); font-weight: 600; }

    display: inline-block;
    min-width: 28px;

  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.25);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 999;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .topbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 18px 24px 0;
    padding-left: 76px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 { margin: 0 0 6px; font-size: 20px; }
  .topbar p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: #f1f3f9;
    color: var(--muted);
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    transition: background .15s;
  }
  .tab:hover { background: #e7eaf3; color: var(--fg); }
  .tab.active {
    background: #ffffff;
    color: var(--fg);
    border-bottom: 2px solid #ffffff;
    margin-bottom: -1px;
    box-shadow: 0 -2px 0 var(--accent) inset;
  }
  .tab .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: 1px;
  }
  .tab.veasy .dot { background: var(--veasy); }
  .tab.easy .dot { background: var(--easy); }
  .tab.med .dot { background: var(--med); }
  .tab.hard .dot { background: var(--hard); }
  .tab.brief .dot { background: #8b5cf6; }
  .tab .count { color: var(--muted); margin-left: 6px; font-weight: 500; }
  body.brief-mode .nav-bar { display: none; }
  .brief-root {

  }

    background-clip: text;

  [data-theme="dark"] .brief-root .brief-title {

  .brief-root .brief-tagline { color: var(--muted); margin-top: 8px; font-size: 13px; }

  .brief-root .section-label {
    font-size: 11px; color: var(--muted);
    letter-spacing: 3px; margin-bottom: 12px;
  }
  .brief-root .ex-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .brief-root .ex-tab {
    padding: 6px 14px; border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent; color: var(--muted);
    cursor: pointer; font-size: 12px;
    font-family: inherit; transition: all 0.18s;
  }
  .brief-root .ex-box {
    background: var(--code-bg); border-radius: 10px;

  }
  .brief-root .ex-title { padding: 10px 16px; font-size: 13px; font-weight: 700; }
  .brief-root pre.brief-pre {
    margin: 0; padding: 16px; font-size: 13px; line-height: 1.7;
    color: var(--code-fg); overflow-x: auto;
    white-space: pre-wrap; word-break: break-word;
    background: var(--code-bg);
    font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
  }
  [data-theme="dark"] .brief-root pre.brief-pre { color: #c8e6c9; }
  .brief-root .why-toggle {
    padding: 10px 16px; cursor: pointer;
    border-top: 1px solid var(--border);
    font-size: 12px; display: flex; align-items: center; gap: 8px;

  }
  .brief-root .why-body {
    padding: 12px 16px; font-size: 13px; line-height: 1.7;
    color: var(--fg); display: none;
  }
  .brief-root .why-body.visible { display: block; }
  .brief-root .cheat {
    background: var(--card); border-radius: 16px;
    border: 1px solid var(--border); padding: 24px; margin-bottom: 16px;
  }
  .brief-root .cheat-row {
    display: flex; justify-content: space-between; flex-wrap: wrap;
    gap: 8px; padding: 8px 0;
    border-bottom: 1px solid var(--border); align-items: center;
  }
  .brief-root .cheat-name { color: var(--muted); font-size: 13px; }
  .brief-root .cheat-code {
    color: var(--str); font-size: 12px;
    background: var(--code-bg);
    padding: 2px 10px; border-radius: 4px;
    font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
  }
  .brief-root .brief-footer {
    text-align: center; color: var(--muted);
    font-size: 11px; letter-spacing: 2px; margin-top: 8px;
  }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 24px 120px;
  }
  .problem-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .problem-card h2 {
    margin: 0 0 6px;
    font-size: 24px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .num-tag {
    background: #eef2ff; color: var(--accent);
    padding: 3px 10px; border-radius: 6px;
    font-size: 13px; font-weight: 700;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff; font-weight: 700; letter-spacing: .05em;
  }
  .badge.veasy { background: var(--veasy); }
  .badge.easy { background: var(--easy); }
  .badge.med { background: var(--med); }
  .badge.hard { background: var(--hard); }
  .section-title {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 8px;
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }
  .problem-card p { margin: 8px 0; font-size: 15px; }
  .intuition {
    background: #ecfeff;
    border-left: 4px solid #06b6d4;
    border-radius: 6px;
    padding: 12px 16px;
    margin: 8px 0;
  }
  .hints, .tips { margin: 6px 0 6px 4px; padding: 0 0 0 22px; }
  .hints li, .tips li { margin: 6px 0; font-size: 14.5px; }
  .tips-block {
    background: #fff7ed;
    border-left: 4px solid #f59e0b;
    border-radius: 6px;
    padding: 10px 16px;
    margin: 8px 0;
  }
  .complexity {
    margin-top: 12px;
    color: var(--muted);
    font-size: 13.5px;
  }
  .cheat-table {
    border-collapse: collapse;
    width: 100%;
    margin: 8px 0 16px;
    font-size: 14px;
  }
  .cheat-table th, .cheat-table td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  .cheat-table th {
    background: #eef2ff;
    color: var(--accent);
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .cheat-table td:first-child {
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    background: var(--code-bg);
    white-space: nowrap;
    color: var(--num);
  }
  .cheat-table tr:nth-child(even) td:not(:first-child) { background: #fafbff; }
  pre.code {
    background: var(--code-bg);
    color: var(--code-fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 13.5px;
    line-height: 1.55;
    margin: 6px 0;
  }
  pre.code code {
    font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
  }
  .kw  { color: var(--kw);  font-weight: 600; }
  .typ { color: var(--typ); font-weight: 500; }
  .str { color: var(--str); }
  .cmt { color: var(--cmt); font-style: italic; }
  .num { color: var(--num); }
  .nav-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #ffffff;
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;

  }
  .nav-btn {

  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .nav-info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kbd {
    display: inline-block;
    border: 1px solid #d0d7de;

    font-size: 11px;

  @media (max-width: 600px) {
    .topbar { padding-left: 70px; padding-right: 70px; }
    main { padding: 20px 14px 130px; }
    .problem-card { padding: 18px 18px; }
    .problem-card h2 { font-size: 19px; }
  }
  .theme-toggle {
    position: fixed; top: 14px; right: 14px;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);

<script>
/* ----------------------- DATA: ALL PROBLEMS ----------------------- */
const PROBLEMS = [];


/* ===================== TEMPLATE / FOUNDATION ===================== */
PROBLEMS.push({

  problem: "Two Pointers is a family of techniques where two indices walk an array (or string, or linked list) along carefully chosen rules so that the entire pass is O(N) instead of O(N^2). Three flavors cover almost everything: (1) OPPOSITE ends — left starts at 0, right at n-1, they walk toward each other (sorted-array search, palindrome, container with most water); (2) SAME direction at different speeds — slow / fast pointers (cycle detection, in-place compaction, kth-from-end); (3) PARTITION — a write-pointer trails a read-pointer to compact / categorize values in place (Dutch national flag, move zeros, remove duplicates).",
  intuition: "The trick of two pointers is monotonicity. On a SORTED array, moving left forward strictly increases the smaller value and moving right backward strictly decreases the larger value — so each step you can decide which one to move based on whether the current sum/diff is too small or too big. For SLOW/FAST cycle detection, the gap closes by 1 every step on a circular path, which is why slow == fast eventually inside any cycle. For PARTITION, the write-pointer is a 'next free slot' that trails the read-pointer; the invariant `everything before write is good` holds across the entire pass.",
  hints: [

    "Slow / fast: slow moves +1, fast moves +2. They meet inside a cycle. To find cycle start, reset slow to head and walk both at +1 — they meet at the entry node (Floyd).",

    "Total movement of each pointer is bounded by N. That's why the loop is O(N) even when there's a `while` inside the `for`.",

    "Skip duplicates AFTER moving, not before, when listing all triplets/quadruplets. Use `while (l < r && nums[l] == nums[l+1]) l++;` style.",

  cheatsheetHtml: `
    <table class="cheat-table">
      <thead><tr><th>Pattern / Idiom</th><th>What it does</th></tr></thead>
      <tbody>
        <tr><td>Opposite ends</td><td>l = 0, r = n-1; while l &lt; r move based on a comparison.</td></tr>
        <tr><td>Sorted pair sum</td><td>If sum &lt; target l++; if sum &gt; target r--; else hit.</td></tr>
        <tr><td>Palindrome check</td><td>Mirror compare s[l] vs s[r]; advance both inward.</td></tr>
        <tr><td>Container / area</td><td>Move the side with the SHORTER value (it's the bottleneck).</td></tr>
        <tr><td>Slow / Fast</td><td>slow += 1, fast += 2. Meet inside any cycle (Floyd).</td></tr>
        <tr><td>Cycle entry (Floyd)</td><td>After meeting, reset slow to head; walk both at +1.</td></tr>
        <tr><td>Kth from end</td><td>Advance fast by k first, then walk both until fast is null.</td></tr>
        <tr><td>Partition / write idx</td><td>w starts at 0; for each r, copy to w if it satisfies condition; w++.</td></tr>
        <tr><td>Dutch flag (3-way)</td><td>lo / mid / hi pointers; swap based on category of nums[mid].</td></tr>
        <tr><td>Skip duplicates</td><td>while (l &lt; r &amp;&amp; nums[l] == nums[l+1]) l++;</td></tr>
        <tr><td>Merge two sorted</td><td>Two read pointers, one write pointer; pick smaller each step.</td></tr>
        <tr><td>Trapping rain water</td><td>Two pointers + leftMax / rightMax; advance shorter side.</td></tr>
      </tbody>
    </table>
    <p><b>Two pieces of intuition worth memorizing:</b></p>
    <ul class="hints">
      <li><b>Monotone decisions.</b> On a sorted array, every comparison gives an <i>unambiguous</i> direction: too small → move left up; too big → move right down. The reason brute force is N^2 is that without sorting, you don't have this monotonicity. Whenever you see a sorted/permitted-to-sort array and a pair/triple/sum question, two pointers is almost certainly the intended tool.</li>
      <li><b>The write pointer is an invariant.</b> In partition problems, every iteration preserves the invariant <code>nums[0..write)</code> contains exactly the elements that satisfy the predicate, in original order. If you can write down that invariant clearly, the inner copy logic almost writes itself.</li>
    </ul>
  `,
  code: `/*
 * The five idioms you'll reach for in 90% of two-pointer problems.
 * Memorize each — every other recipe is a remix of these.
 */

// ---- 1. OPPOSITE ENDS — Two-Sum on a sorted array -------------------
int[] twoSumSorted(int[] nums, int target) {

    int l = 0, r = nums.length - 1;
    while (l < r) {
        int s = nums[l] + nums[r];
        if (s == target)      return new int[]{l, r};
        else if (s < target)  l++;        // need bigger sum
        else                  r--;        // need smaller sum
    }
    return new int[]{-1, -1};
}

// ---- 2. PALINDROME CHECK (skip non-alnum, ignore case) -------------
boolean isPalindrome(String s) {

    int l = 0, r = s.length() - 1;
    while (l < r) {
        while (l < r && !Character.isLetterOrDigit(s.charAt(l))) l++;
        while (l < r && !Character.isLetterOrDigit(s.charAt(r))) r--;
        if (Character.toLowerCase(s.charAt(l)) != Character.toLowerCase(s.charAt(r))) return false;
        l++; r--;
    }
    return true;
}

// ---- 3. SLOW / FAST — Linked-list cycle detection -------------------
boolean hasCycle(ListNode head) {

    ListNode slow = head, fast = head;
    while (fast != null && fast.next != null) {
        slow = slow.next;
        fast = fast.next.next;
        if (slow == fast) return true;
    }
    return false;
}

// Cycle entry (Floyd): after they meet, reset slow to head and walk both
// by +1; the next meeting point is the cycle's start node.
ListNode cycleStart(ListNode head) {
    ListNode slow = head, fast = head;
    while (fast != null && fast.next != null) {
        slow = slow.next; fast = fast.next.next;
        if (slow == fast) {
            slow = head;
            while (slow != fast) { slow = slow.next; fast = fast.next; }
            return slow;
        }
    }
    return null;
}

// ---- 4. PARTITION — Move zeros to the end (in place) ---------------
void moveZeroes(int[] nums) {

    int w = 0;
    for (int r = 0; r < nums.length; r++) {
        if (nums[r] != 0) nums[w++] = nums[r];     // copy non-zero forward
    }
    while (w < nums.length) nums[w++] = 0;          // fill tail with zeros
}

// ---- 5. DUTCH NATIONAL FLAG — 3-way partition ----------------------
void sortColors(int[] nums) {

    int lo = 0, mid = 0, hi = nums.length - 1;
    while (mid <= hi) {
        if      (nums[mid] == 0) { swap(nums, lo++, mid++); }
        else if (nums[mid] == 2) { swap(nums, mid,  hi--);  }   // don't advance mid
        else                     { mid++; }
    }
}

private void swap(int[] a, int i, int j) { int t = a[i]; a[i] = a[j]; a[j] = t; }`,
  complexity: "Every skeleton above is O(N) time. Two-pointer + sort is O(N log N) when sorting is the bottleneck. Space is O(1) for in-place variants and O(1) for opposite-ends/cycle detection."
});

 * Longest Palindromic Substring via expand-around-center.
 */
String longestPalindrome(String s) {

    if (s == null || s.isEmpty()) return "";
    int bestL = 0, bestR = 0;
    for (int i = 0; i < s.length(); i++) {
        int[] a = expand(s, i, i);
        int[] b = expand(s, i, i + 1);
        if (a[1] - a[0] > bestR - bestL) { bestL = a[0]; bestR = a[1]; }
        if (b[1] - b[0] > bestR - bestL) { bestL = b[0]; bestR = b[1]; }
    }
    return s.substring(bestL, bestR + 1);
}

private int[] expand(String s, int l, int r) {
    while (l >= 0 && r < s.length() && s.charAt(l) == s.charAt(r)) { l--; r++; }

 * Median of Two Sorted Arrays. Binary search the partition on the
 * shorter array; check the four boundary values for the median.
 */
double findMedianSortedArrays(int[] a, int[] b) {

    if (a.length > b.length) { int[] t = a; a = b; b = t; }
    int m = a.length, n = b.length;
    int half = (m + n + 1) / 2;
    int lo = 0, hi = m;

    while (lo <= hi) {
        int i = (lo + hi) >>> 1;
        int j = half - i;
        int aLeft  = i == 0 ? Integer.MIN_VALUE : a[i - 1];
        int aRight = i == m ? Integer.MAX_VALUE : a[i];
        int bLeft  = j == 0 ? Integer.MIN_VALUE : b[j - 1];
        int bRight = j == n ? Integer.MAX_VALUE : b[j];

const DIFF_LABEL = { veasy: 'Very Easy', easy: 'Easy', med: 'Medium', hard: 'Hard' };

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightJava(src) {
  let s = escapeHtml(src);
  const stash = [];
  const stashIt = (html) => { stash.push(html); return '\u0001zZ' + (stash.length - 1) + 'Zz\u0001'; };
  s = s.replace(/\/\/[^\n]*/g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => stashIt('<span class="cmt">' + m + '</span>'));
  s = s.replace(/&quot;([^&]|&(?!quot;))*?&quot;/g, m => stashIt('<span class="str">' + m + '</span>'));
  s = s.replace(/&#39;.&#39;|&#39;\\.&#39;/g, m => stashIt('<span class="str">' + m + '</span>'));

  const types = ['String','Integer','Long','Boolean','Character','Double','Float',
    'List','Map','Set','HashMap','HashSet','TreeMap','TreeSet','ArrayList','LinkedList',
    'ArrayDeque','Queue','Deque','PriorityQueue','StringBuilder','BitSet','Stack',
    'TreeNode','ListNode','Random','Collections','Arrays','Math','Comparator','Objects','Map.Entry'];
  const typeRe = new RegExp('\\b(' + types.join('|') + ')\\b', 'g');
  s = s.replace(typeRe, (_, name) => stashIt('<span class="typ">' + name + '</span>'));

  const kws = ['void','int','long','boolean','char','double','float','byte','short',
    'public','private','protected','static','final','abstract','class','interface','enum',
    'return','if','else','for','while','do','break','continue','switch','case','default',
    'new','null','true','false','this','super','try','catch','finally','throw','throws',
    'import','package','extends','implements','instanceof','var'];
  const kwRe = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwRe, (_, name) => stashIt('<span class="kw">' + name + '</span>'));

  s = s.replace(/\b(0x[0-9A-Fa-f_]+L?|\d+(?:_\d+)*L?)\b/g, '<span class="num">$1</span>');

  while (/\u0001zZ\d+Zz\u0001/.test(s)) {
    s = s.replace(/\u0001zZ(\d+)Zz\u0001/g, (_, i) => stash[+i]);
  }
  return s;
}

  const groups = [
    { diff: 'veasy', label: 'Very Easy' },
    { diff: 'easy',  label: 'Easy' },
    { diff: 'med',   label: 'Medium' },
    { diff: 'hard',  label: 'Hard' },
  ];
  const html = groups.map(g => {
    const items = getProblems(g.diff)
      .map((p, i) => `<a data-diff="${g.diff}" data-idx="${i}"><span class="num">${p.num === 0 ? '★' : '#' + p.num}</span>${escapeHtml(p.title)}</a>`)
      .join('');
    return `<div class="group-title">${g.label}</div>${items}`;
  }).join('');
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      state.diff = a.dataset.diff;
      state.idx = +a.dataset.idx;
      render();
      toggleSidebar(false);
    });
  });
}

function renderTabs() {
  document.getElementById('cnt-veasy').textContent = '(' + getProblems('veasy').length + ')';
  document.getElementById('cnt-easy').textContent  = '(' + getProblems('easy').length + ')';
  document.getElementById('cnt-med').textContent   = '(' + getProblems('med').length + ')';
  document.getElementById('cnt-hard').textContent  = '(' + getProblems('hard').length + ')';
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      if (state.diff !== t.dataset.diff) {
        state.diff = t.dataset.diff;
        state.idx = 0;
        render();
      }
    };
  });
}

function render() {
  const main = document.getElementById('main');

  if (state.diff === 'brief') {
    document.body.classList.add('brief-mode');
    main.innerHTML = `
      <div class="brief-root">
        <header class="brief-header">
          <div class="brief-subtitle">JAVA</div>
          <h1 class="brief-title">Two Pointers</h1>
          <p class="brief-tagline">Pick a flavor → tweak inputs → see the pointers walk</p>
        </header>
        <div class="op-tabs" id="briefOpTabs"></div>
        <div class="panel" id="briefMainPanel"></div>
        <div class="cheat">
          <div class="section-label">CHEAT SHEET — COMMON PATTERNS</div>
          <div id="briefCheatSheet"></div>
        </div>
        <div class="brief-footer">OPPOSITE &middot; SLOW/FAST &middot; PARTITION</div>
      </div>
    `;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.diff === state.diff);
    });
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    initBriefMode();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  document.body.classList.remove('brief-mode');

  const problems = getProblems(state.diff);
  if (state.idx >= problems.length) state.idx = problems.length - 1;
  if (state.idx < 0) state.idx = 0;
  const p = problems[state.idx];
  const numTag = p.num === 0 ? '★ Foundation' : '#' + p.num;

  const cheatBlock = p.cheatsheetHtml
    ? `<div class="section-title">Cheatsheet</div>${p.cheatsheetHtml}`
    : '';

  main.innerHTML = `
    <div class="problem-card">
      <h2>
        <span class="num-tag">${numTag}</span>
        ${escapeHtml(p.title)}
        <span class="badge ${p.diff}">${DIFF_LABEL[p.diff]}</span>
      </h2>

      <div class="section-title">Problem</div>
      <p>${escapeHtml(p.problem)}</p>

      <div class="section-title">Intuition</div>
      <div class="intuition">${escapeHtml(p.intuition)}</div>

      ${cheatBlock}

      <div class="section-title">Step-by-step Hints</div>
      <ol class="hints">${p.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ol>

      <div class="section-title">Tips & Tricks</div>
      <div class="tips-block"><ul class="tips">${p.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>

      <div class="section-title">Java Code</div>
      <pre class="code"><code>${highlightJava(p.code)}</code></pre>

      ${p.complexity ? `<div class="complexity"><b>Complexity:</b> ${escapeHtml(p.complexity)}</div>` : ''}
    </div>
  `;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.diff === state.diff);
  });

  document.getElementById('prev').disabled = state.idx === 0;
  document.getElementById('next').disabled = state.idx === problems.length - 1;
  document.getElementById('nav-info').textContent =
    `${DIFF_LABEL[state.diff]} · ${state.idx + 1} / ${problems.length}`;

  document.querySelectorAll('.sidebar a').forEach(a => {
    a.classList.toggle('active', a.dataset.diff === state.diff && +a.dataset.idx === state.idx);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextProblem() {
  const arr = getProblems(state.diff);
  if (state.idx < arr.length - 1) { state.idx++; render(); }
}
function prevProblem() {
  if (state.idx > 0) { state.idx--; render(); }
}
document.getElementById('prev').addEventListener('click', prevProblem);
document.getElementById('next').addEventListener('click', nextProblem);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') prevProblem();
  else if (e.key === 'ArrowRight') nextProblem();
  else if (e.key === 'Escape') toggleSidebar(false);
});

const hb = document.getElementById('hamburger');
const sb = document.getElementById('sidebar');
const ov = document.getElementById('overlay');
function toggleSidebar(open) {
  const isOpen = (typeof open === 'boolean') ? open : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  hb.classList.toggle('open', isOpen);
  ov.classList.toggle('show', isOpen);
}
hb.addEventListener('click', () => toggleSidebar());
ov.addEventListener('click', () => toggleSidebar(false));

const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️';
    themeBtn.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙';
    themeBtn.title = 'Switch to dark mode';
  }
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('theme', next);
});

renderTabs();
bindTabs();
renderTOC();
render();


/* ===== BRIEF MODE: interactive two-pointer explorer ===== */
const BRIEF_OPS = [
  {
    id:"opposite", name:"Opposite Ends", color:"#2563eb", colorDark:"#58a6ff",
    desc:"l = 0, r = n-1; walk inward based on a comparison.",
    rule:"if sum < target → l++  |  if sum > target → r--  |  else hit",
    label:"OPPOSITE ENDS",
    examples:[
      { title:"LC 167 — Two Sum II",
        code:`int[] twoSum(int[] nums, int target) {
    int l = 0, r = nums.length - 1;
    while (l < r) {
        int s = nums[l] + nums[r];
        if      (s == target) return new int[]{l + 1, r + 1};
        else if (s <  target) l++;
        else                  r--;
    }
    return new int[]{-1, -1};
}`,
        why:"Sorting makes the sum monotone in each pointer's direction, so each comparison gives an unambiguous next move." },
    ],
  },
  {
    id:"slowfast", name:"Slow / Fast", color:"#16a34a", colorDark:"#76ff03",
    desc:"slow += 1, fast += 2. Used for cycle detection, midpoint, kth-from-end.",
    rule:"slow = slow.next; fast = fast.next.next; meet ⇒ cycle",
    label:"SLOW / FAST",
    examples:[
      { title:"Linked List Cycle (LC 141)",
        code:`boolean hasCycle(ListNode head) {
    ListNode slow = head, fast = head;
    while (fast != null && fast.next != null) {
        slow = slow.next;
        fast = fast.next.next;
        if (slow == fast) return true;
    }
    return false;
}`,
        why:"In a cycle the gap between slow and fast shrinks by 1 each step, so they must meet within one full loop." },
    ],
  },
  {
    id:"partition", name:"Partition", color:"#d97706", colorDark:"#ffd740",
    desc:"Write pointer trails read pointer; copy values that satisfy a predicate.",
    rule:"if (keep(nums[r])) nums[w++] = nums[r];",
    label:"PARTITION",
    examples:[
      { title:"LC 283 — Move Zeroes",
        code:`void moveZeroes(int[] nums) {
    int w = 0;
    for (int r = 0; r < nums.length; r++) {
        if (nums[r] != 0) nums[w++] = nums[r];
    }
    while (w < nums.length) nums[w++] = 0;
}`,
        why:"The invariant 'nums[0..w) are exactly the kept values, in order' holds across every iteration." },
    ],
  },
  {
    id:"dutch", name:"Dutch Flag", color:"#9333ea", colorDark:"#ea80fc",
    desc:"Three pointers — lo, mid, hi — partition into three buckets in one pass.",
    rule:"== 0 → swap(lo++, mid++)  |  == 2 → swap(mid, hi--)  |  == 1 → mid++",
    label:"3-WAY PARTITION",
    examples:[
      { title:"LC 75 — Sort Colors",
        code:`void sortColors(int[] nums) {
    int lo = 0, mid = 0, hi = nums.length - 1;
    while (mid <= hi) {
        if      (nums[mid] == 0) swap(nums, lo++, mid++);
        else if (nums[mid] == 2) swap(nums, mid,  hi--);
        else                     mid++;
    }
}`,
        why:"Invariants: nums[0..lo) is 0s, nums[lo..mid) is 1s, nums[hi+1..n) is 2s. Each step preserves them." },
    ],
  },
  {
    id:"trap", name:"Trap (leftMax/rightMax)", color:"#dc2626", colorDark:"#ff7b72",
    desc:"For 'water trapped' style problems, advance the side with the SMALLER max.",
    rule:"if h[l] < h[r] then leftMax bounds column l; advance l",
    label:"LEFT/RIGHT MAX",
    examples:[
      { title:"LC 42 — Trapping Rain Water",
        code:`int trap(int[] height) {
    int l = 0, r = height.length - 1;
    int leftMax = 0, rightMax = 0, total = 0;
    while (l < r) {
        if (height[l] < height[r]) {
            if (height[l] >= leftMax)  leftMax  = height[l];
            else                       total   += leftMax  - height[l];
            l++;
        } else {
            if (height[r] >= rightMax) rightMax = height[r];
            else                       total   += rightMax - height[r];
            r--;
        }
    }
    return total;
}`,
        why:"The smaller side determines that column's water level — the other side's max is guaranteed at least as large." },
    ],
  },
  {
    id:"floyd", name:"Floyd's Entry", color:"#0d9488", colorDark:"#a7ffeb",
    desc:"After slow/fast meet, reset slow to head and walk both at +1; they meet at cycle entry.",
    rule:"a == c (mod loop length): proven by 2(a+b) = a+b+nL.",
    label:"CYCLE ENTRY",
    examples:[
      { title:"LC 287 — Find the Duplicate Number",
        code:`int findDuplicate(int[] nums) {
    int slow = nums[0], fast = nums[0];
    do {
        slow = nums[slow];
        fast = nums[nums[fast]];
    } while (slow != fast);

    slow = nums[0];
    while (slow != fast) {
        slow = nums[slow];
        fast = nums[fast];
    }
    return slow;
}`,
        why:"Treat nums[i] as a 'next' pointer. Pigeonhole guarantees a cycle; its entry IS the duplicate." },
    ],
  },
];

const BRIEF_CHEAT_ITEMS = [
  ["Opposite ends",          "while (l < r) { ...; l++ or r--; }"],
  ["Slow / Fast cycle",      "slow=head; fast=head.next.next; meet ⇒ cycle"],
  ["Floyd's entry",          "after meet: slow=head; walk both +1 → entry"],
  ["Midpoint of list",       "while fast && fast.next: slow,fast = +1,+2"],
  ["Kth from end",           "advance fast by k first, then walk both"],
  ["Partition / write idx",  "if (keep(nums[r])) nums[w++] = nums[r];"],
  ["Dutch flag (3-way)",     "lo / mid / hi; swap based on category"],
  ["Skip duplicates",        "while (l<r && nums[l]==nums[l+1]) l++;"],
  ["Container area",         "advance the SHORTER side"],
  ["Trap rain water",        "advance side with SMALLER current value"],
  ["Merge sorted in place",  "walk all three indices BACKWARD"],
];

let briefCurrentOp = BRIEF_OPS[0];
let briefCurrentEx = 0;
let briefWhyOpen = {};
let briefArrStr = "1,3,5,7,9,11";
let briefTarget = 12;

function briefOpColor(op) {
  return document.documentElement.getAttribute('data-theme') === 'dark'
    ? (op.colorDark || op.color)
    : op.color;
}

function briefParseArr() {
  return briefArrStr.split(',').map(s => parseInt(s.trim(), 10)).filter(x => !isNaN(x));
}

function briefRenderArr(arr, l, r, extras) {
  let cells = '';
  for (let i = 0; i < arr.length; i++) {
    const cls = ['arr-cell'];
    if (l !== undefined && r !== undefined && i >= Math.min(l, r) && i <= Math.max(l, r)) cls.push('in-window');
    if (i === l) cls.push('left-ptr');
    if (i === r) cls.push('right-ptr');
    cells += `<div class="${cls.join(' ')}">${arr[i]}</div>`;
  }
  return `<div class="arr-row">${cells}</div>
          <div class="ptr-row">
            <span style="color:var(--easy)">■ left/slow</span>
            <span style="color:var(--med)">■ right/fast</span>
            ${extras || ''}
          </div>`;
}

function briefComputeOpposite(arr, target) {
  // sort to ensure two-pointer correctness
  const sorted = arr.slice().sort((a, b) => a - b);
  let l = 0, r = sorted.length - 1;
  while (l < r) {
    const s = sorted[l] + sorted[r];
    if (s === target) return { l, r, val: '[' + sorted[l] + ', ' + sorted[r] + ']', label: 'pair found (sorted view)', sorted };
    else if (s < target) l++;
    else r--;
  }
  return { l: 0, r: -1, val: 'none', label: 'no pair sums to ' + target, sorted };
}

function briefComputeMoveZeros(arr) {
  // simulate move-zeros: highlight final w boundary
  const a = arr.slice();
  let w = 0;
  for (let r = 0; r < a.length; r++) {
    if (a[r] !== 0) a[w++] = a[r];
  }
  const finalW = w;
  while (w < a.length) a[w++] = 0;
  return { arr: a, l: 0, r: finalW - 1, val: finalW, label: '# of non-zero elements (write pointer)' };
}

function briefComputeDutch(arr) {
  const a = arr.map(x => ((x % 3) + 3) % 3);            // map any input to 0/1/2
  let lo = 0, mid = 0, hi = a.length - 1;
  while (mid <= hi) {
    if (a[mid] === 0) { [a[lo], a[mid]] = [a[mid], a[lo]]; lo++; mid++; }
    else if (a[mid] === 2) { [a[mid], a[hi]] = [a[hi], a[mid]]; hi--; }
    else mid++;
  }
  return { arr: a, l: 0, r: a.length - 1, val: a.join(','), label: 'sorted into 0s/1s/2s (mod 3)' };
}

function briefComputeContainer(arr) {
  let l = 0, r = arr.length - 1, best = 0, bestL = 0, bestR = 0;
  while (l < r) {
    const h = Math.min(arr[l], arr[r]);
    const area = h * (r - l);
    if (area > best) { best = area; bestL = l; bestR = r; }
    if (arr[l] < arr[r]) l++; else r--;
  }
  return { l: bestL, r: bestR, val: best, label: 'max container area' };
}

function briefComputeTrap(arr) {
  let l = 0, r = arr.length - 1, leftMax = 0, rightMax = 0, total = 0;
  while (l < r) {
    if (arr[l] < arr[r]) {
      if (arr[l] >= leftMax) leftMax = arr[l]; else total += leftMax - arr[l];
      l++;
    } else {
      if (arr[r] >= rightMax) rightMax = arr[r]; else total += rightMax - arr[r];
      r--;
    }
  }
  return { val: total, label: 'water trapped' };
}

function briefRenderPanel() {

  const op = briefCurrentOp;
  const color = briefOpColor(op);
  const arr = briefParseArr();
  let info, displayArr = arr;

  if (op.id === 'opposite') {
    info = briefComputeOpposite(arr, briefTarget);
    displayArr = info.sorted;
  } else if (op.id === 'partition') {
    info = briefComputeMoveZeros(arr);
    displayArr = info.arr;
  } else if (op.id === 'dutch') {
    info = briefComputeDutch(arr);
    displayArr = info.arr;
  } else if (op.id === 'trap') {
    info = briefComputeTrap(arr);
  } else if (op.id === 'floyd') {
    info = { val: '—', label: 'Floyd works on a linked list / function — see code' };
  } else {
    info = briefComputeContainer(arr);
  }

  let cells;
  if (op.id === 'trap' || op.id === 'floyd' || op.id === 'slowfast') {
    cells = briefRenderArr(displayArr);
  } else {
    cells = briefRenderArr(displayArr, info.l, info.r);
  }

  const exTabs = op.examples.map((e, i) =>
    `<div class="ex-tab" data-i="${i}" style="${i === briefCurrentEx ? 'background:'+color+'22; color:'+color+'; border-color:'+color : ''}">${escapeHtml(e.title)}</div>`
  ).join('');

  const ex = op.examples[briefCurrentEx];
  const whyOpen = briefWhyOpen[op.id + ':' + briefCurrentEx];

  document.getElementById('briefMainPanel').innerHTML = `
    <div class="op-badge" style="background:${color}22; color:${color}; border:1px solid ${color}">${op.label}</div>
    <div class="op-desc">${escapeHtml(op.desc)}</div>
    <div class="op-rule">${escapeHtml(op.rule)}</div>

    <div class="calc-box">
      <div class="input-row">
        <span class="input-label">array</span>
        <input type="text" id="briefArr" value="${escapeHtml(briefArrStr)}" />
        <span class="input-label">target</span>
        <input type="number" id="briefTarget" value="${briefTarget}" />
      </div>
      ${cells}
      <div class="result-line">${escapeHtml(info.label)}: <span class="result-pill yes">${escapeHtml(String(info.val))}</span></div>
    </div>

    <div class="section-label">EXAMPLES</div>
    <div class="ex-tabs">${exTabs}</div>
    <div class="ex-box">
      <div class="ex-title" style="color:${color}">${escapeHtml(ex.title)}</div>
      <pre class="brief-pre"><code>${highlightJava(ex.code)}</code></pre>
      <div class="why-toggle" data-key="${op.id}:${briefCurrentEx}">${whyOpen ? '▼' : '▶'} Why does this work?</div>
      <div class="why-body ${whyOpen ? 'visible' : ''}">${escapeHtml(ex.why)}</div>
    </div>
  `;

  const arrEl = document.getElementById('briefArr');
  const tEl = document.getElementById('briefTarget');
  if (arrEl) arrEl.addEventListener('input', () => { briefArrStr = arrEl.value; briefRenderPanel(); });
  if (tEl)   tEl.addEventListener('input',   () => { briefTarget = parseInt(tEl.value, 10) || 0; briefRenderPanel(); });

  document.querySelectorAll('#briefMainPanel .ex-tab').forEach(t => {
    t.addEventListener('click', () => { briefCurrentEx = +t.dataset.i; briefRenderPanel(); });
  });

  const wt = document.querySelector('#briefMainPanel .why-toggle');
  if (wt) {
    wt.addEventListener('click', () => {
      const key = wt.dataset.key;
      briefWhyOpen[key] = !briefWhyOpen[key];
      briefRenderPanel();
    });
  }
}

function briefRenderOpTabs() {
  const html = BRIEF_OPS.map(op => {
    const color = briefOpColor(op);
    const active = op.id === briefCurrentOp.id;
    return `<div class="op-tab" data-id="${op.id}"
      style="${active ? 'background:'+color+'22; color:'+color+'; border-color:'+color : ''}">${escapeHtml(op.name)}</div>`;
  }).join('');
  document.getElementById('briefOpTabs').innerHTML = html;
  document.querySelectorAll('#briefOpTabs .op-tab').forEach(t => {
    t.addEventListener('click', () => {
      briefCurrentOp = BRIEF_OPS.find(o => o.id === t.dataset.id);
      briefCurrentEx = 0;
      briefRenderOpTabs();
      briefRenderPanel();
    });
  });
}

function briefRenderCheatSheet() {
  document.getElementById('briefCheatSheet').innerHTML = BRIEF_CHEAT_ITEMS.map(([n, c]) =>
    `<div class="cheat-row"><span class="cheat-name">${escapeHtml(n)}</span><span class="cheat-code">${escapeHtml(c)}</span></div>`
  ).join('');
}

function initBriefMode() {
  briefRenderOpTabs();
  briefRenderPanel();
  briefRenderCheatSheet();
}

const briefThemeObserver = new MutationObserver(() => {
  if (state.diff === 'brief') {
    briefRenderOpTabs();
    briefRenderPanel();
  }
});
briefThemeObserver.observe(document.documentElement, {
  attributes: true,
  attributeFilter: ['data-theme'],
});

</script>
