<!-- KIRO_DARK_MODE_START -->
<style id="kiro-dark-mode-style">
  /* =========================================================
     Kiro Dim Dark Mode -- soft slate palette, not pitch-black.
     Activated only when <html> has class "kiro-dark".
     Designed so coloured pastel callouts stay LIGHT but their
     text becomes dark+readable; everything else flips to dim.
     ========================================================= */
  html.kiro-dark{
    --kd-bg:        #1c2128;   /* page bg, slate, not black */
    --kd-bg-2:      #242a33;   /* panels, h2 bands */
    --kd-bg-3:      #2c333d;   /* hover / table header */
    --kd-text:      #e8edf2;   /* main text on dark */
    --kd-text-mute: #a8b1bd;
    --kd-border:    #3a414d;
    --kd-accent:    #8c7bff;
    --kd-link:      #8cc6ff;
    --kd-good:      #4ddbb0;
    --kd-bad:       #ff9d9d;
    --kd-warn:      #ffd166;
    --kd-info:      #6ec5ff;
    --kd-code-bg:   #1f2530;
    --kd-pre-bg:    #1a1f29;
    /* Used for elements that keep their original light pastel bg.
       We force a near-black text colour so they remain readable. */
    --kd-on-pastel: #15171c;
    color-scheme: dark;
    background:#1c2128 !important;
    color:#e8edf2 !important;
  }

  /* ----- Base text & layout ----- */
  html.kiro-dark body{
    background: var(--kd-bg) !important;
    color: var(--kd-text) !important;
  }
  html.kiro-dark h1,
  html.kiro-dark h3,
  html.kiro-dark h4,
  html.kiro-dark h5,
  html.kiro-dark h6{
    color: var(--kd-text) !important;
    border-color: var(--kd-border) !important;
  }
  html.kiro-dark h1{ border-bottom-color: var(--kd-border) !important; }
  html.kiro-dark h2{
    background: var(--kd-bg-2) !important;
    border-left-color: var(--kd-accent) !important;
    color: var(--kd-text) !important;
  }
  html.kiro-dark h1 .sub,
  html.kiro-dark .small,
  html.kiro-dark .legend,
  html.kiro-dark .sub,
  html.kiro-dark .muted{ color: var(--kd-text-mute) !important; }

  html.kiro-dark a{ color: var(--kd-link) !important; }
  html.kiro-dark a:hover{ color: #c8e1ff !important; }
  html.kiro-dark hr{ border-color: var(--kd-border) !important; }

  /* ----- Code & pre ----- */
  html.kiro-dark code,
  html.kiro-dark code.inline,
  html.kiro-dark td code,
  html.kiro-dark th code,
  html.kiro-dark p code,
  html.kiro-dark li code,
  html.kiro-dark span code{
    background: #2c333d !important;
    color: #f5e8b8 !important;
    border: 1px solid #3a414d !important;
    border-radius: 3px;
    padding: 0 4px;
  }
  html.kiro-dark pre,
  html.kiro-dark pre.code{
    background: var(--kd-pre-bg) !important;
    color: #d6deeb !important;
    border-color: var(--kd-border) !important;
  }
  html.kiro-dark pre code{
    background: transparent !important;
    color: inherit !important;
    border: 0 !important;
    padding: 0 !important;
  }
  html.kiro-dark pre .kw,
  html.kiro-dark .kw   { color: #ff8489 !important; }
  html.kiro-dark pre .typ,
  html.kiro-dark .typ  { color: #ffb070 !important; }
  html.kiro-dark pre .str,
  html.kiro-dark .str  { color: #b8dbff !important; }
  html.kiro-dark pre .num,
  html.kiro-dark .num  { color: #8cc6ff !important; }
  html.kiro-dark pre .cmt,
  html.kiro-dark .cmt  { color: #9aa3b0 !important; }
  html.kiro-dark pre .ann,
  html.kiro-dark .ann  { color: #8ee99a !important; }
  html.kiro-dark pre .fn,
  html.kiro-dark .fn   { color: #d2b3ff !important; }
  html.kiro-dark pre .op,
  html.kiro-dark .op   { color: #d6deeb !important; }
  html.kiro-dark pre .var,
  html.kiro-dark .var  { color: #ffb070 !important; }

  /* ----- Tables ----- */
  html.kiro-dark table{
    background: transparent !important;
    color: var(--kd-text) !important;
    border-color: var(--kd-border) !important;
  }
  html.kiro-dark th,
  html.kiro-dark td{
    border-color: var(--kd-border) !important;
    color: var(--kd-text) !important;
    background-color: transparent;
  }
  html.kiro-dark th{
    background: var(--kd-bg-3) !important;
    color: var(--kd-text) !important;
  }
  html.kiro-dark tr:nth-child(even) td{ background: rgba(255,255,255,.025); }

  html.kiro-dark .right,
  html.kiro-dark .good,
  html.kiro-dark tr.right td,
  html.kiro-dark tr.good td{
    background: rgba(77,219,176,.10) !important;
    color: var(--kd-text) !important;
  }
  html.kiro-dark .wrong,
  html.kiro-dark .bad,
  html.kiro-dark tr.wrong td,
  html.kiro-dark tr.bad td{
    background: rgba(255,157,157,.10) !important;
    color: var(--kd-text) !important;
  }
  html.kiro-dark .col-right{ color: var(--kd-good) !important; }
  html.kiro-dark .col-wrong{ color: var(--kd-bad) !important; }

  html.kiro-dark table.compare th:nth-child(2){
    background: rgba(255,157,157,.18) !important; color: #ffc4c4 !important;
  }
  html.kiro-dark table.compare th:nth-child(3){
    background: rgba(77,219,176,.18) !important; color: #b0f0d8 !important;
  }
  html.kiro-dark table.compare td:nth-child(2){ background: rgba(255,157,157,.06) !important; }
  html.kiro-dark table.compare td:nth-child(3){ background: rgba(77,219,176,.06) !important; }

  /* ----- Generic tip / note / tricky callouts ----- */
  html.kiro-dark .tips,
  html.kiro-dark .tip,
  html.kiro-dark .note{
    background: rgba(255,209,102,.10) !important;
    border-color: rgba(255,209,102,.5) !important;
    color: var(--kd-text) !important;
  }
  html.kiro-dark .tips b,
  html.kiro-dark .tip b{ color: var(--kd-warn) !important; }

  html.kiro-dark .tricky{
    background: rgba(140,123,255,.10) !important;
    border-color: rgba(140,123,255,.5) !important;
    color: var(--kd-text) !important;
  }

  html.kiro-dark .callout,
  html.kiro-dark .info,
  html.kiro-dark .panel,
  html.kiro-dark .box{
    background: var(--kd-bg-2) !important;
    border-color: var(--kd-border) !important;
    color: var(--kd-text) !important;
  }
  html.kiro-dark .callout.green,
  html.kiro-dark .callout.success{
    background: rgba(77,219,176,.10) !important;
    border-color: rgba(77,219,176,.5) !important;
  }
  html.kiro-dark .callout.cyan{
    background: rgba(110,197,255,.10) !important;
    border-color: rgba(110,197,255,.5) !important;
  }
  html.kiro-dark .callout.red,
  html.kiro-dark .callout.error,
  html.kiro-dark .warning{
    background: rgba(255,157,157,.10) !important;
    border-color: rgba(255,157,157,.5) !important;
  }
  html.kiro-dark .callout.yellow,
  html.kiro-dark .callout.warning{
    background: rgba(255,209,102,.10) !important;
    border-color: rgba(255,209,102,.5) !important;
  }

  /* ----- Q-blocks used in Graph_Algorithms_Java cheatsheet:
           .obj / .why / .how / .theo / .cx (all light pastels).
           Re-tone them to dim variants with readable text. ----- */
  html.kiro-dark .block,
  html.kiro-dark .obj,
  html.kiro-dark .why,
  html.kiro-dark .how,
  html.kiro-dark .theo,
  html.kiro-dark .cx{
    color: var(--kd-text) !important;
  }
  html.kiro-dark .block *:not(.label):not(code):not(pre):not(b):not(strong),
  html.kiro-dark .obj *:not(.label):not(code):not(pre):not(b):not(strong),
  html.kiro-dark .why *:not(.label):not(code):not(pre):not(b):not(strong),
  html.kiro-dark .how *:not(.label):not(code):not(pre):not(b):not(strong),
  html.kiro-dark .theo *:not(.label):not(code):not(pre):not(b):not(strong),
  html.kiro-dark .cx *:not(.label):not(code):not(pre):not(b):not(strong){
    color: var(--kd-text) !important;
  }
  html.kiro-dark .block b,
  html.kiro-dark .obj b, html.kiro-dark .why b, html.kiro-dark .how b,
  html.kiro-dark .theo b, html.kiro-dark .cx b,
  html.kiro-dark .block strong,
  html.kiro-dark .obj strong, html.kiro-dark .why strong, html.kiro-dark .how strong,
  html.kiro-dark .theo strong, html.kiro-dark .cx strong{
    color: #fff !important;
  }
  html.kiro-dark .obj  { background: rgba(76,179,255,.16) !important; border-color: #4cb3ff !important; }
  html.kiro-dark .why  { background: rgba(255,177,73,.16) !important; border-color: #ffb149 !important; }
  html.kiro-dark .how  { background: rgba(77,219,176,.16) !important; border-color: #4ddbb0 !important; }
  html.kiro-dark .theo { background: rgba(176,138,255,.16) !important; border-color: #b08aff !important; }
  html.kiro-dark .cx   { background: rgba(255,138,193,.16) !important; border-color: #ff8ac1 !important; }
  /* Their pill-style labels stay coloured (white text already) -- leave as-is. */

  /* h2.cat-* coloured section bands -- repaint to muted versions */
  html.kiro-dark h2.cat-term  { background: rgba(176,184,196,.12) !important; border-left-color: #b0b8c4 !important; }
  html.kiro-dark h2.cat-rep   { background: rgba(124,138,232,.15) !important; border-left-color: #7c8ae8 !important; }
  html.kiro-dark h2.cat-trav  { background: rgba(77,219,176,.15) !important; border-left-color: #4ddbb0 !important; }
  html.kiro-dark h2.cat-topo  { background: rgba(110,197,255,.15) !important; border-left-color: #6ec5ff !important; }
  html.kiro-dark h2.cat-sp    { background: rgba(76,179,255,.15) !important; border-left-color: #4cb3ff !important; }
  html.kiro-dark h2.cat-tree  { background: rgba(176,138,255,.15) !important; border-left-color: #b08aff !important; }
  html.kiro-dark h2.cat-mst   { background: rgba(255,177,73,.15) !important; border-left-color: #ffb149 !important; }
  html.kiro-dark h2.cat-euler { background: rgba(255,138,193,.15) !important; border-left-color: #ff8ac1 !important; }
  html.kiro-dark h2.cat-conn  { background: rgba(255,127,127,.15) !important; border-left-color: #ff7f7f !important; }
  html.kiro-dark h2.cat-color { background: rgba(176,138,255,.15) !important; border-left-color: #b08aff !important; }
  html.kiro-dark h2.cat-tsp   { background: rgba(176,160,140,.15) !important; border-left-color: #b0a08c !important; }
  html.kiro-dark h2.cat-flow  { background: rgba(77,219,176,.15) !important; border-left-color: #4ddbb0 !important; }

  /* category chips -- repaint to muted dim with light text */
  html.kiro-dark .chip-term  { background: rgba(176,184,196,.18) !important; color: #d6dde6 !important; }
  html.kiro-dark .chip-rep   { background: rgba(124,138,232,.20) !important; color: #c8d1ff !important; }
  html.kiro-dark .chip-trav  { background: rgba(77,219,176,.20) !important; color: #b8f0d8 !important; }
  html.kiro-dark .chip-topo  { background: rgba(110,197,255,.20) !important; color: #c0e3ff !important; }
  html.kiro-dark .chip-sp    { background: rgba(76,179,255,.20) !important; color: #c0deff !important; }
  html.kiro-dark .chip-tree  { background: rgba(176,138,255,.20) !important; color: #ddc8ff !important; }
  html.kiro-dark .chip-mst   { background: rgba(255,177,73,.20) !important; color: #ffd9a8 !important; }
  html.kiro-dark .chip-euler { background: rgba(255,138,193,.20) !important; color: #ffc8e0 !important; }
  html.kiro-dark .chip-conn  { background: rgba(255,127,127,.20) !important; color: #ffc8c8 !important; }
  html.kiro-dark .chip-color { background: rgba(176,138,255,.20) !important; color: #ddc8ff !important; }
  html.kiro-dark .chip-tsp   { background: rgba(176,160,140,.20) !important; color: #e0d4c5 !important; }
  html.kiro-dark .chip-flow  { background: rgba(77,219,176,.20) !important; color: #b8f0d8 !important; }

  /* Generic chip used in Leetcode_Patterns_Java */
  html.kiro-dark .chip{
    background: var(--kd-bg-2) !important;
    color: var(--kd-text-mute) !important;
    border-color: var(--kd-border) !important;
  }
  html.kiro-dark .chip b{ color: var(--kd-text) !important; }

  /* Specific named callouts in Graph_Algorithms cheatsheet */
  html.kiro-dark .trick{
    background: rgba(76,179,255,.10) !important;
    border-color: rgba(76,179,255,.5) !important;
    color: var(--kd-text) !important;
  }
  html.kiro-dark .trick b{ color: var(--kd-info) !important; }
  html.kiro-dark .hint-box{
    background: rgba(77,219,176,.10) !important;
    border-color: rgba(77,219,176,.5) !important;
    color: var(--kd-text) !important;
  }
  html.kiro-dark .hint-box b{ color: var(--kd-good) !important; }
  html.kiro-dark .warn{
    background: rgba(255,157,157,.10) !important;
    border-color: rgba(255,157,157,.5) !important;
    color: var(--kd-text) !important;
  }
  html.kiro-dark .warn b{ color: var(--kd-bad) !important; }

  /* ----- Pills (incl. easy/med/hard from leetcode files) ----- */
  html.kiro-dark .pill{ color: #fff !important; }
  html.kiro-dark .pill.bad,
  html.kiro-dark .pill.hard{ background: #b3434a !important; }
  html.kiro-dark .pill.good,
  html.kiro-dark .pill.easy{ background: #1f8a64 !important; }
  html.kiro-dark .pill.tip,
  html.kiro-dark .pill.med { background: #8a6a00 !important; }
  html.kiro-dark .pill.trk { background: #1f5fa0 !important; }

  /* ----- Details / summary ----- */
  html.kiro-dark details > summary{ color: var(--kd-link) !important; }
  html.kiro-dark details[open] > summary{ color: var(--kd-text) !important; }
  html.kiro-dark details .hint{
    background: rgba(110,197,255,.12) !important;
    border-left-color: var(--kd-info) !important;
    color: var(--kd-text) !important;
  }

  /* TOC, blockquote */
  html.kiro-dark .toc{
    background: var(--kd-bg-2) !important;
    border-color: var(--kd-border) !important;
  }
  html.kiro-dark .toc a{ color: var(--kd-link) !important; }
  html.kiro-dark blockquote{
    background: var(--kd-bg-2) !important;
    border-left-color: var(--kd-accent) !important;
    color: var(--kd-text) !important;
  }

  /* ----- Universal safety net: only kicks in for elements whose
           background is STILL light AFTER the dark theme has been
           applied. Tagged at runtime via data-kd-pastel. ----- */
  html.kiro-dark [data-kd-pastel]{
    color: #15171c !important;
  }
  html.kiro-dark [data-kd-pastel] *:not(.label):not(.pill):not(code):not(pre):not(b):not(strong){
    color: #15171c !important;
  }
  html.kiro-dark [data-kd-pastel] b,
  html.kiro-dark [data-kd-pastel] strong{
    color: #000 !important;
  }
  html.kiro-dark [data-kd-pastel] code{
    background: rgba(0,0,0,.10) !important;
    color: #15171c !important;
    border-color: rgba(0,0,0,.18) !important;
  }
  html.kiro-dark [data-kd-pastel] a{ color: #1a4f8a !important; }

  /* Toggle button itself */
  .kiro-dark-toggle{
    position:fixed;
    right:18px;
    bottom:18px;
    width:52px;height:52px;
    border-radius:50%;
    background:#1c2128;
    color:#ffd166;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #ffd166;
    box-shadow:0 6px 18px rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.15);
    cursor:pointer;
    font-size:22px;line-height:1;
    z-index:99998;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    padding:0;
  }
  .kiro-dark-toggle:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 10px 24px rgba(0,0,0,.3);}
  .kiro-dark-toggle:active{transform:scale(.95);}
  .kiro-dark-toggle:focus-visible{outline:3px solid #ffd166;outline-offset:3px;}
  html.kiro-dark .kiro-dark-toggle{
    background:#ffd166;
    color:#1c2128;
    border-color:#1c2128;
  }
  @media print{.kiro-dark-toggle{display:none!important;}}
</style>
<button type="button" class="kiro-dark-toggle" id="kiroDarkToggle"
        title="Toggle dark mode" aria-label="Toggle dark mode" aria-pressed="false">
  <span id="kiroDarkToggleIcon" aria-hidden="true">&#x1F319;</span>
</button>
<script id="kiro-dark-mode-script">
(function(){
  var KEY = 'kiro_dark_mode';
  var html = document.documentElement;
  var btn = document.getElementById('kiroDarkToggle');
  var icon = document.getElementById('kiroDarkToggleIcon');

  /* ---------- pastel safety net (post-dark) ----------
     Scan AFTER dark mode is applied and tag only elements whose
     computed background is still light. We exclude elements whose
     class names overlap with our explicit dark styles, plus any
     inline <code>/<pre>, so we never re-darken text we've already
     styled. */
  var EXCLUDE_TAGS = {CODE:1, PRE:1, BUTTON:1, INPUT:1, TEXTAREA:1, SELECT:1, OPTION:1, SCRIPT:1, STYLE:1, SVG:1, PATH:1, IMG:1};
  var EXCLUDE_CLASSES = [
    'kiro-dark-toggle','kiro-home-btn',
    'tips','tip','note','tricky','callout','panel','box','warning','warn','trick','hint-box','info',
    'obj','why','how','theo','cx','block','label',
    'pill','chip','cat-chip','tag',
    'right','wrong','good','bad','col-right','col-wrong',
    'compare','toc','blockquote','muted','sub','small','legend',
    'chip-term','chip-rep','chip-trav','chip-topo','chip-sp','chip-tree',
    'chip-mst','chip-euler','chip-conn','chip-color','chip-tsp','chip-flow'
  ];
  function hasExcludedClass(el){
    if(!el.classList || !el.classList.length) return false;
    for(var i=0;i<EXCLUDE_CLASSES.length;i++){
      if(el.classList.contains(EXCLUDE_CLASSES[i])) return true;
    }
    return false;
  }

  function untagAll(){
    var tagged = document.querySelectorAll('[data-kd-pastel]');
    for(var i=0;i<tagged.length;i++) tagged[i].removeAttribute('data-kd-pastel');
  }

  function tagPastels(){
    if(!document.body) return;
    untagAll();
    var els = document.body.getElementsByTagName('*');
    for(var i=0;i<els.length;i++){
      var el = els[i];
      if(EXCLUDE_TAGS[el.tagName]) continue;
      if(hasExcludedClass(el)) continue;
      /* Skip h2/h2.cat-* -- already themed */
      if(el.tagName === 'H2') continue;
      /* Skip table cells inside themed compare/right/wrong rows */
      if(el.tagName === 'TD' || el.tagName === 'TH'){
        var tr = el.parentElement;
        if(tr && (tr.classList.contains('right')||tr.classList.contains('wrong')||tr.classList.contains('good')||tr.classList.contains('bad'))) continue;
      }
      var cs = window.getComputedStyle(el);
      var bg = cs.backgroundColor;
      var m = bg.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)$/);
      if(!m) continue;
      var r=+m[1], g=+m[2], b=+m[3], a=m[4]===undefined?1:+m[4];
      if(a < 0.55) continue;
      var minC = Math.min(r,g,b);
      /* Pastel/light: every channel >= 220 AND not pure white */
      if(minC >= 220 && !(r===255 && g===255 && b===255)){
        el.setAttribute('data-kd-pastel','1');
      }
    }
  }

  function apply(on){
    if(on){
      html.classList.add('kiro-dark');
      if(btn){ btn.setAttribute('aria-pressed','true'); btn.title='Switch to light mode'; }
      if(icon){ icon.textContent = '\u2600\uFE0F'; }
      /* Tag after dark CSS is in effect so we only catch genuine misses. */
      if(typeof requestAnimationFrame === 'function'){
        requestAnimationFrame(function(){ requestAnimationFrame(tagPastels); });
      } else { setTimeout(tagPastels, 0); }
    } else {
      html.classList.remove('kiro-dark');
      untagAll();
      if(btn){ btn.setAttribute('aria-pressed','false'); btn.title='Switch to dark mode'; }
      if(icon){ icon.textContent = '\uD83C\uDF19'; }
    }
  }

  function init(){
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch(e) {}
    if(saved === '1') apply(true);
    else if(saved === '0') apply(false);
    else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) apply(true);
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }

  if(btn){
    btn.addEventListener('click', function(){
      var nowOn = !html.classList.contains('kiro-dark');
      apply(nowOn);
      try { localStorage.setItem(KEY, nowOn ? '1' : '0'); } catch(e) {}
    });
  }
})();
</script>
<!-- KIRO_DARK_MODE_END -->
